plugins {
    id 'com.android.application'
}

// Für die Smartboards nur ARM; der Test im Emulator baut zusätzlich -PabiFilters=x86_64
def abiList = (project.findProperty('abiFilters') ?: 'armeabi-v7a,arm64-v8a').toString().split(',').collect { it.trim() }
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def keyFile = rootProject.file('release.p12')

android {
    namespace = 'de.klassenboard.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'de.klassenboard.app'
        minSdk = 26          // Android 8 (CTOUCH Riva) – Mindestanforderung von GeckoView
        targetSdk = 34
        versionCode = runNo
        versionName = '1.0.' + runNo
        ndk {
            abiFilters.addAll(abiList)
        }
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile = keyFile
                storeType = 'pkcs12'
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = 'classpuls'
                keyPassword = System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true   // Bibliotheken komprimiert → deutlich kleinerer Download
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:160.0.20261104181552'
}
