// ── Kodieren und Verschlüsseln ──

// ══════════════════════════ Foto: wählen, bearbeiten, senden ══════════════════════════
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2200 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });

function rotated(src, rot) {
  if (!rot) return src;
  const c = document.createElement('canvas'), swap = rot % 2 === 1;
  c.width = swap ? src.height : src.width; c.height = swap ? src.width : src.height;
  const x = c.getContext('2d');
  x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 2);
  x.drawImage(src, -src.width / 2, -src.height / 2);

}
// Dokument-Modus: Papier wird weiß, Schrift kräftig – Farben (z. B. roter Stift) bleiben erhalten
function docFilter(c) {
  const x = c.getContext('2d'), img = x.getImageData(0, 0, c.width, c.height), d = img.data, hist = new Uint32Array(256);
  let n = 0;
  for (let i = 0; i < d.length; i += 16) { hist[(d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10 | 0]++; n++; }
  const pct = p => { let s = 0; for (let v = 0; v < 256; v++) { s += hist[v]; if (s >= n * p) return v; } return 255; };

}

  const sx = Math.round(cr.x * r.width), sy = Math.round(cr.y * r.height);
  const sw = Math.max(8, Math.round(cr.w * r.width)), sh = Math.max(8, Math.round(cr.h * r.height));

const toBlob = (c, q) => new Promise(res => c.toBlob(res, 'image/jpeg', q || 0.82));

// Bearbeiten-Ansicht. onSend(blob, canvas) → Promise; onCancel()

function pickFile(capture, multiple) {

    const inp = h('input', { type: 'file', accept: 'image/*', capture: capture ? 'environment' : false, multiple: !!multiple, style: 'display:none' });

}

// ══════════════════════════ Lehrkraft ══════════════════════════
const T = {
  ch: null, key: null, online: false, lastState: 0, state: { boards: [], widgets: [], drop: { open: false, n: 0 } },

  },
  async send(m) {

// ── Live-Kamera: erst direkt von Gerät zu Gerät (WebRTC), sonst Einzelbilder über den Kanal ──
const LIVE = {
  stream: null, pc: null, mode: '', timer: null, facing: 'environment', lock: null, tag: null, video: null,
  view() {
    if (this.stream) { this.paint(); return; }
    view.replaceChildren(h('div', { class: 'card' }, h('h1', { text: 'Live-Kamera' }),
      h('p', { class: 'muted', text: 'Dein Handy wird zur Dokumentenkamera: halte es über ein Heft oder ein Experiment – die Klasse sieht live mit.' }),
      h('button', { class: 'big-btn', html: IC.live + '<span>Kamera starten</span>', onclick: () => this.start() })));
  },
  async start() {
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: this.facing }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    } catch (e) {
      view.replaceChildren(h('div', { class: 'card' }, h('h1', { text: 'Kamera nicht freigegeben' }),
        h('p', { class: 'muted', text: 'Bitte erlaube den Zugriff auf die Kamera (in Safari: „aA" in der Adresszeile → Website-Einstellungen → Kamera) und versuche es noch einmal.' }),
        h('button', { class: 'big-btn', text: 'Nochmal versuchen', onclick: () => this.start() })));
      return;
    }
    try { this.lock = await navigator.wakeLock.request('screen'); } catch (e) {}
    this.paint();
    this.connect();
  },
  paint() {
    this.video = h('video', { autoplay: true, playsinline: true, muted: true });
    this.video.muted = true;
    this.video.srcObject = this.stream;
    this.tag =h('div', { class: 'live-tag', text: 'verbinde …' });
    view.replaceChildren(h('div', { class: 'card' }, h('div', { class: 'live-box' }, this.video, this.tag),
      h('button', { class: 'big-btn', html: IC.camera + '<span>Standbild auf die Tafel</span>', onclick: e => this.still(e.currentTarget) }),
      h('div', { class: 'row' },
        h('button', { class: 'chip', text: 'Kamera wechseln', onclick: () => this.flip() }),
        h('button', { class: 'chip', text: 'Stopp', onclick: () => { this.stop(); this.view(); } }))));
    this.label();
  },
  label() { if (this.tag) this.tag.textContent = this.mode === 'rtc' ? 'live' : this.mode === 'frames' ? 'live · Einzelbilder' : 'verbinde …'; },
  async connect() {
    this.closePc(); clearInterval(this.timer); this.mode = ''; this.label();
    T.send({ t: 'live-start' });
    try {
      const pc = this.pc = new RTCPeerConnection({ iceServers: ICE });
      this.stream.getTracks().forEach(tr => pc.addTrack(tr, this.stream));
      pc.onicecandidate = e => { if (e.candidate) T.send({ t: 'rtc', k: 'ice', v: e.candidate.toJSON() }); };
      pc.onconnectionstatechange = () => {
        if (pc !== this.pc) return;
        if (pc.connectionState === 'connected') { clearInterval(this.timer); this.mode = 'rtc'; this.label(); }
        else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') this.frames();
      };
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      T.send({ t: 'rtc', k: 'offer', v: { type: offer.type, sdp: offer.sdp } });
    } catch (e) {}
    // Kommt die direkte Verbindung nicht zustande (Schul-WLAN sperrt das oft), gehen Einzelbilder über den Kanal
    setTimeout(() => { if (this.stream && this.mode !== 'rtc') this.frames(); }, 7000);
  },
  async onSignal(m) {
    const pc = this.pc; if (!pc) return;
    try {
      if (m.k === 'answer') await pc.setRemoteDescription(m.v);
      else if (m.k === 'ice') await pc.addIceCandidate(m.v);
    } catch (e) {}
  },
  frames() {
    if (!this.stream || this.mode === 'frames') return;
    this.mode = 'frames'; this.label();
    const c = document.createElement('canvas');
    clearInterval(this.timer);
    this.timer = setInterval(async () => {
      const v = this.video; if (!v || !v.videoWidth || document.hidden || this.sending) return;
      const k = Math.min(1, 800 / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      this.sending = true;
      try { const b = await toBlob(c, 0.5); await T.send({ t: 'lf', d: B64.enc(await b.arrayBuffer()) }); } catch (e) {}
      this.sending = false;
    }, 650);
  },
  async still(btn) {
    const v = this.video; if (!v || !v.videoWidth) return;
    btn.disabled = true;
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const ok = await T.deliver(await toBlob(c, 0.86), null);
    btn.disabled = false;
    btn.lastElementChild.textContent = ok ? '✓ Standbild liegt auf der Tafel' : 'Nicht angekommen – nochmal tippen';
    setTimeout(() => { if (btn.isConnected) btn.lastElementChild.textContent = 'Standbild auf die Tafel'; }, 2500);
  },
  async flip() {
    this.facing = this.facing === 'environment' ? 'user' : 'environment';
    this.stop(true); await this.start();
  },
  closePc() { if (this.pc) { try { this.pc.close(); } catch (e) {} this.pc = null; } },
  stop(silent) {
    clearInterval(this.timer); this.closePc(); this.mode = '';
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; if (!silent) T.send({ t: 'live-stop' }); }
    if (this.lock) { try { this.lock.release(); } catch (e) {} this.lock = null; }
    if (silent === true && T.tab === 'live' && !this.stream) this.view();
  },
};

// ══════════════════════════ Schüler: ein Foto abgeben ══════════════════════════
const S = {
  chan: '', pub: null, name: '',
  start(chan, pubB64) {
    this.chan = chan; this.pubRaw = B64.unurl(pubB64);
    try { this.name = sessionStorage.getItem('kb_name') || ''; } catch (e) {}
    setStatus('on', 'Foto abgeben');
    this.home();
  },
  home() {
    const name = h('input', { type: 'text', maxlength: '30', placeholder: 'Dein Name (oder Gruppe)', autocomplete: 'off' });
    name.value = this.name;
    name.addEventListener('input', () => { this.name = name.value; try { sessionStorage.setItem('kb_name', this.name); } catch (e) {} });
    view.replaceChildren(h('div', { class: 'card' }, h('h1', { text: 'Foto abgeben' }),
      h('p', { class: 'muted', text: 'Fotografiere dein Ergebnis. Deine Lehrerin oder dein Lehrer entscheidet, ob es an der Tafel gezeigt wird.' }),
      name,
      h('button', { class: 'big-btn', html: IC.camera + '<span>Foto aufnehmen</span>', onclick: () => this.pick(true) }),
      h('button', { class: 'big-btn sec', html: IC.image + '<span>Aus meinen Fotos wählen</span>', onclick: () => this.pick(false) })));
  },
  async pick(capture) {
    const files = await pickFile(capture, false);
    if (!files.length) return;
    let src; try { src = await loadImage(files[0]); } catch (e) { return; }
    openEditor(src, 'Abgeben', blob => this.submit(blob), () => this.home());
  },
  async submit(blob) {
    const pc = progressCard('Foto');
    let ch = null;
    const fail = text => view.replaceChildren(h('div', { class: 'card' }, h('h1', { text: 'Nicht abgegeben' }), h('p', { class: 'muted', text }),
      h('button', { class: 'big-btn', text: 'Zurück', onclick: () => this.home() })));
    try {
      // Eigenes Schlüsselpaar nur für diese Abgabe; nur die Tafel kann das Foto entschlüsseln
      const pair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
      const boardPub = await crypto.subtle.importKey('raw', this.pubRaw, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
      const key = await crypto.subtle.deriveKey({ name: 'ECDH', public: boardPub }, pair.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      const me = rid(8), epk = B64.enc(await crypto.subtle.exportKey('raw', pair.publicKey));
      ch = client().channel('kbd-' + this.chan, { config: { broadcast: { self: false } } });
      let done = null;
      const answer = new Promise(res => { done = res; });
      ch.on('broadcast', { event: 'm' }, async ({ payload }) => {
        if (!payload || payload.to !== me) return;
        try { done(await unseal(key, payload)); } catch (e) {}
      });
      await new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error('timeout')), 10000);
        ch.subscribe(st => { if (st === 'SUBSCRIBED') { clearTimeout(t); res(); } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { clearTimeout(t); rej(new Error(st)); } });
      });
      const send = async m => ch.send({ type: 'broadcast', event: 'm', payload: { s: me, ...(await seal(key, m)) } });
      await ch.send({ type: 'broadcast', event: 'm', payload: { s: me, epk } });
      await sleep(150);
      await sendPhoto(send, blob, { name: this.name.trim().slice(0, 30) }, p => pc.set(p));
      const r = await Promise.race([answer, sleep(12000).then(() => null)]);
      if (r && r.t === 'ok') doneCard('Abgegeben', 'Dein Foto ist bei deiner Lehrkraft angekommen.', () => this.home(), 'Noch ein Foto');
      else if (r && r.t === 'full') fail('Du hast schon genug Fotos geschickt – oder der Eingang ist gerade voll.');
      else fail('Die Tafel hat nicht geantwortet. Vielleicht ist die Abgabe schon beendet.');
    } catch (e) {
      fail('Keine Verbindung. Prüfe das Internet und versuche es noch einmal.');
    }
    // Verbindung gleich wieder schließen – so belegen 30 Handys nicht dauerhaft 30 Leitungen
    try { if (ch) await client().removeChannel(ch); } catch (e) {}
  },
};

// ══════════════════════════ Start ══════════════════════════
(function boot() {
  if (!window.crypto || !crypto.subtle || !window.supabase) {
    fatal('Dieser Browser ist zu alt', 'Bitte öffne die Seite mit Safari (iPhone/iPad) oder Chrome.');
    return;
  }
  const hash = location.hash.slice(1).split('.');
  if (hash[0] === 's' && hash[1] && hash[2]) { S.start(hash[1], hash[2]); return; }
  let link = null;
  if (hash[0] === 't' && hash[1] && hash[2]) {
    link = { chan: hash[1], key: hash[2] };
    try { localStorage.setItem('kb_link', JSON.stringify(link)); } catch (e) {}
    // Der Schlüssel soll nicht in der Adresszeile stehen bleiben
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  } else {
    try { link = JSON.parse(localStorage.getItem('kb_link') || 'null'); } catch (e) {}
  }
  if (!link || !link.chan || !link.key) {
    fatal('Noch nicht verbunden', 'Öffne Scolavis an der Tafel, tippe unten auf „Handy" und scanne den QR-Code mit der Kamera dieses Geräts.');
    return;
  }
  T.start(link.chan, link.key).catch(() => fatal('Verbindung nicht möglich', 'Bitte scanne den QR-Code an der Tafel noch einmal.'));
})();
</script>
