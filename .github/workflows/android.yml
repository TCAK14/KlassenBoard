# Baut die ClassPuls-Android-App (für Smartboards wie CTOUCH Riva) – ohne Android-Werkzeuge auf dem eigenen Rechner.
# Mit Signatur-Schlüssel (Secrets KEYSTORE_BASE64 + KEYSTORE_PASSWORD): öffentliches Release „ClassPuls.apk“.
# Ohne Schlüssel: nur Probe-Build + Test im Android-8-Emulator, Bildschirmfotos im Vorab-Release „app-test“.
name: Android-App

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test im Emulator (Android 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.9.1'
      - name: KVM einschalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test-APK bauen (x86_64)
        working-directory: android
        shell: bash
        run: |
          mkdir -p ../shots
          set -o pipefail
          # Protokoll mit ablegen: die Job-Logs sind ohne Anmeldung nicht lesbar, das Vorab-Release schon
          gradle assembleDebug -PabiFilters=x86_64 --no-daemon --console=plain 2>&1 | tee ../shots/build-full.log
          STATUS=${PIPESTATUS[0]}
          grep -n -i -E "error|failed|what went wrong|exception|warning: \[" ../shots/build-full.log | head -150 > ../shots/build-fehler.txt || true
          tail -250 ../shots/build-full.log > ../shots/build-ende.txt
          rm -f ../shots/build-full.log
          exit $STATUS
      - name: Starten und Bildschirmfotos machen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p shots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n de.klassenboard.app/.MainActivity
            sleep 70
            adb exec-out screencap -p > shots/1-start.png
            sleep 40
            adb exec-out screencap -p > shots/2-spaeter.png
            adb shell dumpsys activity activities | grep -i -E "mResumedActivity|topResumedActivity" > shots/activity.txt || true
            adb logcat -d | grep -i -E "gecko|classpuls|klassenboard|AndroidRuntime|FATAL" | tail -300 > shots/logcat.txt || true
      - name: Leere Dateien entfernen (GitHub lehnt sie ab)
        if: always()
        run: find shots -type f -size 0 -delete 2>/dev/null || true
      - name: Bildschirmfotos veröffentlichen (Vorab-Release app-test)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-test
          name: App-Test (automatisch, nicht installieren)
          prerelease: true
          make_latest: false
          body: Automatischer Test der Android-App im Emulator (Android 8). Nur Bildschirmfotos und Protokoll – keine App zum Installieren.
          files: |
            shots/*

  release:
    name: App bauen und veröffentlichen
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.9.1'
      - name: Signatur-Schlüssel einsetzen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.p12
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "Kein Schlüssel hinterlegt – es wird nichts veröffentlicht."
          fi
      - name: APK bauen (ARM, für Smartboards/Tablets)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../ClassPuls.apk
          rm -f release.p12
          ls -la ../ClassPuls.apk
      - name: Veröffentlichen
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: ClassPuls-App 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ClassPuls für Smartboards und Android-Geräte (ab Android 8).
            Anleitung: https://klassenboard.netlify.app/app
          files: ClassPuls.apk
