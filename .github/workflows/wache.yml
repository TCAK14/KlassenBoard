# Wache: prüft alle 30 Minuten, ob Scolavis erreichbar ist, und hält dabei das Supabase-Projekt wach
# (der Gratis-Tarif pausiert ein Projekt nach 7 Tagen ohne Datenbank-Abfrage – dann fielen Anmeldung,
# Cloud-Speicher, Live-Umfrage und die Handy-Verbindung aus).
# Schlägt eine Prüfung dreimal hintereinander fehl, endet der Lauf rot – GitHub schickt dann eine E-Mail
# an den Besitzer des Projekts (Einstellung „Actions → Failed workflows only", Standard).
# Der Supabase-Schlüssel hier ist der öffentliche (steht auch in index.html) – kein Geheimnis.
name: Wache

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  pruefen:
    name: Erreichbarkeit prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Seiten, Server-Funktionen und Supabase prüfen
        shell: bash
        run: |
          set -u
          SB_URL='https://ubroujkwoizghiiustri.supabase.co'
          SB_KEY='sb_publishable_WbCKbSDkacYqUHxi0E6Qhg_-Lkau-i9'
          fehler=0

          # pruefe <Name> <erwarteter Status> <Suchtext oder -> <curl-Argumente …>
          pruefe() {
            local name="$1" soll="$2" text="$3"; shift 3
            local versuch status
            for versuch in 1 2 3; do
              status=$(curl -sS -m 25 -o /tmp/antwort -w '%{http_code}' "$@" 2>/tmp/curl-fehler || echo 000)
              if [ "$status" = "$soll" ] && { [ "$text" = "-" ] || grep -q -- "$text" /tmp/antwort; }; then
                echo "OK      $name ($status)"
                return 0
              fi
              echo "Versuch $versuch fehlgeschlagen: $name – Status $status, erwartet $soll $(head -c 200 /tmp/curl-fehler 2>/dev/null)"
              [ "$versuch" -lt 3 ] && sleep 25
            done
            echo "::error::$name ist nicht erreichbar oder antwortet falsch (Status $status, erwartet $soll)"
            fehler=1
          }

          pruefe 'Startseite scolavis.de'        200 'Scolavis'         https://scolavis.de/
          pruefe 'Tafel scolavis.de/index.html'  200 'WIDGET_RENDERERS' https://scolavis.de/index.html
          pruefe 'Startseite scolavis.com'       200 'Scolavis'         https://scolavis.com/
          pruefe 'Handy-Seite'                   200 'Scolavis'         https://scolavis.de/handy
          # Server-Funktionen leben: ein GET wird bewusst mit 405 abgewiesen (kostet nichts, ruft keine KI auf)
          pruefe 'Server-Funktionen (/api)'      405 'method'           https://scolavis.de/api/ai-chat
          # Supabase: Anmeldedienst + eine echte Datenbank-Abfrage (hält das Projekt wach)
          pruefe 'Supabase Anmeldung'            200 '-'                -H "apikey: $SB_KEY" "$SB_URL/auth/v1/health"
          pruefe 'Supabase Datenbank'            200 '-'                -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" "$SB_URL/rest/v1/polls?select=id&limit=1"

          exit $fehler
