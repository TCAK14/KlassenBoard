[build]
  publish = "."
  command = "npm install"
  functions = "netlify/functions"

# Lokal gehostete Schrift: ändert sich nie → lange im Browser behalten
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Bibliotheken mit Version im Dateinamen: ändern sich nie
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# App (PWA): Service Worker immer frisch prüfen, Manifest kurz, Symbole eine Woche
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ── Interne Dateien niemals ausliefern (publish = "." veröffentlicht sonst alles) ──
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/android/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

# Download-Seite der Android-App (Smartboards)
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# Handy-Seite (Foto, Live-Kamera, Fernbedienung, Schüler-Abgabe) – wird über den QR-Code an der Tafel geöffnet
[[redirects]]
  from = "/handy"
  to = "/handy.html"
  status = 200

[[redirects]]
  from = "/landing"
  to = "/landing.html"
  status = 301

[[redirects]]
  from = "/landing.html"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/impressum.html"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/datenschutz.html"
  to = "/datenschutz.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
