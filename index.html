.sb-col { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:4px; padding:8px 6px; border-radius:16px; background:var(--w-fill); border:2px solid transparent; }
.sb-col.lead { border-color:var(--sb); background:var(--w-fill-2); }
.sb-name { width:100%; min-width:0; box-sizing:border-box; padding:4px 6px; border:0; border-radius:8px; background:transparent; color:var(--sb); font:inherit; font-weight:700; text-align:center; outline:none; }
body[data-cards="dark"] .sb-name { color:var(--w-ink); }
.sb-name:focus { background:var(--w-fill-3); }
.sb-num { font-weight:700; line-height:1; font-variant-numeric:tabular-nums; color:var(--w-ink); }
.sb-row { display:flex; gap:6px; width:100%; }
.sb-btn { flex:1 1 0; min-width:0; height:44px; border:0; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--w-fill-3); color:var(--w-ink); }
.sb-btn:last-child { flex:1.6 1 0; background:var(--sb); color:#fff; }
.sb-btn:active { transform:scale(0.95); }

/* ── Zeitkreis ── */
.vt { width:100%; height:100%; box-sizing:border-box; padding:8px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
.vt-disc { flex:none; }
.vt-side { display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; }
.vt.vt-wide { flex-direction:row; gap:12px; }
.vt-wide .vt-side { flex:1 1 0; min-width:0; }
.vt-row.vt-mini .tm-btn:not(.tm-go) { display:none; }
.vt-disc svg { display:block; width:100%; height:100%; }
.vt-face { fill:#fff; stroke:var(--w-line-strong); stroke-width:.8; }
body[data-cards="dark"] .vt-face { fill:rgba(255,255,255,0.08); }
.vt-pie { fill:none; stroke:#D92D20; stroke-width:38; transition:stroke-dasharray .3s linear; }
.vt.urgent .vt-pie { stroke:#B42318; }
.vt-ticks line { stroke:var(--w-ink); stroke-width:1.2; stroke-linecap:round; opacity:.55; }
.vt-hub { fill:var(--w-ink); }
.vt-digits { font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
.vt.urgent .vt-digits { color:var(--w-danger); }
.vt-row { width:100%; max-width:340px; }
.vt-row .tm-go { flex:2.2 1 0; min-height:42px; font-size:16px; }
.vt-row .tm-go .ic { display:none; }

/* ── Countdown ── */
.cd { width:100%; height:100%; box-sizing:border-box; padding:10px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; }
.cd > * { flex:none; }
.cd-small { color:var(--w-muted); font-weight:700; line-height:1.2; }
.cd-small:empty { display:none; }
.cd-num { font-weight:700; line-height:1; font-variant-numeric:tabular-nums; color:var(--accent-ink); }
body[data-cards="dark"] .cd-num { color:var(--accent-soft); }
.cd.today .cd-num { color:#D9480F; }
.cd-title { font-weight:700; line-height:1.2; overflow-wrap:anywhere; }
.cd-date { color:var(--w-faint); margin-top:4px; }

/* ── Kalender ── */
.cal-head { flex:none; align-self:stretch; display:flex; align-items:center; gap:4px; padding:5px 8px; background:var(--w-bar); }
.cal-title { flex:1 1 0; min-width:0; font-size:15px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-today { flex:none; height:30px; padding:0 10px; border-radius:8px; border:1.5px solid var(--w-line-strong); background:transparent; color:var(--w-ink); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
.cal-grid { flex:1 1 0; align-self:stretch; min-height:0; box-sizing:border-box; padding:4px 6px 6px; display:grid; grid-template-columns:repeat(8, 1fr); grid-auto-rows:1fr; }
.cal-h { display:flex; align-items:center; justify-content:center; font-size:.62em; font-weight:700; color:var(--w-muted); text-transform:uppercase; letter-spacing:.04em; }
.cal-c { position:relative; display:flex; align-items:center; justify-content:center; font-weight:600; font-variant-numeric:tabular-nums; }
.cal-c span { display:flex; align-items:center; justify-content:center; width:1.9em; height:1.9em; border-radius:50%; }
.cal-c.kw, .cal-h.kw { color:var(--w-faint); font-size:.62em; font-weight:700; border-right:1px solid var(--w-line); }
.cal-c.out { color:var(--w-faint); opacity:.55; }
.cal-c.we { color:var(--w-muted); }
.cal-c.now span { background:var(--accent); color:#fff; }
.cal-c.mark span { box-shadow:inset 0 0 0 2px #D9480F; }

/* ── Sticker: kein Kartenhintergrund ── */
.widget[data-type="sticker"] { background:transparent; border-color:transparent; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
.widget[data-type="sticker"]:hover, .widget[data-type="sticker"].selected { background:rgba(255,255,255,0.1); }
.st { line-height:1; user-select:none; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35)); }

/* ── Kamera und Video ── */
.cam-stage { position:relative; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cam-stage video, .vid { width:100%; height:100%; object-fit:contain; background:#000; display:block; }
.cam-stage video.mirror { transform:scaleX(-1); }
.cam-stage .pdf-loading { color:#fff; background:#000; }
.cam-bar { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); display:flex; gap:6px; padding:5px; border-radius:14px; background:rgba(0,0,0,0.55); opacity:0; transition:opacity .15s; max-width:calc(100% - 12px); }
.cam-stage:hover .cam-bar, .cam-bar:focus-within { opacity:1; }
@media (hover:none) { .cam-bar { opacity:1; } }
.cam-btn { display:flex; align-items:center; gap:6px; height:38px; padding:0 10px; border:0; border-radius:10px; background:rgba(255,255,255,0.14); color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
.cam-btn:hover, .cam-btn.on { background:rgba(255,255,255,0.3); }
.vid { flex:1 1 0; align-self:stretch; min-height:0; }

/* ── Einzelnes Element im Vollbild ── */
.widget.wfull { position:fixed !important; left:0 !important; top:0 !important; width:100vw !important; height:100vh !important; z-index:5000 !important; border-radius:0; border:0; }
.widget.wfull .widget-header, .widget.wfull .resize-handle, .widget.wfull .w-full-btn { display:none; }
.widget.wfull .widget-body { top:0; }
body.wfull-on #toolbar, body.wfull-on #dock, body.wfull-on #tb-pull-tab, body.wfull-on #fs-exit { display:none !important; }
.w-full-exit {
  position:absolute; top:12px; right:12px; z-index:60; width:48px; height:48px; border:0; border-radius:50%; cursor:pointer;
  background:rgba(26,22,64,0.6); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.3);
}
.w-full-exit:hover { background:rgba(26,22,64,0.85); }
.w-full-btn {
  position:absolute; top:6px; right:6px; z-index:20; width:36px; height:36px; border:0; border-radius:10px; cursor:pointer;
  background:rgba(26,22,64,0.55); color:#fff; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .15s;
}
.widget:hover .w-full-btn, .w-full-btn:focus-visible { opacity:1; }
@media (hover:none) { .w-full-btn { opacity:.5; } }
body.draw-mode .w-full-btn { display:none; }

/* ── Zeichnen: Werkzeugleiste und Lineal ── */
#draw-toolbar { max-width:calc(100vw - 16px); overflow-x:auto; scrollbar-width:none; gap:5px; }
#draw-toolbar::-webkit-scrollbar { display:none; }
.draw-tool-btn { width:42px; height:42px; border-radius:12px; font-size:0; }
.draw-tool-btn.active { border-color:var(--accent-soft); background:rgba(159,232,255,0.25); color:var(--accent-soft); }
.draw-tool-btn.has-menu { position:relative; }
.draw-tool-btn.has-menu::after { content:''; position:absolute; right:5px; bottom:5px; width:0; height:0; border-left:5px solid transparent; border-bottom:5px solid currentColor; opacity:.7; }
.draw-pop {
  position:fixed; z-index:1810; min-width:240px; padding:8px; border-radius:16px;
  background:var(--card); color:var(--ink); border:1px solid rgba(26,22,64,0.08); box-shadow:0 18px 50px rgba(0,0,0,0.45);
}
.draw-pop-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); padding:6px 10px 4px; }
.draw-pop-item {
  display:flex; align-items:center; gap:12px; width:100%; min-height:44px; padding:6px 10px; border:0; border-radius:10px;
  background:transparent; color:var(--ink); font:inherit; font-size:14.5px; font-weight:600; text-align:left; cursor:pointer;
}
.draw-pop-item:hover { background:rgba(26,22,64,0.07); }
.draw-pop-item.on { background:var(--accent-tint); color:var(--accent-ink); }
.draw-pop-item.toggle::after { content:'aus'; margin-left:auto; font-size:12.5px; color:var(--ink-muted); }
.draw-pop-item.toggle.on::after { content:'an'; color:var(--accent-ink); }
.draw-pop-sep { height:1px; background:var(--line); margin:6px 8px; }
.draw-pop-hint { font-size:12.5px; line-height:1.4; color:var(--ink-muted); padding:6px 10px 4px; max-width:250px; }

/* ── Handy-Verbindung: Fenster mit QR-Code, Live-Kamera, Abgabe-Karte, Laserpunkt ── */
#dock-phone { position:relative; }
#dock-phone.linked::after { content:''; position:absolute; top:7px; right:12px; width:10px; height:10px; border-radius:50%; background:#2FBF71; box-shadow:0 0 0 2px var(--card); }
#phone-panel {
  position:fixed; right:16px; bottom:calc(var(--dock-h) + 22px); z-index:1700; width:min(350px, calc(100vw - 24px));
  max-height:calc(100vh - var(--toolbar-h) - var(--dock-h) - 44px); overflow:auto; padding:14px 16px 12px; border-radius:20px;
  background:var(--card); color:var(--ink); border:1px solid rgba(26,22,64,0.08); box-shadow:0 18px 50px rgba(0,0,0,0.45);
}
body.draw-mode #phone-panel { display:none; }
.pp-head { display:flex; align-items:center; margin-bottom:8px; }
.pp-head b { font-size:17px; }
.pp-x { margin-left:auto; width:36px; height:36px; border:0; border-radius:10px; background:transparent; color:var(--ink-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pp-x:hover { background:rgba(26,22,64,0.07); }
.pp-note { font-size:14px; line-height:1.45; color:var(--ink-muted); margin:0 0 10px; }
.pp-ok { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:10px; border-radius:12px; background:#DFF5EC; color:#0B6B46; font-weight:800; font-size:16px; }
.pp-qr-wrap { text-align:center; }
.pp-qr { display:inline-block; padding:10px; background:#fff; border-radius:14px; box-shadow:inset 0 0 0 1px rgba(26,22,64,0.1); margin:4px 0 8px; }
.pp-steps { text-align:left; margin:4px 0 10px; padding-left:22px; font-size:14px; line-height:1.5; }
.pp-btn { display:block; width:100%; min-height:44px; margin:0 0 8px; padding:8px 14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
.pp-btn.sec { background:var(--accent-tint); color:var(--accent-ink); }
.pp-link { border:0; background:transparent; color:var(--accent-ink); font:inherit; font-size:13.5px; font-weight:700; text-decoration:underline; cursor:pointer; padding:6px 4px; }
.pp-foot { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 10px; margin-top:6px; padding-top:8px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-muted); }

#phone-laser {
  position:fixed; z-index:99998; width:26px; height:26px; margin:-13px; border-radius:50%; background:#ff3b30;
  box-shadow:0 0 22px 8px rgba(255,59,48,0.55); pointer-events:none; opacity:0; transition:opacity .2s, left .08s linear, top .08s linear;
}
#phone-laser.on { opacity:1; }

#phone-live {
  position:fixed; right:16px; top:calc(var(--toolbar-h) + 12px); z-index:1690; width:min(46vw, 760px); border-radius:16px; overflow:hidden;
  background:#0F1F1C; box-shadow:0 18px 50px rgba(0,0,0,0.5); display:flex; flex-direction:column;
}
#phone-live.big { left:0; top:0; right:0; bottom:0; width:auto; border-radius:0; z-index:100000; }
.pl-head { flex:none; display:flex; align-items:center; gap:8px; padding:6px 8px 6px 14px; background:#16302C; color:#fff; font-size:14.5px; }
.pl-tag { font-size:12.5px; color:#9FE3DA; margin-right:auto; }
.pl-tag::before { content:''; display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:#F87171; }
.pl-head button { width:38px; height:38px; border:0; border-radius:10px; background:rgba(255,255,255,0.1); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pl-head button:hover { background:rgba(255,255,255,0.22); }
.pl-body { position:relative; aspect-ratio:16/9; background:#0B1614; }
#phone-live.big .pl-body { flex:1 1 auto; aspect-ratio:auto; }
.pl-body video, .pl-body img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; }

#drop-card {
  position:fixed; left:16px; top:calc(var(--toolbar-h) + 12px); z-index:1690; width:min(300px, calc(100vw - 24px));
  max-height:calc(100vh - var(--toolbar-h) - 30px); overflow:auto; padding:14px; border-radius:20px; text-align:center;
  background:var(--card); color:var(--ink); box-shadow:0 18px 50px rgba(0,0,0,0.45);
}
.dc-title { font-size:22px; font-weight:800; line-height:1.2; }
.dc-sub { font-size:14px; color:var(--ink-muted); margin-bottom:8px; }
.dc-qr { display:inline-block; padding:10px; background:#fff; border-radius:14px; box-shadow:inset 0 0 0 1px rgba(26,22,64,0.1); }
.dc-foot { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
.dc-foot button, .dc-row button { min-height:38px; padding:6px 11px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
.dc-foot button.go, .dc-row button.go { background:var(--accent); border-color:var(--accent); color:#fff; }
.dc-foot button.danger { color:#B42318; }
.dc-list { text-align:left; }
.dc-row { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
.dc-row b { display:block; margin-bottom:6px; overflow-wrap:anywhere; }
.dc-row div { display:flex; gap:6px; flex-wrap:wrap; }
.dc-row img { display:block; width:100%; margin-top:8px; border-radius:10px; }

/* Messwerkzeuge */
.draw-instr { position:fixed; left:0; top:0; z-index:1790; pointer-events:none; touch-action:none; user-select:none; filter:drop-shadow(0 6px 16px rgba(0,0,0,0.35)); }
.draw-instr svg { display:block; overflow:visible; pointer-events:none; }
.draw-instr .ins-body { fill:rgba(251,250,246,0.86); stroke:rgba(26,22,64,0.55); stroke-width:1.5; pointer-events:all; cursor:grab; }
.draw-instr.dragging .ins-body { cursor:grabbing; }
.draw-instr .ins-tick { stroke:#1A1640; stroke-width:1; }
.draw-instr text { fill:#1A1640; font-family:"Atkinson Hyperlegible Next", system-ui, sans-serif; font-size:12px; font-weight:700; text-anchor:middle; }
.draw-instr text.ins-small { font-size:10px; }
.draw-instr text.ins-inner { font-size:9.5px; fill:#76729A; }
.draw-instr text.ins-read { fill:#4A2FD0; font-size:15px; }
.draw-instr .ins-hub { fill:#1A1640; }
.draw-instr .ins-rot { fill:#6D4BFF; stroke:#fff; stroke-width:2; pointer-events:all; cursor:alias; }
.draw-instr .ins-arm { stroke:#D9480F; stroke-width:2; }
.draw-instr .ins-arm-h { fill:#D9480F; stroke:#fff; stroke-width:2; pointer-events:all; cursor:pointer; }

/* Laserpointer und Auswahl */
#draw-laser { position:fixed; left:0; top:0; z-index:1795; pointer-events:none; }
/* Laufender Strich von Textmarker, Bleistift und Kreide: eigene Ebene, damit er überall gleich deckt */
#draw-live { position:fixed; left:0; top:0; z-index:501; pointer-events:none; }
.draw-pop-item .sub { display:block; font-size:12.5px; font-weight:400; color:var(--ink-muted); }
.draw-pop-item.on .sub { color:inherit; opacity:.8; }
/* Farbauswahl (eigene, weil das Farb-Fenster des Browsers nicht überall funktioniert) */
.draw-color-more {
  position:relative; flex:none; width:28px; height:28px; padding:0; border-radius:50%; border:3px solid transparent; cursor:pointer;
  background:conic-gradient(red, yellow, lime, cyan, blue, magenta, red); transition:transform .15s;
}
.draw-color-more:hover, .draw-color-more.active { transform:scale(1.25); border-color:#fff; }
.draw-color-more i { position:absolute; inset:3px; border-radius:50%; display:none; box-shadow:0 0 0 1.5px rgba(0,0,0,0.4); }
.draw-color-more.active i { display:block; }
.color-pop {
  position:fixed; z-index:100001; width:min(340px, calc(100vw - 16px)); padding:12px; border-radius:16px;
  background:var(--card); color:var(--ink); border:1px solid rgba(26,22,64,0.08); box-shadow:0 18px 50px rgba(0,0,0,0.45);
}
.color-grid { display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; }
.color-grid button { height:28px; padding:0; border:0; border-radius:7px; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(26,22,64,0.16); }
.color-grid button.on { box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--accent); position:relative; }
.color-mix { margin-top:12px; font-size:12.5px; font-weight:600; color:var(--ink-muted); }
.color-mix input[type=range] {
  -webkit-appearance:none; appearance:none; display:block; width:100%; height:16px; margin:5px 0 10px; border-radius:8px;
  outline:none; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(26,22,64,0.16);
}
.color-mix input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff;
  border:2px solid rgba(26,22,64,0.6); box-shadow:0 1px 4px rgba(0,0,0,0.35);
}
.color-mix input[type=range]::-moz-range-thumb {
  width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid rgba(26,22,64,0.6); box-shadow:0 1px 4px rgba(0,0,0,0.35);
}
.color-mix input[type=range]::-moz-range-track { background:transparent; }
.color-foot { display:flex; align-items:center; gap:10px; }
.color-now { flex:none; width:44px; height:38px; border-radius:10px; box-shadow:inset 0 0 0 1px rgba(26,22,64,0.2); }
.color-foot button {
  margin-left:auto; height:38px; padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff;
  font:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
}
.draw-selbox { position:fixed; z-index:1792; border:2px dashed #7FE3DA; background:rgba(159,232,255,0.08); pointer-events:none; }
.draw-float { position:fixed; z-index:1792; outline:2px dashed #7FE3DA; outline-offset:2px; pointer-events:none; }
.draw-float-img { display:block; width:100%; height:100%; }
.draw-float-bar {
  position:absolute; right:-2px; top:-52px; display:flex; gap:4px; padding:4px; border-radius:12px;
  background:var(--card); box-shadow:0 6px 18px rgba(0,0,0,0.3); pointer-events:auto;
}
.draw-float.bar-below .draw-float-bar { top:auto; bottom:-52px; }
.draw-float-bar button { width:40px; height:40px; border:0; border-radius:9px; background:transparent; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.draw-float-bar button:hover { background:rgba(26,22,64,0.08); }

/* ── PDF ── */
.pdf-bar { flex:none; align-self:stretch; display:flex; align-items:center; gap:4px; padding:5px 8px; background:var(--w-bar); }
.pdf-btn { flex:none; width:40px; height:36px; border:0; border-radius:9px; background:transparent; color:var(--w-ink); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pdf-btn:hover { background:var(--w-fill-3); }
.pdf-no { flex:none; min-width:58px; text-align:center; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
.pdf-name { flex:1 1 0; min-width:0; padding:0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--w-muted); }
/* margin:auto statt Zentrieren per Flex: so wird beim Vergrößern links/oben nichts abgeschnitten */
.pdf-stage { flex:1 1 0; align-self:stretch; width:100%; min-width:0; min-height:0; position:relative; display:flex; overflow:auto; background:var(--w-fill-2); }
.pdf-stage canvas { display:block; flex:none; margin:auto; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.25); }
.pdf-stage.zoomed, .pdf-full-stage.zoomed { cursor:grab; touch-action:none; }
.pdf-stage.zoomed:active, .pdf-full-stage.zoomed:active { cursor:grabbing; }
.pdf-zoom { flex:none; min-width:48px; text-align:center; font-size:12.5px; font-weight:700; color:var(--w-muted); font-variant-numeric:tabular-nums; }
.pdf-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center; font-size:14px; color:var(--w-muted); }
.pdf-empty { margin:auto; display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px; text-align:center; }
.pdf-empty-text { font-size:14px; color:var(--w-ink); max-width:300px; }
.pdf-empty-hint { font-size:12.5px; color:var(--w-faint); }
.widget-body.pdf-drop { outline:3px dashed var(--accent); outline-offset:-6px; }
.modal-overlay.pdf-full { z-index:100002; background:rgba(10,14,13,0.96); backdrop-filter:none; flex-direction:column; align-items:stretch; justify-content:flex-start; }
.pdf-full-stage { flex:1 1 0; min-height:0; display:flex; overflow:auto; cursor:pointer; touch-action:none; }
.pdf-full-stage canvas { flex:none; margin:auto; background:#fff; box-shadow:0 8px 40px rgba(0,0,0,0.6); }
.pdf-full-zoom { min-width:64px; text-align:center; color:#fff; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
.pdf-full-gap { width:14px; }
.pdf-full-bar { flex:none; display:flex; align-items:center; justify-content:center; gap:10px; padding:10px; }
.pdf-full-bar button { width:56px; height:48px; border:0; border-radius:12px; background:rgba(255,255,255,0.14); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pdf-full-bar button:hover { background:rgba(255,255,255,0.26); }
.pdf-full-no { min-width:90px; text-align:center; color:#fff; font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }

/* Hilfslinien beim Einrasten */
.snap-guide { position:absolute; z-index:100000; background:var(--accent-soft); pointer-events:none; display:none; }
.snap-guide.v { width:2px; top:0; bottom:0; }
.snap-guide.h { height:2px; left:0; right:0; }

/* ── Menüs im hellen Stil der Leiste ── */
#widget-menu {
  background:var(--card); color:var(--ink); border:1px solid rgba(26,22,64,0.08); border-radius:20px;
  box-shadow:0 20px 56px rgba(0,0,0,0.4); z-index:1750; width:min(720px, calc(100vw - 24px)); padding:14px;
}

.wm-item { background:transparent; border:1px solid var(--line); color:var(--ink); font-size:14px; font-weight:600; min-height:44px; padding:8px 10px; border-radius:12px; gap:9px; }

#more-menu, #tb-customize-panel {

}

.inst-modal { max-width:520px; }

.inst-head img { flex:none; border-radius:14px; }
.inst-head h2 { margin:0 0 4px; }

.inst-link { display:inline-block; margin-top:6px; padding:8px 14px; border-radius:10px; background:var(--accent, #6D4BFF); color:#fff !important; font-weight:700; text-decoration:none; }
.inst-dev { font-size:12.5px; color:rgba(255,255,255,0.5); margin:6px 0 0; }
#install-hint {
  position:fixed; left:16px; bottom:calc(var(--dock-h, 84px) + 22px); z-index:1700; display:flex; align-items:center; gap:12px;
  max-width:min(440px, calc(100vw - 32px)); padding:10px 10px 10px 12px; border-radius:16px; background:var(--card, #FAF9FF); color:var(--ink, #1A1640);
  box-shadow:0 14px 40px rgba(0,0,0,0.35); animation:fadeIn .25s;
}
#install-hint img { flex:none; border-radius:11px; }
#install-hint .ih-txt { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
#install-hint .ih-txt b { font-size:15px; }
#install-hint .ih-txt span { font-size:13px; color:var(--ink-muted, #5B6763); }
#install-hint .ih-go { flex:none; border:0; border-radius:10px; padding:10px 14px; background:var(--accent, #6D4BFF); color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
#install-hint .ih-x { flex:none; width:36px; height:36px; border:0; border-radius:10px; background:transparent; color:var(--ink-muted, #5B6763); display:flex; align-items:center; justify-content:center; cursor:pointer; }
body.draw-mode #install-hint, body.wfull-on #install-hint { display:none; }
.mm-item {
  display:flex; align-items:center; gap:12px; width:100%; min-height:44px; padding:8px 12px;
  border:0; border-radius:10px; background:transparent; color:var(--ink);
  font:inherit; font-size:14.5px; font-weight:600; text-align:left; cursor:pointer;
}
.mm-item:hover { background:rgba(26,22,64,0.07); }
.mm-item .ic { color:var(--ink-muted); }

.mm-note { margin-left:auto; font-size:12.5px; color:var(--ink-muted); font-weight:600; }
.mm-sep { height:1px; background:var(--line); margin:6px 8px; }
.mm-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); padding:8px 12px 4px; }

#class-dropdown { background:var(--card); color:var(--ink); border:1px solid rgba(26,22,64,0.08); border-radius:16px; backdrop-filter:none; box-shadow:0 20px 56px rgba(0,0,0,0.4); min-width:240px; }
.class-dd-header { color:var(--ink-muted); font-size:11px; font-weight:700; letter-spacing:.08em; padding:12px 14px 6px; }
.class-dd-item { font-size:14.5px; padding:10px 14px; color:var(--ink); }
.class-dd-item:hover { background:rgba(26,22,64,0.07); }
.class-dd-item.active { background:var(--accent-tint); color:var(--accent-ink); }
.class-dd-item .class-dd-name { font-weight:600; }
.class-dd-item .class-dd-del { color:var(--ink-muted); font-size:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
.class-dd-item .class-dd-del:hover { background:rgba(180,35,24,0.14); color:#B42318; }
.class-dd-divider { background:var(--line); }
.class-dd-add { color:var(--ink-muted); font-size:14px; font-weight:600; padding:10px 14px; }
.class-dd-add:hover { color:var(--ink); }
.class-dd-add-input { padding:6px 14px 12px; }
.class-dd-add-input input { background:#fff; border:1.5px solid #BCB7DC; color:var(--ink); font-size:14px; border-radius:10px; padding:9px 11px; }
.class-dd-add-input input:focus { border-color:var(--accent); }
.class-dd-add-input button { background:var(--accent); font-size:14px; padding:9px 12px; border-radius:10px; }

/* ── KI-Assistent sitzt jetzt in der unteren Leiste ── */
/* Fenster des Assistenten: hell wie die Karten, unten rechts über dem „KI“-Knopf */
#ki-panel {
  left:auto; right:20px; bottom:calc(var(--dock-h) + 30px);
  width:440px; height:620px; min-width:300px; min-height:320px;
  max-width:calc(100vw - 24px); max-height:calc(100vh - var(--toolbar-h) - var(--dock-h) - 44px);
  background:var(--card); color:var(--ink); border:1px solid rgba(26,22,64,0.08); border-radius:20px;
  box-shadow:0 20px 56px rgba(0,0,0,0.4); backdrop-filter:none; -webkit-backdrop-filter:none;
  font-size:16px; transform-origin:bottom right;
}
/* Groß: mittig und mit großer Schrift, damit die Klasse mitlesen kann */
#ki-panel.big {
  right:max(12px, calc(50vw - 500px)); width:min(1000px, calc(100vw - 24px)) !important;
  height:calc(100vh - var(--toolbar-h) - var(--dock-h) - 44px) !important; font-size:clamp(18px, 1.7vw, 26px);
}
#ki-panel .ki-resize { left:0; right:auto; width:22px; height:22px; cursor:nw-resize; }
#ki-panel .ki-resize::after { left:6px; right:auto; top:6px; border-right:0; border-left:2px solid #BCB7DC; border-top:2px solid #BCB7DC; }
#ki-panel.big .ki-resize { display:none; }
#ki-panel-header { padding:12px 10px 12px 18px; background:transparent; border-bottom:1px solid var(--line); gap:6px; }
#ki-panel-header .ki-logo { display:flex; color:var(--accent); font-size:0; }
#ki-panel-header b { font-size:17px; flex:1; margin-left:4px; }
.ki-hbtn { width:38px; height:38px; flex:none; border:0; border-radius:10px; background:transparent; color:var(--ink-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.ki-hbtn:hover { background:rgba(26,22,64,0.08); color:var(--ink); }
#ki-history { padding:14px; gap:10px; scrollbar-color:#BCB7DC transparent; }
.ki-bubble { font-size:1em; line-height:1.5; padding:10px 14px; border-radius:16px; max-width:94%; }
.ki-bubble.user { background:var(--accent); color:#fff; border-bottom-right-radius:6px; white-space:pre-wrap; }
.ki-bubble.ai { background:#fff; color:var(--ink); border:1px solid var(--line); border-bottom-left-radius:6px; }
.ki-bubble.thinking { color:var(--ink-muted); font-style:normal; display:flex; align-items:center; gap:8px; }
.ki-bubble.error { background:#FEF3F2; border-color:#FECDCA; color:#912018; }
.ki-dots { display:inline-flex; gap:4px; }
.ki-dots i { width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.3; animation:kiDot 1.2s infinite; }
.ki-dots i:nth-child(2) { animation-delay:.2s; }
.ki-dots i:nth-child(3) { animation-delay:.4s; }
@keyframes kiDot { 0%, 80%, 100% { opacity:.25; transform:translateY(0); } 40% { opacity:1; transform:translateY(-3px); } }
.ki-md p { margin:0 0 .6em; }
.ki-md > :last-child { margin-bottom:0; }
.ki-md ol, .ki-md ul { margin:0 0 .6em; padding-left:1.5em; }
.ki-md li { margin:.2em 0; }
.ki-md h4 { margin:.3em 0 .4em; font-size:1.05em; }
.ki-md code { background:rgba(26,22,64,0.08); padding:.1em .35em; border-radius:5px; font-size:.92em; }
.ki-tag { display:inline-block; margin-bottom:6px; padding:2px 8px; border-radius:999px; background:var(--accent-tint); color:var(--accent-ink); font-size:.75em; font-weight:700; }
.ki-note { margin-top:8px; font-size:.82em; color:var(--ink-muted); }
.ki-sources { margin-top:10px; font-size:.82em; color:var(--ink-muted); line-height:1.5; }
.ki-sources a { color:var(--accent-ink); }
.ki-sugg-frame { display:block; width:100%; height:84px; border:0; margin-top:8px; border-radius:10px; background:#fff; }
.ki-img { display:block; width:100%; max-height:46vh; object-fit:contain; border-radius:10px; background:#F1F3EF; }
.ki-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.ki-act {
  display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 12px; border-radius:10px; cursor:pointer;
  border:1.5px solid var(--line); background:#fff; color:var(--ink); font:inherit; font-size:14px; font-weight:700;
}
.ki-act:hover { border-color:var(--accent); background:var(--accent-tint); color:var(--accent-ink); }
.ki-act.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.ki-act.primary:hover { background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; }
.ki-empty { margin:auto 0; padding:6px 4px; display:flex; flex-direction:column; gap:8px; }
.ki-empty-title { font-size:1.25em; font-weight:700; }
.ki-empty-sub { color:var(--ink-muted); font-size:.95em; line-height:1.45; }
.ki-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.ki-chip { min-height:40px; padding:6px 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink); font:inherit; font-size:.9em; font-weight:600; cursor:pointer; text-align:left; }
.ki-chip:hover { border-color:var(--accent); background:var(--accent-tint); color:var(--accent-ink); }
#ki-input-row { padding:10px 12px 6px; gap:8px; border-top:1px solid var(--line); align-items:flex-end; }
#ki-textarea {
  background:#fff; border:1.5px solid #BCB7DC; border-radius:12px; color:var(--ink);
  font-size:16px; line-height:1.4; padding:11px 12px; height:46px; min-height:46px; max-height:140px;
}
#ki-textarea::placeholder { color:#76729A; }
#ki-textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,75,255,0.18); }
#ki-send { width:46px; height:46px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:0; }
#ki-send:hover { background:var(--accent-dark); }
#ki-send:disabled { opacity:.45; cursor:default; }
#ki-foot { padding:0 14px 10px; font-size:12px; line-height:1.35; color:var(--ink-muted); text-align:center; }
#toast { bottom:calc(var(--dock-h) + 30px); }
/* Schüler-Abstimmungsseite (?poll=…): nur die Abstimmung, keine Lehrer-Leisten */
body.voting #toolbar, body.voting #dock, body.voting #board { display:none !important; }
/* Dialoge: neutrales Dunkel passend zur Tafel statt Blaugrau */
.modal { background:#1A2321; }
.bg-swatch { border-color:rgba(255,255,255,0.16); }
.bg-swatch.sel { border-color:#fff; box-shadow:0 0 0 2px var(--accent-soft); }
.voice-toast { bottom:calc(var(--dock-h) + 80px); }
body.fullscreen #toast, body.draw-mode #toast { bottom:24px; }

/* ── Schmalere Bildschirme (iPad quer, kleine Laptops) ── */
@media (max-width: 1100px) {
  #toolbar { gap:6px; padding:0 10px; }
  #logo-text { display:none; }
  .em-opt { padding:0 9px; }
  #edit-mode-btn .lbl { display:none; }
  #class-btn { max-width:150px; }
  #class-btn .class-name { max-width:96px; }
}

/* ── Tablets hochkant und Handys ── */
@media (max-width: 768px) {
  :root { --toolbar-h:52px; --dock-h:70px; }
  #toolbar { gap:4px; padding:0 8px; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; touch-action:pan-x; }
  #class-btn { height:38px; padding:0 9px; font-size:13px; max-width:112px; }
  #class-btn .class-name { max-width:70px; }
  #board-tabs { flex:1 1 auto; min-width:90px; }
  .tab-btn { height:38px; padding:0 11px; font-size:13px; }
  #add-board-btn, .tb-icon-btn { width:38px; height:38px; }
  #edit-mode-btn { height:38px; }
  .em-opt { height:32px; padding:0 8px; }
  #btn-fullscreen { display:none; }
  #auth-area { display:none; }   /* Anmelden steckt hier im Menü ⋯ */

  #dock { left:8px; right:8px; bottom:8px; transform:none; max-width:none; border-radius:18px; padding:5px 6px; }
  .dock-scroll { flex:1 1 auto; }
  body.autohide:not(.chrome-shown) #dock { transform:translateY(160%); }
  .dock-btn { min-width:58px; height:56px; padding:4px 7px; font-size:11px; gap:3px; }

  #board::-webkit-scrollbar { display:none; }
  .widget { min-width:100px; min-height:60px; }

  #widget-menu { width:calc(100vw - 16px); left:8px !important; right:8px !important; max-height:60vh; border-radius:16px; }
  #more-menu { left:8px !important; right:8px !important; min-width:0; }

  .modal { width:calc(100vw - 24px) !important; max-height:80vh; padding:18px; }
  .modal h2 { font-size:16px; }
  .modal-lg { width:calc(100vw - 24px) !important; }
  .auth-modal { max-width:calc(100vw - 24px); }
  .upgrade-modal { max-width:calc(100vw - 24px) !important; }
  .template-grid { grid-template-columns:1fr; }

  #ki-panel, #ki-panel.big {
    left:8px; right:8px; width:auto !important; height:min(72vh, 620px) !important; max-width:none;
    bottom:calc(var(--dock-h) + 18px); border-radius:16px; font-size:16px;
  }
  #ki-panel .ki-resize, #ki-big { display:none; }

  #draw-toolbar { padding:6px 10px; gap:4px; bottom:16px; max-width:calc(100vw - 12px); overflow-x:auto; }
  .draw-tool-btn { width:32px; height:32px; font-size:14px; }
  .draw-color-btn { width:24px; height:24px; }
  #draw-size-slider { width:50px; }

  #class-dropdown { min-width:200px; }
  .class-dd-item { padding:9px 10px; font-size:13px; }
}

@media (max-width: 480px) {
  :root { --toolbar-h:50px; }
  /* Zeichnen und Bearbeiten wandern auf dem Handy ins Menü ⋯ */
  #dock-draw, #dock-phone, #edit-mode-btn { display:none !important; }
  #class-btn { max-width:96px; }
  #ki-panel, #ki-panel.big { height:min(76vh, 640px) !important; }
}

/* iOS Safari zoomt beim Fokussieren von Feldern mit Schrift < 16px unerwünscht hinein */
@supports (-webkit-touch-callout: none) {
  input[type="text"], input[type="url"], input[type="email"], input[type="password"],
  input[type="number"], input[type="search"], textarea, select { font-size:16px !important; }
}
/* Umzugs-Hinweis auf der alten Adresse */
.umzug-bar { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:100000; display:flex; align-items:center;
  gap:12px; max-width:calc(100vw - 24px); padding:10px 12px 10px 16px; border-radius:14px; background:#1A1060; color:#F4F3FF;
  box-shadow:0 10px 30px rgba(0,0,0,.45); border:1px solid rgba(159,232,255,.35); font-size:14px; line-height:1.35; }
.umzug-go { flex:none; padding:8px 14px; border-radius:999px; background:var(--brand-grad); color:#fff; font-weight:700; text-decoration:none; }
.umzug-x { flex:none; background:none; border:0; color:inherit; font-size:22px; line-height:1; cursor:pointer; opacity:.7; padding:2px 4px; }

/* SQL für Supabase SQL-Editor (einmalig ausführen):

// ══════════════════════════════════════════════════════════════
// AUTH MODULE
// ══════════════════════════════════════════════════════════════
const AUTH = {
  client: null,
  user: null,
  _syncTimer: null,
  _configured: false,
  _cloudReady: false,     // Cloud-Stand wurde in dieser Sitzung abgeglichen → erst dann darf hochgeladen werden
  _cloudLoading: null,
  _syncing: false,
  _syncAgain: false,
  _wipeOnSignOut: false,
  _lastRemoteCheck: 0,

  init() {
    if (!window.supabase || SUPABASE_URL.includes('DEINE')) {
      console.info('Scolavis: Supabase nicht konfiguriert — lokaler Modus aktiv.');
      return;
    }
    try {
      this._configured = true;
      this.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      // Bestehende Session wiederherstellen
      this.client.auth.getSession().then(({ data }) => {
        if (data?.session) {
          this.user = data.session.user;
          this._updateUI();
          this.loadFromCloud();
        }
      });
      this.client.auth.onAuthStateChange((event, session) => {
        const prevId = this.user?.id || null;
        this.user = session?.user || null;
        this._updateUI();
        if (event === 'PASSWORD_RECOVERY') { openNewPasswordModal(); return; }
        if (event === 'SIGNED_IN') {
          // SIGNED_IN feuert bei supabase-js auch beim Tab-Refokus — nur bei Kontowechsel neu abgleichen
          if (prevId !== (this.user?.id || null)) this._cloudReady = false;
          if (!this._cloudReady) this.loadFromCloud();
        }
        if (event === 'SIGNED_OUT') this._onSignedOut();
      });
    } catch(e) { console.warn('Supabase init error:', e); }
  },

  async login(email, password) {
    const { error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw error;
  },

  async register(email, password) {
    const { data, error } = await this.client.auth.signUp({ email, password });
    if (error) throw error;
    return data;
  },

  async resetPassword(email) {
    const { error } = await this.client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname,
    });
    if (error) throw error;
  },

  async logout() {
    if (!this.client) return;
    // Ausstehende Änderungen zuerst hochladen — danach wird die lokale Kopie vom Gerät entfernt
    if (APP.saveTimer) APP._persist();
    clearTimeout(this._syncTimer); this._syncTimer = null;
    let clean = false;
    if (this.user && this._cloudReady) {
      // Immer hochladen (nicht nur bei offenen Änderungen): stellt sicher, dass der komplette
      // Stand inkl. Klassenliste wirklich in der Cloud liegt, bevor das Gerät geleert wird
      for (let i = 0; this._syncing && i < 50; i++) await new Promise(r => setTimeout(r, 100));
      await this._doSync();
      clean = this._lastSyncOk === true && !localStorage.getItem('classpuls_dirty_at');
    }
    if (!clean && this.user) {
      const ok = confirm(
        'Der aktuelle Stand konnte nicht in der Cloud gesichert werden.\n\n' +
        'Trotzdem abmelden? Deine Tafeln bleiben dann auf diesem Gerät gespeichert.'
      );
      if (!ok) return;
    }
    this._wipeOnSignOut = clean;
    try { await this.client.auth.signOut(); }
    catch(e) { this._wipeOnSignOut = false; toast('⚠️ Abmelden fehlgeschlagen'); }
  },

  _onSignedOut() {
    this._cloudReady = false;
    clearTimeout(this._syncTimer); this._syncTimer = null;
    if (this._wipeOnSignOut) {
      // Sauber abgemeldet: Konto-Daten vom (oft geteilten) Schul-Gerät entfernen
      this._wipeOnSignOut = false;
      resetLocalData();
      toast('👋 Abgemeldet — deine Tafeln sind sicher in der Cloud gespeichert', 4000);
    } else {
      APP.load();
      renderAll();
      DRAW.loadBoard(APP.state.activeBoardId);
      toast('👋 Abgemeldet');
    }
  },

  syncToCloud() {
    if (!this.client || !this.user) return;
    // Nie blind hochladen: erst prüfen, was in der Cloud liegt (sonst überschreibt ein
    // veralteter lokaler Stand beim Start die neueren Tafeln eines anderen Geräts)
    if (!this._cloudReady) { this.loadFromCloud(); return; }
    clearTimeout(this._syncTimer);
    this._setSyncDot('syncing');
    this._syncTimer = setTimeout(() => { this._syncTimer = null; this._doSync(); }, 1500);
  },

  async _doSync(force) {
    if (!this.client || !this.user) return;
    if (this._syncing) { this._syncAgain = true; return; }
    this._syncing = true;
    this._lastSyncOk = false;
    this._setSyncDot('syncing');
    const uidNow = this.user.id;
    try {
      const dirtyBefore = localStorage.getItem('classpuls_dirty_at');
      if (!force) {
        // Hat inzwischen ein anderes Gerät gespeichert? Dann abgleichen statt überschreiben.
        const { data: head, error: headErr } = await this.client
          .from('boards').select('updated_at').eq('user_id', uidNow).maybeSingle();
        if (headErr) throw headErr;
        const known = Date.parse(localStorage.getItem('classpuls_synced_at') || '') || 0;
        if (head && (Date.parse(head.updated_at) || 0) !== known) {
          this._syncing = false;
          this._cloudReady = false;
          await this.loadFromCloud();
          // Abgleich erfolgreich (Cloud übernommen oder zusammengeführt + hochgeladen)?
          this._lastSyncOk = this._cloudReady && !localStorage.getItem('classpuls_dirty_at');
          return;
        }
      }
      const payload = {
        boards: APP.state.boards,
        activeBoardId: APP.state.activeBoardId,
        icalCache: APP.icalCache,
        classes: CLASSES._data(),
        currentClass: CLASSES.current(),
      };
      const { data: saved, error } = await this.client
        .from('boards')
        .upsert({ user_id: uidNow, data: payload, updated_at: new Date().toISOString() })
        .select('updated_at')
        .single();
      if (error) throw error;
      // Den von der Datenbank bestätigten Zeitstempel als Versionsmarke merken
      localStorage.setItem('classpuls_synced_at', saved?.updated_at || '');
      localStorage.setItem('classpuls_owner', uidNow);
      // dirty nur löschen, wenn währenddessen nichts Neues gespeichert wurde
      if (localStorage.getItem('classpuls_dirty_at') === dirtyBefore) {
        localStorage.removeItem('classpuls_dirty_at');
      }
      this._lastSyncOk = true;
      this._setSyncDot('ok');
    } catch(e) {
      console.warn('Cloud-Sync fehlgeschlagen:', e);
      this._setSyncDot('error');
    } finally {
      this._syncing = false;
      if (this._syncAgain) { this._syncAgain = false; this.syncToCloud(); }
    }
  },

  // Beim Zurückkehren in den Tab prüfen, ob ein anderes Gerät Neues gespeichert hat
  checkRemote() {
    if (!this.client || !this.user || this._syncing) return;
    const now = Date.now();
    if (now - this._lastRemoteCheck < 30000) return;
    this._lastRemoteCheck = now;
    this.loadFromCloud();
  },

  loadFromCloud() {
    if (!this.client || !this.user) return Promise.resolve();
    if (this._cloudLoading) return this._cloudLoading;
    this._cloudLoading = this._reconcile()
      .catch(e => { console.warn('Cloud-Abgleich fehlgeschlagen:', e); this._setSyncDot('error'); })
      .finally(() => { this._cloudLoading = null; });
    return this._cloudLoading;
  },

  // Gleicht lokalen und Cloud-Stand ab, ohne je stillschweigend Arbeit zu überschreiben
  async _reconcile() {
    const uidNow = this.user.id;
    const stillSameUser = () => this.user && this.user.id === uidNow;
    const ts = s => (s ? Date.parse(s) || 0 : 0);

    // Erst nur die Versionsmarke holen — der (evtl. große) Datensatz wird nur bei Bedarf geladen
    const { data: head, error } = await this.client
      .from('boards').select('updated_at').eq('user_id', uidNow).maybeSingle();
    if (error) throw error;
    if (!stillSameUser()) return;

    const owner     = localStorage.getItem('classpuls_owner');
    const foreign   = !!owner && owner !== uidNow;   // lokale Tafeln gehören einem anderen Konto
    const anonymous = !owner;                        // lokale Tafeln entstanden ohne Anmeldung
    const dirty     = !foreign && (!!localStorage.getItem('classpuls_dirty_at') || !!APP._dirtyPending);
    const known     = foreign ? 0 : ts(localStorage.getItem('classpuls_synced_at'));

    if (!head) {
      // Für dieses Konto gibt es noch keinen Cloud-Stand
      if (foreign) resetLocalData();                 // fremde Tafeln nie in dieses Konto hochladen
      localStorage.setItem('classpuls_owner', uidNow);
      this._cloudReady = true;
      if (APP.state.boards.length > 0) await this._doSync(true);
      return;
    }

    if (ts(head.updated_at) === known) {
      // Cloud unverändert seit unserem letzten Stand
      localStorage.setItem('classpuls_owner', uidNow);
      this._cloudReady = true;
      if (dirty) await this._doSync(true); else this._setSyncDot('ok');
      return;
    }

    // Die Cloud hat einen anderen Stand → vollständig laden
    const { data: row, error: rowErr } = await this.client
      .from('boards').select('data, updated_at').eq('user_id', uidNow).maybeSingle();
    if (rowErr) throw rowErr;
    if (!stillSameUser()) return;
    if (!row) { this._cloudReady = true; return; }

    if (dirty) {
      // Beide Seiten haben sich geändert → der Nutzer entscheidet (Standard: nichts verlieren)
      const when = row.updated_at ? new Date(row.updated_at).toLocaleString('de-DE') : '';
      const choice = await askSyncConflict(when, anonymous);
      if (!stillSameUser()) return;
      if (choice !== 'cloud') {
        if (choice === 'merge') this._mergeCloud(row);
        localStorage.setItem('classpuls_owner', uidNow);
        this._cloudReady = true;
        await this._doSync(true);
        if (choice === 'merge') toast('🔀 Beide Stände wurden zusammengeführt');
        return;
      }
    }
    this._applyCloud(row, foreign);
    this._cloudReady = true;
  },

  // Cloud-Tafeln ergänzen, lokale behalten (bei gleicher Tafel gewinnt dieses Gerät)
  _mergeCloud(row) {
    const d = row.data || {};
    const cloudBoards = Array.isArray(d.boards) ? d.boards : [];
    const localIds = new Set(APP.state.boards.map(b => b.id));
    APP.state.boards = APP.state.boards.concat(cloudBoards.filter(b => b && b.id && !localIds.has(b.id)));
    const localClasses = CLASSES._data();
    let added = false;
    Object.keys(d.classes || {}).forEach(name => {
      if (!localClasses[name]) { localClasses[name] = d.classes[name]; added = true; }
    });
    if (added) { CLASSES._save(localClasses); CLASSES.renderDropdown(); }
    renderAll();
    APP._persistLocal();
  },

  _applyCloud(row, foreign) {
    const d = row.data || {};
    if (foreign) {
      ['classpuls_classes', 'classpuls_current_class', 'classpuls_drawings'].forEach(k => localStorage.removeItem(k));
      DRAW.boardDrawings = {};
    }
    clearTimeout(APP.saveTimer); APP.saveTimer = null;   // ausstehendes Speichern des alten Stands verwerfen
    APP._dirtyPending = false;
    APP.state.boards        = Array.isArray(d.boards) ? d.boards : [];
    APP.state.activeBoardId = d.activeBoardId || null;
    APP.state.undo          = null;
    APP.icalCache           = d.icalCache || {};
    // Klassen gehören zum Gesamtstand (ältere Cloud-Stände ohne den Schlüssel lassen lokale Klassen unberührt)
    if ('classes' in d || foreign) {
      try {
        const classes = d.classes || {};
        const has = Object.keys(classes).length > 0;
        if (has) localStorage.setItem('classpuls_classes', JSON.stringify(classes));
        else localStorage.removeItem('classpuls_classes');
        const cur = has && d.currentClass && classes[d.currentClass] ? d.currentClass : null;
        if (cur) localStorage.setItem('classpuls_current_class', cur);
        else localStorage.removeItem('classpuls_current_class');
        const nameEl = document.getElementById('class-btn-name');
        if (nameEl) nameEl.textContent = cur || 'Klasse wählen';
        CLASSES.renderDropdown();
      } catch(_) {}
    }
    if (!APP.state.boards.find(b => b.id === APP.state.activeBoardId)) {
      APP.state.activeBoardId = APP.state.boards[0]?.id || null;
    }
    if (APP.state.boards.length === 0) {
      APP._booting = true;
      createBoard('Meine Tafel', null, [], true);
      APP._booting = false;
    } else {
      renderAll();
    }
    DRAW.loadBoard(APP.state.activeBoardId);
    // Geladenen Cloud-Stand lokal sichern — sonst zeigt ein Offline-Neustart alte Daten
    clearTimeout(APP.saveTimer); APP.saveTimer = null;
    APP._persistLocal();
    localStorage.removeItem('classpuls_dirty_at');
    localStorage.setItem('classpuls_synced_at', row.updated_at || '');
    localStorage.setItem('classpuls_owner', this.user.id);
    this._setSyncDot('ok');
    toast('☁️ Tafeln aus der Cloud geladen');
  },

  _updateUI() {
    const badge    = document.getElementById('user-badge');
    const loginBtn = document.getElementById('auth-login-btn');
    const emailEl  = document.getElementById('user-email');
    const avatarEl = document.getElementById('user-avatar');
    if (this.user) {
      const email = this.user.email || '';
      const meta = this.user.user_metadata || {};
      const displayName = meta.last_name || meta.lastName || meta.name?.split(' ').pop() || email.split('@')[0];
      emailEl.textContent  = displayName;
      avatarEl.textContent = displayName[0]?.toUpperCase() || '?';
      badge.classList.add('visible');
      loginBtn.style.display = 'none';
    } else {
      badge.classList.remove('visible');
      loginBtn.style.display = '';
    }
  },

  _setSyncDot(state) {
    const dot = document.getElementById('sync-dot');
    if (!dot) return;
    dot.classList.toggle('syncing', state === 'syncing');
    if (state !== 'syncing') {
      dot.style.background = state === 'ok' ? '#22c55e' : '#f87171';
    }
  },
};

const FREE_LIMITS = { maxClasses: 1, maxBoards: 3 };

function isPro() {
  // Pro/School nur bei gesetztem Plan in app_metadata — das kann NUR serverseitig
  // gesetzt werden (Supabase Dashboard bzw. später Stripe-Webhook), nicht vom Nutzer selbst.
  // user_metadata zählt bewusst NICHT: das könnte sich jeder Nutzer per API selbst setzen.
  const plan = AUTH.user?.app_metadata?.plan || '';
  return plan === 'pro' || plan === 'school';
}

function checkBoardLimit() {
  if (isPro()) return true;
  if (APP.state.boards.length >= FREE_LIMITS.maxBoards) {
    openUpgradeModal('boards');
    return false;
  }
  return true;
}

function checkClassLimit() {
  if (isPro()) return true;
  const count = CLASSES.list().length;
  if (count >= FREE_LIMITS.maxClasses) {
    openUpgradeModal('classes');
    return false;
  }
  return true;
}

function openUpgradeModal(reason) {
  const msgs = {
    boards: 'Im Kostenlos-Plan kannst du maximal ' + FREE_LIMITS.maxBoards + ' Tafeln erstellen.',
    classes: 'Im Kostenlos-Plan kannst du maximal ' + FREE_LIMITS.maxClasses + ' Klasse erstellen.',
    ki: 'Die kostenlosen Fragen an den KI-Assistenten sind aufgebraucht.',
  };
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:420px;text-align:center">
      <button class="modal-close" style="position:absolute;top:12px;right:12px">&times;</button>
      <div style="font-size:48px;margin-bottom:14px">🔒</div>
      <h2 style="margin-bottom:8px">Upgrade auf Pro</h2>
      <p style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:20px;line-height:1.6">
        ${msgs[reason] || 'Diese Funktion ist nur im Pro-Plan verfügbar.'}<br>
        Mit Pro bekommst du unbegrenzte Klassen, Tafeln, KI-Assistent und mehr.
      </p>
      <div style="display:flex;gap:10px">
        <button class="btn-secondary" style="flex:1" onclick="this.closest('.modal-overlay').remove()">Später</button>
        <a href="landing.html#preise" class="btn-primary" style="flex:1;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center">Ab 2,50 €/Monat →</a>
      </div>
    </div>`;
  overlay.querySelector('.modal-close').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// Entwurfsfläche (1076×532) → tatsächlicher Bildschirm
function fitLayout(widgets) {
  const boardEl = document.getElementById('board');
  const css = getComputedStyle(document.documentElement);
  const availW = (boardEl && boardEl.clientWidth) || window.innerWidth;
  const availH = ((boardEl && boardEl.clientHeight) || window.innerHeight)
    - (parseInt(css.getPropertyValue('--toolbar-h')) || 60) - (parseInt(css.getPropertyValue('--dock-h')) || 84) - 16;
  // Seite noch nicht sichtbar (z. B. im Hintergrund geladen): Maße der Vorlage behalten statt Breite 0
  if (!(availW >= 240)) return widgets.map(w => ({ ...w }));
  if (availW < 600) {
    // Handy: volle Breite, untereinander (in Lesereihenfolge der Vorlage)
    let y = 12;
    return widgets.slice().sort((a, b) => (a.y - b.y) || (a.x - b.x)).map(w => {
      const h = Math.round(w.h * 0.85);
      const r = { ...w, x: 12, y, w: availW - 24, h };
      y += h + 12;
      return r;
    });
  }
  const k = Math.max(0.75, Math.min(1.8, availW / LAYOUT_BASE.w, availH / LAYOUT_BASE.h));
  return widgets.map(w => ({ ...w,
    x: Math.round(w.x * k), y: Math.round(w.y * k), w: Math.round(w.w * k), h: Math.round(w.h * k) }));
}

const APP = {
  state: {
    boards: [],
    activeBoardId: null,
    editMode: true,
    undo: null,   // previous boards snapshot (1 level)
  },
  intervals: {},   // widgetId -> intervalId
  selectedId: null,
  saveTimer: null,
  icalCache: {},   // boardId -> { url, entries, lastFetched }

  // ── Persistence ──
  _booting: false,       // true während automatischer Start-Speicherungen (zählen nicht als Nutzer-Änderung)
  _dirtyPending: false,  // es gibt Nutzer-Änderungen, die noch nicht als "dirty" vermerkt sind
  _quotaWarned: false,

  save() {
    if (!this._booting) this._dirtyPending = true;
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this._persist(), 500);
  },
  // Schreibt den Stand in den Browser-Speicher. Ist der voll, haben die Tafeln
  // Vorrang vor den (ebenfalls dort liegenden) Zeichnungen.
  _persistLocal() {
    if (this._resetting) return true;
    const json = JSON.stringify({
      boards: this.state.boards,
      activeBoardId: this.state.activeBoardId,
      icalCache: this.icalCache,
    });
    try { localStorage.setItem('classpuls_v2', json); return true; }
    catch(e) {
      try {
        localStorage.removeItem('classpuls_drawings');
        localStorage.setItem('classpuls_v2', json);
        return true;
      } catch(e2) { return false; }
    }
  },
  _persist() {
    clearTimeout(this.saveTimer);
    this.saveTimer = null;
    if (!this._persistLocal() && !this._quotaWarned) {
      this._quotaWarned = true;
      toast('⚠️ Browser-Speicher voll — bitte große Bilder/Dateien von den Tafeln entfernen', 6000);
    }
    if (this._dirtyPending) {
      this._dirtyPending = false;
      // Merker: lokale Änderungen, die noch nicht (erfolgreich) in der Cloud sind
      try { localStorage.setItem('classpuls_dirty_at', new Date().toISOString()); } catch(e) {}
      AUTH.syncToCloud(); // Cloud-Sync wenn eingeloggt
    }
  },
  load() {
    try {
      let raw = localStorage.getItem('classpuls_v2');
      if (!raw) {
        raw = localStorage.getItem('klassenboard_v2');
        if (raw) {
          localStorage.setItem('classpuls_v2', raw);
          localStorage.removeItem('klassenboard_v2');
        }
      }
      if (!raw) return false;
      const data = JSON.parse(raw);
      this.state.boards = Array.isArray(data.boards) ? data.boards.filter(b => b && b.id) : [];
      this.state.boards.forEach(b => { if (!Array.isArray(b.widgets)) b.widgets = []; });
      this.state.activeBoardId = data.activeBoardId || null;
      this.icalCache = data.icalCache || {};
      return true;
    } catch(e) { return false; }
  },
  exportAll() {
    const data = {
      version:2,
      exported: new Date().toISOString(),
      boards: this.state.boards,
      icalCache: this.icalCache,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ClassPuls_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    toast('✅ Exportiert');
  },
  importAll(json) {
    try {
      const data = JSON.parse(json);
      if (!Array.isArray(data.boards) || data.boards.length === 0) throw new Error('Ungültiges Format');
      if (!data.boards.every(b => b && typeof b === 'object' && b.id && Array.isArray(b.widgets))) throw new Error('Ungültiges Format');
      this.snapshotUndo();
      this.state.boards = data.boards;
      this.icalCache = data.icalCache || {};
      if (!this.state.boards.find(b => b.id === this.state.activeBoardId)) {
        this.state.activeBoardId = this.state.boards[0]?.id || null;
      }
      this.save();
      renderAll();
      toast('✅ Importiert: ' + data.boards.length + ' Tafel(n)');
    } catch(e) { toast('❌ Import fehlgeschlagen: ' + e.message); }
  },
  // ── Undo ──
  snapshotUndo() {
    this.state.undo = JSON.stringify(this.state.boards);
  },
  undo() {
    if (!this.state.undo) { toast('Kein Rückgängig verfügbar'); return; }
    const prev = JSON.parse(this.state.undo);
    this.state.undo = null;
    this.state.boards = prev;
    if (!this.state.boards.find(b => b.id === this.state.activeBoardId)) {
      this.state.activeBoardId = this.state.boards[0]?.id || null;
    }
    this.save();
    renderAll();
    DRAW.loadBoard(this.state.activeBoardId); // Zeichenebene zum ggf. gewechselten Board holen
    toast('↩ Rückgängig');
  },

  // ── Board helpers ──
  activeBoard() { return this.state.boards.find(b => b.id === this.state.activeBoardId); },
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), dur);
}

// Escaped für HTML-Text UND Attribute. Ohne die Anführungszeichen wurden Werte wie
// «Was bedeutet "Demokratie"?» in value="…" abgeschnitten und gingen beim Speichern verloren.
function safeText(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function resetEverything() {
  // Angemeldet: zuerst die Cloud leeren — sonst käme nach dem Neuladen alles von dort zurück
  if (AUTH.user && AUTH.client) {
    let cloudOk = false;
    try {
      const del = AUTH.client.from('boards').delete().eq('user_id', AUTH.user.id);
      const res = await Promise.race([del, new Promise(r => setTimeout(() => r({ error: new Error('timeout') }), 8000))]);
      cloudOk = !res.error;
      // Klassen-Tabelle ist optional — ein Fehler dort darf das Zurücksetzen nicht blockieren
      await Promise.race([
        AUTH.client.from('class_boards').delete().eq('user_id', AUTH.user.id),
        new Promise(r => setTimeout(r, 4000)),
      ]).catch(() => {});
    } catch(e) { cloudOk = false; }
    if (!cloudOk) {
      toast('⚠️ Die Cloud ist gerade nicht erreichbar — bitte gleich nochmal versuchen', 5000);
      return false;
    }
  }
  // Ab hier darf nichts mehr den alten Stand zurückschreiben
  APP._resetting = true;
  clearTimeout(APP.saveTimer); APP.saveTimer = null; APP._dirtyPending = false;
  clearTimeout(AUTH._syncTimer); AUTH._syncTimer = null;
  clearTimeout(DRAW._saveTimer);
  ['classpuls_v2','classpuls_classes','classpuls_current_class','classpuls_drawings',
   'classpuls_dirty_at','classpuls_synced_at','classpuls_owner','classpuls_visited',
   'kb_toolbar_pos','kb_toolbar_side','kb_toolbar_prefs','kb_dock_items','kb_autohide','kb_cards'].forEach(k => localStorage.removeItem(k));
  try { indexedDB.deleteDatabase('classpuls_files'); } catch(e) {}
  localStorage.removeItem('classpuls_roster');
  // Neu laden → die App startet wie beim ersten Besuch (ohne ?reset in der Adresse)
  window.location.replace(window.location.pathname);
  return true;
}

// Fragt bei zwei abweichenden Ständen, was passieren soll. Wird der Dialog ohne Wahl
// geschlossen, gilt "zusammenführen" — dabei geht auf keiner Seite etwas verloren.
function askSyncConflict(when, anonymous) {
  return new Promise(resolve => {
    const intro = anonymous
      ? 'Auf diesem Gerät gibt es Tafeln, die noch nicht zu deinem Konto gehören — und in deinem Konto liegen bereits Tafeln'
      : 'Auf diesem Gerät gibt es Änderungen, die noch nicht in der Cloud sind — und die Cloud wurde inzwischen von einem anderen Gerät geändert';
    const { overlay } = openModal(`
      <div class="modal" style="max-width:440px">
        <h2 style="margin-bottom:8px">☁️ Zwei Stände gefunden</h2>
        <p style="font-size:13px;color:rgba(255,255,255,0.6);line-height:1.6;margin-bottom:16px">
          ${intro}${when ? ' (Stand: ' + safeText(when) + ')' : ''}. Was soll passieren?
        </p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn-primary" data-choice="merge">🔀 Beides behalten (zusammenführen)</button>
          <button class="btn-secondary" data-choice="cloud">☁️ Cloud-Stand laden — Änderungen dieses Geräts verwerfen</button>
          <button class="btn-secondary" data-choice="local">💻 Stand dieses Geräts behalten — Cloud überschreiben</button>
        </div>
      </div>`);
    let done = false;
    const finish = choice => {
      if (done) return;
      done = true;
      clearInterval(watch);
      overlay.remove();
      resolve(choice);
    };
    overlay.querySelectorAll('[data-choice]').forEach(b =>
      b.addEventListener('click', () => finish(b.dataset.choice)));
    // Egal wie der Dialog verschwindet (ESC, Klick daneben): nie ohne Entscheidung hängen bleiben
    const watch = setInterval(() => { if (!overlay.isConnected) finish('merge'); }, 300);
  });
}

// Bilder vor dem Speichern verkleinern: Handy-Fotos (4–8 MB) würden den
// Browser-Speicher (~5 MB für ALLE Tafeln) sofort sprengen.
function readImageScaled(file, maxDim, cb) {
  if (!file || file.size > 30 * 1024 * 1024) { cb(null); return; }
  const reader = new FileReader();
  reader.onerror = () => cb(null);
  reader.onload = ev => {
    const src = ev.target.result;
    // Animationen und Vektorgrafiken nicht rastern — nur übernehmen, wenn sie klein genug sind
    if (file.type === 'image/gif' || file.type === 'image/svg+xml') { cb(src.length <= 1500000 ? src : null); return; }
    const img = new Image();
    img.onerror = () => cb(null);
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      if (scale === 1 && src.length <= 400000) { cb(src); return; }   // schon klein genug
      const c = document.createElement('canvas');
      c.width  = Math.max(1, Math.round(img.naturalWidth  * scale));
      c.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const cx = c.getContext('2d');
      let out = '';
      if (file.type === 'image/png') {                       // Transparenz erhalten, notfalls etwas kleiner
        for (let k = 1; k >= 0.5; k -= 0.25) {
          c.width = Math.max(1, Math.round(img.naturalWidth * scale * k));
          c.height = Math.max(1, Math.round(img.naturalHeight * scale * k));
          cx.clearRect(0, 0, c.width, c.height);
          cx.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/png');
          if (out.length <= 700000) break;
        }
      }
      if (!out || out.length > 700000) {
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', 0.85);
      }
      cb(out);
    };
    img.src = src;
  };
  reader.readAsDataURL(file);
}

// Signalton für abgelaufene Timer. Der AudioContext wird beim Start-Klick "geweckt",
// weil Browser Ton ohne vorherige Nutzer-Geste blockieren.
let _alarmCtx = null;
function primeAlarm() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    _alarmCtx = _alarmCtx || new AC();
    if (_alarmCtx.state === 'suspended') _alarmCtx.resume();
  } catch(e) {}
}
function playAlarm() {
  try {
    primeAlarm();
    const ctx = _alarmCtx;
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.02;
    [0, 0.32, 0.64, 1.2, 1.52, 1.84].forEach(dt => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, t0 + dt);
      gain.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.26);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0 + dt); osc.stop(t0 + dt + 0.28);
    });
  } catch(e) {}
}

// KI- und Sprachbefehle liefern Widget-Einstellungen teils in anderer Form, als die Widgets erwarten
function normalizeWidgetConfig(type, cfg) {
  cfg = (cfg && typeof cfg === 'object') ? cfg : {};
  if ((type === 'text' || type === 'goal') && !cfg.text && cfg.content) cfg.text = cfg.content;
  if (type === 'homework') {
    if (!cfg.items && cfg.text) cfg.items = [cfg.text];
    if (Array.isArray(cfg.items)) {
      cfg.items = cfg.items.map(it => typeof it === 'string' ? it : (it && (it.text || it.label)) || '').filter(Boolean);
    }
  }
  if (type === 'phases') {
    // Die KI nennt die Liste "items" mit "label" — das Widget erwartet "phases" mit "name" und Farbe
    const palette = ['#6D4BFF', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4'];
    const src = Array.isArray(cfg.phases) ? cfg.phases : (Array.isArray(cfg.items) ? cfg.items : null);
    if (src) {
      cfg.phases = src.filter(p => p && typeof p === 'object').map((p, i) => ({
        name: String(p.name || p.label || p.text || 'Phase ' + (i + 1)),
        minutes: Math.max(1, parseInt(p.minutes) || 5),
        color: /^#[0-9a-f]{3,8}$/i.test(p.color || '') ? p.color : palette[i % palette.length],
      }));
      delete cfg.items;
      cfg.activeIdx = -1;
    }
  }
  if (type === 'checklist' && Array.isArray(cfg.items)) {
    cfg.items = cfg.items.map(it => typeof it === 'string' ? { text: it, done: false } : { text: String((it && (it.text || it.label)) || ''), done: !!(it && it.done) }).filter(it => it.text);
  }
  if (type === 'agenda' && Array.isArray(cfg.items)) {
    cfg.items = cfg.items.map(it => typeof it === 'string' ? { time: '', text: it } : { time: String((it && it.time) || ''), text: String((it && (it.text || it.label)) || '') }).filter(it => it.text);
  }
  if (type === 'timer' && (cfg.minutes != null || cfg.seconds != null)) {
    // "Timer 5 Minuten" kommt als seconds:300 — ohne Umrechnung kämen 5 Standard-Minuten obendrauf
    let total = (Number(cfg.minutes) || 0) * 60 + (Number(cfg.seconds) || 0);
    total = Math.max(1, Math.min(total, 180 * 60));
    cfg.minutes = Math.floor(total / 60);
    cfg.seconds = total % 60;
  }
  return cfg;
}

function el(tag, cls, attrs={}) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function openModal(html, onClose) {
  const overlay = el('div','modal-overlay');
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  const close = () => { overlay.remove(); onClose && onClose(); };
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  const closeBtns = overlay.querySelectorAll('[data-close]');
  closeBtns.forEach(b => b.addEventListener('click', close));
  // Tastatur: ESC schließt auch beim Tippen in einem Feld; Enter in einem
  // einzeiligen Feld löst die Hauptaktion aus (Login-Dialog regelt Enter selbst)
  overlay.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
    if (e.key === 'Enter' && e.target.tagName === 'INPUT'
        && !['file','checkbox','range','color'].includes(e.target.type)
        && !e.target.closest('.auth-modal')) {
      const primary = overlay.querySelector('.btn-primary:not([disabled]), .ai-board-gen-btn:not([disabled])');
      if (primary) { e.preventDefault(); primary.click(); }
    }
  });
  // Mit Maus/Tastatur direkt ins erste Feld — auf Touch-Geräten nicht (Bildschirmtastatur verdeckt den Dialog)
  if (window.matchMedia && window.matchMedia('(pointer:fine)').matches) {
    requestAnimationFrame(() => {
      if (overlay.contains(document.activeElement)) return;
      overlay.querySelector('input[type="text"], input[type="url"], input[type="number"], input[type="email"], textarea')?.focus();
    });
  }
  return { overlay, close };
}

// BOARD CRUD
// ══════════════════════════════════════════════════════════════
// Ruhige Tafelfarbe als Standard. Der frühere Standard (Indigo-Verlauf) wird beim Anzeigen
// wie „kein eigener Hintergrund“ behandelt — so bekommen bestehende Tafeln den neuen Look,
// ohne dass gespeicherte Daten umgeschrieben werden müssen.
const DEFAULT_BG = { type:'color', value:'radial-gradient(1100px 720px at 12% -8%, #3A1C9E 0%, transparent 62%), radial-gradient(1000px 760px at 104% 108%, #0B4FB8 0%, transparent 58%), #060432' };
const LEGACY_DEFAULT_BG = 'linear-gradient(135deg,#667eea,#764ba2)';
// Frühere Standard-Hintergründe: werden beim Anzeigen wie „Standard“ (Scolavis-Verlauf) behandelt.
// Wer Tafelgrün ausdrücklich will, wählt es neu (Wert #1F3532 — absichtlich minimal anders).
const isLegacyBg = v => v === LEGACY_DEFAULT_BG || v === '#1F3531';
function createBoard(name, bg, widgets=[], skipLimit=false) {
  if (!skipLimit && !checkBoardLimit()) return null;
  const board = {
    id: uid(),
    name: name || 'Neue Tafel',
    background: bg ? { ...bg } : { ...DEFAULT_BG },
    // Tief kopieren: sonst teilen sich Tafeln aus derselben Vorlage ihre Einstellungen
    // (abgehakte Checkliste auf Tafel A wäre auch auf Tafel B abgehakt)
    widgets: widgets.map((w, i) => ({ zIndex: i + 1, ...JSON.parse(JSON.stringify(w)), id: uid(), createdAt: new Date().toISOString() })),
    createdAt: new Date().toISOString(),
  };
  // Zeichnung der bisherigen Tafel sichern, damit sie nicht auf der neuen erscheint
  if (DRAW.canvas && APP.state.activeBoardId) DRAW.saveBoard(APP.state.activeBoardId);
  APP.state.boards.push(board);
  APP.state.activeBoardId = board.id;
  APP.save();
  renderAll();
  if (DRAW.canvas) DRAW.loadBoard(board.id);
  return board;
}

function switchBoard(id) {
  // Save drawing of current board before switching
  DRAW.saveBoard(APP.state.activeBoardId);
  APP.state.activeBoardId = id;
  APP.selectedId = null;
  stopAllIntervals();
  APP.save();
  renderBoardTabs();
  renderBoardBg();
  renderWidgets();
  // Load drawing of new board
  DRAW.loadBoard(id);
}

function deleteBoard(id) {
  if (APP.state.boards.length <= 1) { toast('Mindestens eine Tafel erforderlich'); return; }
  APP.snapshotUndo();
  // Find index and name of deleted board
  const delIdx = APP.state.boards.findIndex(b => b.id === id);
  const delName = APP.state.boards[delIdx]?.name || '';
  // Check if deleted board had default name "Tafel N"
  const defaultMatch = delName.match(/^Tafel (\d+)$/);
  const delNum = defaultMatch ? parseInt(defaultMatch[1]) : null;

  APP.state.boards = APP.state.boards.filter(b => b.id !== id);

  // Auto-renumber: boards with default name "Tafel M" where M > delNum → "Tafel M-1"
  if (delNum !== null) {
    APP.state.boards.forEach(b => {
      const m = b.name.match(/^Tafel (\d+)$/);
      if (m && parseInt(m[1]) > delNum) {
        b.name = 'Tafel ' + (parseInt(m[1]) - 1);
      }
    });
  }

  if (APP.state.activeBoardId === id) {
    const newIdx = Math.min(delIdx, APP.state.boards.length - 1);
    APP.state.activeBoardId = APP.state.boards[newIdx].id;
  }
  // Zeichnung des gelöschten Boards entsorgen und die des neuen Boards anzeigen
  delete DRAW.boardDrawings[id];
  DRAW._persistDrawings();
  DRAW.loadBoard(APP.state.activeBoardId);
  APP.save();
  renderAll();
}

function renameBoard(id, name) {
  const b = APP.state.boards.find(b => b.id === id);
  if (b) { b.name = name; APP.save(); renderBoardTabs(); }
}

// Sucht im gerade sichtbaren Teil der Tafel die erste freie Stelle (zeilenweise von links oben)
function findFreeSpot(board, w, h) {
  const boardEl = document.getElementById('board');
  const css = getComputedStyle(document.documentElement);
  const top = parseInt(css.getPropertyValue('--toolbar-h')) || 60;
  const dock = parseInt(css.getPropertyValue('--dock-h')) || 84;
  const sx = boardEl ? boardEl.scrollLeft : 0, sy = boardEl ? boardEl.scrollTop : 0;
  const viewW = (boardEl ? boardEl.clientWidth : window.innerWidth);
  const viewH = (boardEl ? boardEl.clientHeight : window.innerHeight) - top - dock - 16;
  const gap = 16, step = 24, pad = 24;
  const others = (board.widgets || []).map(o => ({ x:o.x||0, y:o.y||0, w:o.w||200, h:o.h||100 }));
  const free = (x, y) => !others.some(o => x < o.x + o.w + gap && x + w + gap > o.x && y < o.y + o.h + gap && y + h + gap > o.y);
  for (let y = sy + pad; y + h <= sy + viewH; y += step) {
    for (let x = sx + pad; x + w <= sx + viewW - pad; x += step) {
      if (free(x, y)) return { x, y };
    }
  }
  // Handy: Elemente stehen untereinander → neues Element ans Ende hängen
  if (viewW < 600) {
    return { x: 12, y: others.reduce((m, o) => Math.max(m, o.y + o.h), 0) + 12 };
  }
  // Kein freier Platz: leicht versetzt stapeln, damit nichts exakt übereinander liegt
  const n = others.length % 8;
  return { x: sx + Math.max(12, Math.min(40 + n * 28, viewW - w - 12)), y: sy + 40 + n * 28 };
}

// Standard-Einstellungen; Namensrad und Gruppen starten mit der gemerkten Klassenliste statt mit Beispielnamen
function newWidgetConfig(type, extraConfig) {
  const cfg = { ...getDefaultConfig(type), ...(extraConfig || {}) };
  if (type === 'dayplan' && !(extraConfig && ('source' in extraConfig || 'items' in extraConfig)) && icalFor(APP.activeBoard(), false)) {
    cfg.source = 'timetable';
  }
  if ((type === 'names' || type === 'groups' || type === 'duties') && !(extraConfig && 'names' in extraConfig)) {
    const roster = getRoster();
    if (roster) cfg.names = roster;
  }
  return cfg;
}

function addWidget(type, extraConfig={}, size) {
  const board = APP.activeBoard();
  if (!board) return;
  APP.snapshotUndo();
  const def = REGISTRY[type];
  // auf dem Handy nicht breiter als der Bildschirm
  const maxNewW = Math.max(200, ((document.getElementById('board') || {}).clientWidth || window.innerWidth) - 24);
  const newW = (size && size.w) || def.w, newH = (size && size.h) || def.h;
  const widget = {
    id: uid(),
    type,
    ...findFreeSpot(board, Math.min(newW, maxNewW), newH),
    w: Math.min(newW, maxNewW),
    h: newH,
    zIndex: nextZ(board),
    locked: false,
    config: newWidgetConfig(type, extraConfig),
    createdAt: new Date().toISOString(),
  };
  board.widgets.push(widget);
  APP.save();
  renderWidgets();
  // select new widget
  APP.selectedId = widget.id;
  const wEl = document.querySelector('[data-wid="'+widget.id+'"]');
  if (wEl) {
    wEl.classList.add('selected');
    // liegt das neue Element außerhalb des sichtbaren Bereichs (Handy: ganz unten), dorthin scrollen
    if (wEl.scrollIntoView) wEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  return widget;
}

function removeWidget(id) {
  const board = APP.activeBoard();
  if (!board) return;
  APP.snapshotUndo();
  board.widgets = board.widgets.filter(w => w.id !== id);
  stopInterval(id);
  stopAudioStream(id);
  stopCam(id); CAM_ON.delete(id);
  stopPollChannel(id);
  APP.selectedId = null;
  APP.save();
  renderWidgets();
}

function updateWidget(id, patch) {
  const board = APP.activeBoard();
  if (!board) return;
  const w = board.widgets.find(w => w.id === id);
  if (!w) return;
  Object.assign(w, patch);
  APP.save();
}

function nextZ(board) {
  return (board.widgets.reduce((m, w) => Math.max(m, w.zIndex || 0), 0)) + 1;

// INTERVAL MANAGEMENT
// ══════════════════════════════════════════════════════════════
function startInterval(wid, fn, ms) {
  stopInterval(wid);
  APP.intervals[wid] = setInterval(fn, ms);
}
function stopInterval(wid) {
  clearInterval(APP.intervals[wid]);
  delete APP.intervals[wid];
}
function stopAllIntervals() {
  Object.keys(APP.intervals).forEach(stopInterval);
}

// ── Audio streams (Geräuschpegel-Widget) ──
const AUDIO_STREAMS = {};
// ── Supabase Realtime channels (Poll-Widget) ──
const POLL_CHANNELS = {}; // widgetId -> { stream, ctx, raf }
function stopAudioStream(wid) {
  const a = AUDIO_STREAMS[wid];
  if (!a) return;
  cancelAnimationFrame(a.raf);
  a.stream?.getTracks().forEach(t => t.stop());
  a.ctx?.close().catch(()=>{});
  delete AUDIO_STREAMS[wid];
}
function stopAllAudioStreams() {
  Object.keys(AUDIO_STREAMS).forEach(stopAudioStream);
}
function stopPollChannel(wid) {
  if (!POLL_CHANNELS[wid]) return;
  try { AUTH.client?.removeChannel(POLL_CHANNELS[wid]); } catch(e) {}
  delete POLL_CHANNELS[wid];
}
function stopAllPollChannels() {
  Object.keys(POLL_CHANNELS).forEach(stopPollChannel);
}

function renderAll() {
  renderBoardTabs();
  renderBoardBg();
  renderWidgets();
