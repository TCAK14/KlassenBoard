  // ── Lautstärke / Noise Meter ──
  noise(w, body) {
    stopAudioStream(w.id);
    body.style.cssText += 'flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;';

    // Emoji + Label
    const emojiEl = el('div');
    emojiEl.style.cssText = 'font-size:42px;line-height:1;transition:all .2s;';
    emojiEl.textContent = '😴';

    const labelEl = el('div');
    labelEl.style.cssText = 'font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--w-ink);transition:color .3s;';
    labelEl.textContent = 'LEISE';

    // Balken-Meter (5 Balken)
    const bars = el('div');
    bars.style.cssText = 'display:flex;align-items:flex-end;gap:4px;height:48px;';
    const barEls = [];
    const barHeights = [20, 30, 45, 35, 25];
    barHeights.forEach((h, i) => {
      const b = el('div');
      b.style.cssText = `width:10px;border-radius:4px;background:var(--w-fill-3);height:${h}%;transition:height .1s,background .3s;`;
      bars.appendChild(b);
      barEls.push(b);
    });

    // Mikrofon-Button
    const micBtn = el('button');
    micBtn.style.cssText = 'margin-top:4px;padding:6px 14px;border-radius:20px;border:none;background:var(--accent-tint);color:var(--accent-ink);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;';
    micBtn.textContent = '🎤 Mikrofon starten';

    body.append(emojiEl, bars, labelEl, micBtn);

    let running = false;

    function getColor(level) {
      const low  = (w.config.lowThreshold  ?? 25) / 100;
      const high = (w.config.highThreshold ?? 55) / 100;
      if (level < low)  return { bg:'#22c55e', fg:'#15803D', label:'LEISE',  emoji:'😴' };
      if (level < high) return { bg:'#f59e0b', fg:'#A8480A', label:'MITTEL', emoji:'🤫' };
      return                   { bg:'#ef4444', fg:'#B42318', label:'LAUT',   emoji:'🔊' };
    }

    function startMic() {
      if (running) return;
      // Ohne HTTPS oder in alten Browsern gibt es kein Mikrofon-API — sonst bliebe der Button hängen
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        emojiEl.textContent = '❌';
        labelEl.textContent = 'Mikrofon nicht verfügbar';
        labelEl.style.color = 'var(--w-danger)';
        return;
      }
      running = true;
      micBtn.textContent = '⏹ Stoppen';
      micBtn.style.background = 'rgba(180,35,24,0.12)';
      micBtn.style.color = 'var(--w-danger)';

      navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(stream => {
          // Widget wurde entfernt/neu gerendert, während die Freigabe lief → Mikro sofort schließen
          if (!body.isConnected) { stream.getTracks().forEach(t => t.stop()); return; }
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.6;
          source.connect(analyser);
          const data = new Uint8Array(analyser.frequencyBinCount);

          function tick() {
            if (!body.isConnected) { stopAudioStream(w.id); return; } // Widget weg → Mikro freigeben
            analyser.getByteFrequencyData(data);
            const avg = data.reduce((a,b) => a+b, 0) / data.length / 128;
            const multiplier = (w.config.sensitivity ?? 3) / 3 * 2.5;
            const level = Math.min(avg * multiplier, 1);

            // Update bars
            barEls.forEach((b, i) => {
              const threshold = (i + 1) / barEls.length;
              const active = level >= threshold * 0.8;
              const col = getColor(level);
              b.style.height = active ? `${barHeights[i] + level * 40}%` : `${barHeights[i]}%`;
              b.style.background = active ? col.bg : 'var(--w-fill-2)';
            });

            const col = getColor(level);
            emojiEl.textContent = col.emoji;
            labelEl.textContent = col.label;
            labelEl.style.color = document.body.dataset.cards === 'dark' ? col.bg : col.fg;

            const raf = requestAnimationFrame(tick);
            AUDIO_STREAMS[w.id] = { stream, ctx, raf };
          }
          tick();
        })
        .catch(err => {
          running = false;
          micBtn.textContent = '🎤 Mikrofon starten';
          micBtn.style.background = 'var(--accent-tint)';
          micBtn.style.color = 'var(--accent-ink)';
          emojiEl.textContent = '❌';
          labelEl.textContent = 'Kein Zugriff';
          labelEl.style.color = 'var(--w-danger)';
        });
    }

    function stopMic() {
      running = false;
      stopAudioStream(w.id);
      micBtn.textContent = '🎤 Mikrofon starten';
      micBtn.style.background = 'var(--accent-tint)';
      micBtn.style.color = 'var(--accent-ink)';
      emojiEl.textContent = '😴';
      labelEl.textContent = 'LEISE';
      labelEl.style.color = 'var(--w-ink)';
      barEls.forEach((b,i) => { b.style.height = `${barHeights[i]}%`; b.style.background = 'var(--w-fill-2)'; });
    }

    micBtn.addEventListener('click', () => running ? stopMic() : startMic());
  },

  // ── Live-Umfrage ──
  poll(w, body) {
    // Cleanup old subscription
    if (POLL_CHANNELS[w.id]) {
      try { AUTH.client?.removeChannel(POLL_CHANNELS[w.id]); } catch(e) {}
      delete POLL_CHANNELS[w.id];
    }

    if (!w.config.question) {
      // Leerer Zustand
      const wrap = el('div');
      wrap.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:2px dashed var(--w-line-strong);border-radius:12px;transition:all .2s;';
      const icon = el('div'); icon.style.fontSize = '36px'; icon.textContent = '📊';
      const txt = el('div'); txt.style.cssText = 'font-size:13px;color:var(--w-muted);text-align:center;font-weight:500;';
      txt.textContent = 'Live-Umfrage erstellen';
      const sub = el('div'); sub.style.cssText = 'font-size:11px;color:var(--w-faint);';
      sub.textContent = 'Hier klicken oder ⚙ oben rechts';
      wrap.append(icon, txt, sub);
      wrap.addEventListener('mouseenter', () => { wrap.style.borderColor='var(--accent)'; wrap.style.background='var(--w-fill)'; });
      wrap.addEventListener('mouseleave', () => { wrap.style.borderColor='var(--w-line-strong)'; wrap.style.background=''; });
      wrap.addEventListener('click', e => { e.stopPropagation(); openPollSettings(w); });
      body.appendChild(wrap);
      return;
    }

    const COLORS = ['#6D4BFF','#22c55e','#f59e0b','#ef4444'];
    const options = (w.config.options || []).filter(o => o.trim());
    const voteCounts = new Array(options.length).fill(0);
    const pollId = w.config.pollId;
    const votingUrl = window.location.origin + window.location.pathname + '?poll=' + pollId;

    // Layout
    const wrap = el('div');
    wrap.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column;padding:10px;gap:6px;overflow:hidden;';

    // Top row: question + QR
    const topRow = el('div');
    topRow.style.cssText = 'display:flex;gap:10px;align-items:flex-start;flex-shrink:0;';
    const qEl = el('div','poll-question'); qEl.textContent = w.config.question;
    qEl.style.flex = '1';
    const qrWrap = el('div'); qrWrap.id = 'poll-qr-'+w.id;
    qrWrap.style.cssText = 'width:72px;height:72px;flex-shrink:0;background:#fff;border-radius:8px;padding:3px;cursor:pointer;';
    qrWrap.title = 'Link kopieren';
    qrWrap.addEventListener('click', e => { e.stopPropagation(); navigator.clipboard.writeText(votingUrl).then(()=>toast('📋 Link kopiert!')); });
    topRow.append(qEl, qrWrap);

    // Bars
    const barsWrap = el('div'); barsWrap.style.cssText = 'flex:1;display:flex;flex-direction:column;justify-content:center;';
    const barFills = [], countEls = [];
    options.forEach((opt, i) => {
      const row = el('div','poll-bar-row');
      const lbl = el('div','poll-bar-label'); lbl.textContent = opt;
      const bg  = el('div','poll-bar-bg');
      const fill= el('div','poll-bar-fill'); fill.style.cssText = `width:0%;background:${COLORS[i%4]};`;
      const cnt = el('div','poll-bar-count'); cnt.textContent = '0';
      bg.appendChild(fill); row.append(lbl, bg, cnt);
      barsWrap.appendChild(row);
      barFills.push(fill); countEls.push(cnt);
    });

    const totalEl = el('div','poll-total'); totalEl.textContent = '0 Stimmen';

    // Controls
    const ctrl = el('div','poll-ctrl');
    const revealBtn = el('button');
    const revealed = w.config.showResults !== false; // default: sichtbar
    revealBtn.style.cssText = revealed
      ? 'background:rgba(21,128,61,0.14);color:#15803D;'
      : 'background:var(--w-fill-2);color:var(--w-muted);';
    revealBtn.textContent = revealed ? '👁 Ergebnis sichtbar' : '🙈 Ergebnis versteckt';
    const resetBtn = el('button');
    resetBtn.style.cssText = 'background:rgba(180,35,24,0.12);color:var(--w-danger);';
    resetBtn.textContent = '🗑 Reset';
    const copyBtn = el('button');
    copyBtn.style.cssText = 'background:var(--accent-tint);color:var(--accent-ink);';
    copyBtn.textContent = '📋 Link';
    const editBtn2 = el('button');
    editBtn2.style.cssText = 'background:var(--w-fill-2);color:var(--w-muted);';
    editBtn2.textContent = '✏️';
    ctrl.append(revealBtn, resetBtn, copyBtn, editBtn2);

    // Ergebnis-Sichtbarkeit anwenden
    function applyVisibility() {
      const show = w.config.showResults !== false;
      barsWrap.style.filter  = show ? '' : 'blur(6px)';
      barsWrap.style.opacity = show ? '1' : '0.25';
      totalEl.style.filter   = show ? '' : 'blur(4px)';
      totalEl.style.opacity  = show ? '1' : '0.25';
      revealBtn.textContent  = show ? '👁 Ergebnis sichtbar' : '🙈 Ergebnis versteckt';
      revealBtn.style.cssText = show
        ? 'background:rgba(21,128,61,0.14);color:#15803D;'
        : 'background:var(--w-fill-2);color:var(--w-muted);';
    }
    applyVisibility();

    revealBtn.addEventListener('click', e => {
      e.stopPropagation();
      w.config.showResults = w.config.showResults === false ? true : false;
      applyVisibility();
      APP.save();
    });

    wrap.append(topRow, barsWrap, totalEl, ctrl);
    body.appendChild(wrap);

    // QR Code generieren
    setTimeout(() => {
      const qrEl = document.getElementById('poll-qr-'+w.id);
      if (qrEl && window.QRCode) {
        try { new QRCode(qrEl, { text:votingUrl, width:66, height:66, correctLevel:QRCode.CorrectLevel.M }); }
        catch(e) {}
      }
    }, 80);

    function updateBars() {
      const total = voteCounts.reduce((a,b)=>a+b,0);
      totalEl.textContent = total + (total===1?' Stimme':' Stimmen');
      barFills.forEach((f,i) => {
        const pct = total>0 ? (voteCounts[i]/total*100) : 0;
        f.style.width = pct+'%';
        countEls[i].textContent = voteCounts[i];
      });
    }

    async function loadVotes() {
      if (!AUTH.client || !pollId) return;
      const { data } = await AUTH.client.from('poll_votes').select('option_index').eq('poll_id', pollId);
      if (data) { voteCounts.fill(0); data.forEach(v=>{ if(v.option_index<voteCounts.length) voteCounts[v.option_index]++; }); updateBars(); }
    }

    resetBtn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!AUTH.client) { toast('Supabase nicht verbunden'); return; }
      await AUTH.client.from('poll_votes').delete().eq('poll_id', pollId);
      voteCounts.fill(0); updateBars(); toast('🗑 Stimmen zurückgesetzt');
    });
    copyBtn.addEventListener('click', e => { e.stopPropagation(); navigator.clipboard.writeText(votingUrl).then(()=>toast('📋 Link kopiert!')); });
    editBtn2.addEventListener('click', e => { e.stopPropagation(); openPollSettings(w); });

    if (AUTH.client && pollId) {
      loadVotes();
      const ch = AUTH.client.channel('poll-'+w.id)
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'poll_votes', filter:'poll_id=eq.'+pollId },
          payload => { const i=payload.new.option_index; if(i>=0&&i<voteCounts.length){ voteCounts[i]++; updateBars(); } })
        .on('postgres_changes', { event:'DELETE', schema:'public', table:'poll_votes', filter:'poll_id=eq.'+pollId },
          () => loadVotes())
        .subscribe();
      POLL_CHANNELS[w.id] = ch;
    } else if (!AUTH.client) {
      totalEl.textContent = '⚠️ Anmelden für Live-Ergebnisse';
    }
  },

    });

    const genBtn = el('button','ai-gen-btn'); genBtn.textContent = '✨ Generieren';

      output.textContent = 'Hier erscheint der generierte Inhalt…';

    // ── Bottom row ──
    const bottomRow = el('div','ai-bottom-row');
    const copyBtn2 = el('button'); copyBtn2.textContent='📋 Kopieren'; copyBtn2.style.cssText='background:var(--w-fill-2);color:var(--w-ink);';
    const clearBtn = el('button'); clearBtn.textContent='🗑 Löschen'; clearBtn.style.cssText='background:rgba(180,35,24,0.12);color:var(--w-danger);';
    copyBtn2.addEventListener('click', e => { e.stopPropagation(); navigator.clipboard.writeText(output.textContent).then(()=>toast('📋 Kopiert!')); });
    clearBtn.addEventListener('click', e => { e.stopPropagation(); output.textContent=''; output.style.color='var(--w-faint)'; w.config.lastOutput=''; APP.save(); });
    bottomRow.append(copyBtn2, clearBtn);

    body.append(ctrlRow, output, bottomRow);

    // ── Generate via Supabase Edge Function ──
    genBtn.addEventListener('click', async e => {
      e.stopPropagation();
      const topic = topicInput.value.trim();
      if (!topic) { toast('⚠️ Bitte ein Thema eingeben'); topicInput.focus(); return; }
      const type = typeSelect.value;
      const grade = gradeSelect.value;

      genBtn.disabled = true; genBtn.textContent = '⏳ Lädt…';
      output.style.color = 'var(--w-faint)';
      output.textContent = '⏳ KI generiert Inhalt…';

      try {
        const { data, error } = await AUTH.client.functions.invoke('ai-generate', {
          body: { topic, type, grade }
        });
        if (error) throw new Error(error.message || String(error));
        const text = data?.text || '(Keine Antwort)';
        output.textContent = text;
        output.style.color = 'var(--w-ink)';
        w.config.lastOutput = text;
        w.config.lastTopic  = topic;
        w.config.lastType   = type;
        w.config.lastGrade  = grade;
        APP.save();
      } catch(err) {
        output.textContent = '❌ Fehler: ' + err.message;
        output.style.color = 'var(--w-danger)';
        toast('❌ KI-Fehler: ' + err.message);
      } finally {
        genBtn.disabled = false; genBtn.textContent = '✨ Generieren';
      }
    });
  },

      overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
      const box = document.createElement('div');

      htitle.style.cssText = 'font-weight:700;font-size:14px;margin-bottom:14px;color:#fff';

      const urlInp = document.createElement('input');
      urlInp.type = 'url'; urlInp.placeholder = 'https://www.beispiel.de';
      urlInp.style.cssText = 'width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:13px;padding:8px 10px;margin-bottom:8px;box-sizing:border-box;outline:none';

      const nameInp = document.createElement('input');
      nameInp.type = 'text'; nameInp.placeholder = 'Name (optional)';
      nameInp.style.cssText = 'width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:13px;padding:8px 10px;margin-bottom:8px;box-sizing:border-box;outline:none';

      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:6px';

      const cancel = document.createElement('button');

      cancel.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;font-size:13px';
      cancel.addEventListener('click', () => overlay.remove());

      const ok = document.createElement('button');
      ok.textContent = '✓ Hinzufügen';
      ok.style.cssText = 'padding:8px 14px;border-radius:8px;border:none;background:#6D4BFF;color:#fff;cursor:pointer;font-size:13px;font-weight:600';
      ok.addEventListener('click', () => {
        let url = urlInp.value.trim();
        if (!url) return;
        if (!url.startsWith('http')) url = 'https://' + url;
        const domain = (() => { try { return new URL(url).hostname; } catch(e) { return url; } })();
        cfg.links.push({ url, name: nameInp.value.trim() || domain });
        APP.save(); render(); overlay.remove();
      });

      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      [urlInp, nameInp].forEach(inp => inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key==='Enter') ok.click(); }));
      row.append(cancel, ok);
      box.append(htitle, urlInp, nameInp, row);
      overlay.appendChild(box);
      document.body.appendChild(overlay);

    render();

  // ── Frag die KI ──
  ask(w, body) {
    body.style.cssText += 'flex-direction:column;gap:7px;padding:10px;overflow:hidden;';

    // Note: image generation works without login, text AI needs login

    // ── Chat history ──
    const history = el('div','ask-history');
    const messages = w.config.messages || [];

    function renderMessages() {
      history.innerHTML = '';
      messages.forEach(m => {
        const b = el('div','ask-bubble ' + m.role);
        if (m.type === 'image') {
          const img = document.createElement('img');
          img.src = m.url;
          img.alt = m.text || 'Bild';
          img.style.cssText = 'max-width:100%;border-radius:8px;display:block;margin-top:4px;';
          img.onerror = () => { img.replaceWith(Object.assign(document.createElement('span'), {textContent:'❌ Bild konnte nicht geladen werden'})); };
          const label = document.createElement('div');
          label.style.cssText = 'font-size:11px;opacity:0.55;margin-bottom:3px;';
          label.textContent = '🖼 ' + (m.text || 'Generiertes Bild');
          b.append(label, img);
        } else {
          b.textContent = m.text;
        }
        history.appendChild(b);
      });
      setTimeout(() => { history.scrollTop = history.scrollHeight; }, 30);
    }
    renderMessages();

    // ── Top row (clear button) ──
    const topRow = el('div'); topRow.style.cssText='display:flex;justify-content:flex-end;flex-shrink:0;';
    const clearBtn = el('button','ask-clear-btn'); clearBtn.textContent='🗑 Verlauf löschen';
    clearBtn.addEventListener('click', e => {
      e.stopPropagation();
      w.config.messages = [];
      messages.length = 0;
      renderMessages();
      APP.save();
    });

    // Expand/shrink button
    const expandBtn = el('button','ask-clear-btn');
    expandBtn.textContent = '⛶ Vergrößern';
    expandBtn.style.marginRight = '4px';
    expandBtn.addEventListener('click', e => {
      e.stopPropagation();
      const isLarge = w.w >= 700;
      w.w = isLarge ? 400 : 750;
      w.h = isLarge ? 300 : 520;
      expandBtn.textContent = isLarge ? '⛶ Vergrößern' : '⊡ Verkleinern';
      // re-render widget with new size
      const wEl = document.querySelector('.widget[data-wid="' + w.id + '"]');
      if (wEl) {
        wEl.style.width  = w.w + 'px';
        wEl.style.height = w.h + 'px';
      }
      APP.save();
    });

    topRow.append(expandBtn, clearBtn);

    // ── Input row ──
    const inputRow = el('div','ask-input-row');
    const textarea = document.createElement('textarea');
    textarea.placeholder = 'z.B. "Zeige einen Apfel" oder eine Frage stellen…';
    textarea.addEventListener('click', e => e.stopPropagation());
    textarea.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
    });

    const sendBtn = el('button','ask-send-btn'); sendBtn.textContent = '➤';
    sendBtn.title = 'Frage stellen (Enter)';
    inputRow.append(textarea, sendBtn);

    body.append(topRow, history, inputRow);

    // ── Send ──
    // Detect image request from German keywords
    function isImageRequest(q) {
      return /^(zeig|zeige|mal|male|zeichne|generiere|erstell|bild von|bild:|foto von|zeig mir|zeige mir|show|draw)\b/i.test(q.trim()) ||
             /(als bild|als foto|als zeichnung|als illustration)/i.test(q);
    }

    function extractImagePrompt(q) {
      return q.replace(/^(zeig(e)?(\s*(mir|einen|eine|ein|das|die|den))?|mal(e)?|zeichne|generiere|erstell(e)?|bild von|bild:|foto von|show|draw)\s*/i, '').trim() || q;
    }

    sendBtn.addEventListener('click', async e => {
      e.stopPropagation();
      const q = textarea.value.trim();
      if (!q) return;

      textarea.value = '';
      messages.push({ role:'user', text:q });

      const thinkingBubble = el('div','ask-bubble thinking');
      history.appendChild(thinkingBubble);
      history.scrollTop = history.scrollHeight;
      sendBtn.disabled = true;

      try {
        if (isImageRequest(q)) {
          // ── Image generation via Pollinations.ai (free, no key) ──
          thinkingBubble.textContent = '🎨 Generiere Bild…';
          const subject = extractImagePrompt(q);
          const w_px = Math.min(800, Math.max(400, w.w * 2));
          const h_px = Math.min(600, Math.max(300, w.h * 1.5));
          const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(subject + ', realistic photograph, high quality, educational, clear lighting')}?width=${w_px}&height=${h_px}&nologo=true&seed=${Math.floor(Math.random()*2000000000)}`;
          thinkingBubble.remove();
          messages.push({ role:'ai', type:'image', url, text: subject });
        } else {
          // ── Text answer via Supabase Edge Function ──
          thinkingBubble.textContent = '⏳ Denke nach…';
          if (!AUTH.user) throw new Error('Für Textfragen bitte zuerst anmelden (Konto-Icon oben rechts)');
          const { data, error } = await AUTH.client.functions.invoke('ai-generate', {
            body: { type:'ask', question: q }
          });
          if (error) throw new Error(error.message || String(error));
          const answer = data?.text || '(Keine Antwort)';
          thinkingBubble.remove();
          messages.push({ role:'ai', text:answer });
        }
        if (messages.length > 30) messages.splice(0, messages.length - 30);
        w.config.messages = messages;
        APP.save();
        renderMessages();
      } catch(err) {
        thinkingBubble.textContent = '❌ ' + err.message;
        thinkingBubble.style.color = 'var(--w-danger)';
      } finally {
        sendBtn.disabled = false;
      }
    });
  },

  // ── Browser Widget ──
  browser(w, body) {
    body.style.flexDirection = 'column';
    body.style.alignItems = 'stretch';
    body.style.justifyContent = 'stretch';
    body.style.padding = '0';
    body.style.overflow = 'hidden';

    if (!w.config.bookmarks) {
      w.config.bookmarks = [
        { label:'FragFinn', url:'https://www.fragfinn.de' },
        { label:'ARD', url:'https://www.ard.de' },
        { label:'ZDF', url:'https://www.zdf.de' },
        { label:'Planet Schule', url:'https://www.planet-schule.de' },
      ];
    }
    const bookmarkList = w.config.bookmarks;

    // URL bar
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;gap:4px;padding:6px;background:var(--w-bar);flex-shrink:0;align-items:center';

    const btnStyle = 'border:none;background:var(--w-fill-2);color:var(--w-ink);border-radius:5px;padding:4px 7px;cursor:pointer;font-size:12px;flex-shrink:0';

    const homeBtn = document.createElement('button');
    homeBtn.textContent = '🏠';
    homeBtn.title = 'Startseite';
    homeBtn.style.cssText = btnStyle;
    homeBtn.addEventListener('click', function(e) { e.stopPropagation(); showStartpage(); });

    const urlInp = document.createElement('input');
    urlInp.type = 'text';
    urlInp.placeholder = 'URL eingeben…';
    urlInp.value = '';
    urlInp.style.cssText = 'flex:1;background:var(--w-fill-2);border:1px solid var(--w-line-strong);border-radius:6px;color:var(--w-ink);font-size:12px;padding:5px 8px;touch-action:auto;min-width:0';
    urlInp.addEventListener('click', e => e.stopPropagation());
    urlInp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') navigate(urlInp.value); });

    const goBtn = document.createElement('button');
    goBtn.textContent = '→';
    goBtn.style.cssText = 'border:none;background:var(--brand);color:#fff;border-radius:5px;padding:4px 9px;cursor:pointer;font-size:13px;flex-shrink:0;font-weight:700';

    bar.append(homeBtn, urlInp, goBtn);

    // Startpage with tiles
    const startpage = document.createElement('div');
    startpage.style.cssText = 'flex:1;overflow:hidden;background:var(--w-fill);padding:0;display:none;flex-direction:column;width:100%';

    function renderStartpage() {
      startpage.innerHTML = '';
      const totalItems = bookmarkList.length + (APP.state.editMode ? 1 : 0);
      const cols = Math.max(2, Math.ceil(Math.sqrt(totalItems)));
      const rows = Math.ceil(totalItems / cols);
      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(' + cols + ',1fr);grid-template-rows:repeat(' + rows + ',1fr);gap:0;flex:1;width:100%;height:100%';
      bookmarkList.forEach((bm, i) => {
        const tile = document.createElement('div');
        tile.style.cssText = 'position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--w-fill);border:0.5px solid var(--w-line);transition:all .15s;overflow:hidden';
        tile.addEventListener('mouseenter', function() { this.style.background='var(--w-fill-2)'; });
        tile.addEventListener('mouseleave', function() { this.style.background='var(--w-fill)'; });
        const icon = document.createElement('img');
        try { icon.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(new URL(bm.url).hostname) + '&sz=128'; } catch(e) {}
        icon.style.cssText = 'width:100%;height:100%;object-fit:contain;padding:15%;';
        icon.onerror = function() { this.style.display='none'; const fb=document.createElement('div'); fb.textContent='🌐'; fb.style.cssText='font-size:clamp(24px,40%,64px)'; tile.insertBefore(fb,lbl); };
        const lbl = document.createElement('div');
        lbl.style.cssText = 'position:absolute;bottom:0;left:0;right:0;font-size:10px;color:rgba(255,255,255,0.85);text-align:center;padding:3px 4px;background:rgba(0,0,0,0.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        lbl.textContent = bm.label;
        let clickTimer = null;
        tile.addEventListener('click', function(e) {
          e.stopPropagation();
          if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; return; }
          clickTimer = setTimeout(function() { clickTimer = null; navigate(bm.url); }, 300);
        });
        const rename = function(e) {
          e.stopPropagation();
          if (!APP.state.editMode) return;
          const newName = prompt('Name umbenennen:', bm.label);
          if (newName && newName.trim()) { bm.label = newName.trim(); APP.save(); renderStartpage(); }
        };
        tile.addEventListener('dblclick', rename);
        tile.append(icon, lbl);
        if (APP.state.editMode) {
          // Buttons im Edit-Modus immer sichtbar — Hover existiert auf Touch-Geräten nicht
          const del = document.createElement('button');
          del.textContent = '✕';
          del.title = 'Entfernen';
          del.style.cssText = 'position:absolute;top:4px;right:4px;background:rgba(239,68,68,0.7);border:none;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;z-index:2';
          del.addEventListener('click', function(ev) { ev.stopPropagation(); bookmarkList.splice(i,1); APP.save(); renderStartpage(); });
          const edit = document.createElement('button');
          edit.textContent = '✏️';
          edit.title = 'Umbenennen';
          edit.style.cssText = 'position:absolute;top:4px;right:28px;background:var(--w-fill-3);border:none;color:var(--w-ink);border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;line-height:1;z-index:2';
          edit.addEventListener('click', rename);
          tile.append(edit, del);
        }
        grid.appendChild(tile);
      });
      // Add-Tile
      if (APP.state.editMode) {
        const addTile = document.createElement('div');
        addTile.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;cursor:pointer;background:var(--w-fill);border:0.5px dashed var(--w-line-strong);transition:all .15s';
        addTile.innerHTML = '<div style="font-size:20px;color:var(--w-faint)">+</div><div style="font-size:9px;color:var(--w-faint)">Seite hinzufügen</div>';
        addTile.addEventListener('click', function(e) {
          e.stopPropagation();
          const raw = prompt('Webseite eingeben (z.B. wikipedia.de):');
          if (!raw) return;
          let url = raw.trim();
          if (!url.startsWith('http')) url = 'https://' + (url.startsWith('www.') ? '' : 'www.') + url;
          try {
            const host = new URL(url).hostname.replace('www.','');
            const name = host.split('.')[0];
            const label = name.charAt(0).toUpperCase() + name.slice(1);
            bookmarkList.push({ label: label, url: url });
          } catch(err) {
            bookmarkList.push({ label: url, url: url });
          }
          APP.save();
          renderStartpage();
        });
        grid.appendChild(addTile);
      }
      startpage.appendChild(grid);
    }


    const showStartpage = () => {
      startpage.style.display = 'flex';
      urlInp.value = '';
      renderStartpage();
    };

    const navigate = (url) => {
      let u = url.trim();
      if (!u) { showStartpage(); return; }
      if (!u.startsWith('http')) u = 'https://' + u;
      window.open(u, '_blank', 'noopener');
      urlInp.value = u;
    };

    goBtn.addEventListener('click', e => { e.stopPropagation(); navigate(urlInp.value); });
    body.append(bar, startpage);
    // Altlast: frühere Versionen speicherten config.url — nicht bei jedem Render einen Tab öffnen
    if (w.config.url) { delete w.config.url; APP.save(); }
    showStartpage();
  },

  // ── Datei-Anzeige Widget ──
  files(w, body) {
    body.style.flexDirection = 'column';
    body.style.padding = '0';
    body.style.overflow = 'hidden';

    const file = w.config.fileData; // { name, type, data (base64 or text) }

    if (!file) {
      // Drop zone
      const zone = document.createElement('div');
      zone.style.cssText = 'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer';
      zone.innerHTML = '<div style="font-size:36px">📂</div><div style="font-size:13px;color:var(--w-muted)">Datei hier ablegen oder klicken</div><div style="font-size:11px;color:var(--w-faint)">Bild · PDF · MP3 · Video · Text · und mehr</div>';

      const fileInp = document.createElement('input');
      fileInp.type = 'file';
      fileInp.accept = '*';
      fileInp.style.display = 'none';

      fileInp.addEventListener('change', () => {
        const f = fileInp.files[0];
        if (!f) return;
        // Bilder werden automatisch verkleinert und dürfen deshalb größer sein
        const isScalableImage = f.type.startsWith('image/') && f.type !== 'image/gif' && f.type !== 'image/svg+xml';
        if (isScalableImage) {
          readImageScaled(f, 1600, dataUrl => {
            if (!dataUrl) { toast('❌ Bild konnte nicht geladen werden'); return; }
            w.config.fileData = { name: f.name, type: dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', data: dataUrl };
            APP.save();
            renderWidgetContent(w, body);
          });
          return;
        }
        // localStorage fasst insgesamt nur ~5 MB — größere Dateien würden das
        // Speichern ALLER Boards dauerhaft blockieren
        const MAX_FILE = 2 * 1024 * 1024;
        if (f.size > MAX_FILE) {
          toast('⚠️ Datei zu groß (max. 2 MB für PDF, Audio und Video).', 4000);
          fileInp.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = e => {
          w.config.fileData = { name: f.name, type: f.type, data: e.target.result };
          APP.save();
          renderWidgetContent(w, body);
        };
        if (f.type.startsWith('text/')) reader.readAsText(f);
        else reader.readAsDataURL(f);
      });

      zone.addEventListener('click', e => { e.stopPropagation(); fileInp.click(); });

      // Drag & Drop
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.background = 'rgba(109,75,255,0.2)'; });
      zone.addEventListener('dragleave', () => { zone.style.background = ''; });
      zone.addEventListener('drop', e => {
        e.preventDefault(); e.stopPropagation();
        zone.style.background = '';
        const f = e.dataTransfer.files[0];
        if (!f) return;
        fileInp.files = e.dataTransfer.files;
        fileInp.dispatchEvent(new Event('change'));
      });

      body.append(zone, fileInp);
      return;
    }

    // Header bar
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--w-bar);flex-shrink:0;font-size:11.5px;';
    const fileIcon = document.createElement('span');
    fileIcon.style.opacity = '0.6';
    fileIcon.textContent = '📄';
    const fileName = document.createElement('span');
    fileName.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    fileName.textContent = file.name;
    header.append(fileIcon, fileName);
    const changeBtn = document.createElement('button');
    changeBtn.textContent = '↺ Andere Datei';
    changeBtn.style.cssText = 'border:none;background:var(--w-fill-2);color:var(--w-ink);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:10.5px;flex-shrink:0';
    changeBtn.addEventListener('click', e => { e.stopPropagation(); w.config.fileData = null; APP.save(); renderWidgetContent(w, body); });
    header.appendChild(changeBtn);

    const viewer = document.createElement('div');
    viewer.style.cssText = 'flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:var(--w-fill);';

    if (file.type.startsWith('text/')) {
      // Textdateien wurden als Roh-Text gespeichert (readAsText) — direkt anzeigen
      const pre = document.createElement('pre');
      pre.style.cssText = 'width:100%;height:100%;margin:0;padding:12px;overflow:auto;font-size:12.5px;line-height:1.5;color:var(--w-ink);background:var(--w-fill);white-space:pre-wrap;word-break:break-word;box-sizing:border-box;text-align:left';
      pre.textContent = file.data;
      viewer.style.alignItems = 'stretch';
      viewer.appendChild(pre);
    } else if (file.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = file.data;
      img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain';
      viewer.appendChild(img);
    } else if (file.type === 'application/pdf') {
      const frame = document.createElement('iframe');
      frame.src = file.data;
      frame.style.cssText = 'width:100%;height:100%;border:none;';
      viewer.appendChild(frame);
    } else if (file.type.startsWith('video/')) {
      const vid = document.createElement('video');
      vid.src = file.data; vid.controls = true;
      vid.style.cssText = 'max-width:100%;max-height:100%';
      viewer.appendChild(vid);
    } else if (file.type.startsWith('audio/')) {
      const aud = document.createElement('audio');
      aud.src = file.data; aud.controls = true;
      aud.style.cssText = 'width:90%;margin:auto';
      viewer.appendChild(aud);
    } else if (file.type.startsWith('audio/') || file.name?.match(/\.(mp3|wav|ogg|aac|flac|m4a)$/i)) {
      const aud = document.createElement('audio');
      aud.src = file.data; aud.controls = true; aud.autoplay = false;
      aud.style.cssText = 'width:90%;margin:20px auto;display:block';
      viewer.style.background = 'var(--w-fill)';
      const lbl = document.createElement('div');
      lbl.style.cssText = 'color:var(--w-muted);font-size:13px;margin-bottom:8px;text-align:center';
      lbl.textContent = '🎵 ' + (file.name || 'Audio');
      viewer.append(lbl, aud);
    } else {
      // Binärdatei / Excel / Word / etc. → Download-Button
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px';
      const icon = document.createElement('div');
      icon.style.cssText = 'font-size:48px';
      const ext = (file.name||'').split('.').pop().toLowerCase();
      const icons = {xlsx:'📊',xls:'📊',docx:'📄',doc:'📄',pptx:'📋',ppt:'📋',zip:'📦',csv:'📊',pdf:'📕'};
      icon.textContent = icons[ext] || '📎';
      const name = document.createElement('div');
      name.style.cssText = 'color:var(--w-ink);font-size:13px;text-align:center;word-break:break-all';
      name.textContent = file.name || 'Datei';
      const dl = document.createElement('a');
      dl.href = file.data;
      dl.download = file.name || 'datei';
      dl.textContent = '⬇ Herunterladen';
      dl.style.cssText = 'background:var(--accent);color:#fff;padding:8px 20px;border-radius:8px;text-decoration:none;font-size:13px';
      wrap.append(icon, name, dl);
      viewer.style.background = 'var(--w-fill)';
      viewer.appendChild(wrap);
    }

    body.append(header, viewer);
  },

  // ── PDF ── Seite für Seite, Großansicht für die Klasse
  pdf(w, body) {
    body.style.flexDirection = 'column';
    body.style.padding = '0';
    body.style.overflow = 'hidden';
    const rerender = () => { if (body.isConnected) renderWidgetContent(w, body); };
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/pdf,.pdf'; inp.style.display = 'none';
    inp.addEventListener('change', () => pickPdf(w, inp.files[0], rerender));
    body.appendChild(inp);
    // PDF per Ziehen auf das Element ablegen
    body.ondragover = e => { e.preventDefault(); body.classList.add('pdf-drop'); };
    body.ondragleave = () => body.classList.remove('pdf-drop');
    body.ondrop = e => { e.preventDefault(); e.stopPropagation(); body.classList.remove('pdf-drop'); pickPdf(w, e.dataTransfer.files[0], rerender); };

    const empty = (text, btnLabel) => {
      const box = el('div', 'pdf-empty');
      if (text) { const t = el('div', 'pdf-empty-text'); t.textContent = text; box.appendChild(t); }
      const b = emptyCta('pdf', btnLabel, () => inp.click());
      b.style.margin = '0';
      const hint = el('div', 'pdf-empty-hint');
      hint.textContent = 'oder Datei hierher ziehen · bleibt nur auf diesem Gerät';
      box.append(b, hint);
      body.appendChild(box);
    };
    if (!w.config.fileId) { empty('', 'PDF öffnen'); return; }

    const bar = el('div', 'pdf-bar');
    const mk = (iconName, title, fn) => {
      const b = el('button', 'pdf-btn'); b.innerHTML = icon(iconName, 20); b.title = title; b.setAttribute('aria-label', title);
      b.addEventListener('click', e => { e.stopPropagation(); fn(); });
      return b;
    };
    const no = el('span', 'pdf-no'); no.textContent = '…';
    const name = el('span', 'pdf-name'); name.textContent = w.config.name || 'PDF';
    const stage = el('div', 'pdf-stage');
    const canvas = document.createElement('canvas');
    stage.appendChild(canvas);
    let doc = null, chain = Promise.resolve(), waiting = false;
    // (siehe Großansicht: nacheinander zeichnen, Aufrufe zusammenfassen)
    const show = () => {
      if (waiting) return chain;
      waiting = true;
      chain = chain.then(() => { waiting = false; return paint(); });
      return chain;
    };
    const paint = async () => {
      if (!doc || !body.isConnected) return;
      const p = Math.max(1, Math.min(doc.numPages, w.config.page || 1));
      w.config.page = p;
      no.textContent = p + ' / ' + doc.numPages;
      const z = _pdfZoom.get(w.id) || 1;
      try { await drawPdfPage(doc, p, canvas, (body.clientWidth - 12) * z, (body.clientHeight - bar.offsetHeight - 12) * z); } catch(e) {}
    };
    const go = d => {
      if (!doc) return;
      const p = Math.max(1, Math.min(doc.numPages, (w.config.page || 1) + d));
      if (p === w.config.page) return;
      w.config.page = p; no.textContent = p + ' / ' + doc.numPages; APP.save(); show();
    };
    const zlabel = el('span', 'pdf-zoom');
    zlabel.textContent = Math.round((_pdfZoom.get(w.id) || 1) * 100) + ' %';
    stage.classList.toggle('zoomed', (_pdfZoom.get(w.id) || 1) > 1);
    const setZoom = z => applyPdfZoom(w.id, stage, zlabel, z, () => show());
    attachPdfZoom(stage, { z: () => _pdfZoom.get(w.id) || 1, set: setZoom }, { dblclick: true });
    bar.append(
      mk('chevronLeft', 'Vorherige Seite', () => go(-1)), no, mk('chevronRight', 'Nächste Seite', () => go(1)),
      name,
      mk('zoomOut', 'Verkleinern', () => setZoom((_pdfZoom.get(w.id) || 1) / 1.25)), zlabel,
      mk('zoomIn', 'Vergrößern (auch Doppelklick oder Strg + Mausrad)', () => setZoom((_pdfZoom.get(w.id) || 1) * 1.25)),
      mk('maximize', 'Groß anzeigen', () => openPdfFullscreen(w, show)),
      mk('files', 'Andere PDF öffnen', () => inp.click())
    );
    body.append(bar, stage);
    const loading = el('div', 'pdf-loading'); loading.textContent = 'PDF wird geladen …';
    stage.appendChild(loading);
    getPdfDoc(w.config.fileId).then(d => {
      if (!body.isConnected) return;
      loading.remove();
      if (!d) {
        // Tafel kommt von einem anderen Gerät oder der Browser-Speicher wurde geleert
        bar.remove(); stage.remove();
        empty('„' + (w.config.name || 'Die PDF') + '“ liegt nicht auf diesem Gerät.', 'PDF erneut auswählen');
        return;
      }
      doc = d; show();
    }, err => {
      if (!body.isConnected) return;
      loading.textContent = /offline/.test(String(err && err.message)) || !navigator.onLine
        ? 'Zum Anzeigen von PDFs wird einmalig eine Internetverbindung gebraucht.'
        : 'Diese PDF kann nicht angezeigt werden (beschädigt oder geschützt).';
    });
  },

  // ── Arbeitssymbole ── antippen = aktiv; alles andere tritt zurück
  worksymbols(w, body) {
    const keys = Array.isArray(w.config.shown) && w.config.shown.length ? w.config.shown : WORK_SYMBOLS_DEFAULT;
    const shown = keys.map(k => WORK_SYMBOLS.find(s => s.k === k)).filter(Boolean);
    let active = Array.isArray(w.config.active) ? w.config.active.slice() : [];
    const bodyH = w.h - (APP.state.editMode ? 34 : 0), n = shown.length;
    // Spaltenzahl wählen, bei der die Kacheln am größten werden
    let best = { cols: 1, size: 0 };
    for (let cols = 1; cols <= n; cols++) {
      const size = Math.min((w.w - 16) / cols, (bodyH - 16) / Math.ceil(n / cols));
      if (size > best.size) best = { cols, size };
    }
    const grid = el('div', 'ws-grid');
    grid.style.gridTemplateColumns = 'repeat(' + best.cols + ', 1fr)';
    const ic = Math.round(Math.max(22, Math.min(best.size * 0.5, 320)));
    const tiles = shown.map(s => {
      const b = el('button', 'ws-tile');
      b.innerHTML = '<svg width="' + ic + '" height="' + ic + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + s.d + '"/></svg><span>' + s.label + '</span>';
      b.style.fontSize = Math.max(11, Math.min(best.size * 0.115, 44)) + 'px';
      b.addEventListener('click', e => {
        e.stopPropagation();
        if (active.includes(s.k)) active = active.filter(k => k !== s.k);
        else active = w.config.multi ? active.concat(s.k) : [s.k];
        w.config.active = active;
        APP.save();
        paint();
      });
      grid.appendChild(b);
      return b;
    });
    const paint = () => {
      grid.classList.toggle('has-active', active.length > 0);
      tiles.forEach((b, i) => {
        const on = active.includes(shown[i].k);
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
    };
    paint();
    body.appendChild(grid);
  },

  // ── Punktetafel ── Teams nebeneinander, Punkte direkt antippen
  scoreboard(w, body) {
    if (!Array.isArray(w.config.teams) || !w.config.teams.length) {
      w.config.teams = [{ name: 'Team A', score: 0 }, { name: 'Team B', score: 0 }];
    }
    const teams = w.config.teams;
    const COLORS = ['#6D4BFF', '#D9480F', '#5F3DC4', '#1971C2', '#C2255C', '#2B8A3E', '#E67700', '#495057'];
    const bodyH = w.h - (APP.state.editMode ? 34 : 0);
    const colW = (w.w - 16) / teams.length;
    // Höhe: Ränder + Teamname + Zahl + Knopfzeile müssen übereinander passen
    const nameFs = Math.max(13, Math.min(colW * 0.11, 30));
    const numFs = Math.max(20, Math.min(colW * 0.44, (bodyH - 32 - (nameFs * 1.25 + 10) - 44 - 12) * 0.92, 420));
    const wrap = el('div', 'sb');
    const cols = teams.map((t, i) => {
      const col = el('div', 'sb-col');
      col.style.setProperty('--sb', COLORS[i % COLORS.length]);
      const name = el('input', 'sb-name');
      name.value = t.name || ('Team ' + (i + 1));
      name.maxLength = 24;
      name.setAttribute('aria-label', 'Teamname');
      name.style.fontSize = nameFs + 'px';
      name.addEventListener('change', () => { t.name = name.value.trim() || ('Team ' + (i + 1)); name.value = t.name; APP.save(); });
      name.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') name.blur(); });
      const num = el('div', 'sb-num');
      num.style.fontSize = numFs + 'px';
      const row = el('div', 'sb-row');
      const mk = (html, d, title) => {
        const b = el('button', 'sb-btn');
        b.innerHTML = html; b.title = title; b.setAttribute('aria-label', title);
        b.addEventListener('click', e => { e.stopPropagation(); t.score = (Number(t.score) || 0) + d; APP.save(); paint(); });
        return b;
      };
      row.append(mk(icon('minus', 20), -1, 'Einen Punkt abziehen'), mk(icon('plus', 24), 1, 'Einen Punkt geben'));
      col.append(name, num, row);
      wrap.appendChild(col);
      return { col, num };
    });
    const paint = () => {
      const scores = teams.map(t => Number(t.score) || 0);
      const max = Math.max(...scores);
      const single = scores.filter(s => s === max).length === 1 && teams.length > 1;
      cols.forEach((c, i) => {
        c.num.textContent = scores[i];
        c.col.classList.toggle('lead', single && scores[i] === max);
      });

  // ── Zeitkreis ── die Restzeit als Fläche: je weniger Farbe, desto weniger Zeit (wie eine Lernuhr)
  visualtimer(w, body) {
    let full = timerFullSeconds(w);
    let running = !!w._timerRunning;
    let endAt = w._timerEndAt || null;
    let remaining = running && endAt ? Math.max(0, Math.round((endAt - Date.now()) / 1000))
      : (typeof w._timerRemaining === 'number' ? w._timerRemaining : full);
    const bodyH = w.h - (APP.state.editMode ? 34 : 0);
    // Flach und breit: Kreis links, Zeit und Knöpfe rechts daneben
    const wide = w.w >= bodyH * 1.45;
    const size = wide ? Math.round(Math.max(40, Math.min(bodyH - 16, (w.w - 24) * 0.5)))
      : Math.round(Math.max(90, Math.min(w.w - 24, (bodyH - 16 - 12 - 46) / 1.13, 1100)));
    const C = 2 * Math.PI * 19;
    const wrap = el('div', 'vt');
    const disc = el('div', 'vt-disc');
    disc.style.width = disc.style.height = size + 'px';
    // Minutenskala gegen den Uhrzeigersinn (wie eine Lernuhr): 0 oben, 15 links, 30 unten, 45 rechts
    let ticks = '', nums = '';
    for (let i = 0; i < 60; i++) {
      const a = -i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 36 : 38.3;
      ticks += '<line' + (big ? ' class="b"' : '') + ' x1="' + _f(50 + r1 * Math.sin(a)) + '" y1="' + _f(50 - r1 * Math.cos(a)) + '" x2="' + _f(50 + 40.5 * Math.sin(a)) + '" y2="' + _f(50 - 40.5 * Math.cos(a)) + '"/>';
      if (big) nums += '<text x="' + _f(50 + 45.6 * Math.sin(a)) + '" y="' + _f(50 - 45.6 * Math.cos(a)) + '">' + i + '</text>';
    }
    disc.innerHTML = '<svg viewBox="0 0 100 100" role="img" aria-label="Verbleibende Zeit als Fläche – zum Einstellen ziehen">'
      + '<circle class="vt-face" cx="50" cy="50" r="40.5"/>'
      + '<g transform="translate(100 0) scale(-1 1)"><circle class="vt-pie" cx="50" cy="50" r="19" transform="rotate(-90 50 50)" stroke-dasharray="0 ' + C.toFixed(2) + '"/></g>'
      + '<g class="vt-ticks">' + ticks + '</g><g class="vt-nums">' + nums + '</g><circle class="vt-hub" cx="50" cy="50" r="2.6"/></svg>';
    // Zeit direkt am Kreis einstellen: auf die gewünschte Minute tippen oder ziehen
    disc.addEventListener('pointerdown', e => {
      if (running) return;
      e.preventDefault(); e.stopPropagation();
      try { disc.setPointerCapture(e.pointerId); } catch(_) {}
      const set = ev => {
        const r = disc.getBoundingClientRect();
        const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
        let cw = Math.atan2(dx, -dy) * 180 / Math.PI;
        if (cw < 0) cw += 360;
        let min = Math.round(((360 - cw) % 360) / 6);
        if (min === 0) min = full >= 1800 ? 60 : 1;
        if (min * 60 === full && !isPaused()) return;
        w.config.minutes = min; w.config.seconds = 0;
        full = min * 60;
        resetTimerState(w);
        remaining = full;
        updateDisplay();
      };
      set(e);
      const up = () => { disc.removeEventListener('pointermove', set); disc.removeEventListener('pointerup', up); disc.removeEventListener('pointercancel', up); APP.save(); };
      disc.addEventListener('pointermove', set);
      disc.addEventListener('pointerup', up);
      disc.addEventListener('pointercancel', up);
    });
    const pie = disc.querySelector('.vt-pie');
    const digits = el('div', 'vt-digits');
    digits.style.fontSize = Math.max(16, Math.min(size * (wide ? 0.2 : 0.13), 64)) + 'px';
    const row = el('div', 'tm-row vt-row');
    const mkBtn = (cls, html, title, fn) => {
      const b = el('button', 'tm-btn' + (cls ? ' ' + cls : ''));
      b.innerHTML = html; b.title = title; b.setAttribute('aria-label', title);
      b.addEventListener('click', e => { e.stopPropagation(); fn(); });
      return b;
    };
    const goBtn = mkBtn('tm-go', '', 'Start', toggle);
    row.append(mkBtn('', icon('minus', 20), 'Eine Minute weniger', () => adjust(-60)),
               mkBtn('', icon('plus', 20), 'Eine Minute mehr', () => adjust(60)),
               mkBtn('', icon('reset', 19), 'Zurücksetzen', reset), goBtn);
    const side = el('div', 'vt-side');
    side.append(digits, row);
    wrap.append(disc, side);
    if (wide) {
      wrap.classList.add('vt-wide');
      if (w.w - 24 - size - 12 < 200) row.classList.add('vt-mini');   // zu schmal: nur Start/Pause, Zeit am Kreis einstellen
    }
    body.appendChild(wrap);

    const fmt = s => String(Math.floor(Math.max(0, s) / 60)).padStart(2, '0') + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
    function isPaused() { return !running && typeof w._timerRemaining === 'number' && remaining > 0; }
    function updateDisplay() {
      const r = Math.max(0, remaining);
      // Zifferblatt = 60 Minuten (wie eine Uhr); längere Zeiten füllen den ganzen Kreis
      const scale = Math.max(3600, full, r);
      pie.setAttribute('stroke-dasharray', (C * r / scale).toFixed(2) + ' ' + C.toFixed(2));
      digits.textContent = fmt(r);
      wrap.classList.toggle('urgent', r <= 30 && (running || r === 0));
      const label = running ? 'Pause' : (r === 0 ? 'Nochmal' : (isPaused() ? 'Weiter' : 'Start'));
      goBtn.innerHTML = icon(running ? 'pause' : (r === 0 ? 'reset' : 'play'), 20) + '<span>' + label + '</span>';
      goBtn.title = label;
    }
    function tick() {
      if (!w._timerRunning) {
        running = false;
        remaining = typeof w._timerRemaining === 'number' ? w._timerRemaining : 0;
        stopInterval(w.id);
        updateDisplay();
        return;
      }
      remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      updateDisplay();
    }
    function reset() {
      running = false; stopInterval(w.id);
      resetTimerState(w);
      remaining = full;
      updateDisplay();
    }
    function toggle() {
      if (remaining <= 0) { reset(); return; }
      running = !running;
      if (running) {
        primeAlarm();
        endAt = Date.now() + remaining * 1000;
        w._timerRunning = true; w._timerEndAt = endAt; delete w._timerRemaining;
        startInterval(w.id, tick, 250);
      } else {
        w._timerRunning = false; w._timerRemaining = remaining;
        stopInterval(w.id);
      }
      updateDisplay();
    }
    function adjust(delta) {
      if (!running && !isPaused() && remaining > 0) {
        const sec = Math.max(60, Math.min(180 * 60, full + delta));
        w.config.minutes = Math.floor(sec / 60); w.config.seconds = sec % 60;
        full = sec; resetTimerState(w); remaining = full;
        APP.save();
      } else {
        remaining = Math.max(0, Math.min(180 * 60, remaining + delta));
        if (running) { endAt = Date.now() + remaining * 1000; w._timerEndAt = endAt; }
        else w._timerRemaining = remaining;
      }
      updateDisplay();
    }
    if (running) startInterval(w.id, tick, 250);
    updateDisplay();
  },

  // ── Countdown ── Tage bis zu einem Ereignis
  countdown(w, body) {
    body.style.flexDirection = 'column';
    const d = w.config.date;
    if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) {
      body.appendChild(emptyCta('countdown', 'Datum festlegen', () => openCountdownSettings(w)));
      return;
    }
    const bodyH = w.h - (APP.state.editMode ? 34 : 0);
    // Zeilen: Noch / Zahl / Tage bis / Titel / Datum ≈ 2 × Zahlengröße
    const numFs = Math.max(30, Math.min(w.w * 0.36, (bodyH - 28) / (w.config.title ? 2.05 : 1.75), 520));
    const wrap = el('div', 'cd');
    const pre = el('div', 'cd-small'), num = el('div', 'cd-num'), unit = el('div', 'cd-small'), title = el('div', 'cd-title'), date = el('div', 'cd-date');
    num.style.fontSize = numFs + 'px';
    const small = Math.max(13, Math.min(numFs * 0.2, 40));
    pre.style.fontSize = unit.style.fontSize = small + 'px';
    title.style.fontSize = Math.max(15, Math.min(numFs * 0.26, 56)) + 'px';
    date.style.fontSize = Math.max(11, small * 0.72) + 'px';
    const [y, m, dd] = d.split('-').map(Number);
    const target = new Date(y, m - 1, dd);
    title.textContent = w.config.title || '';
    date.textContent = target.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const update = () => {
      const now = new Date();
      const days = Math.round((target - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
      wrap.classList.toggle('today', days === 0);
      if (days > 1) { pre.textContent = 'Noch'; num.textContent = days; unit.textContent = w.config.title ? 'Tage bis' : 'Tage'; }
      else if (days === 1) { pre.textContent = 'Noch'; num.textContent = '1'; unit.textContent = w.config.title ? 'Tag bis' : 'Tag'; }
      else if (days === 0) { pre.textContent = ''; num.textContent = 'Heute'; unit.textContent = ''; num.style.fontSize = (numFs * 0.6) + 'px'; }
      else { pre.textContent = 'Vor'; num.textContent = -days; unit.textContent = -days === 1 ? 'Tag:' : 'Tagen:'; }
    };
    update();
    startInterval(w.id, update, 60000);
    wrap.append(pre, num, unit, title, date);
    body.appendChild(wrap);
  },

  // ── Kalender ── Monat mit Kalenderwochen; Countdown-Tage dieser Tafel sind markiert
  calendar(w, body) {
    body.style.flexDirection = 'column';
    body.style.padding = '0';
    const bodyH = w.h - (APP.state.editMode ? 34 : 0);
    const marks = new Map();
    ((APP.activeBoard() || {}).widgets || []).forEach(x => {
      if (x.type === 'countdown' && x.config && x.config.date) marks.set(x.config.date, x.config.title || 'Ereignis');
    });
    const head = el('div', 'cal-head'), grid = el('div', 'cal-grid');
    const title = el('div', 'cal-title');
    const mk = (iconName, label, fn) => {
      const b = el('button', 'pdf-btn'); b.innerHTML = icon(iconName, 20); b.title = label; b.setAttribute('aria-label', label);
      b.addEventListener('click', e => { e.stopPropagation(); fn(); });
      return b;
    };
    const today = el('button', 'cal-today'); today.textContent = 'Heute';
    today.addEventListener('click', e => { e.stopPropagation(); _calOffset.set(w.id, 0); paint(); });
    head.append(mk('chevronLeft', 'Vorheriger Monat', () => { _calOffset.set(w.id, (_calOffset.get(w.id) || 0) - 1); paint(); }),
                title, today,
                mk('chevronRight', 'Nächster Monat', () => { _calOffset.set(w.id, (_calOffset.get(w.id) || 0) + 1); paint(); }));
    const paint = () => {
      const off = _calOffset.get(w.id) || 0;
      const now = new Date();
      const first = new Date(now.getFullYear(), now.getMonth() + off, 1);
      const month = first.getMonth();
      title.textContent = first.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
      today.style.visibility = off ? 'visible' : 'hidden';
      const start = new Date(first);
      start.setDate(1 - ((first.getDay() + 6) % 7));   // Montag der ersten Woche
      const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(first.getFullYear(), month + 1, 0).getDate()) / 7);
      const cell = Math.min((w.w - 12) / 8, (bodyH - 46 - 8) / (weeks + 1));
      grid.style.fontSize = Math.max(10, Math.min(cell * 0.42, 44)) + 'px';
      grid.innerHTML = '';
      ['KW', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].forEach((t, i) => {
        const h = el('div', 'cal-h' + (i === 0 ? ' kw' : '')); h.textContent = t; grid.appendChild(h);
      });
      const day = new Date(start);
      for (let r = 0; r < weeks; r++) {
        const kw = el('div', 'cal-c kw'); kw.textContent = isoWeek(day); grid.appendChild(kw);
        for (let i = 0; i < 7; i++) {
          const c = el('div', 'cal-c');
          const key = day.getFullYear() + '-' + String(day.getMonth() + 1).padStart(2, '0') + '-' + String(day.getDate()).padStart(2, '0');
          const inner = el('span'); inner.textContent = day.getDate(); c.appendChild(inner);
          if (day.getMonth() !== month) c.classList.add('out');
          if (i >= 5) c.classList.add('we');
          if (day.toDateString() === now.toDateString()) c.classList.add('now');
          if (marks.has(key)) { c.classList.add('mark'); c.title = marks.get(key); }
          grid.appendChild(c);
          day.setDate(day.getDate() + 1);
        }
      }
    };
    paint();
    body.append(head, grid);
  },

  // ── Sticker ── frei platzierbares Bild-Zeichen ohne Karte
  sticker(w, body) {
    const s = el('div', 'st');
    s.textContent = w.config.emoji || '⭐';
    s.style.fontSize = Math.max(24, Math.min(w.w, w.h - (APP.state.editMode ? 34 : 0)) * 0.66) + 'px';
    body.appendChild(s);
  },

  // ── Kamera ── Live-Bild (z. B. als Dokumentenkamera); das Bild verlässt das Gerät nicht
  webcam(w, body) {
    stopCam(w.id);
    body.style.padding = '0';
    body.style.overflow = 'hidden';
    const rerender = () => { if (body.isConnected) renderWidgetContent(w, body); };
    if (!CAM_ON.has(w.id)) {
      const box = el('div', 'pdf-empty');
      const b = emptyCta('webcam', 'Kamera einschalten', () => { CAM_ON.add(w.id); rerender(); });
      b.style.margin = '0';
      const hint = el('div', 'pdf-empty-hint');
      hint.textContent = 'Das Bild bleibt auf diesem Gerät und wird nicht gespeichert';
      box.append(b, hint);
      body.appendChild(box);
      return;
    }
    const stage = el('div', 'cam-stage');
    const video = document.createElement('video');
    video.autoplay = true; video.muted = true; video.playsInline = true;
    if (w.config.mirror) video.classList.add('mirror');
    const msg = el('div', 'pdf-loading'); msg.textContent = 'Kamera wird gestartet …';
    const bar = el('div', 'cam-bar');
    const mk = (iconName, label, fn) => {
      const b = el('button', 'cam-btn'); b.innerHTML = icon(iconName, 20) + '<span>' + label + '</span>';
      b.addEventListener('click', e => { e.stopPropagation(); fn(b); });
      return b;
    };
    bar.append(
      mk('pause', 'Standbild', b => {
        if (video.paused) { video.play(); b.querySelector('span').textContent = 'Standbild'; b.classList.remove('on'); }
        else { video.pause(); b.querySelector('span').textContent = 'Weiter'; b.classList.add('on'); }
      }),
      mk('reset', 'Spiegeln', () => { w.config.mirror = !w.config.mirror; APP.save(); video.classList.toggle('mirror', !!w.config.mirror); }),
      mk('webcam', 'Andere Kamera', async () => {
        try {
          const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
          if (cams.length < 2) { toast('Es ist nur eine Kamera angeschlossen'); return; }
          const cur = cams.findIndex(d => d.deviceId === w.config.deviceId);
          w.config.deviceId = cams[(cur + 1) % cams.length].deviceId;
          APP.save(); rerender();
        } catch (e) { toast('Kameras konnten nicht abgefragt werden'); }
      }),
      mk('x', 'Aus', () => { CAM_ON.delete(w.id); stopCam(w.id); rerender(); })
    );
    stage.append(video, msg, bar);
    body.appendChild(stage);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg.textContent = 'Dieser Browser unterstützt keine Kamera.';
      return;
    }
    const want = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    if (w.config.deviceId) want.deviceId = { ideal: w.config.deviceId };
    navigator.mediaDevices.getUserMedia({ video: want, audio: false }).then(stream => {
      if (!body.isConnected || !stage.isConnected || !CAM_ON.has(w.id)) { stream.getTracks().forEach(t => t.stop()); return; }
      CAM_STREAMS[w.id] = stream;
      video.srcObject = stream;
      msg.remove();
    }, err => {
      CAM_ON.delete(w.id);
      msg.textContent = err && err.name === 'NotAllowedError'
        ? 'Der Zugriff auf die Kamera wurde nicht erlaubt. Erlaube ihn über das Schloss-Symbol in der Adresszeile.'
        : 'Es wurde keine Kamera gefunden oder sie wird gerade von einem anderen Programm benutzt.';
    });
  },

  // ── Video ── eigene Videodatei, liegt wie PDFs nur lokal auf dem Gerät
  video(w, body) {
    body.style.flexDirection = 'column';
    body.style.padding = '0';
    body.style.overflow = 'hidden';
    const rerender = () => { if (body.isConnected) renderWidgetContent(w, body); };
    const pick = async file => {
      if (!file) return;
      if (!/^video\//.test(file.type) && !/\.(mp4|webm|mov|m4v|ogv)$/i.test(file.name || '')) { toast('Bitte eine Videodatei auswählen (z. B. MP4)'); return; }
      if (file.size > 500 * 1024 * 1024) { toast('Dieses Video ist zu groß (maximal 500 MB).', 4000); return; }
      try {
        const fileId = 'vid_' + uid();
        await PDFSTORE.put(fileId, await file.arrayBuffer());
        if (w.config.fileId) PDFSTORE.del(w.config.fileId);
        w.config = { fileId, name: file.name || 'Video', mime: file.type || 'video/mp4' };
        APP.save();
        rerender();
      } catch (e) {
        console.error('Video speichern:', e);
        toast('Das Video konnte nicht gespeichert werden (Speicher des Browsers voll oder gesperrt).', 5000);
      }
    };
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'video/*'; inp.style.display = 'none';
    inp.addEventListener('change', () => pick(inp.files[0]));
    body.appendChild(inp);
    body.ondragover = e => { e.preventDefault(); body.classList.add('pdf-drop'); };
    body.ondragleave = () => body.classList.remove('pdf-drop');
    body.ondrop = e => { e.preventDefault(); e.stopPropagation(); body.classList.remove('pdf-drop'); pick(e.dataTransfer.files[0]); };
    const empty = (text, label) => {
      const box = el('div', 'pdf-empty');
      if (text) { const t = el('div', 'pdf-empty-text'); t.textContent = text; box.appendChild(t); }
      const b = emptyCta('video', label, () => inp.click());
      b.style.margin = '0';
      const hint = el('div', 'pdf-empty-hint');
      hint.textContent = 'oder Datei hierher ziehen · bleibt nur auf diesem Gerät';
      box.append(b, hint);
      body.appendChild(box);
    };
    if (!w.config.fileId) { empty('', 'Video öffnen'); return; }
    const old = _videoUrls.get(w.id);
    if (old) { URL.revokeObjectURL(old); _videoUrls.delete(w.id); }
    const video = document.createElement('video');
    video.className = 'vid';
    video.controls = true; video.playsInline = true; video.preload = 'metadata';
    body.appendChild(video);
    PDFSTORE.get(w.config.fileId).then(buf => {
      if (!body.isConnected) return;
      if (!buf) { video.remove(); empty('„' + (w.config.name || 'Das Video') + '“ liegt nicht auf diesem Gerät.', 'Video erneut auswählen'); return; }
      const url = URL.createObjectURL(new Blob([buf], { type: w.config.mime || 'video/mp4' }));
      _videoUrls.set(w.id, url);
      video.src = url;
    }, () => { video.remove(); empty('Das Video konnte nicht geladen werden.', 'Video erneut auswählen'); });
  },

  // ── Tagesplan ── Bildsymbole, abhaken, „jetzt“ hervorgehoben. Selbst eingetragen (Haken verschwinden am nächsten Tag)
  //    oder automatisch aus dem Stundenplan (hakt nach der Uhr ab, Ausfall/Vertretung markiert)
  dayplan(w, body) {
    const fromTT = w.config.source === 'timetable';
    let items, note = '', banner = '';
    if (fromTT) {
      const board = APP.state.boards.find(b => b.widgets.includes(w)) || APP.activeBoard();
      const cache = icalFor(board, false);
      if (!cache || !cache.url) { body.appendChild(emptyCta('timetable', 'Stundenplan verbinden', () => openDayplanEdit(w))); return; }
      const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
      const res = dayplanRowsFromTimetable(w, cache, now);
      const marks = w.config.marks && w.config.marks.day === todayKey() && w.config.marks.set ? w.config.marks.set : {};
      items = res.rows.map(r => ({ ...r, time: r.start >= 0 ? fmtHM(r.start) : '', done: r.key in marks ? !!marks[r.key] : r.end <= nowMin }));
      banner = res.allDay.length ? 'Heute: ' + res.allDay.join(' · ') : '';
      if (!res.lessons && !banner) note = !cache.lastFetched ? 'Stundenplan wird geladen …'
        : (now.getDay() === 0 || now.getDay() === 6 ? 'Schönes Wochenende!' : 'Heute kein Unterricht im Stundenplan');
    } else {
      items = (Array.isArray(w.config.items) ? w.config.items : []).filter(it => it && typeof it === 'object').slice(0, 20);
      if (!items.length) { body.appendChild(emptyCta('dayplan', 'Tagesplan eintragen', () => openDayplanEdit(w))); return; }
      if (w.config.autoReset !== false && w.config.day && w.config.day !== todayKey() && items.some(it => it.done)) {
        items.forEach(it => { it.done = false; });
        w.config.day = todayKey();
        APP.save();
      }
    }
    const bodyH = w.h - (APP.state.editMode ? 34 : 0);
    const title = String(w.config.title || '').trim();
    const titleFs = title ? Math.max(15, Math.min(bodyH * 0.06, w.w * 0.08, 34)) : 0;
    const cur = items.findIndex(it => !it.done && !it.cancelled);
    const extra = (note ? 1.6 : 0) + (banner ? 1.2 : 0);
    const avail = bodyH - 14 - (title ? titleFs * 1.6 : 0);
    // Passt nicht alles hin: Erledigtes oben einklappen, damit „jetzt“ und der Rest groß und lesbar bleiben
    let skip = 0;
    const maxRows = Math.floor(avail / 34 - extra);
    if (items.length > maxRows && maxRows >= 3) skip = Math.max(0, Math.min(cur >= 0 ? cur : items.length, items.length - maxRows + 1));
    const n = items.length - skip + (skip ? 0.7 : 0) + extra;
    const rowH = Math.max(30, avail / Math.max(1, n));
    const fs = Math.max(13, Math.min(rowH * 0.4, w.w * 0.07, 40));
    const wrap = el('div', 'dp');
    wrap.style.setProperty('--dp-fs', fs + 'px');
    wrap.style.setProperty('--dp-row', rowH + 'px');
    if (title) { const t = el('div', 'dp-title'); t.textContent = title; t.style.fontSize = titleFs + 'px'; wrap.appendChild(t); }
    if (banner) { const bn = el('div', 'dp-banner'); bn.textContent = banner; wrap.appendChild(bn); }
    if (note) { const nt = el('div', 'dp-note'); nt.textContent = note; wrap.appendChild(nt); }
    if (skip) {
      const sk = el('button', 'dp-skip');
      sk.textContent = '✓ ' + skip + ' erledigt';
      sk.title = 'Alles anzeigen';
      sk.addEventListener('click', e => { e.stopPropagation(); wrap.classList.add('dp-all'); });
      wrap.appendChild(sk);
    }
    items.forEach((it, i) => {
      const row = el('button', 'dp-row' + (it.done ? ' done' : '') + (i === cur ? ' now' : '') + (it.cancelled ? ' off' : '') + (i < skip ? ' dp-hid' : ''));
      row.setAttribute('aria-pressed', String(!!it.done));
      const pic = el('span', 'dp-pic'); pic.innerHTML = pictoSvg(it.icon || guessPicto(it.text));
      const txt = el('span', 'dp-text'); txt.textContent = it.text || '';
      row.append(pic, txt);
      if (it.cancelled || it.changed) { const tg = el('span', 'dp-tag' + (it.changed ? ' chg' : '')); tg.textContent = it.cancelled ? 'entfällt' : 'Vertretung'; row.appendChild(tg); }
      if (it.time && w.config.showTimes !== false) { const tm = el('span', 'dp-time'); tm.textContent = it.time; row.appendChild(tm); }
      const chk = el('span', 'dp-check'); chk.innerHTML = icon('check', 18); row.appendChild(chk);
      row.addEventListener('click', e => {
        e.stopPropagation();
        if (fromTT) {
          if (!w.config.marks || w.config.marks.day !== todayKey() || !w.config.marks.set) w.config.marks = { day: todayKey(), set: {} };
          w.config.marks.set[it.key] = !it.done;
        } else {
          it.done = !it.done;
          w.config.day = todayKey();
        }
        APP.save();
        renderWidgetContent(w, body);
      });
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
  },

  // ── Klassendienste ── wer ist diese Woche dran? Antippen eines Namens = fehlt heute → Vertretung rückt nach
  duties(w, body) {
    const cfg = w.config;
    const names = dutyNames(cfg), list = dutyList(cfg);
    if (!names.length || !list.length) { body.appendChild(emptyCta('duties', names.length ? 'Dienste eintragen' : 'Namen eintragen', () => openDutiesEdit(w))); return; }
    if (typeof cfg.startPeriod !== 'number') { cfg.startPeriod = dutyBase(dutyRot(cfg)); APP.save(); }
    const res = dutyAssign(cfg, new Date());
    const bodyW = w.w, bodyH = w.h - (APP.state.editMode ? 34 : 0);
    const n = res.slots.length;
    const title = String(cfg.title || '').trim(), sub = dutyPeriodLabel(cfg, new Date());
    const manual = dutyRot(cfg) === 'manual';
    const headFs = (title || sub || manual) ? Math.max(14, Math.min(bodyH * 0.065, bodyW * 0.06, 30)) : 0;
    const gap = 6, headH = headFs ? headFs * 1.35 + gap : 0;
    const fitRow = k => { const r = Math.ceil(n / k); return (bodyH - 16 - headH - (r - 1) * gap) / r; };
    let cols = bodyW >= 560 && n >= 5 ? 2 : 1;
    if (cols === 1 && fitRow(1) < 40 && bodyW >= 300 && n >= 3) cols = 2;   // flach: lieber zwei Spalten als scrollen
    // Sehr wenig Platz: nur Bild + Name (das Bild sagt, welcher Dienst)
    const compact = fitRow(cols) < 44;
    const rowH = Math.max(compact ? 26 : 34, fitRow(cols));
    const cellW = (bodyW - 16 - (cols - 1) * 8) / cols;
    const fs = Math.max(13, Math.min(rowH * (compact ? 0.5 : 0.42), cellW * (compact ? 0.1 : 0.09), 40));
    const picS = compact ? rowH - 6 : Math.min(rowH - 8, fs * 2.3);
    const wrap = el('div', 'du' + (compact ? ' compact' : ''));
    if (headFs) {
      const head = el('div', 'du-head');
      head.style.fontSize = headFs + 'px';
      const t = el('span', 'du-title'); t.textContent = title;
      const s = el('span', 'du-sub'); s.textContent = sub;
      head.append(t, s);
      if (manual) {
        const nx = el('button', 'du-next');
        nx.innerHTML = '<span>Weiter</span>' + icon('chevronRight', 16);
        nx.title = 'Nächste Kinder sind dran';
        nx.addEventListener('click', e => { e.stopPropagation(); cfg.offset = (Number(cfg.offset) || 0) + 1; delete cfg.absent; APP.save(); renderWidgetContent(w, body); });
        head.appendChild(nx);
      }
      wrap.appendChild(head);
    }
    const grid = el('div', 'du-grid');
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.style.gridAutoRows = rowH + 'px';
    const toggleAbsent = name => {
      const cur = cfg.absent && cfg.absent.p === res.p && Array.isArray(cfg.absent.names) ? cfg.absent.names.slice() : [];
      const i = cur.indexOf(name);
      if (i >= 0) cur.splice(i, 1); else cur.push(name);
      cfg.absent = { p: res.p, names: cur };
      APP.save();
      renderWidgetContent(w, body);
    };
    res.slots.forEach(s => {
      const cell = el('div', 'du-cell');
      cell.style.fontSize = fs + 'px';
      const pic = el('span', 'du-pic'); pic.style.width = pic.style.height = picS + 'px'; pic.innerHTML = pictoSvg(s.icon);
      const txt = el('span', 'du-txt');
      const lbl = el('span', 'du-lbl'); lbl.textContent = s.text;
      const nm = el('span', 'du-names');
      const joined = s.people.map(x => x.name || '—').join(' & ');
      const availW = (cellW - picS - fs * 1.6) * 0.94;
      nm.style.fontSize = Math.max(11, Math.min(fs, availW / Math.max(1, textWidthEm(joined, 800)))) + 'px';
      cell.title = s.text;
      s.people.forEach((x, i) => {
        if (i) nm.appendChild(document.createTextNode(' & '));
        const b = el('button', 'du-name');
        b.textContent = x.name || '—';
        b.title = x.name ? x.name + ' fehlt? Antippen – dann ist jemand anderes dran' : 'Niemand mehr frei';
        if (x.name) b.addEventListener('click', e => { e.stopPropagation(); toggleAbsent(x.name); });
        nm.appendChild(b);
      });
      s.people.filter(x => x.missing).forEach(x => {
        const f = el('button', 'du-for');
        f.textContent = 'für ' + x.missing;
        f.title = x.missing + ' ist doch da';
        f.addEventListener('click', e => { e.stopPropagation(); toggleAbsent(x.missing); });
        (compact ? nm : lbl).appendChild(f);
      });
      txt.append(lbl, nm);
      cell.append(pic, txt);
      grid.appendChild(cell);
    });
    wrap.appendChild(grid);
    body.appendChild(wrap);
    // Um Mitternacht / montags von selbst weiterschalten
    let last = res.p;
    startInterval(w.id, () => { if (dutyPeriod(cfg, new Date()) !== last) renderWidgetContent(w, body); }, 60000);
  },

  // ── Datum ── stellt sich jeden Tag selbst um (Wochentag, Datum, Jahreszeit)
  today(w, body) {
    const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
    const WD_COL = ['#E64980', '#E03131', '#F08C00', '#E6A700', '#2F9E44', '#1C7ED6', '#7048E8'];
    const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const line = w.config.style === 'line';
    const showSeason = w.config.season !== false, showYM = !!w.config.yesterday;
    const bodyW = w.w, bodyH = w.h - (APP.state.editMode ? 34 : 0);
    const wrap = el('div', 'td ' + (line ? 'td-line' : 'td-cards'));
    body.appendChild(wrap);
    let lastKey = '';
    const paint = () => {
      const d = new Date();
      if (d.toDateString() === lastKey) return;
      lastKey = d.toDateString();
      const wd = d.getDay(), [season, sKey] = seasonOf(d);
      const ym = 'Gestern war ' + WD[(wd + 6) % 7] + ' · Morgen ist ' + WD[(wd + 1) % 7];
      wrap.innerHTML = '';
      if (line) {
        const main = 'Heute ist ' + WD[wd] + ', der ' + d.getDate() + '. ' + MON[d.getMonth()] + ' ' + d.getFullYear() + '.';
        const extraH = (showSeason ? 1 : 0) + (showYM ? 1 : 0);
        const fs = fitFontSize(main, bodyW - 32, (bodyH - 24) * (extraH ? 0.62 : 1), { max: 72, lineHeight: 1.25, weight: 700 });
        const t = el('div', 'td-sentence');
        t.style.fontSize = fs + 'px';
        t.innerHTML = 'Heute ist <b style="color:' + WD_COL[wd] + '">' + WD[wd] + '</b>, der ' + d.getDate() + '. ' + MON[d.getMonth()] + ' ' + d.getFullYear() + '.';
        wrap.appendChild(t);
        if (showSeason) {
          const s = el('div', 'td-sline');
          s.style.fontSize = Math.max(13, fs * 0.6) + 'px';
          s.innerHTML = '<span class="td-spic">' + pictoSvg(sKey) + '</span>' + season;
          wrap.appendChild(s);
        }
        if (showYM) { const y = el('div', 'td-ym'); y.style.fontSize = Math.max(12, fs * 0.42) + 'px'; y.textContent = ym; wrap.appendChild(y); }
        return;
      }
      // Karten: Wochentag mit Farbpunkten der Woche, dann Tag / Monat / Jahr, dann Jahreszeit
      const rows = 2 + (showSeason ? 1 : 0) + (showYM ? 0.5 : 0);
      const unit = (bodyH - 16 - (Math.ceil(rows) - 1) * 8) / rows;
      const big = Math.max(16, Math.min(unit * 0.5, bodyW * 0.11, 90));
      const card = (cls, html, fs) => { const k = el('div', 'td-card ' + cls); k.innerHTML = html; k.style.fontSize = fs + 'px'; return k; };
      let dots = '';
      [1, 2, 3, 4, 5, 6, 0].forEach(i => { dots += '<i style="background:' + WD_COL[i] + '"' + (i === wd ? ' class="on"' : '') + '></i>'; });
      const w1 = card('td-wd', '<b>' + WD[wd] + '</b><span class="td-dots">' + dots + '</span>', big);
      w1.style.borderLeftColor = WD_COL[wd];
      w1.style.flexGrow = '1';
      wrap.appendChild(w1);
      const r2 = el('div', 'td-row');
      const sm = Math.max(14, Math.min(big * 0.85, bodyW * 0.075));
      r2.append(card('td-day', '<b>' + d.getDate() + '.</b>', sm), card('td-mon', '<b>' + MON[d.getMonth()] + '</b>', Math.max(13, Math.min(sm, (bodyW * 0.45) / Math.max(5, MON[d.getMonth()].length * 0.62)))), card('td-year', '<b>' + d.getFullYear() + '</b>', sm));
      r2.style.flexGrow = '1';
      wrap.appendChild(r2);
      if (showSeason) {
        const s = card('td-season', '<span class="td-spic">' + pictoSvg(sKey) + '</span><b>' + season + '</b>', Math.max(14, big * 0.75));
        s.style.flexGrow = '0.9';
        wrap.appendChild(s);
      }
      if (showYM) { const y = el('div', 'td-ym'); y.style.fontSize = Math.max(12, big * 0.32) + 'px'; y.textContent = ym; wrap.appendChild(y); }
    };
    paint();
    startInterval(w.id, paint, 30000);
  },
