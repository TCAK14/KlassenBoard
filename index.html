function renderBoardTabs() {
  updatePager();
  const container = document.getElementById('board-tabs');
  container.innerHTML = '';
  APP.state.boards.forEach(board => {
    const btn = el('button','tab-btn' + (board.id === APP.state.activeBoardId ? ' active' : ''));
    btn.dataset.bid = board.id;

    const nameSpan = document.createElement('span');
    nameSpan.className = 'tab-name-span';
    nameSpan.textContent = board.name;

    const editBtn = document.createElement('span');
    editBtn.className = 'tab-action tab-edit';
    editBtn.innerHTML = icon('edit', 14);
    editBtn.title = 'Umbenennen';

    const closeX = document.createElement('span');
    closeX.className = 'tab-action tab-close';
    closeX.innerHTML = icon('x', 14);
    closeX.title = 'Tafel löschen';

    editBtn.addEventListener('click', e => {
      e.stopPropagation();
      openRenameModal(board);
    });
    closeX.addEventListener('click', e => {
      e.stopPropagation();
      if (APP.state.boards.length <= 1) { toast('❌ Mindestens eine Tafel muss vorhanden sein'); return; }
      if (confirm('Tafel "' + board.name + '" wirklich löschen?')) deleteBoard(board.id);
    });

    btn.append(nameSpan, editBtn, closeX);
    btn.addEventListener('click', () => { if (board.id !== APP.state.activeBoardId) switchBoard(board.id); });
    container.appendChild(btn);
  });
  // Aktiven Tab sichtbar halten, wenn die Tab-Leiste überläuft
  const activeTab = container.querySelector('.tab-btn.active');
  if (activeTab && container.scrollWidth > container.clientWidth) {
    container.scrollLeft = Math.max(0, activeTab.offsetLeft - container.offsetLeft - 12);
  }
}

function openRenameModal(board) {
  // Remove existing modal if any
  document.getElementById('rename-modal-overlay')?.remove();

  const overlay = document.createElement('div');
  overlay.id = 'rename-modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px)';

  const box = document.createElement('div');
  box.style.cssText = 'background:#1e293b;border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:20px;min-width:280px;box-shadow:0 20px 60px rgba(0,0,0,0.7)';
  box.innerHTML = '<div style="font-size:14px;font-weight:700;margin-bottom:12px">✏️ Tafel umbenennen</div>';

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.value = board.name;
  inp.style.cssText = 'width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:14px;padding:9px 12px;margin-bottom:12px;box-sizing:border-box;touch-action:auto;outline:none';
  inp.addEventListener('click', e => e.stopPropagation());

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Abbrechen';
  cancelBtn.style.cssText = 'padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;font-size:13px';

  const okBtn = document.createElement('button');
  okBtn.textContent = 'Speichern';
  okBtn.style.cssText = 'padding:8px 16px;border-radius:8px;border:none;background:#6D4BFF;color:#fff;cursor:pointer;font-size:13px;font-weight:600';

  const close = () => overlay.remove();
  const confirm_rename = () => {
    const name = inp.value.trim();
    if (name) renameBoard(board.id, name);
    close();
  };

  cancelBtn.addEventListener('click', close);
  okBtn.addEventListener('click', confirm_rename);
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') confirm_rename();
    if (e.key === 'Escape') close();
  });
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  row.append(cancelBtn, okBtn);
  box.append(inp, row);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  requestAnimationFrame(() => { inp.focus(); inp.select(); });
}

function renderBoardBg() {
  const board = APP.activeBoard();
  const boardEl = document.getElementById('board');
  if (!board || !boardEl) return;
  const bg = board.background || {};
  // Hintergrund direkt auf dem Scroll-Container: bleibt beim Scrollen der Tafel stehen.
  // Nur die background-Eigenschaft setzen — top/bottom des Boards steuert die Toolbar-Position.
  if (bg.type === 'image' && bg.value) {
    // URL nicht ungeprüft interpolieren (CSS-Injection)
    boardEl.style.background = 'url("' + String(bg.value).replace(/["\\\n\r]/g, '') + '") center / cover no-repeat #1e293b';
  } else if (bg.type === 'pattern') {
    boardEl.style.background = patternCss(bg.value);
  } else if (bg.value && !isLegacyBg(bg.value)) {
    boardEl.style.background = bg.value;
  } else {
    boardEl.style.background = DEFAULT_BG.value;   // Standard = Scolavis-Verlauf (nicht nur die flache Grundfarbe)
  }
}

// ══════════════════════════════════════════════════════════════
// RENDER – WIDGETS
// ══════════════════════════════════════════════════════════════
function renderWidgets() {
  exitWidgetFull(true);
  Object.keys(CAM_STREAMS).forEach(stopCam);
  stopAllIntervals();
  stopAllAudioStreams();
  stopAllPollChannels(); // Poll-Renderer abonniert neu — alte Realtime-Channels nicht leaken
  const layer = document.getElementById('widgets-layer');
  layer.innerHTML = '';
  const board = APP.activeBoard();
  if (!board) return;
  if (!Array.isArray(board.widgets)) board.widgets = [];
  board.widgets = board.widgets.filter(w => w && w.type);
  board.widgets.forEach(w => {
    // Ein einzelnes defektes Widget darf nicht die ganze Tafel leer lassen
    try { layer.appendChild(buildWidgetEl(w)); }
    catch(e) { console.error('Widget konnte nicht aufgebaut werden:', w.type, e); }
  });
  updateLayerSize();
  // restart timetable refresh
  board.widgets.filter(w => w.type === 'timetable' || (w.type === 'dayplan' && w.config && w.config.source === 'timetable')).forEach(w => {
    if (w.type === 'dayplan') icalFor(board, true);
    startTimetableRefresh(w);
  });
}

// Fläche so groß wie der Inhalt halten (Scrollbereich) und die Zeichenebene mitziehen
function updateLayerSize() {
  const layer = document.getElementById('widgets-layer');
  const board = APP.activeBoard();
  if (!layer || !board) return;
  // Auf Handys bewusst eine größere virtuelle Tafel, sonst passt kaum ein Widget
  const small = window.innerWidth <= 768;
  let maxR = small ? 900 : 0, maxB = small ? 600 : 0;
  board.widgets.forEach(w => {
    maxR = Math.max(maxR, (w.x || 0) + (w.w || 200) + 20);
    maxB = Math.max(maxB, (w.y || 0) + (w.h || 100) + 20);
  });
  layer.style.minWidth = maxR + 'px';
  layer.style.minHeight = maxB + 'px';
  if (DRAW.canvas) DRAW._syncScroll();
}

// ── Einzelnes Element im Vollbild (PDF, Video, Timer … für die ganze Klasse) ──
let _wfull = null;
// Eingebettete Seiten/Videos füllen den Rahmen von selbst — nicht neu aufbauen (Video liefe sonst von vorn)
const WFULL_NO_RERENDER = new Set(['youtube', 'browser', 'webcam', 'video']);
// Im Vollbild rechnen die Elemente mit der Bildschirmgröße statt mit ihrer gespeicherten Größe.
// Ein Proxy statt echter Änderung: die gespeicherte Größe bleibt unangetastet.
function widgetFullProxy(w) {
  const extra = APP.state.editMode ? 34 : 0;
  return new Proxy(w, { get(t, k) {
    if (k === '__full') return true;
    if (k === 'w') return window.innerWidth;
    if (k === 'h') return window.innerHeight + extra;
    return t[k];
  } });
}
function toggleWidgetFull(id) {
  if (_wfull) { const same = _wfull.id === id; exitWidgetFull(); if (same) return; }
  const board = APP.activeBoard();
  const w = board && board.widgets.find(x => x.id === id);
  const shell = document.querySelector('[data-wid="' + id + '"]');
  if (!w || !shell) return;
  const draw = () => {
    const b = shell.querySelector('.widget-body');
    if (b && !WFULL_NO_RERENDER.has(w.type)) renderWidgetContent(w, b);
  };
  const exitBtn = el('button', 'w-full-exit');
  exitBtn.innerHTML = icon('minimize', 22);
  exitBtn.title = 'Vollbild beenden (Esc)';
  exitBtn.setAttribute('aria-label', 'Vollbild beenden');
  exitBtn.addEventListener('click', e => { e.stopPropagation(); exitWidgetFull(); });
  shell.appendChild(exitBtn);
  shell.classList.add('wfull');
  document.body.classList.add('wfull-on');
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); exitWidgetFull(); } };
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('resize', draw);
  _wfull = { id, shell, w, onKey, draw, exitBtn };
  draw();
}
function exitWidgetFull(skipRender) {
  if (!_wfull) return;
  const f = _wfull; _wfull = null;
  document.removeEventListener('keydown', f.onKey, true);
  window.removeEventListener('resize', f.draw);
  document.body.classList.remove('wfull-on');
  f.exitBtn.remove();
  f.shell.classList.remove('wfull');
  if (!skipRender && f.shell.isConnected && !WFULL_NO_RERENDER.has(f.w.type)) {
    const b = f.shell.querySelector('.widget-body');
    if (b) renderWidgetContent(f.w, b);
  }
}

// Elemente mit Einstellungs-Dialog (muss zu openWidgetSettings passen)
const WIDGET_HAS_SETTINGS = new Set(['timer','text','qr','names','homework','goal','timetable','image','youtube',
  'noise','poll','randomnum','groups','agenda','checklist','phases',
  'visualtimer','worksymbols','countdown','sticker','scoreboard','clock','traffic','dayplan','today','link','duties']);

function buildWidgetEl(w) {
  const shell = el('div','widget' + (w.id === APP.selectedId ? ' selected' : ''));
  shell.dataset.wid = w.id;
  shell.dataset.type = w.type;
  if (w.config && w.config.frameless) shell.classList.add('frameless');
  shell.style.cssText = `left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${w.zIndex||1}`;

  // Header (only in edit mode)
  if (APP.state.editMode) {
    const hdr = el('div','widget-header');
    const titleEl = el('span','widget-title');
    titleEl.textContent = REGISTRY[w.type]?.label || w.type;
    const actions = el('div','widget-actions');
    const settBtn = el('button','w-btn'); settBtn.innerHTML = icon('settings', 15); settBtn.title = 'Einstellungen';
    settBtn.addEventListener('click', e => { e.stopPropagation(); openWidgetSettings(w.id); });
    const delBtn = el('button','w-btn del'); delBtn.innerHTML = icon('x', 15); delBtn.title = 'Vom Board entfernen';
    delBtn.addEventListener('click', e => { e.stopPropagation(); removeWidget(w.id); });
    const fullBtn = el('button','w-btn'); fullBtn.innerHTML = icon('maximize', 15); fullBtn.title = 'Im Vollbild zeigen';
    fullBtn.addEventListener('click', e => { e.stopPropagation(); toggleWidgetFull(w.id); });
    actions.append(fullBtn);
    // Zahnrad nur zeigen, wenn das Element auch Einstellungen hat
    if (WIDGET_HAS_SETTINGS.has(w.type)) actions.append(settBtn);
    actions.append(delBtn);
    hdr.append(titleEl, actions);
    shell.appendChild(hdr);
    // Resize handle
    const rh = el('div','resize-handle');
    shell.appendChild(rh);
    initResize(shell, rh, w);
    initDrag(shell, hdr, w);
  }

  // Body
  const body = el('div','widget-body' + (APP.state.editMode ? ' with-header' : ''));
  renderWidgetContent(w, body);
  shell.appendChild(body);
  if (!APP.state.editMode) {
    // In der Ansicht: kleiner Vollbild-Knopf in der Ecke (erscheint beim Darüberfahren, auf Touch immer)
    const fb = el('button', 'w-full-btn');
    fb.innerHTML = icon('maximize', 17);
    fb.title = 'Im Vollbild zeigen';
    fb.setAttribute('aria-label', 'Im Vollbild zeigen');
    fb.addEventListener('click', e => { e.stopPropagation(); toggleWidgetFull(w.id); });
    shell.appendChild(fb);
  }

  // Double-tap / dblclick to edit (works on both desktop and mobile)
  if (APP.state.editMode) {
    const hasOwnEdit = new Set(['text','goal','homework','agenda','checklist']);
    if (!hasOwnEdit.has(w.type) && WIDGET_HAS_SETTINGS.has(w.type)) {
      body.addEventListener('dblclick', e => {
        // schnelles Tippen auf Knöpfe (−/+, Punkte, Ampel) ist kein Wunsch nach Einstellungen
        if (e.target.closest('button, input, select, textarea, a')) return;
        e.stopPropagation(); openWidgetSettings(w.id);
      });
    }
    let lastTap = 0, lastTapX = 0, lastTapY = 0;
    body.addEventListener('touchend', e => {
      // Zwei-Finger-Tap ist kein Doppel-Tap
      if (e.touches.length > 0 || e.changedTouches.length !== 1) { lastTap = 0; return; }
      // Schnelle Taps auf Bedienelemente (Timer-Buttons etc.) nicht kapern
      if (e.target.closest('button, input, select, textarea, a')) { lastTap = 0; return; }
      const t = e.changedTouches[0];
      const now = Date.now();
      const near = Math.abs(t.clientX - lastTapX) < 40 && Math.abs(t.clientY - lastTapY) < 40;
      if (now - lastTap < 350 && near) {
        if (!WIDGET_HAS_SETTINGS.has(w.type)) { lastTap = 0; return; }
        e.preventDefault();
        lastTap = 0;
        if (hasOwnEdit.has(w.type)) {
          if (w.type === 'text' || w.type === 'goal') {
            const target = e.target.closest('.w-text-display, .w-goal-text');
            if (target) target.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
          } else {
            openWidgetSettings(w.id);
          }
        } else {
          openWidgetSettings(w.id);
        }
        return;
      }
      lastTap = now; lastTapX = t.clientX; lastTapY = t.clientY;
    });
  }

  // Click to select
  shell.addEventListener('pointerdown', e => {
    if (!APP.state.editMode) return;
    APP.selectedId = w.id;
    document.querySelectorAll('.widget').forEach(el => el.classList.remove('selected'));
    shell.classList.add('selected');
    // bring to front — nur wenn das Widget nicht schon oben liegt (sonst löst jeder
    // Klick ein Speichern + Cloud-Sync aus und der z-index wächst endlos)
    const board = APP.activeBoard();
    if (board) {
      const maxOther = board.widgets.reduce((m, o) => o === w ? m : Math.max(m, o.zIndex || 0), 0);
      if ((w.zIndex || 0) <= maxOther) {
        w.zIndex = maxOther + 1;
        shell.style.zIndex = w.zIndex;
        APP.save();
      }
    }
  });

  return shell;
}

// DRAG & RESIZE (Pointer Events)
// ══════════════════════════════════════════════════════════════
// Einrasten: 8-px-Raster + Kanten/Mitten der anderen Elemente (Alt gedrückt = frei bewegen)
const SNAP = { grid: 8, tol: 7 };
function snapLines(w) {
  const board = APP.activeBoard();
  const xs = [], ys = [];
  (board ? board.widgets : []).forEach(o => {
    if (o === w) return;
    xs.push(o.x, o.x + o.w / 2, o.x + o.w);
    ys.push(o.y, o.y + o.h / 2, o.y + o.h);
  });
  return { xs, ys };
}
function snapAxis(cands, lines) {
  let best = null;
  cands.forEach(cnd => lines.forEach(line => {
    const d = line - cnd;
    if (Math.abs(d) <= SNAP.tol && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, line };
  }));
  return best;
}
function showSnapGuide(axis, pos) {
  const layer = document.getElementById('widgets-layer');
  if (!layer) return;
  let g = layer.querySelector('.snap-guide.' + axis);
  if (pos == null) { if (g) g.remove(); return; }
  if (!g) { g = el('div', 'snap-guide ' + axis); layer.appendChild(g); }
  g.style.display = 'block';
  if (axis === 'v') g.style.left = (pos - 1) + 'px'; else g.style.top = (pos - 1) + 'px';
}
function hideSnapGuides() { showSnapGuide('v', null); showSnapGuide('h', null); }
const snapGrid = v => Math.round(v / SNAP.grid) * SNAP.grid;

function initDrag(shell, handle, w) {
  let startX, startY, startLeft, startTop, lines;
  // Ohne touch-action:none übernimmt der Browser den Touch fürs Board-Scrollen
  // und feuert pointercancel mitten im Drag
  handle.style.touchAction = 'none';
  handle.addEventListener('pointerdown', e => {
    if (!APP.state.editMode) return;
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY;
    startLeft = w.x; startTop = w.y;
    lines = snapLines(w);
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  });
  function onMove(e) {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    let x = Math.max(0, startLeft + dx), y = Math.max(0, startTop + dy);
    if (e.altKey) hideSnapGuides();
    else {
      // Eine Achse, auf der (fast) nicht gezogen wird, bleibt exakt stehen
      const sx = Math.abs(dx) < 3 ? null : snapAxis([x, x + w.w / 2, x + w.w], lines.xs);
      if (sx) x += sx.d; else x = Math.abs(dx) < 3 ? startLeft : snapGrid(x);
      showSnapGuide('v', sx ? sx.line : null);
      const sy = Math.abs(dy) < 3 ? null : snapAxis([y, y + w.h / 2, y + w.h], lines.ys);
      if (sy) y += sy.d; else y = Math.abs(dy) < 3 ? startTop : snapGrid(y);
      showSnapGuide('h', sy ? sy.line : null);
    }
    w.x = Math.max(0, Math.round(x));
    w.y = Math.max(0, Math.round(y));
    shell.style.left = w.x + 'px';
    shell.style.top  = w.y + 'px';
  }
  function onUp() {
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    handle.removeEventListener('pointercancel', onUp);
    hideSnapGuides();
    if (w.x !== startLeft || w.y !== startTop) { APP.save(); updateLayerSize(); }
  }
}

function initResize(shell, handle, w) {
  let startX, startY, startW, startH, lines;
  handle.style.touchAction = 'none';
  handle.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    handle.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY;
    startW = w.w; startH = w.h;
    lines = snapLines(w);
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  });
  function onMove(e) {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    let nw = Math.max(120, startW + dx), nh = Math.max(80, startH + dy);
    if (e.altKey) hideSnapGuides();
    else {
      // rechte/untere Kante rastet an anderen Elementen oder am Raster ein
      const sx = Math.abs(dx) < 3 ? null : snapAxis([w.x + nw], lines.xs);
      if (sx) nw += sx.d; else nw = Math.abs(dx) < 3 ? startW : snapGrid(w.x + nw) - w.x;
      showSnapGuide('v', sx ? sx.line : null);
      const sy = Math.abs(dy) < 3 ? null : snapAxis([w.y + nh], lines.ys);
      if (sy) nh += sy.d; else nh = Math.abs(dy) < 3 ? startH : snapGrid(w.y + nh) - w.y;
      showSnapGuide('h', sy ? sy.line : null);
    }
    w.w = Math.max(120, Math.round(nw));
    w.h = Math.max(80, Math.round(nh));
    shell.style.width  = w.w + 'px';
    shell.style.height = w.h + 'px';
  }
  function onUp() {
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    handle.removeEventListener('pointercancel', onUp);
    hideSnapGuides();
    if (w.w === startW && w.h === startH) return;
    APP.save();
    updateLayerSize();
    // re-render content so QR etc. resizes
    const body = shell.querySelector('.widget-body');
    if (body) renderWidgetContent(w, body);
  }
}

// WIDGET CONTENT RENDERERS
// ══════════════════════════════════════════════════════════════
function renderWidgetContent(w, body) {
  // Wird ein Element im Vollbild neu aufgebaut (z. B. nach einem Einstellungs-Dialog), bleibt es groß
  if (_wfull && _wfull.id === w.id && !w.__full) w = widgetFullProxy(w);
  body.innerHTML = '';
  if (!w.config || typeof w.config !== 'object') w.config = {};
  const fn = WIDGET_RENDERERS[w.type];
  const showError = msg => {
    body.innerHTML = '';
    const box = el('div');
    box.style.cssText = 'padding:14px;font-size:12.5px;color:rgba(255,255,255,0.6);text-align:center;line-height:1.5';
    box.textContent = msg;
    body.appendChild(box);
  };
  if (!fn) { showError('❓ Unbekanntes Element'); return; }
  try { fn(w, body); }
  catch(e) {
    // Defekte Daten in einem Widget dürfen nicht die ganze Tafel lahmlegen
    console.error('Widget-Fehler (' + w.type + '):', e);
    showError('⚠️ Dieses Element konnte nicht geladen werden. Über ✕ entfernen und neu anlegen.');
  }
}

// Textbreite in em (über ein unsichtbares Canvas gemessen — funktioniert auch, bevor das
// Element im Dokument hängt, und passt sich automatisch an die geladene Schrift an)
const _measureCtx = document.createElement('canvas').getContext('2d');
const _measureCache = new Map();
function textWidthEm(str, weight) {
  const key = (weight || 400) + '|' + str;
  let v = _measureCache.get(key);
  if (v === undefined) {
    _measureCtx.font = (weight || 400) + ' 100px ' + getComputedStyle(document.body).fontFamily;
    v = _measureCtx.measureText(str).width / 100;
    if (_measureCache.size > 4000) _measureCache.clear();
    _measureCache.set(key, v);
  }
  return v;
}
// Wie viele Zeilen braucht der Text bei Schriftgröße fs in einem Feld der Breite boxW?
function countWrappedLines(text, boxW, fs, weight) {
  const space = textWidthEm(' ', weight) * fs;
  let lines = 0;
  for (const para of String(text == null ? '' : text).split('\n')) {
    let lineW = 0;
    lines++;
    for (const word of para.split(/\s+/)) {
      if (!word) continue;
      const ww = textWidthEm(word, weight) * fs;
      if (lineW > 0 && lineW + space + ww <= boxW) { lineW += space + ww; continue; }
      if (lineW > 0) lines++;
      // überlange Wörter werden mitten im Wort umbrochen (word-break)
      if (ww > boxW) { lines += Math.ceil(ww / boxW) - 1; lineW = ww % boxW; }
      else lineW = ww;
    }
  }
  return lines;
}
// Größte Schriftgröße, bei der der Text noch ins Feld passt
function fitFontSize(text, boxW, boxH, opts) {
  const o = Object.assign({ min: 14, max: 72, lineHeight: 1.6, weight: 400 }, opts || {});
  const w = Math.max(20, boxW * 0.97);   // kleine Reserve für Rundungen
  let lo = o.min, hi = o.max;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (countWrappedLines(text, w, mid, o.weight) * mid * o.lineHeight <= boxH) lo = mid; else hi = mid - 1;
  }
  return lo;
}

// ── Timer-Hilfen ──
function timerFullSeconds(w) {
  const c = w.config || {};
  const secs = Math.max(0, Number(c.seconds) || 0);
  // Fehlt "minutes" (ältere KI-/Sprach-Timer mit reinen Sekunden), nicht stillschweigend 5 Minuten addieren
  const mins = c.minutes == null ? (secs > 0 ? 0 : 5) : Math.max(0, Number(c.minutes) || 0);
  return (mins * 60 + secs) || 300;
}

}
// Überwacht ALLE laufenden Timer — auch auf Tafeln, die gerade nicht angezeigt werden
setInterval(() => {
  const now = Date.now();
  (APP.state.boards || []).forEach(board => {
    (board.widgets || []).forEach(w => {

      w._timerRunning = false;

      const shell = document.querySelector('[data-wid="' + w.id + '"]');

// PDF — Dateien liegen lokal im Browser (IndexedDB), nicht in der Cloud:
// PDFs sind zu groß für localStorage/Cloud-Sync und enthalten oft Material, das das Gerät nicht verlassen soll.
// ══════════════════════════════════════════════════════════════
const PDF_MAX_BYTES = 60 * 1024 * 1024;
const PDFSTORE = {
  _db: null,

      const req = indexedDB.open('classpuls_files', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('pdf');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { this._db = null; reject(req.error); };
    });
    return this._db;
  },
  async put(id, buf) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('pdf', 'readwrite');
      tx.objectStore('pdf').put(buf, id);
      tx.oncomplete = () => resolve();
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  },
  async get(id) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const req = db.transaction('pdf').objectStore('pdf').get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  },
  async del(id) {
    try {
      const db = await this.open();
      db.transaction('pdf', 'readwrite').objectStore('pdf').delete(id);
    } catch(e) {}
  },
};
// PDF.js erst laden, wenn wirklich ein PDF geöffnet wird (spart ~1 MB beim Start)
const PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { _pdfjsLoading = null; s.remove(); reject(new Error('offline')); };

  });

}
// geöffnete Dokumente behalten, damit Blättern und Neuaufbau nicht jedes Mal neu einlesen
const _pdfDocs = new Map();
async function getPdfDoc(fileId) {

  const p = (async () => {
    const buf = await PDFSTORE.get(fileId);
    if (!buf) return null;
    const lib = await loadPdfJs();
    // Kopie übergeben: PDF.js übernimmt den Puffer und macht das Original unbrauchbar
    return lib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
  })();

// Eine Seite so groß wie möglich in den Kasten zeichnen
async function drawPdfPage(doc, pageNo, canvas, boxW, boxH) {

  // Speicher-Deckel: bei starkem Zoom lieber etwas weniger scharf als ein abstürzender Browser

  canvas.style.width = Math.floor(vp.width / dpr) + 'px';

// Zoomstufe je PDF-Element (1 = ganze Seite sichtbar); bewusst nicht gespeichert
const _pdfZoom = new Map();

// st = { z(): aktuelle Stufe, set(z): neue Stufe }. Rückgabe: wasGesture() → war die letzte Berührung ein Ziehen/Zoomen?
function attachPdfZoom(stage, st, opts) {
  const pts = new Map();
  let pan = null, pinch = null, moved = false;
  stage.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;            // normales Mausrad scrollt die vergrößerte Seite
    e.preventDefault(); e.stopPropagation();
    st.set(st.z() * (e.deltaY < 0 ? 1.2 : 1 / 1.2));
  }, { passive: false });
  stage.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: st.z() };
      pan = null;
    } else if (st.z() > 1) {
      pan = { x: e.clientX, y: e.clientY, sl: stage.scrollLeft, st: stage.scrollTop };
      try { stage.setPointerCapture(e.pointerId); } catch(_) {}
    }
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch.d > 10) st.set(pinch.z * d / pinch.d);
      moved = true;
    } else if (pan) {
      const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
      stage.scrollLeft = pan.sl - dx;
      stage.scrollTop = pan.st - dy;
    }
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) pan = null; };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  if (opts && opts.dblclick) stage.addEventListener('dblclick', e => { e.stopPropagation(); st.set(st.z() > 1 ? 1 : 2); });
  return { wasGesture: () => moved };
}
// Neue Zoomstufe setzen und dabei die Bildmitte an Ort und Stelle halten
function applyPdfZoom(id, stage, label, z, redraw) {
  z = Math.max(1, Math.min(5, Math.round(z * 100) / 100));
  if (z === (_pdfZoom.get(id) || 1)) return;
  const fx = (stage.scrollLeft + stage.clientWidth / 2) / Math.max(1, stage.scrollWidth);
  const fy = (stage.scrollTop + stage.clientHeight / 2) / Math.max(1, stage.scrollHeight);
  _pdfZoom.set(id, z);
  stage.classList.toggle('zoomed', z > 1);
  if (label) label.textContent = Math.round(z * 100) + ' %';
  Promise.resolve(redraw()).then(() => {
    stage.scrollLeft = fx * stage.scrollWidth - stage.clientWidth / 2;
    stage.scrollTop = fy * stage.scrollHeight - stage.clientHeight / 2;
  });
}

async function pickPdf(w, file, onDone) {
  if (!file) return;
  if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name || '')) { toast('Bitte eine PDF-Datei auswählen'); return; }
  if (file.size > PDF_MAX_BYTES) { toast('Diese PDF ist zu groß (maximal 60 MB).', 4000); return; }
  try {
    const buf = await file.arrayBuffer();
    const fileId = 'pdf_' + uid();
    await PDFSTORE.put(fileId, buf);
    if (w.config.fileId) { PDFSTORE.del(w.config.fileId); _pdfDocs.delete(w.config.fileId); }
    w.config = { fileId, name: file.name || 'Dokument.pdf', page: 1 };
    APP.save();
    onDone();
  } catch (e) {
    console.error('PDF speichern:', e);
    toast('Die PDF konnte nicht gespeichert werden (Speicher des Browsers voll oder gesperrt).', 5000);
  }
}
// Großansicht: eine Seite bildschirmfüllend, Blättern mit Knöpfen, Pfeiltasten oder Wischen
function openPdfFullscreen(w, onClose) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay pdf-full';
  ov.innerHTML = '<div class="pdf-full-stage"><canvas></canvas></div>'
    + '<div class="pdf-full-bar"><button data-a="prev" aria-label="Vorherige Seite">' + icon('chevronLeft', 26) + '</button>'
    + '<span class="pdf-full-no"></span><button data-a="next" aria-label="Nächste Seite">' + icon('chevronRight', 26) + '</button>'
    + '<span class="pdf-full-gap"></span>'
    + '<button data-a="zout" aria-label="Verkleinern" title="Verkleinern">' + icon('zoomOut', 24) + '</button>'
    + '<span class="pdf-full-zoom">100 %</span>'
    + '<button data-a="zin" aria-label="Vergrößern" title="Vergrößern">' + icon('zoomIn', 24) + '</button>'
    + '<span class="pdf-full-gap"></span>'
    + '<button data-a="close" aria-label="Schließen">' + icon('x', 24) + '</button></div>';
  document.body.appendChild(ov);
  const stage = ov.querySelector('.pdf-full-stage'), canvas = ov.querySelector('canvas'), no = ov.querySelector('.pdf-full-no');
  let doc = null, chain = Promise.resolve(), waiting = false;
  const zid = 'full_' + w.id, zlabel = ov.querySelector('.pdf-full-zoom');
  _pdfZoom.delete(zid);
  const setZoom = z => applyPdfZoom(zid, stage, zlabel, z, () => show());
  const gesture = attachPdfZoom(stage, { z: () => _pdfZoom.get(zid) || 1, set: setZoom });
  // Zeichnet nacheinander; mehrere Aufrufe während eines Zeichnens werden zu einem zusammengefasst.
  // Das zurückgegebene Versprechen ist erst erfüllt, wenn der neue Stand wirklich gezeichnet ist.
  const show = () => {
    if (waiting) return chain;
    waiting = true;
    chain = chain.then(() => { waiting = false; return paint(); });
    return chain;
  };
  const paint = async () => {
    if (!doc || !ov.isConnected) return;
    const p = Math.max(1, Math.min(doc.numPages, w.config.page || 1));
    w.config.page = p;
    no.textContent = p + ' / ' + doc.numPages;
    const z = _pdfZoom.get(zid) || 1;
    try { await drawPdfPage(doc, p, canvas, (ov.clientWidth - 16) * z, (ov.clientHeight - 84) * z); } catch(e) {}
  };
  const go = d => { if (!doc) return; const p = Math.max(1, Math.min(doc.numPages, (w.config.page || 1) + d)); if (p !== w.config.page) { w.config.page = p; no.textContent = p + ' / ' + doc.numPages; APP.save(); show(); } };
  const close = () => { document.removeEventListener('keydown', onKey, true); window.removeEventListener('resize', show); ov.remove(); onClose && onClose(); };
  const onKey = e => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); setZoom((_pdfZoom.get(zid) || 1) * 1.25); }
    else if (e.key === '-') { e.preventDefault(); setZoom((_pdfZoom.get(zid) || 1) / 1.25); }
    else if (e.key === '0') { e.preventDefault(); setZoom(1); }
    else if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); e.stopPropagation(); go(1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); go(-1); }
  };
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('resize', show);
  ov.querySelector('[data-a=prev]').addEventListener('click', () => go(-1));
  ov.querySelector('[data-a=next]').addEventListener('click', () => go(1));
  ov.querySelector('[data-a=close]').addEventListener('click', close);
  ov.querySelector('[data-a=zin]').addEventListener('click', () => setZoom((_pdfZoom.get(zid) || 1) * 1.25));
  ov.querySelector('[data-a=zout]').addEventListener('click', () => setZoom((_pdfZoom.get(zid) || 1) / 1.25));
  let tx = null;
  stage.addEventListener('pointerdown', e => { tx = e.clientX; });
  stage.addEventListener('pointerup', e => {
    if (tx == null) return;
    // vergrößert oder gerade gezoomt/verschoben: nicht versehentlich blättern
    if ((_pdfZoom.get(zid) || 1) > 1 || gesture.wasGesture()) { tx = null; return; }
    const dx = e.clientX - tx; tx = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    else go(e.clientX > window.innerWidth / 2 ? 1 : -1);   // Tippen: rechte Hälfte = weiter
  });
  getPdfDoc(w.config.fileId).then(d => { doc = d; if (!d) close(); else show(); }, close);
}

function setRoster(text) {

const _videoUrls = new Map();

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);

// TAFEL TEILEN — die Tafel steckt komplett im Link (kein Server, keine Anmeldung).
// Bilder, PDFs und Videos sind zu groß dafür und werden weggelassen.
// ══════════════════════════════════════════════════════════════
const SHARE_PREFIX = '#tafel=';
function _b64url(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function _unb64url(str) {
  const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function _pipe(bytes, stream) {
  const w = stream.writable.getWriter();
  w.write(bytes); w.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
// Einstellungen für den Link säubern: nichts Großes (eingebettete Dateien) und keine Laufzeit-Reste
function _slimConfig(cfg) {
  const out = {};
  Object.keys(cfg || {}).forEach(k => {
    if (k.startsWith('_') || k === 'fileId' || k === 'fileData' || k === 'messages' || k === 'entries' || k === 'icalUrl' || k === 'marks' || k === 'absent') return;
    const v = cfg[k];
    if (typeof v === 'string' && (v.length > 4000 || v.startsWith('data:'))) return;
    if (v && typeof v === 'object' && JSON.stringify(v).length > 6000) return;
    out[k] = v;
  });
  return out;
}
async function shareBoardLink() {
  const board = APP.activeBoard();
  if (!board) return;
  const bg = board.background && typeof board.background.value === 'string' && board.background.value.length < 600 ? board.background : null;
  const data = { v: 1, n: board.name, b: bg, w: board.widgets.map(w => ({ t: w.type, x: w.x, y: w.y, w: w.w, h: w.h, c: _slimConfig(w.config) })) };
  const raw = new TextEncoder().encode(JSON.stringify(data));
  let payload;
  try {
    payload = window.CompressionStream ? '1' + _b64url(await _pipe(raw, new CompressionStream('deflate-raw'))) : '0' + _b64url(raw);
  } catch (e) { payload = '0' + _b64url(raw); }
  const url = location.origin + location.pathname + SHARE_PREFIX + payload;
  if (url.length > 30000) { toast('Diese Tafel ist zu umfangreich für einen Link. Nutze stattdessen Export / Import.', 5000); return; }
  const hasNames = board.widgets.some(w => ['names', 'groups', 'duties'].includes(w.type) && w.config && w.config.names);
  const { overlay } = openModal(`
    <div class="modal">
      <button class="modal-close" data-close>✕</button>
      <h2>Tafel „${safeText(board.name)}“ teilen</h2>
      <p style="font-size:14px;color:rgba(255,255,255,0.7);line-height:1.5;margin-bottom:12px">Wer diesen Link öffnet, bekommt eine Kopie der Tafel. Die Tafel steckt vollständig im Link – es wird nichts auf einem Server gespeichert.</p>
      <div class="form-group"><input type="text" id="share-url" readonly value="${safeText(url)}"></div>
      <button class="btn-primary" id="share-copy">Link kopieren</button>
      <p style="font-size:12.5px;color:rgba(255,255,255,0.5);line-height:1.5;margin-top:12px">Bilder, PDFs und Videos sind nicht enthalten.${hasNames ? ' <strong style="color:#fbbf24">Achtung: Die Tafel enthält Namenslisten – teile den Link nur mit Personen, die diese Namen sehen dürfen.</strong>' : ''}</p>
    </div>
  `);
  const inp = overlay.querySelector('#share-url');
  overlay.querySelector('#share-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); toast('✅ Link kopiert'); }
    catch (e) { inp.focus(); inp.select(); toast('Bitte den Link markieren und kopieren'); }
  });
}
// Beim Start: steckt eine geteilte Tafel in der Adresse?
async function checkSharedBoard() {
  if (!location.hash.startsWith(SHARE_PREFIX)) return;
  const payload = location.hash.slice(SHARE_PREFIX.length);
  // Adresse sofort säubern, damit ein Neuladen die Tafel nicht noch einmal anbietet
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
  let data;
  try {
    let bytes = _unb64url(payload.slice(1));
    if (payload[0] === '1') bytes = await _pipe(bytes, new DecompressionStream('deflate-raw'));
    data = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { toast('Der geteilte Link ist unvollständig oder beschädigt.', 5000); return; }
  if (!data || !Array.isArray(data.w)) { toast('Der geteilte Link enthält keine Tafel.', 5000); return; }
  const num = (v, min, max, def) => { v = Number(v); return isFinite(v) ? Math.max(min, Math.min(max, Math.round(v))) : def; };
  const widgets = data.w.slice(0, 60).filter(x => x && REGISTRY[x.t]).map(x => ({
    type: x.t, x: num(x.x, 0, 6000, 20), y: num(x.y, 0, 6000, 20),
    w: num(x.w, 100, 3000, REGISTRY[x.t].w), h: num(x.h, 60, 3000, REGISTRY[x.t].h),
    config: { ...getDefaultConfig(x.t), ..._slimConfig(x.c && typeof x.c === 'object' ? x.c : {}) },
  }));
  const name = String(data.n || 'Geteilte Tafel').slice(0, 40);
  const bg = data.b && data.b.type === 'pattern' && BG_PATTERNS[data.b.value] ? { type: 'pattern', value: data.b.value }
    : data.b && typeof data.b.value === 'string' && data.b.value.length < 600 && !/url\s*\(|expression|javascript:/i.test(data.b.value)
    ? { type: data.b.type === 'gradient' ? 'gradient' : 'color', value: data.b.value } : null;
  const { overlay, close } = openModal(`
    <div class="modal" style="max-width:440px">
      <button class="modal-close" data-close>✕</button>
      <h2>Geteilte Tafel hinzufügen?</h2>
      <p style="font-size:15px;color:rgba(255,255,255,0.8);line-height:1.5;margin-bottom:16px">Jemand hat die Tafel <strong>„${safeText(name)}“</strong> mit ${widgets.length} Elementen mit dir geteilt. Sie wird als neue Tafel hinzugefügt, deine anderen Tafeln bleiben unverändert.</p>
      <div class="btn-row"><button class="btn-secondary" data-close>Nein</button><button class="btn-primary" id="share-add">Hinzufügen</button></div>
    </div>
  `);
  overlay.querySelector('#share-add').addEventListener('click', () => {
    close();
    if (createBoard(name, bg, widgets)) toast('✅ Tafel „' + name + '“ hinzugefügt');
  });
}

// Uhrzeit so, wie man sie sagt: „Viertel nach drei“, „fünf vor halb neun“
function sayTime(h, m) {
  const N = ['zwölf','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf'];
  const H = x => N[x % 12];
  if (m % 5 !== 0) return '';
  if (m === 0) return (h % 12 === 1 ? 'ein' : H(h)) + ' Uhr';
  if (m === 15) return 'Viertel nach ' + H(h);
  if (m === 30) return 'halb ' + H(h + 1);
  if (m === 45) return 'Viertel vor ' + H(h + 1);
  if (m < 25) return ({ 5:'fünf', 10:'zehn', 20:'zwanzig' })[m] + ' nach ' + H(h);
  if (m === 25) return 'fünf vor halb ' + H(h + 1);
  if (m === 35) return 'fünf nach halb ' + H(h + 1);
  return ({ 40:'zwanzig', 50:'zehn', 55:'fünf' })[m] + ' vor ' + H(h + 1);
}

function openTrafficSettings(w) {
  const DEF = { green:['Sprechen', 'Normale Lautstärke'], yellow:['Flüstern', 'Leise mit dem Nachbarn'], red:['Ruhe', 'Niemand spricht'] };
  const L = w.config.labels && typeof w.config.labels === 'object' ? w.config.labels : {};
  const row = (k, name) => {
    const o = L[k] || {};
    return `<div class="form-group"><label>${name}</label><div style="display:flex;gap:8px">
      <input type="text" data-k="${k}" data-f="label" maxlength="30" style="flex:1" value="${safeText(o.label || DEF[k][0])}">
      <input type="text" data-k="${k}" data-f="sub" maxlength="60" style="flex:1.6" value="${safeText(o.sub != null ? o.sub : DEF[k][1])}">
    </div></div>`;
  };
  const { overlay, close } = openModal(`
    <div class="modal">
      <button class="modal-close" data-close>✕</button>
      <h2>Ampel beschriften</h2>
      <p style="font-size:13.5px;color:rgba(255,255,255,0.6);margin:-6px 0 14px;line-height:1.5">Lege fest, was jede Farbe bedeutet – links das Wort, rechts die Erklärung. Praktisch für Bewegungsspiele.</p>
      ${row('green', 'Grün')}${row('yellow', 'Gelb')}${row('red', 'Rot')}
      <div class="btn-row"><button class="btn-secondary" id="tl-def" type="button">Standard</button><button class="btn-primary" id="tl-save">Speichern</button></div>
    </div>
  `);
  const rerender = () => { const shell = document.querySelector('[data-wid="' + w.id + '"]'); if (shell) renderWidgetContent(w, shell.querySelector('.widget-body')); };
  overlay.querySelector('#tl-def').addEventListener('click', () => { delete w.config.labels; APP.save(); rerender(); close(); });
  overlay.querySelector('#tl-save').addEventListener('click', () => {
    const labels = {};
    ['green', 'yellow', 'red'].forEach(k => {
      const label = overlay.querySelector(`input[data-k="${k}"][data-f="label"]`).value.trim() || DEF[k][0];
      const sub = overlay.querySelector(`input[data-k="${k}"][data-f="sub"]`).value.trim();
      if (label !== DEF[k][0] || sub !== DEF[k][1]) labels[k] = { label, sub };
    });
    if (Object.keys(labels).length) w.config.labels = labels; else delete w.config.labels;
    APP.save(); rerender(); close();
  });
}

// Stundenplan-Abo einer Tafel; hat sie keins, das einer anderen Tafel dieser Klasse verwenden (adopt = übernehmen)
function icalFor(board, adopt) {
  if (!board) return null;
  const own = APP.icalCache[board.id];
  if (own && own.url) return own;
  const other = APP.state.boards.map(b => APP.icalCache[b.id]).find(x => x && x.url);
  if (other && adopt) {
    APP.icalCache[board.id] = { url: other.url, entries: other.entries || [], lastFetched: other.lastFetched };
    return APP.icalCache[board.id];
  }
  return other || null;
}

// Heutige Zeilen aus dem Stundenplan: Doppelstunden zusammengefasst, Pausen ergänzt, eigene Punkte nach Uhrzeit einsortiert
function dayplanRowsFromTimetable(w, cache, now) {
  const cfg = w.config || {};
  const subj = cfg.subjects && typeof cfg.subjects === 'object' ? cfg.subjects : {};
  const day0 = new Date(now); day0.setHours(0, 0, 0, 0);
  const day1 = new Date(day0.getTime() + 86400000);
  const mins = d => d.getHours() * 60 + d.getMinutes();
  const raw = [], allDay = [];
  ((cache && cache.entries) || []).forEach(e => {
    const s = new Date(e.start), en = new Date(e.end);
    if (isNaN(s) || isNaN(en) || en <= day0 || s >= day1) return;
    const name = String(e.subject || '').trim();
    // Ganztägiges (Projekttag, Ferien, Ausflug) wird zur Überschrift-Zeile, nicht zur Stunde
    if (mins(s) === 0 || en - s >= 10 * 3600000 || s < day0) { if (name && !e.cancelled && !allDay.includes(name) && allDay.length < 2) allDay.push(name); return; }
    if (name) raw.push({ raw: name, start: mins(s), end: Math.max(mins(s) + 1, en >= day1 ? 1440 : mins(en)), cancelled: !!e.cancelled, changed: !!e.changed });
  });
  raw.sort((a, b) => a.start - b.start || a.raw.localeCompare(b.raw));
  const lessons = [];
  raw.forEach(l => {
    const last = lessons[lessons.length - 1];
    if (last && l.start === last.start) {                       // geteilte Klasse, z. B. Religion / Ethik
      if (!last.raws.includes(l.raw)) last.raws.push(l.raw);
      last.end = Math.max(last.end, l.end); last.cancelled = last.cancelled && l.cancelled; last.changed = last.changed || l.changed;
      return;
    }
    if (last && last.raws.length === 1 && last.raws[0] === l.raw && last.cancelled === l.cancelled && l.start - last.end <= 10) {
      last.end = Math.max(last.end, l.end); last.changed = last.changed || l.changed;   // Doppelstunde
      return;
    }
    lessons.push({ raws: [l.raw], start: l.start, end: l.end, cancelled: l.cancelled, changed: l.changed });
  });
  const nameOf = r => (subj[r] && String(subj[r].name || '').trim()) || subjectName(r);
  const rows = [];
  lessons.forEach((l, i) => {
    const prev = lessons[i - 1];
    if (prev && cfg.breaks !== false && l.start - prev.end >= 15) {
      const lunch = l.start - prev.end >= 40 && prev.end >= 11 * 60 && prev.end <= 14 * 60;
      rows.push({ text: lunch ? 'Mittagessen' : 'Pause', icon: lunch ? 'mittagessen' : 'pause', start: prev.end, end: l.start, kind: 'break' });
    }
    const names = l.raws.map(nameOf);
    const own = subj[l.raws[0]] && subj[l.raws[0]].icon;
    rows.push({ text: names.join(' / '), icon: PICTOS[own] ? own : guessPicto(names[0]), start: l.start, end: l.end,
      cancelled: l.cancelled, changed: l.changed && !l.cancelled, kind: 'lesson' });
  });
  (Array.isArray(cfg.extras) ? cfg.extras : []).forEach(x => {
    if (!x || !String(x.text || '').trim()) return;
    const t = parseHM(x.time);
    rows.push({ text: String(x.text).trim().slice(0, 40), icon: PICTOS[x.icon] ? x.icon : guessPicto(x.text), start: t == null ? -1 : t, end: null, kind: 'extra' });
  });
  rows.sort((a, b) => a.start - b.start);
  rows.forEach((r, i) => {
    if (r.end == null) { const n = rows.slice(i + 1).find(x => x.start > r.start); r.end = n ? n.start : (r.start < 0 ? Infinity : r.start + 30); }
    r.key = (r.start < 0 ? 'x' : r.start) + '|' + r.text;
  });
  return { rows, lessons: lessons.length, names: lessons.map(l => l.raws.map(nameOf).join(' / ')), allDay };
}

// KLASSENDIENSTE — alle Kinder kommen der Reihe nach dran, Wechsel jede Woche / jeden Schultag / von Hand
// ══════════════════════════════════════════════════════════════
function dutyBase(rot, now) {
  const d = new Date(now || Date.now()); d.setHours(12, 0, 0, 0);
  const days = Math.round((d - new Date(2024, 0, 1, 12)) / 86400000);   // 1.1.2024 war ein Montag
  const wk = Math.floor(days / 7), dow = ((days % 7) + 7) % 7;
  return rot === 'day' ? wk * 5 + Math.min(dow, 4) : wk;   // am Wochenende gelten die Dienste vom Freitag
}
const dutyNames = cfg => [...new Set(String(cfg.names || '').split('\n').map(s => s.trim().slice(0, 40)).filter(Boolean))].slice(0, 60);
const dutyList = cfg => (Array.isArray(cfg.duties) ? cfg.duties : []).filter(d => d && String(d.text || '').trim()).slice(0, 16)
  .map(d => ({ text: String(d.text).trim().slice(0, 40), icon: PICTOS[d.icon] ? d.icon : guessDuty(d.text), count: Math.max(1, Math.min(3, Math.round(Number(d.count) || 1))) }));
function dutyRot(cfg) { return cfg.rotate === 'day' || cfg.rotate === 'manual' ? cfg.rotate : 'week'; }
function dutyPeriod(cfg, now) {
  const rot = dutyRot(cfg);
  return (rot === 'manual' ? 0 : dutyBase(rot, now) - (Number(cfg.startPeriod) || 0)) + (Number(cfg.offset) || 0);
}
// Verteilung für einen Zeitraum: Platz j bekommt Name (p·S + j) — so ist jedes Kind reihum dran.
// Wer fehlt, wird durch die nächsten in der Reihe ersetzt, die gerade keinen Dienst haben.
function dutyAssign(cfg, now) {
  const names = dutyNames(cfg), duties = dutyList(cfg), L = names.length;
  const p = dutyPeriod(cfg, now);
  const S = duties.reduce((s, d) => s + d.count, 0);
  const absent = cfg.absent && cfg.absent.p === p && Array.isArray(cfg.absent.names) ? cfg.absent.names : [];
  if (!L) return { p, slots: duties.map(d => ({ ...d, people: [] })), absent };
  const start = (((p * S) % L) + L) % L;
  let j = 0;
  const slots = duties.map(d => ({ ...d, people: Array.from({ length: d.count }, () => ({ name: names[(start + j++) % L] })) }));
  const taken = new Set();
  slots.forEach(s => s.people.forEach(x => { if (!absent.includes(x.name)) taken.add(x.name); }));
  let k = start + S;
  slots.forEach(s => s.people.forEach(x => {
    if (!absent.includes(x.name)) return;
    let sub = '';
    for (let t = 0; t < L && !sub; t++, k++) { const cand = names[k % L]; if (!absent.includes(cand) && !taken.has(cand)) sub = cand; }
    x.missing = x.name; x.name = sub;
    if (sub) taken.add(sub);
  }));
  return { p, slots, absent };
}
function dutyPeriodLabel(cfg, now) {
  const rot = dutyRot(cfg), d = new Date(now || Date.now());
  if (rot === 'manual') return '';
  const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  if (rot === 'day') return d.getDay() === 0 || d.getDay() === 6 ? 'am Freitag' : 'heute';
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  return 'diese Woche · ' + mon.getDate() + '.' + (mon.getMonth() === fri.getMonth() ? '' : (mon.getMonth() + 1) + '.') + '–' + fri.getDate() + '.' + (fri.getMonth() + 1) + '.';
}

      <div class="form-group"><label>Überschrift</label><input type="text" id="du-title" maxlength="40" value="${safeText(cfg.title || '')}" placeholder="Klassendienste"></div>
      <div class="btn-row"><button class="btn-primary" id="du-save">Speichern</button></div>
    </div>
  `);
  const $ = s => overlay.querySelector(s);
  attachRosterButtons(overlay, '#du-names');
  $('#du-rot').value = dutyRot(cfg);
  const draft = () => ({ ...cfg, rotate: $('#du-rot').value, names: $('#du-names').value, duties: rows,
    startPeriod: reset ? dutyBase($('#du-rot').value) : cfg.startPeriod, offset, absent: reset ? null : cfg.absent });
  const preview = () => {
    const res = dutyAssign(draft(), new Date());
    const box = $('#du-preview');
    box.innerHTML = '';
    if (!dutyNames(draft()).length) { box.textContent = 'Noch keine Namen eingetragen.'; return; }
    res.slots.forEach(s => {
      const line = document.createElement('div');
      line.textContent = s.text + ': ' + (s.people.map(x => x.name || '—').join(' & ') || '—');
      box.appendChild(line);
    });
  };
  const markReset = () => { reset = true; offset = 0; preview(); };
  const paint = () => {
    const list = $('#du-rows');
    list.innerHTML = '';
    rows.forEach((r, i) => {
      const row = document.createElement('div'); row.className = 'dp-erow';
      const pic = document.createElement('button'); pic.type = 'button'; pic.className = 'dp-epic'; pic.title = 'Bildsymbol wählen';
      pic.innerHTML = pictoSvg(r.icon || guessDuty(r.text));
      pic.addEventListener('click', () => openPictoPicker(pic, k => { r.icon = k; r.manual = true; paint(); }, DUTY_PICTO_LIST));
      const txt = document.createElement('input'); txt.type = 'text'; txt.maxLength = 40; txt.placeholder = 'z. B. Tafeldienst'; txt.value = r.text || '';
      txt.addEventListener('input', () => { r.text = txt.value; if (!r.manual) { r.icon = guessDuty(r.text); pic.innerHTML = pictoSvg(r.icon); } preview(); });
      const cnt = document.createElement('select'); cnt.className = 'du-count'; cnt.title = 'Wie viele Kinder?';
      [1, 2, 3].forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n + (n === 1 ? ' Kind' : ' Kinder'); cnt.appendChild(o); });
      cnt.value = r.count || 1;
      cnt.addEventListener('change', () => { r.count = Number(cnt.value); markReset(); });
      const mk = (ic, title, fn, dis) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'dp-ebtn'; b.title = title; b.setAttribute('aria-label', title);
        b.innerHTML = icon(ic, 16); b.disabled = !!dis; b.addEventListener('click', fn); return b;
      };
      row.append(pic, txt, cnt,
        mk('chevronUp', 'Nach oben', () => { [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]]; paint(); preview(); }, i === 0),
        mk('x', 'Dienst löschen', () => { rows.splice(i, 1); paint(); markReset(); }));
      list.appendChild(row);
    });
  };
  paint(); preview();
  $('#du-add').addEventListener('click', () => { rows.push({ text: '', icon: 'dienste', count: 1 }); paint(); markReset(); $('#du-rows .dp-erow:last-child input')?.focus(); });
  $('#du-names').addEventListener('input', markReset);
  $('#du-rot').addEventListener('change', markReset);
  $('#du-back').addEventListener('click', () => { offset--; preview(); });
  $('#du-fwd').addEventListener('click', () => { offset++; preview(); });
  $('#du-save').addEventListener('click', () => {
    const d = draft();
    cfg.rotate = d.rotate;
    cfg.names = dutyNames(d).join('\n');
    cfg.duties = dutyList(d).map(({ text, icon, count }) => ({ text, icon, count }));
    cfg.startPeriod = typeof d.startPeriod === 'number' ? d.startPeriod : dutyBase(d.rotate);
    cfg.offset = offset;
    if (reset) delete cfg.absent;
    cfg.title = $('#du-title').value.trim();
    APP.save();
    const shell = document.querySelector('[data-wid="' + w.id + '"]');
    if (shell) renderWidgetContent(w, shell.querySelector('.widget-body'));
    close();
  });
}

const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function seasonOf(d) {
  const md = d.getMonth() * 100 + d.getDate();
  if (md >= 1121 || md < 220) return ['Winter', 'winter'];
  if (md < 521) return ['Frühling', 'fruehling'];
  if (md < 823) return ['Sommer', 'sommer'];
  return ['Herbst', 'herbst'];
}

function patternCss(key) { const p = BG_PATTERNS[key]; return p ? p.css() : DEFAULT_BG.value; }
function boardBgCss(bg) {

function boardThumb(board) {
  const t = el('span', 'tpl-thumb');
  t.style.background = boardBgCss(board.background);
  t.style.backgroundSize = 'cover';
  const ws = board.widgets || [];
  const maxX = ws.reduce((m, w) => Math.max(m, (w.x || 0) + (w.w || 0)), 0), maxY = ws.reduce((m, w) => Math.max(m, (w.y || 0) + (w.h || 0)), 0);
  const k = Math.max(1, maxX / LAYOUT_BASE.w, maxY / LAYOUT_BASE.h);
  const BW = LAYOUT_BASE.w * k, BH = LAYOUT_BASE.h * k;
  ws.forEach(w => {
    const r = el('span');
    r.innerHTML = icon(w.type, 16);
    r.style.cssText = 'left:' + ((w.x || 0) / BW * 100).toFixed(2) + '%;top:' + ((w.y || 0) / BH * 100).toFixed(2) + '%;width:' + ((w.w || 0) / BW * 100).toFixed(2) + '%;height:' + ((w.h || 0) / BH * 100).toFixed(2) + '%';
    if (w.type === 'sticker' || (w.config && w.config.frameless)) r.style.background = 'rgba(251,250,246,0.35)';
    t.appendChild(r);
  });
  return t;
}
function stepBoard(d) {
  const bs = APP.state.boards, i = bs.findIndex(b => b.id === APP.state.activeBoardId);
  const j = Math.max(0, Math.min(bs.length - 1, i + d));
  if (j !== i && bs[j]) switchBoard(bs[j].id);
}
function updatePager() {
  let p = document.getElementById('board-pager');
  const bs = APP.state.boards || [];
  if (!p) {
    p = document.createElement('div');
    p.id = 'board-pager';
    p.setAttribute('data-kb-keep', '');
    p.innerHTML = '<button data-d="-1" aria-label="Vorherige Tafel">' + icon('chevronLeft', 20) + '</button><button class="pg-no" title="Alle Tafeln"></button><button data-d="1" aria-label="Nächste Tafel">' + icon('chevronRight', 20) + '</button>';
    p.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => stepBoard(Number(b.dataset.d))));
    p.querySelector('.pg-no').addEventListener('click', openBoardOverview);
    document.body.appendChild(p);
  }
  const i = bs.findIndex(b => b.id === APP.state.activeBoardId);
  p.hidden = bs.length < 2;
  p.querySelector('.pg-no').textContent = (i + 1) + ' / ' + bs.length;
  p.querySelector('[data-d="-1"]').disabled = i <= 0;
  p.querySelector('[data-d="1"]').disabled = i >= bs.length - 1;
}
document.addEventListener('keydown', e => {
  if (e.key !== 'PageDown' && e.key !== 'PageUp') return;
  if (e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (document.querySelector('.modal-overlay') || document.body.classList.contains('wfull-on')) return;
  e.preventDefault();
  stepBoard(e.key === 'PageDown' ? 1 : -1);
});
function openBoardOverview() {
  const cls = CLASSES.current();
  const { overlay, close } = openModal(`
    <div class="modal start-modal">
      <button class="modal-close" data-close aria-label="Schließen">${icon('x', 20)}</button>
      <h2>Alle Tafeln${cls ? ' · ' + safeText(cls) : ''}</h2>
      <p class="start-sub">Antippen öffnet eine Tafel. Darunter kannst du sie kopieren, umbenennen, verschieben oder löschen.</p>
      <div class="start-grid" id="ov-grid"></div>
    </div>
  `);
  const grid = overlay.querySelector('#ov-grid');
  const paint = () => {
    grid.innerHTML = '';
    APP.state.boards.forEach((b, i) => {
      const card = el('div', 'tpl-card2 ov-card' + (b.id === APP.state.activeBoardId ? ' cur' : ''));
      const open = el('button', 'ov-open');
      const txt = el('span', 'tpl-txt');
      const n = el('span', 'tpl-name2'); n.textContent = b.name;
      const d = el('span', 'tpl-desc2'); d.textContent = (i + 1) + '. Tafel · ' + b.widgets.length + (b.widgets.length === 1 ? ' Element' : ' Elemente');
      txt.append(n, d);
      open.append(boardThumb(b), txt);
      open.addEventListener('click', () => { close(); if (b.id !== APP.state.activeBoardId) switchBoard(b.id); });
      const acts = el('div', 'ov-acts');
      const mk = (ic, title, fn, dis) => {
        const bt = el('button', 'ov-btn');
        bt.innerHTML = icon(ic, 18); bt.title = title; bt.setAttribute('aria-label', title); bt.disabled = !!dis;
        bt.addEventListener('click', e => { e.stopPropagation(); fn(bt); });
        acts.appendChild(bt);
        return bt;
      };
      mk('chevronLeft', 'Nach vorn', () => { const a = APP.state.boards; [a[i - 1], a[i]] = [a[i], a[i - 1]]; APP.save(); renderBoardTabs(); paint(); }, i === 0);
      mk('chevronRight', 'Nach hinten', () => { const a = APP.state.boards; [a[i + 1], a[i]] = [a[i], a[i + 1]]; APP.save(); renderBoardTabs(); paint(); }, i === APP.state.boards.length - 1);
      mk('copy', 'Kopie erstellen', () => {
        const copy = createBoard(b.name.slice(0, 32) + ' (Kopie)', b.background, b.widgets);
        if (!copy) return;
        // Kopie direkt hinter das Original, Zeichnung mitnehmen
        const a = APP.state.boards;
        a.splice(a.indexOf(copy), 1);
        a.splice(a.indexOf(b) + 1, 0, copy);
        if (DRAW.boardDrawings[b.id]) { DRAW.boardDrawings[copy.id] = DRAW.boardDrawings[b.id]; DRAW._persistDrawings(); DRAW.loadBoard(copy.id); }
        APP.save(); renderBoardTabs(); paint();
        toast('✅ Kopie erstellt');
      });
      mk('edit', 'Umbenennen', () => {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.value = b.name; inp.maxLength = 40; inp.className = 'ov-rename';
        n.replaceWith(inp);
        inp.focus(); inp.select();
        let done = false;
        const finish = ok => {
          if (done) return; done = true;
          const v = inp.value.trim();
          if (ok && v) renameBoard(b.id, v);
          paint();
        };
        inp.addEventListener('click', e => e.stopPropagation());
        inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); finish(true); } if (e.key === 'Escape') finish(false); });
        inp.addEventListener('blur', () => finish(true));
      });
      mk('trash', 'Löschen', bt => {
        if (APP.state.boards.length <= 1) { toast('Mindestens eine Tafel muss bleiben'); return; }
        if (!bt.classList.contains('confirm')) {
          bt.classList.add('confirm');
          bt.innerHTML = '<span>Wirklich löschen?</span>';
          setTimeout(() => { if (bt.isConnected) { bt.classList.remove('confirm'); bt.innerHTML = icon('trash', 18); } }, 3500);
          return;
        }
        deleteBoard(b.id);
        paint();
      });
      card.append(open, acts);
      grid.appendChild(card);
    });
  };
  paint();
}

const WIDGET_RENDERERS = {

  // ── Clock ── digital, analog (mit Zeigern), beides oder Übungsuhr zum Uhrzeit-Lernen
  clock(w, body) {
    const style = ['analog', 'both', 'practice'].includes(w.config.style) ? w.config.style : 'digital';
    const showSec = w.config.seconds !== false;
    const fmtTime = d => d.toLocaleTimeString('de-DE', showSec ? undefined : { hour: '2-digit', minute: '2-digit' });
    body.style.flexDirection = 'column';
    if (style === 'digital') {
      const time = el('div','w-clock');
      const date = el('div','w-date');
      // HH:MM:SS = 8 Zeichen, HH:MM = 5 Zeichen
      const clockFs = Math.max(18, Math.min((w.w - 16) / (showSec ? 4.96 : 3.1), w.h * 0.42));

      time.style.whiteSpace = 'nowrap';
      time.style.letterSpacing = '-0.02em';
      date.style.fontSize = Math.max(11, clockFs * 0.28) + 'px';
      body.append(time, date);
      const update = () => {
        const now = new Date();
        time.textContent = fmtTime(now);
        date.textContent = now.toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long' });
      };
      update();
      startInterval(w.id, update, 1000);
      return;
    }
    const practice = style === 'practice';
    const bodyH = w.h - (APP.state.editMode ? 34 : 0);
    const digFs = style === 'both' ? Math.max(14, Math.min(w.w / 5.4, bodyH * 0.13)) : 0;
    const ansFs = practice ? Math.max(13, Math.min(w.w / 13, bodyH * 0.06, 30)) : 0;
    const reserve = (style === 'both' ? digFs * 1.2 + 6 : 0) + (practice ? 44 + 6 + ansFs * 2.6 + 6 : 0);
    const size = Math.round(Math.max(60, Math.min(w.w - 20, bodyH - 16 - reserve, 1100)));

    const face = el('div', 'ck-face');
    face.style.width = face.style.height = size + 'px';
    let s = '<svg viewBox="0 0 100 100" role="img" aria-label="Uhr mit Zeigern"><circle class="ck-dial" cx="50" cy="50" r="48"/>';
    for (let i = 0; i < 60; i++) {
      const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 41 : 44;
      s += '<line class="ck-tick' + (big ? ' h' : '') + '" x1="' + _f(50 + r1 * Math.sin(a)) + '" y1="' + _f(50 - r1 * Math.cos(a))
        + '" x2="' + _f(50 + 46 * Math.sin(a)) + '" y2="' + _f(50 - 46 * Math.cos(a)) + '"/>';

    }

  // ── Timer ── Ring mit Restzeit, Zeit direkt am Element einstellen (−/+, Voreinstellungen)

        + '<circle class="trk" cx="50" cy="50" r="44"/><circle class="prg" cx="50" cy="50" r="44" stroke-dasharray="' + C.toFixed(2) + '"/></svg>';
      prog = ring.querySelector('.prg');
      const center = el('div', 'tm-center');
      // Ziffern so groß, wie der Ring innen breit ist (auch bei 120:00)
      const widest = fmt(Math.max(full, remaining)).replace(/\d/g, '0');
      digits.style.fontSize = Math.floor(size * 0.72 / Math.max(2.4, textWidthEm(widest, 700))) + 'px';
      stateEl.style.fontSize = Math.max(11, Math.round(size * 0.075)) + 'px';
      center.append(digits, stateEl);

    }

    // Bedienung
    const ctrl = el('div', 'tm-ctrl');
    const mkBtn = (cls, html, title, fn) => {

    const minusBtn = mkBtn('', icon('minus', 20), 'Eine Minute weniger', () => adjust(-60));
    const plusBtn  = mkBtn('', icon('plus', 20), 'Eine Minute mehr', () => adjust(60));

    const goBtn    = mkBtn('tm-go', '', 'Start', toggle);
    const presetBtns = [5, 10, 15, 20].map(min => {

    }
    // pausiert = angehalten mit gemerkter Restzeit (auch wenn sie per „+“ über der Startzeit liegt)
    function isPaused() { return !running && typeof w._timerRemaining === 'number' && remaining > 0; }
    function tick() {
      if (!w._timerRunning) {
        // vom Timer-Wächter beendet (oder extern gestoppt)
        running = false;
        remaining = typeof w._timerRemaining === 'number' ? w._timerRemaining : 0;
        stopInterval(w.id);
        updateDisplay();
        return;
      }
      remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      updateDisplay();
    }
    function reset() {
      running = false; stopInterval(w.id);
      resetTimerState(w);
      remaining = full; ringFull = full;
      updateDisplay();
    }
    function toggle() {
      if (remaining <= 0) { reset(); return; }
      running = !running;
      if (running) {
        primeAlarm(); // Ton braucht eine Nutzer-Geste — hier ist sie
        endAt = Date.now() + remaining * 1000;
        w._timerRunning = true; w._timerEndAt = endAt; delete w._timerRemaining;
        startInterval(w.id, tick, 250);
      } else {
        w._timerRunning = false; w._timerRemaining = remaining;
        stopInterval(w.id);
      }
      updateDisplay();
    }
    // Neue Gesamtzeit (Voreinstellung oder −/+ im Zustand „bereit“) — wird gespeichert
    function setFull(sec) {
      sec = Math.max(60, Math.min(180 * 60, sec));
      w.config.minutes = Math.floor(sec / 60);
      w.config.seconds = sec % 60;
      full = sec;
      running = false; stopInterval(w.id);
      resetTimerState(w);
      remaining = full; ringFull = full;
      APP.save();
      updateDisplay();
    }
    function adjust(delta) {
      if (!running && !isPaused() && remaining > 0) { setFull(full + delta); return; }
      // läuft oder pausiert: nur die Restzeit ändern, die eingestellte Zeit bleibt
      remaining = Math.max(0, Math.min(180 * 60, remaining + delta));
      ringFull = Math.max(ringFull, remaining);
      if (running) {
        endAt = Date.now() + remaining * 1000;
        w._timerEndAt = endAt;
      } else {
        w._timerRemaining = remaining;
      }
      updateDisplay();
    }
    if (running) startInterval(w.id, tick, 250); // laufenden Timer nach Re-Render fortsetzen
    updateDisplay();
  },

  // ── Stopwatch ──
  stopwatch(w, body) {
    body.style.flexDirection = 'column';
    const display = el('div','w-timer-display');
    // MM:SS.hh = 8 Zeichen
    const timerFs = Math.max(24, Math.min((w.w - 20) / 4.9, w.h * 0.40));
    display.style.fontSize = timerFs + 'px';
    const row = el('div','w-btn-row');
    const startBtn = el('button','w-action-btn');
    const lapBtn = el('button','w-action-btn'); lapBtn.textContent = '⚑ Runde';
    const resetBtn = el('button','w-action-btn'); resetBtn.textContent = '↺';
    row.append(startBtn, lapBtn, resetBtn);
    const lapsDiv = el('div'); lapsDiv.style.cssText='width:100%;overflow-y:auto;max-height:70px;margin-top:6px;font-size:11px;font-family:monospace;color:var(--w-muted)';
    body.append(display, row, lapsDiv);

    // Laufzeit-Zustand auf dem Widget-Objekt — überlebt Re-Renders (siehe Timer)
    let running = !!w._swRunning;
    let startedAt = w._swStartedAt || null;
    let elapsed = running && startedAt ? Date.now() - startedAt : (w._swElapsed || 0);
    let laps = w._swLaps || [];
    function fmt(ms) {
      const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), cs=Math.floor((ms%1000)/10);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    }
    function renderLaps() {
      lapsDiv.innerHTML = '';
      laps.forEach((l, i) => {
        const d = el('div');
        d.textContent = `Runde ${i+1}: ${fmt(l)}`;
        lapsDiv.prepend(d);
      });
    }
    startBtn.addEventListener('click', () => {
      if (!running) {
        startedAt = Date.now() - elapsed;
        running = true;
        w._swRunning = true; w._swStartedAt = startedAt;
        startInterval(w.id, () => { elapsed = Date.now() - startedAt; display.textContent = fmt(elapsed); }, 50);
      } else {
        running = false; stopInterval(w.id);
        w._swRunning = false; w._swElapsed = elapsed;
      }
      startBtn.textContent = running ? '⏸ Pause' : '▶ Start';
    });
    lapBtn.addEventListener('click', () => {
      if (!running) return;
      laps.push(elapsed);
      w._swLaps = laps;
      const d = el('div');
      d.textContent = `Runde ${laps.length}: ${fmt(laps[laps.length-1])}`;
      lapsDiv.prepend(d);
    });
    resetBtn.addEventListener('click', () => {
      running = false; stopInterval(w.id);
      elapsed = 0; laps = [];
      delete w._swRunning; delete w._swStartedAt; delete w._swElapsed; delete w._swLaps;
      display.textContent = fmt(0);
      lapsDiv.innerHTML = '';
      startBtn.textContent = '▶ Start';
    });
    if (running) startInterval(w.id, () => { elapsed = Date.now() - startedAt; display.textContent = fmt(elapsed); }, 50);
    display.textContent = fmt(elapsed);
    startBtn.textContent = running ? '⏸ Pause' : '▶ Start';
    renderLaps();
  },

    const text = w.config.text || '';

  // ── Traffic Light ──
  traffic(w, body) {
    const MODES = [
      { state:'red',    cls:'r', label:'Ruhe',     sub:'Niemand spricht',        icon:'volOff' },
      { state:'yellow', cls:'y', label:'Flüstern', sub:'Leise mit dem Nachbarn', icon:'volLow' },
      { state:'green',  cls:'g', label:'Sprechen', sub:'Normale Lautstärke',     icon:'volHigh' },
    ];
    // Eigene Beschriftung (z. B. für Bewegungsspiele): config.labels = { red:{label, sub}, … }
    const LBL = w.config.labels && typeof w.config.labels === 'object' ? w.config.labels : {};
    MODES.forEach(m => {
      const o = LBL[m.state];
      if (!o || typeof o !== 'object') return;
      if (o.label) m.label = String(o.label).slice(0, 30);
      if (o.sub != null) m.sub = String(o.sub).slice(0, 60);
    });
    const bodyH = w.h - (APP.state.editMode ? 34 : 0);
    const pick = state => {
      // nochmal antippen = keine Stufe aktiv
      w.config.state = (w.config.state === state) ? '' : state;
      APP.save();
      update();
    };
    let update;

    if (bodyH >= 170 && w.w >= 230) {
      // Liste: Wort + Symbol statt nur Farbe (auch bei Farbsehschwäche eindeutig, aus der letzten Reihe lesbar)
      const rowH = (bodyH - 20 - 16) / 3;
      const wrap = el('div', 'tl');
      const longest = Math.max(...MODES.map(m => textWidthEm(m.label, 700)));
      wrap.style.fontSize = Math.max(15, Math.min(rowH * 0.42, (w.w - 26) / (longest + 3.4), 64)) + 'px';
      const rows = MODES.map(m => {
        const b = el('button', 'tl-row ' + m.cls);
        b.innerHTML = '<span class="tl-dot">' + icon(m.icon, 18) + '</span><span class="tl-txt"><span class="tl-label">'
          + safeText(m.label) + '</span>' + (rowH >= 58 && m.sub ? '<span class="tl-sub">' + safeText(m.sub) + '</span>' : '') + '</span>';
        const svg = b.querySelector('svg'); svg.style.width = svg.style.height = '0.9em';
        b.addEventListener('click', e => { e.stopPropagation(); pick(m.state); });
        wrap.appendChild(b);
        return b;
      });
      update = () => rows.forEach((b, i) => {
        const on = MODES[i].state === w.config.state;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
      body.appendChild(wrap);
    } else {
      // Klein: drei Lichter + Wort darunter
      body.style.flexDirection = 'column'; body.style.gap = '10px';
      const circleSize = Math.max(36, Math.min(w.w * 0.26, bodyH * 0.42)) + 'px';
      const labelEl = el('div');
      labelEl.style.cssText = 'font-size:' + Math.max(13, Math.min(w.w * 0.08, 24)) + 'px;font-weight:700;color:var(--w-ink);min-height:1.2em';
      const circles = MODES.map(m => {
        const cEl = el('div', 'w-traffic-circle');
        cEl.style.width = circleSize; cEl.style.height = circleSize;
        cEl.title = m.label;
        cEl.addEventListener('click', () => pick(m.state));
        return cEl;
      });
      update = () => {
        circles.forEach((cEl, i) => {
          cEl.className = 'w-traffic-circle ' + (MODES[i].state === w.config.state ? 'active-' + MODES[i].cls : 'dim');
        });
        const cur = MODES.find(m => m.state === w.config.state);
        labelEl.textContent = cur ? cur.label : '';
      };
      const circleRow = el('div'); circleRow.style.cssText = 'display:flex;gap:12px;align-items:center';
      circleRow.append(...circles);
      body.append(circleRow, labelEl);
    }
    update();
  },

  // ── Random Name ──
  names(w, body) {
    body.style.flexDirection = 'column';
    const names = (w.config.names || '').split('\n').map(s=>s.trim()).filter(Boolean);
    if (!names.length) {
      body.style.gap = '10px';
      const cta = emptyCta('names', 'Namen eintragen', () => openNamesEdit(w));
      body.appendChild(cta);
      if (getRoster()) {
        // gemerkte Klassenliste mit einem Tipp übernehmen
        cta.style.margin = '0';
        const b = emptyCta('groups', 'Klassenliste verwenden', () => { w.config.names = getRoster(); APP.save(); renderWidgetContent(w, body); });
        b.style.margin = '0';
        body.appendChild(b);
      }
      return;
    }
    let highlighted = w.config.highlighted ?? -1;
    const list = el('ul','w-names-list');
    const btn = el('button','w-action-btn'); btn.style.margin='0 auto 8px'; btn.textContent = '🎲 Zufällig';

    // Scale font: bigger when fewer names, smaller when many
    const itemCount = Math.max(names.length, 1);
    const itemFs = Math.max(13, Math.min(32, (w.h - 60) / itemCount * 0.7));
    const highlightFs = Math.min(itemFs * 1.5, 42);

    function render() {
      list.innerHTML = '';
      names.forEach((n,i) => {
        const li = document.createElement('li');
        li.textContent = n;
        li.style.fontSize = (i === highlighted ? highlightFs : itemFs) + 'px';
        if (i === highlighted) li.classList.add('highlighted');
        list.appendChild(li);
      });
    }
    btn.addEventListener('click', () => {
      if (!names.length) return;
      // Fair ziehen: jeder Name kommt einmal dran, bevor sich jemand wiederholt
      let drawn = Array.isArray(w.config.drawn) ? w.config.drawn.filter(i => i < names.length) : [];
      if (drawn.length >= names.length) drawn = [];
      const pool = names.map((_, i) => i).filter(i => !drawn.includes(i));
      highlighted = pool[Math.floor(Math.random() * pool.length)];
      drawn.push(highlighted);
      w.config.drawn = drawn;
      w.config.highlighted = highlighted;
      APP.save();
      render();
      list.querySelector('.highlighted')?.scrollIntoView({ block: 'nearest' });
      btn.textContent = '🎲 Zufällig (' + (names.length - drawn.length) + ' übrig)';
    });
    body.append(btn, list);
    render();
  },

  // ── Homework ──
  homework(w, body) {
    const div = el('div','w-homework');
    // Altdaten-Migration: frühere Versionen speicherten {text,done}-Objekte statt Strings
    if (Array.isArray(w.config.items) && w.config.items.some(it => typeof it === 'object')) {
      w.config.items = w.config.items.map(it => typeof it === 'string' ? it : (it && (it.text || it.label)) || '').filter(Boolean);
      APP.save();
    }
    const items = w.config.items || [];
    let itemFs = 14;
    {
      const rows = items.length ? items.map(String) : ['Doppelklick zum Bearbeiten'];
      const boxW = w.w - 26, boxH = w.h - 34 - 26;
      for (let fs = 44; fs > 14; fs--) {
        const lines = rows.reduce((s, it) => s + countWrappedLines(it, boxW * 0.97, fs), 0);
        const need = lines * fs * 1.35 + rows.length * (2 * Math.max(3, fs * 0.2) + 1) + Math.max(11, fs * 0.6) * 1.35 + 8;
        if (need <= boxH) { itemFs = fs; break; }
      }
    }
    const h3 = document.createElement('h3');
    h3.style.fontSize = Math.max(11, itemFs * 0.6) + 'px';
    h3.textContent = w.config.subject || 'Hausaufgaben';
    const ul = document.createElement('ul');
    if (items.length === 0) {
      h3.style.fontSize = '14px';
      div.style.cssText = 'display:flex;flex-direction:column;height:100%;box-sizing:border-box';
      div.append(h3, emptyCta('homework', 'Hausaufgaben eintragen', () => openHomeworkEdit(w)));
      body.appendChild(div);
      return;
    }
    items.forEach(item => {
      const li = document.createElement('li');
      li.style.fontSize = itemFs + 'px';
      li.style.paddingTop = Math.max(3, itemFs * 0.2) + 'px';
      li.style.paddingBottom = Math.max(3, itemFs * 0.2) + 'px';
      li.textContent = item;
      ul.appendChild(li);
    });
    div.append(h3, ul);
    if (APP.state.editMode) div.addEventListener('dblclick', () => openHomeworkEdit(w));
    body.appendChild(div);
  },
