<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Scolavis – Das digitale Klassenzimmer</title>
<meta name="description" content="Scolavis ist das smarte digitale Klassenzimmer für Lehrerinnen und Lehrer. Widgets, KI-Assistent, Live-Umfragen, Sprachsteuerung und mehr.">
<meta name="theme-color" content="#050136">
<link rel="preload" href="fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
<meta property="og:title" content="Scolavis">
<meta property="og:description" content="Das smarte digitale Klassenzimmer für Lehrerinnen und Lehrer">
<meta property="og:type" content="website">
<meta property="og:image" content="https://scolavis.de/og-image.png">
<meta property="og:url" content="https://scolavis.de/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scolavis">
<style>
:root {
  --brand: #6D4BFF;
  --brand-dark: #5234E0;
  --toolbar-h: 56px;
  --glass: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
  --radius: 16px;
  --radius-sm: 10px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
body { background:#1e293b; color:#fff; touch-action:manipulation; }
/* Inputs/Textareas müssen immer tippbar sein – touch-action:none auf body überschreiben */
input, textarea, select, [contenteditable] { touch-action:auto; user-select:text; -webkit-user-select:text; }
.modal, .modal * { touch-action:auto; }
.modal-overlay { touch-action:auto; -webkit-overflow-scrolling:touch; }
.tab-input { touch-action:auto; user-select:text; -webkit-user-select:text; }
#ki-panel, #ki-panel * { touch-action:auto; }
#ki-history { -webkit-overflow-scrolling:touch; }
#class-dropdown { touch-action:auto; }
#widget-menu { touch-action:auto; -webkit-overflow-scrolling:touch; }

/* ── Klassen-Wechsler ── */
#class-switcher {
  position:relative; flex-shrink:0;
}
#class-btn {
  display:flex; align-items:center; gap:5px;
  padding:5px 10px; border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
  color:#fff; cursor:pointer; font-size:13px; font-weight:600;
  transition:all .15s; white-space:nowrap; max-width:130px;
}
#class-btn:hover { background:rgba(255,255,255,0.18); }
#class-btn .class-name { overflow:hidden; text-overflow:ellipsis; max-width:90px; }
/* Hängt direkt an <body> (siehe CLASSES.initUI): innerhalb der horizontal
   scrollbaren Toolbar würde das Menü abgeschnitten und wäre unsichtbar */
#class-dropdown {
  position:fixed; top:64px; left:8px;
  min-width:220px; max-width:calc(100vw - 16px); background:rgba(15,15,25,0.97);
  backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.12);
  border-radius:12px; box-shadow:0 16px 48px rgba(0,0,0,0.6);
  z-index:100000; display:none; overflow-x:hidden; overflow-y:auto;
}
#class-dropdown.open { display:block; }
.class-dd-header {
  padding:10px 12px 6px; font-size:10.5px;
  color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:.8px;
}
.class-dd-item {
  display:flex; align-items:center; gap:8px;
  padding:9px 12px; cursor:pointer; transition:background .1s;
  font-size:13px;
}
.class-dd-item:hover { background:rgba(255,255,255,0.07); }
.class-dd-item.active { background:rgba(109,75,255,0.2); color:#7FE3DA; }
.class-dd-item .class-dd-name { flex:1; font-weight:500; }
.class-dd-item .class-dd-count { font-size:10.5px; color:rgba(255,255,255,0.3); }
.class-dd-item .class-dd-del {
  opacity:0; font-size:11px; padding:2px 5px; border-radius:4px;
  border:none; background:transparent; color:rgba(255,255,255,0.4); cursor:pointer;
  transition:opacity .15s;
}
.class-dd-item:hover .class-dd-del { opacity:1; }
/* Touch-Geräte kennen kein Hover — Löschen-Button dort immer zeigen */
@media (hover:none) { .class-dd-item .class-dd-del { opacity:0.7; } }
.class-dd-item .class-dd-del:hover { background:rgba(239,68,68,0.2); color:#fca5a5; }
.class-dd-divider { height:1px; background:rgba(255,255,255,0.07); margin:4px 0; }
.class-dd-add {
  display:flex; align-items:center; gap:8px;
  padding:8px 12px 10px; cursor:pointer;
  font-size:12.5px; color:rgba(255,255,255,0.45);
  transition:color .15s;
}
.class-dd-add:hover { color:#fff; }
.class-dd-add-input {
  display:none; padding:6px 12px 10px; gap:6px; flex-direction:column;
}
.class-dd-add-input.visible { display:flex; }
.class-dd-add-input input {
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  border-radius:7px; color:#fff; font-size:12.5px; padding:7px 10px;
  touch-action:auto; outline:none;
}
.class-dd-add-input input:focus { border-color:rgba(109,75,255,0.6); }
.class-dd-add-input button {
  padding:6px 12px; border-radius:7px; border:none; cursor:pointer;
  background:var(--brand); color:#fff; font-size:12px; font-weight:600;
}

/* ── Toolbar ── */
#toolbar {
  position:fixed; top:0; left:0; right:0; height:var(--toolbar-h);
  background:rgba(0,0,0,0.4); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--glass-border);
  display:flex; align-items:center; gap:8px; padding:0 12px;
  z-index:99999 !important; user-select:none;
  pointer-events:all !important;
  overflow-x:auto; scrollbar-width:none;
}
#toolbar::-webkit-scrollbar { display:none; }
#logo { display:flex; align-items:center; gap:6px; margin-right:8px; flex-shrink:0; }
#logo span:first-child { font-size:22px; }
#logo-text { font-weight:700; font-size:15px; letter-spacing:-0.3px; }
#board-tabs { display:flex; align-items:center; gap:4px; flex:1; min-width:150px; overflow-x:auto; scrollbar-width:none; }
#board-tabs::-webkit-scrollbar { display:none; }
.tab-btn {
  flex-shrink:0; padding:6px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:500;
  border:none; cursor:pointer; transition:all .15s; white-space:nowrap;
  background:transparent; color:rgba(255,255,255,0.5);
}
.tab-btn:hover { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.85); }
.tab-btn.active { background:rgba(255,255,255,0.18); color:#fff; box-shadow:0 1px 4px rgba(0,0,0,0.3); }
.tab-btn { display:flex; align-items:center; gap:5px; }
.tab-name-span { pointer-events:none; }
.tab-action {
  font-size:11px; opacity:0; border-radius:3px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .15s, background .15s; line-height:1;
  padding:1px 2px; cursor:pointer;
}
.tab-btn:hover .tab-action { opacity:0.6; }
.tab-btn:hover .tab-action:hover { opacity:1; background:rgba(255,255,255,0.2); }
/* Touch: Umbenennen/Löschen nur am aktiven Tab und dort sichtbar — unsichtbare,
   aber antippbare Buttons an inaktiven Tabs würden versehentlich auslösen */
@media (hover:none) {
  .tab-btn.active .tab-action { opacity:0.7; }
  .tab-btn:not(.active) .tab-action { display:none; }
}
.tab-edit { font-size:10px; }
.tab-close { font-size:11px; margin-left:1px; }
.tab-input { background:transparent; border:none; outline:none; color:#fff; font:inherit; width:100px; }
#add-board-btn {
  flex-shrink:0; width:28px; height:28px; border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.1); border:none; color:rgba(255,255,255,0.6);
  cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
#add-board-btn:hover { background:rgba(255,255,255,0.2); color:#fff; }
.toolbar-sep { width:1px; height:28px; background:rgba(255,255,255,0.1); flex-shrink:0; }
.tb-btn {
  flex-shrink:0; border:none; cursor:pointer; border-radius:var(--radius-sm);
  padding:6px 10px; font-size:13px; font-weight:500; transition:all .15s;
  display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.tb-btn:active { transform:scale(0.95); }
#btn-ai-board { background:linear-gradient(135deg,#0E9F97,#6D4BFF); color:#fff; }
#btn-ai-board:hover { background:linear-gradient(135deg,#6D4BFF,#5234E0); }
#btn-add-widget { background:var(--brand); color:#fff; }
#btn-add-widget:hover { background:var(--brand-dark); }

/* ── KI-Board Generator Modal ── */
.ai-board-modal { max-width:480px; }
.ai-board-modal h2 { font-size:18px; margin-bottom:4px; }
.ai-board-modal .subtitle { font-size:12.5px; color:rgba(255,255,255,0.45); margin-bottom:16px; }
.ai-board-row { display:flex; gap:10px; }
.ai-board-row .form-group { flex:1; }
.ai-board-gen-btn {
  width:100%; padding:12px; border-radius:10px; border:none;
  background:linear-gradient(135deg,#0E9F97,#6D4BFF); color:#fff;
  font-size:14px; font-weight:700; cursor:pointer; margin-top:8px;
  transition:all .2s; letter-spacing:.3px;
}
.ai-board-gen-btn:hover { background:linear-gradient(135deg,#6D4BFF,#5234E0); transform:translateY(-1px); }
.ai-board-gen-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.ai-board-progress {
  margin-top:14px; padding:12px; border-radius:10px;
  background:rgba(109,75,255,0.1); border:1px solid rgba(109,75,255,0.2);
  font-size:12.5px; color:rgba(255,255,255,0.6); text-align:center; display:none;
}
.ai-board-progress.visible { display:block; }
.tb-icon-btn {
  flex-shrink:0; width:34px; height:34px; border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.08); border:none; color:rgba(255,255,255,0.7);
  cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;
  transition:all .15s;
}
.tb-icon-btn:hover { background:rgba(255,255,255,0.18); color:#fff; }
.tb-icon-btn.active { background:rgba(253,224,71,0.25); color:#fde047; }
#edit-mode-btn { padding:6px 10px; width:auto; font-size:12px; font-weight:600; letter-spacing:.3px; }

/* ── Board Canvas ── */
/* Das Board ist auf allen Geräten scrollbar: Tafeln werden oft am Laptop vorbereitet
   und am Smartboard mit anderer Auflösung gezeigt — Widgets außerhalb des sichtbaren
   Bereichs müssen erreichbar bleiben. Der Hintergrund liegt direkt auf dem
   Scroll-Container und bleibt deshalb beim Scrollen stehen. */
#board {
  position:fixed; top:var(--toolbar-h); left:0; right:0; bottom:0;
  overflow:auto; background:linear-gradient(135deg,#667eea,#764ba2);
  touch-action:pan-x pan-y pinch-zoom; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.3) transparent;
}
@media (pointer: coarse) {
  #board { scrollbar-width:none; }
  #board::-webkit-scrollbar { width:0; height:0; }
}
#board-bg { display:none; } /* Alt-Element: Hintergrund liegt jetzt auf #board selbst */
#widgets-layer { position:relative; min-width:100%; min-height:100%; }

/* ── Widget Shell ── */
.widget {
  position:absolute; border-radius:var(--radius);
  background:var(--glass); backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow);
  overflow:hidden; user-select:none;
  transition:box-shadow .15s;
  min-width:120px; min-height:80px;
}
.widget.selected { border-color:rgba(109,75,255,0.8); box-shadow:0 0 0 2px rgba(109,75,255,0.4), var(--shadow); }
.widget-header {
  position:absolute; top:0; left:0; right:0; height:32px;
  background:rgba(0,0,0,0.2);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 8px; cursor:grab; z-index:2;
  opacity:0; transition:opacity .15s;
}
.widget:hover .widget-header, .widget.selected .widget-header { opacity:1; }
.widget-header:active { cursor:grabbing; }
.widget-title { font-size:11px; color:rgba(255,255,255,0.6); font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
.widget-actions { display:flex; gap:4px; }
.w-btn {
  width:22px; height:22px; border-radius:6px; border:none; cursor:pointer;
  font-size:12px; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7);
  transition:all .1s;
}
.w-btn:hover { background:rgba(255,255,255,0.25); color:#fff; }
.w-btn.del:hover { background:rgba(239,68,68,0.4); color:#fca5a5; }
.widget-body {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.widget-body.with-header { top:32px; }
.resize-handle {
  position:absolute; right:0; bottom:0; width:20px; height:20px;
  cursor:se-resize; opacity:0; transition:opacity .15s; z-index:3;
}
.resize-handle::after {
  content:''; position:absolute; right:4px; bottom:4px;
  width:10px; height:10px;
  border-right:2px solid rgba(255,255,255,0.5);
  border-bottom:2px solid rgba(255,255,255,0.5);
  border-radius:0 0 3px 0;
}
.widget:hover .resize-handle { opacity:1; }

/* ── Modal ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
  z-index:2000; display:flex; align-items:center; justify-content:center;
  animation:fadeIn .15s;
}
.modal {
  background:#1e293b; border:1px solid var(--glass-border); border-radius:20px;
  box-shadow:0 24px 64px rgba(0,0,0,0.5); padding:24px;
  width:min(520px,95vw); max-height:85vh; overflow-y:auto;
  animation:slideUp .2s;
}
.modal-lg { width:min(720px,95vw); }
.modal h2 { font-size:18px; font-weight:700; margin-bottom:16px; }
.modal-close {
  float:right; background:none; border:none; color:rgba(255,255,255,0.4);
  font-size:20px; cursor:pointer; padding:0 4px; line-height:1;
}
.modal-close:hover { color:#fff; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }

/* ── Form elements ── */
input[type=text], input[type=url], input[type=number], textarea, select {
  width:100%; padding:10px 12px; border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
  color:#fff; font:inherit; font-size:14px; outline:none; transition:border .15s;
}
input:focus, textarea:focus, select:focus { border-color:var(--brand); }
select option { background:#1e293b; }
label { display:block; font-size:12px; color:rgba(255,255,255,0.5); margin-bottom:5px; font-weight:600; letter-spacing:.3px; }
.form-group { margin-bottom:14px; }
.btn-primary {
  padding:10px 20px; background:var(--brand); color:#fff; border:none;
  border-radius:var(--radius-sm); cursor:pointer; font:inherit; font-size:14px;
  font-weight:600; transition:all .15s; width:100%;
}
.btn-primary:hover { background:var(--brand-dark); }
.btn-secondary {
  padding:8px 16px; background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.12);
  border-radius:var(--radius-sm); cursor:pointer; font:inherit; font-size:13px; transition:all .15s;
}
.btn-secondary:hover { background:rgba(255,255,255,0.15); }
.btn-row { display:flex; gap:8px; margin-top:16px; }
.btn-row .btn-primary { flex:1; }

/* ── Widget Menu ── */
#widget-menu {
  position:fixed; background:#0f172a; border:1px solid var(--glass-border);
  border-radius:18px; box-shadow:0 20px 56px rgba(0,0,0,0.6);
  padding:14px 12px; z-index:1500; width:288px;
  max-height:calc(100vh - 80px); overflow-y:auto; scrollbar-width:none;
}
#widget-menu::-webkit-scrollbar { display:none; }
.wm-cat {
  font-size:9.5px; color:rgba(255,255,255,0.32); font-weight:700;
  letter-spacing:1px; text-transform:uppercase; padding:8px 6px 5px;
}
.wm-cat:first-child { padding-top:2px; }
.wm-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:4px; }
.wm-item {
  display:flex; align-items:center; gap:7px; padding:8px 10px;
  border-radius:10px; background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.07);
  cursor:pointer; color:#fff; font:inherit; font-size:12.5px; font-weight:500;
  transition:all .12s; text-align:left;
  overflow:hidden; min-width:0; width:100%;
}
.wm-item:hover { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.15); }
.wm-item:active { transform:scale(0.97); }
.wm-item .wm-emoji { font-size:15px; flex-shrink:0; line-height:1; }
.wm-item .wm-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }

/* ── Templates grid ── */
.template-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tpl-card {
  border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,0.1);
  padding:14px; cursor:pointer; transition:all .15s; background:rgba(255,255,255,0.04);
}
.tpl-card:hover { background:rgba(255,255,255,0.1); border-color:var(--brand); transform:translateY(-1px); }
.tpl-emoji { font-size:28px; margin-bottom:6px; }
.tpl-name { font-size:13px; font-weight:700; }
.tpl-desc { font-size:11px; color:rgba(255,255,255,0.45); margin-top:3px; }

/* ── BG Picker ── */
.bg-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.bg-swatch { height:44px; border-radius:8px; border:2px solid transparent; cursor:pointer; transition:all .15s; }
.bg-swatch:hover { transform:scale(1.05); }
.bg-swatch.sel { border-color:#fff; }

/* ── iCal modal ── */
.ical-info { font-size:12px; color:rgba(255,255,255,0.4); line-height:1.6; margin-top:8px; }

/* ── Floating KI-Chat ── */
#ki-fab {
  position:fixed; bottom:24px; left:24px; z-index:2000;
  width:48px; height:48px; border-radius:14px;
  background:rgba(15,15,30,0.85);
  backdrop-filter:blur(12px);
  border:1px solid rgba(109,75,255,0.3);
  cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; padding:0;
}
#ki-fab:hover { transform:translateY(-2px); border-color:rgba(109,75,255,0.6); box-shadow:0 8px 28px rgba(109,75,255,0.3); background:rgba(109,75,255,0.15); }
#ki-fab:active { transform:scale(0.95); }
#ki-panel {
  position:fixed; bottom:80px; left:20px; z-index:2000;
  width:320px; height:420px; min-width:260px; min-height:250px; max-width:90vw; max-height:80vh;
  background:rgba(15,15,25,0.95); backdrop-filter:blur(20px);
  border:1px solid rgba(109,75,255,0.3); border-radius:16px;
  box-shadow:0 16px 48px rgba(0,0,0,0.6);
  display:flex; flex-direction:column; overflow:hidden;
  transform:scale(0.9) translateY(10px); opacity:0;
  transition:opacity .2s, transform .2s; pointer-events:none;
}
#ki-panel .ki-resize {
  position:absolute; top:0; right:0; width:18px; height:18px; cursor:ne-resize; z-index:5;
}
#ki-panel .ki-resize::after {
  content:''; position:absolute; top:4px; right:4px;
  width:8px; height:8px; border-top:2px solid rgba(255,255,255,0.3); border-right:2px solid rgba(255,255,255,0.3);
}
#ki-panel.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }
#ki-panel-header {
  padding:12px 14px; background:linear-gradient(135deg,rgba(14,159,151,0.3),rgba(109,75,255,0.2));
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
#ki-panel-header span:first-child { font-size:18px; }
#ki-panel-header b { font-size:13px; flex:1; }
#ki-panel-header small { font-size:10px; color:rgba(255,255,255,0.35); }
#ki-history {
  flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent;
}
.ki-bubble { padding:8px 11px; border-radius:10px; font-size:12.5px; line-height:1.45; max-width:90%; word-break:break-word; }
.ki-bubble.user { background:rgba(109,75,255,0.3); align-self:flex-end; }
.ki-bubble.ai { background:rgba(255,255,255,0.07); align-self:flex-start; }
.ki-bubble.thinking { color:rgba(255,255,255,0.4); font-style:italic; }
#ki-input-row { display:flex; gap:6px; padding:10px; border-top:1px solid rgba(255,255,255,0.07); flex-shrink:0; }
#ki-textarea {
  flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:8px; color:#fff; font-size:12px; padding:7px 10px;
  resize:none; height:38px; font-family:inherit; touch-action:auto;
}
#ki-textarea:focus { outline:none; border-color:rgba(109,75,255,0.5); }
#ki-send { background:var(--brand); border:none; border-radius:8px; color:#fff; 
  width:36px; height:38px; cursor:pointer; font-size:14px; flex-shrink:0; transition:background .15s; }
#ki-send:hover { background:var(--brand-dark); }
/* ── Zeichnen-Modus ── */
#draw-toolbar {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  display:none; align-items:center; gap:6px;
  background:rgba(10,10,20,0.92); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.12); border-radius:40px;
  padding:8px 14px; z-index:1800;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
#draw-toolbar.visible { display:flex; }
.draw-tool-btn {
  width:36px; height:36px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:16px; background:rgba(255,255,255,0.08); color:#fff;
  transition:all .15s; flex-shrink:0;
}
.draw-tool-btn:hover { background:rgba(255,255,255,0.18); }
.draw-tool-btn.active { border-color:var(--brand); background:rgba(109,75,255,0.25); }
.draw-color-btn {
  width:28px; height:28px; border-radius:50%; border:3px solid transparent;
  cursor:pointer; flex-shrink:0; transition:transform .15s;
}
.draw-color-btn:hover, .draw-color-btn.active { transform:scale(1.25); border-color:#fff; }
.draw-sep { width:1px; height:28px; background:rgba(255,255,255,0.12); margin:0 2px; }
#draw-size-slider {
  width:70px; accent-color:var(--brand); cursor:pointer;
}
/* Liegt bei (0,0) und wird per transform mit dem Board mitgescrollt (DRAW._syncScroll) */
#draw-canvas {
  position:absolute; top:0; left:0; z-index:500; touch-action:none;
  display:none; cursor:crosshair; max-width:none; transform-origin:0 0;
}
/* Behaltene Zeichnung bleibt außerhalb des Zeichenmodus sichtbar, blockiert aber keine Klicks */
#draw-canvas.keep-visible { display:block; pointer-events:none; cursor:default; }
body.draw-mode #draw-canvas { display:block; pointer-events:auto; cursor:crosshair; }
body.draw-mode .widget { pointer-events:none; }
body.draw-mode #toolbar { z-index:1900 !important; } /* !important nötig — Basisregel setzt 99999 !important */

/* ── Toast ── */
#toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:rgba(30,41,59,0.95); border:1px solid rgba(255,255,255,0.15);
  color:#fff; padding:10px 20px; border-radius:12px; font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:100001; transition:transform .3s ease, opacity .2s ease;
  pointer-events:none; opacity:0; max-width:calc(100vw - 24px); text-align:center;
}
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

/* ── Widget content styles ── */
.w-clock { font-size:clamp(2rem,5vw,4rem); font-weight:700; font-variant-numeric:tabular-nums; width:100%; text-align:center; }
.w-date { font-size:14px; color:rgba(255,255,255,0.55); margin-top:4px; }
.w-timer-display { font-size:clamp(2rem,4vw,3.5rem); font-weight:700; font-variant-numeric:tabular-nums; }
.w-timer-display.urgent { color:#f87171; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.w-btn-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
.w-action-btn {
  padding:6px 14px; border-radius:10px; border:none; cursor:pointer;
  background:rgba(255,255,255,0.15); color:#fff; font:inherit; font-size:13px;
  font-weight:600; transition:all .12s; min-width:44px; min-height:36px;
}
.w-action-btn:hover { background:rgba(255,255,255,0.28); }
.w-action-btn:active { transform:scale(0.95); }
.w-traffic-circle {
  width:min(80px,30%); aspect-ratio:1; border-radius:50%;
  border:4px solid rgba(0,0,0,0.3); cursor:pointer; transition:all .2s;
  box-shadow:inset 0 0 12px rgba(0,0,0,0.3);
}
.w-traffic-circle.active-r { background:#ef4444; box-shadow:0 0 20px rgba(239,68,68,0.6),inset 0 0 12px rgba(0,0,0,0.3); }
.w-traffic-circle.active-y { background:#eab308; box-shadow:0 0 20px rgba(234,179,8,0.6),inset 0 0 12px rgba(0,0,0,0.3); }
.w-traffic-circle.active-g { background:#22c55e; box-shadow:0 0 20px rgba(34,197,94,0.6),inset 0 0 12px rgba(0,0,0,0.3); }
.w-traffic-circle.dim { background:rgba(255,255,255,0.08); }
.w-text-display { line-height:1.6; padding:14px; overflow:auto; width:100%; height:100%; white-space:pre-wrap; word-break:break-word; }
.w-names-list { list-style:none; width:100%; padding:6px; overflow-y:auto; max-height:100%; }
.w-names-list li { padding:3px 8px; border-radius:6px; transition:background .1s; line-height:1.4; }
.w-names-list li.highlighted { background:rgba(109,75,255,0.4); font-weight:700; }
.w-homework { padding:12px; overflow-y:auto; width:100%; }
.w-homework h3 { color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.w-homework ul { list-style:none; }
.w-homework li { padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.07); }
.w-goal-text { font-weight:700; text-align:center; padding:14px; line-height:1.4; width:100%; }
.w-qr-container { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px; height:100%; }
.w-qr-container canvas, .w-qr-container img { border-radius:8px; max-width:100%; max-height:calc(100% - 40px); }
.w-qr-label { font-size:11px; color:rgba(255,255,255,0.5); text-align:center; word-break:break-all; }
.timetable-inner { width:100%; padding:10px; overflow-y:auto; max-height:100%; }
.tt-now { border-radius:10px; padding:10px 12px; background:rgba(109,75,255,0.2); border:1px solid rgba(109,75,255,0.4); margin-bottom:8px; }
.tt-label { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:rgba(255,255,255,0.4); font-weight:700; }
.tt-subject { font-size:20px; font-weight:700; margin:2px 0; }
.tt-meta { font-size:12px; color:rgba(255,255,255,0.5); }
.tt-cancelled { text-decoration:line-through; color:rgba(255,100,100,0.7); }
.tt-changed { color:#fbbf24; }
.tt-next-list { list-style:none; }
.tt-next-list li { display:flex; gap:10px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; align-items:center; }
.tt-time { color:rgba(255,255,255,0.4); font-size:11px; flex-shrink:0; width:80px; }
.tt-no-data { font-size:13px; color:rgba(255,255,255,0.3); text-align:center; padding:20px; }
.w-image-inner { width:100%; height:100%; object-fit:contain; }
.w-youtube-iframe { width:100%; height:100%; border:none; }
.w-dice { font-size:clamp(3rem,8vw,6rem); cursor:pointer; transition:transform .1s; }
.w-dice:active { transform:scale(0.85); }
.w-randnum { font-size:clamp(2.5rem,6vw,5rem); font-weight:700; cursor:pointer; }
.w-randnum:active { transform:scale(0.9); }
.groups-inner { padding:8px; overflow-y:auto; width:100%; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; }
.group-card { border-radius:10px; padding:8px 12px; background:rgba(255,255,255,0.08); flex:1 1 calc(50% - 4px); min-width:100px; }
.group-card h4 { font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:4px; }
.group-card ul { list-style:none; font-size:13px; }
.group-card ul li { padding:2px 0; }
.agenda-inner { padding:10px; overflow-y:auto; width:100%; }
.agenda-item { display:flex; gap:10px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.07); align-items:flex-start; }
.agenda-time { font-size:11px; color:rgba(255,255,255,0.4); flex-shrink:0; padding-top:2px; width:55px; }
.agenda-text { font-size:13px; }
.checklist-inner { padding:10px; overflow-y:auto; width:100%; }
.checklist-item { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.06); cursor:pointer; }
.checklist-item input[type=checkbox] { width:16px; height:16px; accent-color:var(--brand); flex-shrink:0; cursor:pointer; }
.checklist-item span { font-size:13px; flex:1; }
.checklist-item.done span { text-decoration:line-through; color:rgba(255,255,255,0.3); }
.phases-inner { display:flex; flex-direction:column; gap:6px; padding:10px; overflow-y:auto; width:100%; }
.phase-item { border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:all .15s; border:1px solid transparent; }
.phase-item.active { border-color:rgba(255,255,255,0.3); }
.phase-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.phase-name { font-size:14px; font-weight:600; }
.phase-dur { font-size:11px; color:rgba(255,255,255,0.4); margin-left:auto; }
.status-inner { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:8px; }
.status-emoji { font-size:clamp(2.5rem,8vw,5rem); cursor:pointer; transition:transform .1s; }
.status-emoji:active { transform:scale(0.85); }
.status-label { font-size:14px; font-weight:600; color:rgba(255,255,255,0.7); }

/* Fullscreen hide toolbar */
body.fullscreen #toolbar { display:none; }
body.fullscreen #board { top:0 !important; bottom:0 !important; } /* kein toter Streifen bei Bottom-Toolbar */
body.fullscreen #tb-pull-tab { display:none !important; }
/* Vollbild verlassen ohne Tastatur (Touch-Smartboards, iPads) */
#fs-exit {
  display:none; position:fixed; top:10px; right:10px; z-index:9000;
  width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.45); color:#fff; font-size:16px; cursor:pointer;
  opacity:0.35; transition:opacity .2s; backdrop-filter:blur(8px);
}
#fs-exit:hover, #fs-exit:focus-visible { opacity:1; }
body.fullscreen #fs-exit { display:block; }
.widget.alarm { animation:alarmFlash .5s ease 6; }
@keyframes alarmFlash { 0%,100% { box-shadow:var(--shadow); } 50% { box-shadow:0 0 0 6px rgba(248,113,113,0.85), var(--shadow); } }
body.fullscreen #board { top:0; }

/* Scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }

/* ── Auth ── */
#auth-area { display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:4px; }
#auth-login-btn {
  flex-shrink:0; border:none; cursor:pointer; border-radius:var(--radius-sm);
  padding:6px 12px; font-size:12px; font-weight:600;
  background:rgba(109,75,255,0.2); color:#7FE3DA;
  border:1px solid rgba(109,75,255,0.3); transition:all .15s; white-space:nowrap;
}
#auth-login-btn:hover { background:rgba(109,75,255,0.4); color:#fff; }
#user-badge {
  display:none; align-items:center; gap:7px;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
  border-radius:var(--radius-sm); padding:5px 10px;
}
#user-badge.visible { display:flex; }
#user-avatar {
  width:26px; height:26px; border-radius:50%;
  background:linear-gradient(135deg,var(--brand),#2BBCB3);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; flex-shrink:0;
}
#user-email { font-size:12px; color:rgba(255,255,255,0.7); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#sync-dot { width:7px; height:7px; border-radius:50%; background:#22c55e; flex-shrink:0; transition:background .3s; }
#sync-dot.syncing { background:#f59e0b; animation:pulse 1s infinite; }
#auth-logout-btn {
  border:none; cursor:pointer; background:transparent; color:rgba(255,255,255,0.35);
  font-size:15px; padding:2px 0 2px 4px; line-height:1; transition:color .15s;
}
#auth-logout-btn:hover { color:#f87171; }
/* Auth Modal */
.auth-modal { max-width:360px; }
.auth-tabs { display:flex; margin-bottom:20px; border-radius:10px; overflow:hidden; background:rgba(255,255,255,0.05); }
.auth-tab { flex:1; padding:9px; border:none; background:transparent; color:rgba(255,255,255,0.45); cursor:pointer; font-size:13px; font-weight:600; transition:all .15s; }
.auth-tab.active { background:rgba(109,75,255,0.35); color:#fff; }
.auth-field { margin-bottom:14px; }
.auth-field label { display:block; font-size:11px; color:rgba(255,255,255,0.45); margin-bottom:6px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
.auth-field input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.06); color:#fff; font-size:14px; outline:none; transition:border-color .15s; touch-action:auto; user-select:text; }
.auth-field input:focus { border-color:rgba(109,75,255,0.6); background:rgba(109,75,255,0.08); }
.auth-submit { width:100%; padding:11px; border-radius:10px; border:none; background:var(--brand); color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:all .15s; margin-top:4px; }
.auth-submit:hover { background:var(--brand-dark); }
.auth-submit:disabled { opacity:0.5; cursor:not-allowed; }
.auth-msg { font-size:12px; text-align:center; margin-top:12px; min-height:18px; }
.auth-msg.error { color:#f87171; }
.auth-msg.success { color:#4ade80; }
.auth-info { font-size:11px; color:rgba(255,255,255,0.3); text-align:center; margin-top:14px; line-height:1.5; }

/* ── Poll Widget ── */
.poll-question { font-size:13px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:10px; }
.poll-bar-row { display:flex;align-items:center;gap:8px;margin-bottom:6px; }
.poll-bar-label { font-size:11px;color:rgba(255,255,255,0.75);min-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0; }
.poll-bar-bg { flex:1;height:18px;background:rgba(255,255,255,0.1);border-radius:20px;overflow:hidden; }
.poll-bar-fill { height:100%;border-radius:20px;transition:width .4s ease; }
.poll-bar-count { font-size:11px;color:rgba(255,255,255,0.5);min-width:18px;text-align:right;flex-shrink:0; }
.poll-total { font-size:10px;color:rgba(255,255,255,0.35);text-align:center;margin-top:4px; }
.poll-ctrl { display:flex;gap:6px;justify-content:center;margin-top:8px; }
.poll-ctrl button { padding:4px 12px;border-radius:8px;border:none;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s; }

/* ── Voting Page (Schüler) ── */
#voting-page { position:fixed;inset:0;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:9999; }
.voting-card { background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:32px 28px;max-width:460px;width:100%; }
.voting-q { font-size:20px;font-weight:700;color:#fff;text-align:center;margin-bottom:24px;line-height:1.4; }
.voting-opt { width:100%;padding:14px 20px;border-radius:14px;border:2px solid transparent;background:rgba(255,255,255,0.06);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .18s;text-align:left;margin-bottom:10px;display:block; }
.voting-opt:hover { transform:translateX(4px); }
.voting-opt:disabled { opacity:.5;cursor:not-allowed;transform:none; }

/* ── KI-Assistent Widget ── */
.ai-ctrl-row { display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;margin-bottom:6px; }
.ai-ctrl-row input, .ai-ctrl-row select {
  padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.07);color:#fff;font-size:12px;touch-action:auto;user-select:text;
}
.ai-ctrl-row input { flex:1;min-width:100px; }
.ai-ctrl-row input::placeholder { color:rgba(255,255,255,0.3); }
.ai-ctrl-row select { cursor:pointer; }
.ai-ctrl-row select option { background:#1e293b; }
.ai-gen-btn {
  padding:6px 14px;border-radius:8px;border:none;background:var(--brand);color:#fff;
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;
}
.ai-gen-btn:hover { background:var(--brand-dark); }
.ai-gen-btn:disabled { opacity:.5;cursor:not-allowed; }
.ai-output {
  flex:1;overflow-y:auto;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:rgba(255,255,255,0.85);
  line-height:1.65;white-space:pre-wrap;word-break:break-word;scrollbar-width:thin;
}
.ai-bottom-row { display:flex;gap:5px;justify-content:flex-end;flex-shrink:0;margin-top:5px; }
.ai-bottom-row button {
  padding:4px 12px;border-radius:8px;border:none;
  font-size:11px;cursor:pointer;transition:all .15s;
}

/* ── Frag die KI Widget ── */
.ask-input-row { display:flex;gap:6px;flex-shrink:0; }
.ask-input-row textarea {
  flex:1;resize:none;padding:8px 10px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);
  color:#fff;font-size:12.5px;line-height:1.5;font-family:inherit;
  touch-action:auto;user-select:text;-webkit-user-select:text;
  min-height:52px;max-height:90px;
}
.ask-input-row textarea::placeholder { color:rgba(255,255,255,0.3); }
.ask-send-btn {
  padding:8px 14px;border-radius:10px;border:none;background:var(--brand);
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;align-self:flex-end;
  transition:all .15s;line-height:1;
}
.ask-send-btn:hover { background:var(--brand-dark); }
.ask-send-btn:disabled { opacity:.4;cursor:not-allowed; }
.ask-history {
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  scrollbar-width:thin;padding-right:2px;
}
.ask-bubble {
  border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;max-width:100%;
}
.ask-bubble.user {
  background:var(--brand);color:#fff;align-self:flex-end;
  border-bottom-right-radius:3px;font-weight:500;
}
.ask-bubble.ai {
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.88);
  border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:3px;
}
.ask-bubble.thinking {
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.35);
  font-style:italic;border:1px dashed rgba(255,255,255,0.1);
}
.ask-clear-btn {
  background:none;border:none;color:rgba(255,255,255,0.25);
  font-size:11px;cursor:pointer;padding:2px 4px;align-self:flex-end;flex-shrink:0;
  transition:color .15s;
}
.ask-clear-btn:hover { color:rgba(255,255,255,0.5); }

/* ── Sprachsteuerung ── */
#btn-more.listening { background:rgba(239,68,68,0.35) !important; color:#fecaca !important; animation:pulse 1s infinite; }
@keyframes ripple { 0%{transform:scale(1);opacity:1} 100%{transform:scale(1.5);opacity:0} }
.voice-toast {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  background:rgba(15,23,42,0.95); border:1px solid rgba(239,68,68,0.4);
  color:#f1f5f9; padding:10px 20px; border-radius:12px; font-size:13px;
  z-index:9999; display:flex; align-items:center; gap:8px; pointer-events:none;
}
.voice-transcript { color:#fde047; font-style:italic; }

/* ── Skalierbare Widget-Schrift ── */
.w-clock, .w-timer-display { transition:font-size .1s; }
.groups-inner { overflow-y:auto; flex:1; }
.group-card h4 { font-size:clamp(0.7rem, 2vw, 1.1rem); }
.group-card li { font-size:clamp(0.65rem, 1.8vw, 1rem); }

/* ══════════════════════════════════════════════════════════════
   NEUER LOOK — ruhige Tafel, helle gut lesbare Karten, Leiste unten
   (überschreibt gezielt die älteren Regeln weiter oben)
   ══════════════════════════════════════════════════════════════ */
:root {
  --ink:#1A1640; --ink-muted:#5A5679; --card:#FAF9FF; --line:#E2DFF4;
  /* Markenfarben Scolavis: Violett → Blau → Cyan auf tiefem Indigo (aus dem Logo) */
  --accent:#6D4BFF; --accent-dark:#5234E0; --accent-ink:#4A2FD0; --accent-tint:#ECE8FF; --accent-soft:#9FE8FF;
  --board:#060432; --on-board:#F4F3FF; --on-board-muted:#C9C6EE;
  --brand:#6D4BFF; --brand-dark:#5234E0;
  --brand-grad:linear-gradient(120deg, #C04BFF 0%, #6D4BFF 45%, #22D3F5 100%);
  --toolbar-h:60px; --dock-h:84px; --radius:18px;
}
/* Schrift: Atkinson Hyperlegible Next (Braille Institute, SIL Open Font License — siehe fonts/OFL.txt).
   Auf Lesbarkeit entwickelt: ähnliche Zeichen (I l 1, O 0, rn m) sind klar unterscheidbar.
   Liegt lokal im Ordner fonts/ — es wird NICHTS von Google-Servern geladen (DSGVO). */
@font-face {
  font-family:'Atkinson Hyperlegible Next'; font-style:normal; font-weight:200 800; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-next-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family:'Atkinson Hyperlegible Next'; font-style:normal; font-weight:200 800; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-next-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
html, body { font-family:"Atkinson Hyperlegible Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; }
button, input, select, textarea { font-family:inherit; }
body { background:var(--board); color:var(--on-board); }
.ic { flex:none; display:block; }

/* ── Obere Leiste: nur Navigation, liegt über der Tafel ── */
#toolbar {
  height:var(--toolbar-h); gap:8px; padding:0 14px; border-bottom:none;
  /* dezente Abdunklung, damit die Leiste auf jedem Hintergrund lesbar bleibt */
  background:linear-gradient(rgba(6,4,40,0.46), rgba(6,4,40,0.2));
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:var(--on-board); transition:transform .25s ease;
}
#toolbar.solid { background:rgba(10,7,52,0.92); box-shadow:0 6px 18px rgba(0,0,0,0.28); }
#logo { gap:8px; margin-right:4px; color:var(--on-board); }
#logo .logo-mark { display:flex; }
#logo .logo-mark img { display:block; width:38px; height:38px; border-radius:10px; box-shadow:0 0 16px rgba(125,90,255,0.6), 0 0 2px rgba(34,211,245,0.8); }
#logo-text { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
.logo-vis { background:var(--brand-grad); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
/* „Mehr" und andere Hauptknöpfe tragen den Markenverlauf */
.dock-btn.accent { color:var(--accent-ink); }
#btn-add-widget { background:var(--brand-grad) !important; color:#fff !important; }
#class-btn {
  height:40px; padding:0 12px; border-radius:12px; max-width:180px;
  background:transparent; border:1.5px solid rgba(255,255,255,0.38);
  color:var(--on-board); font-size:14px; font-weight:700; gap:6px;
}
#class-btn:hover { background:rgba(255,255,255,0.12); }
#class-btn .class-name { max-width:124px; }
#board-tabs { gap:2px; min-width:150px; flex:0 1 auto; }
.tab-btn { height:40px; padding:0 14px; border-radius:12px; font-size:14px; font-weight:700; color:var(--on-board-muted); background:transparent; gap:6px; }
.tab-btn:hover { background:rgba(255,255,255,0.12); color:#fff; }
.tab-btn.active { background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,0.25); }
/* Umbenennen/Löschen nur am aktiven Tab: ruhigere Leiste, keine versehentlichen Klicks */
.tab-btn .tab-action { display:none; width:24px; height:24px; border-radius:7px; padding:0; color:inherit; }
.tab-btn.active .tab-action { display:flex; opacity:0.55; }
.tab-btn.active .tab-action:hover { opacity:1; background:rgba(26,22,64,0.1); }
#add-board-btn { width:40px; height:40px; border-radius:12px; background:transparent; color:var(--on-board-muted); font-size:0; }
#add-board-btn:hover { background:rgba(255,255,255,0.12); color:#fff; }
.tb-spacer { flex:1 1 0; min-width:4px; }
.toolbar-sep { display:none; }
.tb-icon-btn { width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,0.12); color:var(--on-board); font-size:0; }
.tb-icon-btn:hover { background:rgba(255,255,255,0.22); color:#fff; }
.tb-icon-btn.active { background:var(--card); color:var(--ink); }
/* Schalter „Ansicht | Bearbeiten": beide Möglichkeiten stehen da, die aktive ist hell hinterlegt */
#edit-mode-btn {
  flex:none; width:auto; height:40px; padding:3px; gap:2px; border-radius:12px;
  display:flex; align-items:center; background:rgba(255,255,255,0.12); letter-spacing:0;
}
.em-opt {
  height:34px; padding:0 11px; gap:6px; border:none; border-radius:9px; cursor:pointer;
  display:flex; align-items:center; background:transparent; color:var(--on-board);
  font:inherit; font-size:14px; font-weight:700; opacity:.82; transition:background .15s, color .15s;
}
.em-opt:hover { background:rgba(255,255,255,0.14); opacity:1; }
.em-opt.on { background:var(--card); color:var(--ink); opacity:1; }
#auth-area { margin-left:2px; }
#auth-login-btn { height:40px; padding:0 14px; border-radius:12px; border:none; background:var(--card); color:var(--ink); font-size:14px; font-weight:700; }
#auth-login-btn:hover { background:#fff; color:var(--ink); }
#user-badge { height:40px; padding:0 10px; border-radius:12px; border:none; background:rgba(255,255,255,0.12); }
#user-avatar { background:var(--accent); }
#user-email { color:var(--on-board); font-size:13px; font-weight:600; }
#auth-logout-btn { color:var(--on-board-muted); width:28px; height:28px; padding:0; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0; }
#auth-logout-btn:hover { background:rgba(255,255,255,0.16); color:#fff; }

/* ── Tafel: Hintergrund reicht bis hinter die Leiste, Elemente beginnen darunter ── */
#board { top:0; background:var(--board); }
#widgets-layer {
  margin-top:var(--toolbar-h); min-width:0; min-height:0;
  /* Platz, um Elemente über die untere Leiste scrollen zu können */
  padding-bottom:calc(var(--dock-h) + 28px); box-sizing:content-box;
}
body.fullscreen #widgets-layer, body.autohide #widgets-layer { margin-top:0; }

/* ── Untere Leiste (Dock): Elemente mit einem Klick auf die Tafel ── */
#dock {
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:1700;
  max-width:calc(100vw - 24px); display:flex; align-items:stretch; gap:2px;
  background:var(--card); color:var(--ink); border-radius:22px; padding:7px 8px;
  box-shadow:0 14px 36px rgba(0,0,0,0.32); transition:transform .25s ease; user-select:none;
}
/* Nur die Element-Knöpfe scrollen — „KI“ und „Mehr“ bleiben immer sichtbar */
.dock-scroll {
  display:flex; align-items:stretch; gap:2px; flex:0 1 auto; min-width:0;
  overflow-x:auto; scrollbar-width:none; touch-action:pan-x; border-radius:14px;
}
.dock-scroll::-webkit-scrollbar { display:none; }
.dock-btn {
  flex:none; min-width:66px; height:62px; padding:5px 9px; border:0; border-radius:14px;
  background:transparent; color:#2B2650; font:inherit; font-size:12px; font-weight:700;
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  white-space:nowrap; transition:background .12s, transform .1s;
}
.dock-btn:hover { background:rgba(26,22,64,0.07); }
.dock-btn:active { transform:scale(0.94); }
.dock-btn.accent { color:var(--accent-ink); }
.dock-btn.on { background:var(--accent-tint); color:var(--accent-ink); }
.dock-sep { flex:none; width:1px; margin:10px 4px; background:var(--line); }
body.draw-mode #dock, body.fullscreen #dock { display:none; }

/* ── Leisten automatisch ausblenden ── */
body.autohide:not(.chrome-shown) #toolbar { transform:translateY(-110%); }
body.autohide:not(.chrome-shown) #dock { transform:translate(-50%, 160%); }
#tb-pull-tab {
  position:fixed; left:50%; top:0; transform:translateX(-50%); z-index:99998;
  height:26px; padding:0 16px; border:0; border-radius:0 0 12px 12px; cursor:pointer;
  background:var(--card); color:var(--ink); font:inherit; font-size:12px; font-weight:700;
  display:flex; align-items:center; gap:6px; box-shadow:0 6px 16px rgba(0,0,0,0.25); transition:top .25s ease;
}
body.autohide.chrome-shown #tb-pull-tab { top:var(--toolbar-h); }
body.fullscreen #tb-pull-tab { display:none !important; }

/* ── Karten (Elemente): hell, dunkle Schrift — am Smartboard aus der letzten Reihe lesbar ── */
.widget {
  --w-bg:var(--card); --w-ink:#1A1640; --w-muted:#5A5679; --w-faint:#76729A;
  --w-line:#E2DFF4; --w-line-strong:#BCB7DC;
  --w-fill:rgba(26,22,64,0.05); --w-fill-2:rgba(26,22,64,0.09); --w-fill-3:rgba(26,22,64,0.15); --w-bar:rgba(26,22,64,0.06);
  --w-danger:#B42318; --w-warn:#A8480A;
  background:var(--w-bg); color:var(--w-ink); border:1px solid rgba(26,22,64,0.07);
  border-radius:var(--radius); backdrop-filter:none; -webkit-backdrop-filter:none;
  box-shadow:0 10px 30px rgba(0,0,0,0.22);
}
/* Wahlweise dunkle Karten (Menü ⋯ → Karten) */
body[data-cards="dark"] .widget {
  --w-bg:rgba(16,12,58,0.82); --w-ink:#F4F3FF; --w-muted:rgba(242,245,244,0.72); --w-faint:rgba(242,245,244,0.55);
  --w-line:rgba(255,255,255,0.14); --w-line-strong:rgba(255,255,255,0.32);
  --w-fill:rgba(255,255,255,0.07); --w-fill-2:rgba(255,255,255,0.12); --w-fill-3:rgba(255,255,255,0.2); --w-bar:rgba(0,0,0,0.25);
  --w-danger:#F87171; --w-warn:#FBBF24;
  border-color:rgba(255,255,255,0.12); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.widget.selected { border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,75,255,0.38), 0 10px 30px rgba(0,0,0,0.22); }
.widget.alarm { animation:alarmFlash .5s ease 6; }
@keyframes alarmFlash { 0%,100% { box-shadow:0 10px 30px rgba(0,0,0,0.22); } 50% { box-shadow:0 0 0 7px rgba(180,35,24,0.85), 0 10px 30px rgba(0,0,0,0.22); } }
/* Im Bearbeiten-Modus ist der Griff immer sichtbar — auch am Smartboard ohne Maus */
.widget-header { height:34px; background:var(--w-bar); padding:0 5px 0 12px; opacity:1; }
body:not([data-cards="dark"]) .widget-header { background:linear-gradient(90deg, rgba(192,75,255,0.10), rgba(109,75,255,0.07) 50%, rgba(34,211,245,0.09)); }
.widget-title { color:var(--w-muted); font-size:11.5px; letter-spacing:.06em; }
.w-btn { position:relative; width:30px; height:30px; border-radius:8px; background:transparent; color:var(--w-muted); font-size:0; }
.w-btn svg { width:18px; height:18px; }
.w-btn:hover { background:var(--w-fill-2); color:var(--w-ink); }
.w-btn.del:hover { background:rgba(180,35,24,0.14); color:var(--w-danger); }
.widget-body.with-header { top:34px; }
/* Schrift im Element wächst mit dem Element mit (cqw = Prozent der Element-Breite) */
.widget-body { container-type:size; }
/* Größen-Griff: im Bearbeiten-Modus immer sichtbar (am Smartboard gibt es kein „mit der Maus darüberfahren") */
.resize-handle { width:26px; height:26px; opacity:1; }
.resize-handle::after {
  right:5px; bottom:5px; width:12px; height:12px; border-radius:0 0 5px 0;
  border-right:3px solid var(--accent); border-bottom:3px solid var(--accent); opacity:.7;
}
.resize-handle:hover::after { opacity:1; }
@media (pointer: coarse) {
  /* Finger statt Maus: größere Trefferflächen, ohne die Kopfzeile höher zu machen */
  .w-btn::after { content:''; position:absolute; inset:-6px -2px; }
  .widget-actions { gap:6px; }
  .resize-handle { width:34px; height:34px; }
  .resize-handle::after { width:15px; height:15px; }
}
.widget ::-webkit-scrollbar-thumb { background:var(--w-line-strong); }
.widget input[type=text], .widget input[type=url], .widget input[type=number], .widget textarea, .widget select {
  color:var(--w-ink); background:var(--w-fill); border-color:var(--w-line-strong);
}
.widget input::placeholder, .widget textarea::placeholder { color:var(--w-faint); }
@media (hover:none) { .widget-header, .resize-handle { opacity:1; } }

/* Inhalte der Elemente */
.w-date { color:var(--w-muted); }
.w-timer-display.urgent { color:var(--w-danger); }
.w-action-btn { background:var(--w-fill-2); color:var(--w-ink); font-size:14px; font-weight:700; padding:8px 16px; min-height:40px; border-radius:12px; }
.w-action-btn:hover { background:var(--w-fill-3); }
.w-traffic-circle { border-color:rgba(26,22,64,0.2); box-shadow:inset 0 0 10px rgba(0,0,0,0.14); }
.w-traffic-circle.dim { background:var(--w-fill-2); }
.w-names-list li.highlighted { background:var(--accent); color:#fff; }
.w-homework h3 { color:var(--w-muted); }
.w-homework li { border-bottom-color:var(--w-line); }
.w-qr-label { color:var(--w-muted); font-size:12px; }
.tt-now { background:var(--accent-tint); border-color:rgba(109,75,255,0.35); color:#1A1640; }
.tt-now .tt-label, .tt-now .tt-meta { color:#40504C; }
.tt-label { color:var(--w-muted); }
.tt-subject { font-size:clamp(18px, 7cqw, 36px); }
.tt-meta { color:var(--w-muted); font-size:clamp(12px, 3.6cqw, 18px); }
.tt-cancelled { color:var(--w-danger); }
.tt-changed { color:var(--w-warn); }
.tt-next-list li { border-bottom-color:var(--w-line); font-size:clamp(13px, 4.4cqw, 22px); }
.tt-time { color:var(--w-muted); font-size:0.82em; width:5.6em; }
.tt-no-data { color:var(--w-faint); }
.group-card { background:var(--w-fill); }
.group-card h4 { color:var(--w-muted); }
/* Listen: so groß wie möglich, aber alle Zeilen (--n, vom Element gesetzt) sollen ins Element passen.
   Reicht der Platz trotz kleinster Schrift nicht, scrollt die Liste statt über den Rand zu laufen. */
.agenda-inner, .checklist-inner, .phases-inner, .w-homework { max-height:100%; }
.agenda-inner, .checklist-inner {
  --n:6; --row-fs:clamp(14px, min(4.8cqw, calc(((100cqh - 20px) / var(--n) - 1px) / 2.05)), 44px);
}
.phases-inner {
  --n:4; --row-fs:clamp(14px, min(4.8cqw, calc(((100cqh - 20px) / var(--n) - 24px) / 1.4)), 40px);
}
.agenda-item { border-bottom-color:var(--w-line); gap:12px; padding:calc(var(--row-fs) * 0.3) 4px; align-items:baseline; }
.agenda-time { color:var(--w-muted); font-size:calc(var(--row-fs) * 0.78); font-weight:600; width:3.9em; padding-top:0; font-variant-numeric:tabular-nums; }
.agenda-text { font-size:var(--row-fs); }
.checklist-item { border-bottom-color:var(--w-line); gap:10px; padding:calc(var(--row-fs) * 0.3) 2px; }
.checklist-item input[type=checkbox] { width:calc(var(--row-fs) * 1.05); height:calc(var(--row-fs) * 1.05); accent-color:var(--accent); }
.checklist-item span { font-size:var(--row-fs); }
.checklist-item.done span { color:var(--w-faint); }
.phase-item.active { border-color:var(--w-ink); }
.phase-name { font-size:var(--row-fs); }
.phase-dur { color:var(--w-muted); font-size:calc(var(--row-fs) * 0.74); }
.status-label { color:var(--w-muted); font-size:clamp(14px, 6cqw, 26px); }
.status-inner { width:100%; }
/* Leeres Textfeld: im Bearbeiten-Modus zeigen, wie man hineinschreibt */
.widget-body.with-header .w-text-display:empty::before { content:'Doppelklick: Text eingeben'; color:var(--w-faint); }
.poll-question { color:var(--w-ink); font-size:clamp(13px, 4.6cqw, 24px); }
.poll-bar-label { color:var(--w-ink); font-size:clamp(11px, 3.6cqw, 18px); }
.poll-bar-bg { background:var(--w-fill-2); }
.poll-bar-count, .poll-total { color:var(--w-muted); }
.ai-ctrl-row input, .ai-ctrl-row select { border-color:var(--w-line-strong); background:var(--w-fill); color:var(--w-ink); }
.ai-ctrl-row input::placeholder { color:var(--w-faint); }
.ai-ctrl-row select option { background:#fff; color:#1A1640; }
.ai-output { background:var(--w-fill); border-color:var(--w-line); color:var(--w-ink); font-size:13.5px; }
.ask-input-row textarea { border-color:var(--w-line-strong); background:var(--w-fill); color:var(--w-ink); }
.ask-input-row textarea::placeholder { color:var(--w-faint); }
.ask-bubble.ai { background:var(--w-fill); color:var(--w-ink); border-color:var(--w-line); }
.ask-bubble.thinking { background:var(--w-fill); color:var(--w-muted); border-color:var(--w-line-strong); }
.ask-clear-btn { color:var(--w-muted); }
.ask-clear-btn:hover { color:var(--w-ink); }

/* ── Timer: Ring + direkte Bedienung ── */
.tm { width:100%; height:100%; box-sizing:border-box; padding:10px 14px; display:flex; align-items:center; justify-content:center; gap:clamp(12px, 4cqw, 30px); }
.tm-tall, .tm-compact { flex-direction:column; gap:10px; }
.tm-ring { position:relative; flex:none; }
.tm-ring svg { display:block; width:100%; height:100%; transform:rotate(-90deg); }
.tm-ring .trk { fill:none; stroke:var(--w-fill-3); stroke-width:7; }
.tm-ring .prg { fill:none; stroke:var(--accent); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset .3s linear, stroke .3s; }
body[data-cards="dark"] .tm-ring .prg { stroke:var(--accent-soft); }
.tm.urgent .tm-ring .prg { stroke:var(--w-danger); }
.tm-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.tm-digits { font-weight:700; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tm.urgent .tm-digits { color:var(--w-danger); }
.tm-state { color:var(--w-muted); line-height:1.2; }
.tm-ctrl { flex:1 1 0; min-width:0; max-width:300px; display:flex; flex-direction:column; gap:8px; }
.tm-tall .tm-ctrl, .tm-compact .tm-ctrl { flex:none; width:100%; max-width:340px; }
.tm-row { display:flex; gap:6px; }
.tm-btn {
  flex:1 1 0; min-width:0; min-height:42px; padding:0 6px; border-radius:12px; cursor:pointer;
  border:1.5px solid var(--w-line-strong); background:transparent; color:var(--w-ink);
  font:inherit; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px;
}
.tm-btn:hover { background:var(--w-fill-2); }
.tm-btn:active { transform:scale(0.96); }
.tm-btn.on { background:var(--accent-tint); border-color:var(--accent); color:#4A2FD0; }
.tm-go { min-height:50px; border:0; background:var(--accent); color:#fff; font-size:19px; }
.tm-go:hover { background:var(--accent-dark); }
.tm-go.done { background:var(--w-fill-3); color:var(--w-ink); }
.tm-compact .tm-go { flex:2.2 1 0; min-height:42px; font-size:16px; }
.tm-compact .tm-go .ic { display:none; }

/* ── Ampel als „Arbeitsform“ ── */
.tl { width:100%; height:100%; box-sizing:border-box; padding:10px; display:flex; flex-direction:column; gap:8px; }
.tl-row {
  flex:1 1 0; min-height:0; display:flex; align-items:center; gap:0.55em; padding:0 0.65em; cursor:pointer;
  border-radius:14px; border:2px solid var(--w-line); background:transparent; color:var(--w-muted);
  font:inherit; font-size:inherit; text-align:left; transition:background .15s, color .15s, border-color .15s;
}
.tl-row:hover { border-color:var(--w-line-strong); }
.tl-dot { flex:none; width:1.5em; height:1.5em; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; }
.tl-row.r .tl-dot { background:#D92D20; }
.tl-row.y .tl-dot { background:#E6A700; }
.tl-row.g .tl-dot { background:#16A34A; }
.tl-txt { display:flex; flex-direction:column; min-width:0; line-height:1.15; }
.tl-label { font-weight:700; }
.tl-sub { font-size:max(12px, 0.46em); opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tl-row.on.r { background:#D92D20; border-color:#D92D20; color:#fff; }
.tl-row.on.y { background:#F5B301; border-color:#F5B301; color:#1A1640; }
.tl-row.on.g { background:#16A34A; border-color:#16A34A; color:#fff; }
.tl-row.on .tl-dot { background:rgba(255,255,255,0.28); color:inherit; }

/* ── Leeres Element: Knopf zum Ausfüllen ── */
.w-empty-cta {
  margin:auto; display:flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:10px 18px;
  border-radius:12px; border:1.5px dashed var(--w-line-strong); background:transparent; color:var(--w-muted);
  font:inherit; font-size:15px; font-weight:700; cursor:pointer;
}
.w-empty-cta:hover { border-style:solid; border-color:var(--accent); background:var(--accent-tint); color:#4A2FD0; }

/* ── Start-Dialog: Vorlagen-Galerie + KI-Feld (heller Dialog) ── */
.modal.start-modal {
  background:var(--card); color:var(--ink); border:0; border-radius:24px; padding:28px 30px 26px;
  /* Höhe so begrenzen, dass der Dialog nicht unter die obere Leiste rutscht (er steht mittig) */
  width:min(1040px, calc(100vw - 32px)); max-height:calc(100vh - 2 * var(--toolbar-h) - 24px);
}
.start-modal h2 { font-size:clamp(22px, 3vw, 30px); letter-spacing:-0.01em; margin:0 44px 6px 0; color:var(--ink); }
.start-modal .start-sub { margin:0 0 18px; font-size:16px; color:var(--ink-muted); }
.start-modal h3 { margin:20px 0 12px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); }
.modal.start-modal { position:relative; }
.start-modal .modal-close { position:absolute; float:none; padding:0; color:var(--ink-muted); width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; top:18px; right:18px; }
.start-modal .modal-close:hover { background:rgba(26,22,64,0.08); color:var(--ink); }
.start-ai { background:var(--accent-tint); border-radius:18px; padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.start-ai label { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700; color:var(--accent-ink); margin:0; text-transform:none; letter-spacing:0; }
.start-ai-row { display:flex; gap:10px; flex-wrap:wrap; }
.start-ai-row input {
  flex:1 1 280px; min-width:0; min-height:50px; box-sizing:border-box; padding:0 16px; border-radius:12px;
  border:1.5px solid #9FBFBB; background:#fff; color:var(--ink); font:inherit; font-size:17px;
}
.start-ai-row input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,75,255,0.2); }
.start-ai-row button { flex:none; min-height:50px; padding:0 22px; border-radius:12px; border:0; background:var(--accent); color:#fff; font:inherit; font-size:17px; font-weight:700; cursor:pointer; }
.start-ai-row button:hover { background:var(--accent-dark); }
.start-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; }
.tpl-card2 {
  display:flex; flex-direction:column; gap:10px; padding:9px 9px 12px; border-radius:16px; cursor:pointer; text-align:left;
  border:1.5px solid #DADFD9; background:#fff; color:var(--ink); font:inherit; transition:border-color .12s, box-shadow .12s, transform .1s;
}
.tpl-card2:hover { border-color:var(--accent); box-shadow:0 6px 18px rgba(109,75,255,0.18); }
.tpl-card2:active { transform:scale(0.98); }
.tpl-thumb { position:relative; display:block; width:100%; aspect-ratio:1076 / 532; border-radius:10px; overflow:hidden; }
.tpl-thumb span { position:absolute; border-radius:3px; background:rgba(251,250,246,0.92); box-shadow:0 0 0 1px rgba(26,22,64,0.16), 0 1px 3px rgba(0,0,0,0.18); }
.tpl-txt { display:flex; flex-direction:column; gap:2px; padding:0 4px; }
.tpl-name2 { font-size:17px; font-weight:700; }
.tpl-desc2 { font-size:13.5px; color:var(--ink-muted); line-height:1.3; }
@media (max-width: 600px) {
  .modal.start-modal { padding:20px 16px 18px; border-radius:18px; }
  .start-grid { grid-template-columns:repeat(2, 1fr); gap:8px; }
  .tpl-name2 { font-size:15px; }
  .tpl-desc2 { display:none; }
}

.dc { width:100%; height:100%; box-sizing:border-box; padding:8px 10px; display:flex; flex-direction:column; gap:8px; }
.dc-area { flex:1 1 0; min-height:0; display:grid; gap:12px; justify-content:center; align-content:center; border:0; background:transparent; padding:0; cursor:pointer; }
.dc-die svg { display:block; filter:drop-shadow(0 3px 6px rgba(0,0,0,0.18)); }
.dc-face { fill:#fff; stroke:#BCB7DC; stroke-width:2.5; }
.dc-pip { fill:#1A1640; }
.dc-area.rolling .dc-die { animation:dcShake .14s linear infinite; }
@keyframes dcShake { 0%,100% { transform:rotate(0); } 25% { transform:rotate(-8deg); } 75% { transform:rotate(8deg); } }
.dc-ctrl { flex:none; display:flex; align-items:center; gap:6px; height:44px; }
.dc-ctrl .tm-btn { flex:none; width:clamp(32px, 14cqw, 44px); min-height:40px; padding:0; }
.dc-label { flex:none; min-width:24px; text-align:center; font-size:16px; font-weight:700; }
.dc-sum { flex:1 1 0; min-width:0; white-space:nowrap; overflow:hidden; text-align:right; font-size:clamp(15px, 6cqw, 26px); font-weight:700; color:var(--accent-ink); font-variant-numeric:tabular-nums; }
body[data-cards="dark"] .dc-sum { color:var(--accent-soft); }

/* ── Tagesplan ── */
.dp { width:100%; height:100%; box-sizing:border-box; padding:7px 8px; display:flex; flex-direction:column; overflow-y:auto; }
.dp-title { flex:none; font-weight:700; text-align:center; color:var(--accent-ink); padding-bottom:.35em; }
body[data-cards="dark"] .dp-title { color:var(--accent-soft); }
.dp-row {
  flex:0 0 var(--dp-row); min-height:0; display:flex; align-items:center; gap:.55em; padding:0 .45em; margin:0;
  border:0; border-bottom:1px solid var(--w-line); border-radius:0; background:transparent; color:var(--w-ink);
  font:inherit; font-size:var(--dp-fs); font-weight:700; text-align:left; cursor:pointer; transition:background .15s, opacity .15s;
}
.dp-row:last-child { border-bottom:0; }
.dp-row.now { background:rgba(109,75,255,0.13); border-radius:12px; box-shadow:inset 5px 0 0 var(--accent); }
.dp-row.done { opacity:.42; }
.dp-row.done .dp-text { text-decoration:line-through; }
.dp-pic { flex:none; width:calc(var(--dp-fs) * 1.75); height:calc(var(--dp-fs) * 1.75); max-height:calc(var(--dp-row) - 6px); max-width:calc(var(--dp-row) - 6px); }
.dp-pic svg, .dp-epic svg, .td-spic svg, .picto-pick svg { display:block; width:100%; height:100%; }
.dp-text { flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dp-time { flex:none; font-size:.66em; color:var(--w-muted); font-variant-numeric:tabular-nums; }
.dp-check { flex:none; width:1.15em; height:1.15em; border:2px solid var(--w-line-strong); border-radius:.28em; display:flex; align-items:center; justify-content:center; color:transparent; }
.dp-check svg { width:85%; height:85%; }
.dp-row.done .dp-check { background:var(--accent); border-color:var(--accent); color:#fff; }
.dp-row.off .dp-text { text-decoration:line-through; }
.dp-row.off { opacity:.55; }
.dp-tag { flex:none; font-size:.5em; font-weight:800; padding:.2em .5em; border-radius:.45em; background:var(--w-danger); color:#fff; letter-spacing:.02em; }
.dp-tag.chg { background:#F59F00; color:#1A1640; }
.dp-title { line-height:1.2; }
.dp-skip { flex:0 0 calc(var(--dp-row) * .7); min-height:0; border:0; background:transparent; color:var(--w-muted); font:inherit; font-size:calc(var(--dp-fs) * .7); font-weight:700; cursor:pointer; }
.dp-row.dp-hid { display:none; }
.dp.dp-all .dp-row.dp-hid { display:flex; }
.dp.dp-all .dp-skip { display:none; }
.dp-banner { flex:none; margin:0 0 .35em; padding:.35em .6em; line-height:1.2; border-radius:10px; background:rgba(109,75,255,0.13); color:var(--accent-ink); font-size:calc(var(--dp-fs) * .8); font-weight:800; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
body[data-cards="dark"] .dp-banner { color:var(--accent-soft); }
.dp-note { flex:none; padding:.6em .4em; text-align:center; font-size:var(--dp-fs); font-weight:700; color:var(--w-muted); }
.dp-src { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 16px; }
.dp-src button { display:flex; flex-direction:column; gap:3px; padding:12px 14px; border-radius:12px; border:1.5px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.05); color:#fff; font:inherit; text-align:left; cursor:pointer; }
.dp-src button b { font-size:15px; }
.dp-src button small { font-size:12.5px; color:rgba(255,255,255,0.65); line-height:1.35; }
.dp-src button.on { border-color:var(--accent-soft); background:rgba(109,75,255,0.35); box-shadow:0 0 0 2px rgba(159,232,255,0.25); }
.dp-urlrow { display:flex; gap:8px; align-items:stretch; }
.dp-urlrow input { flex:1 1 0; min-width:0; margin:0; }
.dp-urlrow button { flex:none; margin:0; }
.dp-status { font-size:13.5px; line-height:1.45; color:rgba(255,255,255,0.75); margin:-2px 0 12px; }
.dp-status.ok { color:#8CE99A; }
.dp-code { flex:none; min-width:54px; max-width:110px; padding:0 6px; font-size:13px; font-weight:700; color:rgba(255,255,255,0.7); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width: 560px) { .dp-src { grid-template-columns:1fr; } }
.dp-edit { display:flex; flex-direction:column; gap:6px; margin:6px 0; max-height:46vh; overflow-y:auto; }
.dp-erow { display:flex; align-items:center; gap:6px; }
.dp-erow input { margin:0; }
.dp-erow .dp-etime { flex:none; width:70px; }
.dp-epic { flex:none; width:44px; height:44px; padding:2px; border:1px solid rgba(255,255,255,0.18); border-radius:10px; background:rgba(255,255,255,0.06); cursor:pointer; }
.dp-ebtn { flex:none; width:34px; height:34px; border:0; border-radius:8px; background:rgba(255,255,255,0.08); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.dp-ebtn:disabled { opacity:.3; cursor:default; }
.dp-opt { display:flex !important; align-items:center; gap:8px; font-size:14px !important; color:#fff !important; margin-bottom:10px !important; cursor:pointer; text-transform:none; letter-spacing:0 !important; font-weight:500 !important; }
.dp-opt input { width:18px; height:18px; flex:none; }
.picto-pick {
  position:fixed; z-index:3000; width:min(440px, calc(100vw - 16px)); max-height:60vh; overflow-y:auto; padding:8px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:6px;
  background:var(--card); border-radius:14px; box-shadow:0 18px 50px rgba(0,0,0,0.5);
}
.picto-pick button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border:0; border-radius:10px; background:transparent; color:var(--ink); font:inherit; font-size:11px; font-weight:600; cursor:pointer; }
.picto-pick button:hover { background:var(--accent-tint); }
.picto-pick button svg { width:40px; height:40px; }

/* ── Klassendienste ── */
.du { width:100%; height:100%; box-sizing:border-box; padding:8px; display:flex; flex-direction:column; gap:6px; }
.du-head { flex:none; display:flex; align-items:center; gap:.5em; padding:0 .25em; min-width:0; line-height:1.2; }
.du-title { font-weight:800; color:var(--accent-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
body[data-cards="dark"] .du-title { color:var(--accent-soft); }
.du-sub { flex:1 1 auto; font-size:.62em; font-weight:700; color:var(--w-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right; }
.du-next { flex:none; display:flex; align-items:center; gap:.2em; padding:.2em .6em; border:0; border-radius:.5em; background:var(--accent); color:#fff; font:inherit; font-size:.6em; font-weight:800; cursor:pointer; }
.du-grid { flex:1 1 0; min-height:0; display:grid; gap:6px 8px; overflow-y:auto; align-content:start; }
.du-cell { display:flex; align-items:center; gap:.5em; padding:0 .55em; border-radius:12px; background:var(--w-fill); min-width:0; }
.du-pic { flex:none; }
.du-pic svg { display:block; width:100%; height:100%; }
.du-txt { flex:1 1 0; min-width:0; display:flex; flex-direction:column; line-height:1.12; }
.du-lbl { font-size:.58em; font-weight:700; color:var(--w-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.du-names { font-weight:800; color:var(--w-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.du-name { border:0; background:transparent; color:inherit; font:inherit; padding:0; cursor:pointer; border-radius:.2em; }
.du-name:hover { text-decoration:underline; text-decoration-thickness:2px; }
.du-for { border:0; background:transparent; font:inherit; font-weight:800; color:var(--accent-ink); padding:0; margin-left:.45em; cursor:pointer; text-decoration:underline; }
body[data-cards="dark"] .du-for { color:var(--accent-soft); }
.du.compact .du-lbl { display:none; }
.du.compact .du-cell { padding:0 .4em; gap:.4em; border-radius:9px; }
.du.compact .du-for { font-size:.6em; }
.du-prev { display:flex; align-items:center; gap:8px; }
#du-preview { flex:1 1 0; min-width:0; font-size:13.5px; line-height:1.5; color:rgba(255,255,255,0.85); padding:8px 10px; border-radius:10px; background:rgba(255,255,255,0.06); max-height:150px; overflow-y:auto; }
.du-count { flex:none; width:auto !important; margin:0 !important; padding:6px 8px !important; }

/* ── Datum ── */
.td { width:100%; height:100%; box-sizing:border-box; padding:8px; display:flex; flex-direction:column; gap:8px; }
.td-card { min-height:0; display:flex; align-items:center; justify-content:center; gap:.4em; border-radius:12px; border:1.5px solid var(--w-line); background:var(--w-bg); line-height:1.05; text-align:center; overflow:hidden; }
.td-card b { font-weight:700; white-space:nowrap; }
.td-wd { flex-direction:column; gap:.18em; border-left:8px solid; }
.td-dots { display:flex; gap:.18em; }
.td-dots i { width:.22em; height:.22em; border-radius:50%; opacity:.45; }
.td-dots i.on { opacity:1; transform:scale(1.5); }
.td-row { display:flex; gap:8px; min-height:0; }
.td-row .td-card { flex:1 1 0; }
.td-row .td-mon { flex:1.7 1 0; }
.td-spic { flex:none; width:1.5em; height:1.5em; }
.td-ym { flex:none; text-align:center; color:var(--w-muted); font-weight:700; }
.td-line { justify-content:center; align-items:center; text-align:center; padding:12px 16px; }
.td-sentence { line-height:1.25; font-weight:600; }
.td-sentence b { font-weight:800; }
.td-sline { display:flex; align-items:center; gap:.4em; font-weight:700; color:var(--w-muted); }

/* ── Link ── */
.lk { width:100%; height:100%; display:flex; align-items:center; gap:.6em; padding:0 .8em; border:0; background:transparent; color:var(--w-ink); font:inherit; text-align:left; cursor:pointer; }
.lk-ic { flex:none; width:2.1em; height:2.1em; border-radius:.55em; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; }
.lk-ic .ic { width:60%; height:60%; }
.lk-txt { flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
.lk-txt b { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lk-txt small { font-size:.55em; color:var(--w-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lk-go { flex:none; color:var(--w-muted); }
.lk:hover .lk-go { color:var(--accent); }

/* ── Bild ohne Rahmen ── */
.widget.frameless { background:transparent; border-color:transparent; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
.widget.frameless:hover, .widget.frameless.selected { outline:2px dashed rgba(159,232,255,0.7); outline-offset:2px; }

/* ── Zeitkreis: Skala ── */
.vt-ticks line.b { stroke-width:1.6; opacity:.85; }
.vt-nums text { fill:var(--w-ink); font-size:5.6px; font-weight:700; text-anchor:middle; dominant-baseline:central; font-family:"Atkinson Hyperlegible Next", system-ui, sans-serif; }
.vt-disc { cursor:pointer; touch-action:none; }

/* ── Tafel-Übersicht und Blättern ── */
.ov-card { padding:0; gap:0; cursor:default; }
.ov-card.cur { border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,75,255,0.25); }
.ov-open { display:flex; flex-direction:column; gap:10px; padding:9px 9px 8px; border:0; background:transparent; color:var(--ink); font:inherit; text-align:left; cursor:pointer; border-radius:16px 16px 0 0; }
.ov-acts { display:flex; gap:4px; padding:0 8px 8px; }
.ov-btn { flex:1 1 0; min-width:0; height:38px; border:1.5px solid #DADFD9; border-radius:10px; background:#fff; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; font:inherit; font-size:12.5px; font-weight:700; }
.ov-btn:hover { border-color:var(--accent); color:var(--accent-ink); }
.ov-btn:disabled { opacity:.3; cursor:default; }
.ov-btn.confirm { flex:3 1 0; background:#B42318; border-color:#B42318; color:#fff; }
.ov-rename { width:100%; min-height:36px; padding:4px 8px; border-radius:8px; border:1.5px solid var(--accent); font:inherit; font-size:16px; font-weight:700; color:var(--ink); background:#fff; }
#board-pager { position:fixed; right:18px; bottom:28px; z-index:1690; display:flex; align-items:center; gap:2px; padding:4px; border-radius:14px; background:var(--card); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
#board-pager[hidden] { display:none; }
#board-pager button { min-width:40px; height:40px; border:0; border-radius:10px; background:transparent; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; font:inherit; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; }
#board-pager button:hover:not(:disabled) { background:rgba(26,22,64,0.08); }
#board-pager button:disabled { opacity:.3; cursor:default; }
body.draw-mode #board-pager, body.wfull-on #board-pager, body.voting #board-pager { display:none; }
body.fullscreen #board-pager { bottom:18px; opacity:.55; }
body.fullscreen #board-pager:hover { opacity:1; }
@media (max-width: 1279px) { body:not(.fullscreen) #board-pager { display:none; } }

/* ── Uhr mit Zeigern ── */
.ck { width:100%; height:100%; box-sizing:border-box; padding:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
.ck-face { flex:none; }
.ck-face svg { display:block; width:100%; height:100%; }
.ck-dial { fill:#fff; stroke:#1A1640; stroke-width:1.6; }
.ck-tick { stroke:#76729A; stroke-width:.6; stroke-linecap:round; }
.ck-tick.h { stroke:#1A1640; stroke-width:1.6; }
.ck-num { fill:#1A1640; font-size:8.5px; font-weight:700; text-anchor:middle; dominant-baseline:central; font-family:"Atkinson Hyperlegible Next", system-ui, sans-serif; }
.ck-hand { stroke:#1A1640; stroke-linecap:round; }
.ck-hand.hr { stroke-width:3.4; }
.ck-hand.mn { stroke-width:2.2; }
.ck-hand.sc { stroke:#D92D20; stroke-width:.9; }
.ck-hub { fill:#1A1640; }
.ck-digital { font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
.ck-answer { flex:none; text-align:center; line-height:1.3; }
.ck-answer b { display:block; }
.ck-answer span { color:var(--w-muted); font-weight:700; }
.ck-ctrl { flex:none; display:flex; gap:6px; width:100%; max-width:380px; }

/* ── Start-Dialog: Suche und Kategorien ── */
.start-modal h3 { display:flex; align-items:center; gap:8px; }
.start-count { font-size:12px; padding:2px 9px; border-radius:999px; background:var(--accent-tint); color:var(--accent-ink); letter-spacing:0; }
.start-filter { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.start-search { display:flex; align-items:center; gap:8px; min-height:46px; padding:0 12px; border-radius:12px; border:1.5px solid #C9D0CA; background:#fff; color:var(--ink-muted); }
.start-search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,75,255,0.18); }
.start-search input { flex:1; min-width:0; border:0; outline:none; background:transparent; color:var(--ink); font:inherit; font-size:16px; padding:0; }
.start-chips { display:flex; flex-wrap:wrap; gap:6px; }
.start-chip { min-height:36px; padding:0 14px; border-radius:999px; border:1.5px solid #DADFD9; background:#fff; color:var(--ink); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
.start-chip:hover { border-color:var(--accent); }
.start-chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.start-none { padding:24px 8px; text-align:center; color:var(--ink-muted); font-size:15px; }
.tpl-card2[hidden] { display:none; }
.tpl-thumb span { display:flex; align-items:center; justify-content:center; overflow:hidden; color:#76729A; }
.tpl-thumb span .ic { width:auto; height:52%; max-height:18px; max-width:80%; }

/* ── Arbeitssymbole ── */
.ws-grid { width:100%; height:100%; box-sizing:border-box; padding:8px; display:grid; gap:8px; grid-auto-rows:1fr; }
.ws-tile {
  min-width:0; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5em; padding:4px;
  border-radius:16px; border:2px solid var(--w-line); background:transparent; color:var(--w-ink);
  font:inherit; font-weight:700; line-height:1.15; text-align:center; cursor:pointer; transition:background .15s, opacity .15s, border-color .15s;
}
.ws-tile svg { flex:none; max-height:62%; }
.ws-tile:hover { border-color:var(--w-line-strong); }
.ws-grid.has-active .ws-tile:not(.on) { opacity:.32; }
.ws-tile.on { background:var(--accent); border-color:var(--accent); color:#fff; }

/* ── Punktetafel ── */
.sb { width:100%; height:100%; box-sizing:border-box; padding:8px; display:flex; gap:8px; }
