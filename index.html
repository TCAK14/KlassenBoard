<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>ClassPuls – Das digitale Klassenzimmer</title>
<meta name="description" content="ClassPuls ist das smarte digitale Klassenzimmer für Lehrerinnen und Lehrer. Widgets, KI-Assistent, Live-Umfragen, Sprachsteuerung und mehr.">
<meta name="theme-color" content="#6366f1">
<meta property="og:title" content="ClassPuls">
<meta property="og:description" content="Das smarte digitale Klassenzimmer für Lehrerinnen und Lehrer">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>">
<link rel="stylesheet" href="css/styles.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <a id="logo" href="landing.html" title="Zur Startseite" style="text-decoration:none;color:inherit">
    <span style="font-size:16px;font-weight:800;color:#2bbcb3">C</span>
    <span id="logo-text">ClassPuls</span>
        <span style="font-size:9px;opacity:0.4;margin-left:2px;font-weight:400;letter-spacing:1px;text-transform:uppercase;align-self:flex-end;margin-bottom:1px">Beta</span>
  </a>
  <!-- Klassen-Wechsler -->
  <div id="class-switcher">
    <button id="class-btn" title="Klasse wechseln">
      <span class="class-name" id="class-btn-name">Klasse wählen</span>
      <span style="opacity:0.5;font-size:10px">▾</span>
    </button>
    <div id="class-dropdown">
      <div class="class-dd-header">Meine Klassen</div>
      <div id="class-list"></div>
      <div class="class-dd-divider"></div>
      <div class="class-dd-add" id="class-add-trigger">＋ Neue Klasse anlegen</div>
      <div class="class-dd-add-input" id="class-add-form">
        <input id="class-add-input" type="text" placeholder='z.B. "2e" oder "7b Deutsch"' maxlength="30">
        <button id="class-add-confirm">Anlegen</button>
      </div>
    </div>
  </div>
  <div class="toolbar-sep" style="margin:0 2px"></div>
  <div id="board-tabs"></div>
  <button id="add-board-btn" title="Neue Tafel">+</button>
  <div class="toolbar-sep"></div>
  <button class="tb-btn" id="btn-add-widget" title="Elemente hinzufügen (W)">＋ Elemente</button>
  <button class="tb-icon-btn tb-item" id="btn-template" data-tbid="template" title="Vorlage laden">📋</button>
  <button class="tb-icon-btn tb-item" id="btn-bg" data-tbid="bg" title="Hintergrund">🎨</button>
  <button class="tb-icon-btn tb-item" id="btn-ical" data-tbid="ical" title="Stundenplan (iCal)">📅</button>
  <button class="tb-icon-btn tb-item" id="btn-export" data-tbid="export" title="Export/Import">💾</button>
  <div class="toolbar-sep"></div>
  <button class="tb-icon-btn tb-item" id="btn-voice" data-tbid="voice" title="Sprachsteuerung (Mikrofon)">🎙️</button>
  <button class="tb-icon-btn tb-item" id="btn-draw" data-tbid="draw" title="Zeichnen / Schreiben">🖊</button>
  <button class="tb-icon-btn tb-btn tb-item" id="edit-mode-btn" data-tbid="editmode" title="Bearbeiten/Ansicht (E)">✏️ Edit</button>
  <button class="tb-icon-btn tb-item" id="btn-fullscreen" data-tbid="fullscreen" title="Vollbild (F)">⤢</button>
  <button class="tb-icon-btn" id="btn-customize-toolbar" title="Leiste anpassen" style="opacity:0.5;font-size:15px">⚙</button>
  <div class="toolbar-sep"></div>
  <div id="auth-area">
    <button id="auth-login-btn">🔑 Anmelden</button>
    <div id="user-badge">
      <div id="user-avatar">?</div>
      <span id="user-email"></span>
      <div id="sync-dot" title="Cloud-Sync aktiv"></div>
      <button id="auth-logout-btn" title="Abmelden">✕</button>
    </div>
  </div>
</div>

<!-- Board -->
<div id="board">
  <div id="board-bg"></div>
  <div id="widgets-layer"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Zeichnen-Canvas -->
<canvas id="draw-canvas"></canvas>

<!-- Text-Input beim Schreiben per Doppelklick -->
<textarea id="draw-text-input" style="display:none;position:fixed;z-index:9999;background:rgba(0,0,0,0.85);color:#fff;border:2px solid #facc15;border-radius:8px;padding:8px 12px;font-size:18px;resize:none;min-width:160px;min-height:40px;outline:none;backdrop-filter:blur(6px)" placeholder="Text eingeben…"></textarea>

<!-- Zeichnen-Toolbar -->
<div id="draw-toolbar">
  <!-- Werkzeuge -->
  <button class="draw-tool-btn active" id="dt-pen"       title="Stift (dünn)">✏️</button>
  <button class="draw-tool-btn"        id="dt-pen-thick"  title="Stift (dick)">🖊</button>
  <button class="draw-tool-btn"        id="dt-marker"     title="Marker (Textmarker)">🟡</button>
  <button class="draw-tool-btn"        id="dt-brush"      title="Pinsel (weich)">🖌️</button>
  <button class="draw-tool-btn"        id="dt-text"       title="Text schreiben (T)">T</button>
  <button class="draw-tool-btn"        id="dt-eraser"     title="Radiergummi">◻</button>
  <div class="draw-sep"></div>
  <!-- Farben -->
  <button class="draw-color-btn" style="background:#ffffff" data-color="#ffffff" title="Weiß"></button>
  <button class="draw-color-btn" style="background:#facc15" data-color="#facc15" title="Gelb"></button>
  <button class="draw-color-btn" style="background:#fb923c" data-color="#fb923c" title="Orange"></button>
  <button class="draw-color-btn" style="background:#f87171" data-color="#f87171" title="Rot"></button>
  <button class="draw-color-btn" style="background:#34d399" data-color="#34d399" title="Grün"></button>
  <button class="draw-color-btn" style="background:#60a5fa" data-color="#60a5fa" title="Blau"></button>
  <button class="draw-color-btn" style="background:#e879f9" data-color="#e879f9" title="Pink"></button>
  <button class="draw-color-btn" style="background:#000000; border:1px solid rgba(255,255,255,0.4)" data-color="#000000" title="Schwarz"></button>
  <!-- Eigene Farbe -->
  <label title="Eigene Farbe" style="position:relative;cursor:pointer">
    <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:conic-gradient(red,yellow,green,cyan,blue,magenta,red);border:2px solid rgba(255,255,255,0.4)"></span>
    <input type="color" id="draw-custom-color" style="position:absolute;opacity:0;width:0;height:0" title="Eigene Farbe">
  </label>
  <div class="draw-sep"></div>
  <!-- Stärke -->
  <input type="range" id="draw-size-slider" min="1" max="40" value="4" title="Strichstärke">
  <div class="draw-sep"></div>
  <button class="draw-tool-btn" id="dt-undo"  title="Rückgängig (Strg+Z)">↩</button>
  <button class="draw-tool-btn" id="dt-clear" title="Alles löschen">🗑</button>
  <div class="draw-sep"></div>
  <button class="draw-tool-btn" id="dt-exit" title="Zeichnen beenden" style="background:rgba(239,68,68,0.2);color:#f87171">✕</button>
</div>

<!-- Floating KI-Chat -->
<button id="ki-fab" title="KI-Assistent">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="11" cy="11" r="10" fill="url(#kg)" opacity="0.9"/>
    <path d="M7 9.5C7 8.1 8.1 7 9.5 7h3C13.9 7 15 8.1 15 9.5v3c0 1.4-1.1 2.5-2.5 2.5H11l-2 2v-2H9.5C8.1 15 7 13.9 7 12.5v-3z" fill="white" opacity="0.95"/>
    <circle cx="9.5" cy="11" r="1" fill="url(#kg2)"/>
    <circle cx="12.5" cy="11" r="1" fill="url(#kg2)"/>
    <defs>
      <linearGradient id="kg" x1="0" y1="0" x2="22" y2="22" gradientUnits="userSpaceOnUse">
        <stop stop-color="#7c3aed"/>
        <stop offset="1" stop-color="#6366f1"/>
      </linearGradient>
      <linearGradient id="kg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="userSpaceOnUse">
        <stop stop-color="#7c3aed"/>
        <stop offset="1" stop-color="#06b6d4"/>
      </linearGradient>
    </defs>
  </svg>
</button>
<div id="ki-panel">
  <div class="ki-resize" id="ki-resize"></div>
  <div id="ki-panel-header">
    <span>🤖</span>
    <b>KI-Assistent</b>
    <small>Zeige ein Bild oder stelle eine Frage</small>
  </div>
  <div id="ki-history"></div>
  <div id="ki-input-row">
    <textarea id="ki-textarea" placeholder='z.B. "Zeige einen Apfel"…' rows="1"></textarea>
    <button id="ki-send">➤</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/01-config.js"></script>
<script src="js/02-auth.js"></script>
<script src="js/03-registry.js"></script>
<script src="js/04-templates.js"></script>
<script src="js/05-state.js"></script>
<script src="js/06-utils.js"></script>
<script src="js/07-render.js"></script>
<script src="js/08-widgets.js"></script>
<script src="js/09-timetable.js"></script>
<script src="js/10-widget-settings.js"></script>
<script src="js/11-modals.js"></script>
<script src="js/12-auth-ui.js"></script>
<script src="js/13-voice.js"></script>
<script src="js/14-ai-generator.js"></script>
<script src="js/15-init.js"></script>
<script src="js/16-voting.js"></script>
<script src="js/17-classes.js"></script>
<script src="js/18-draw.js"></script>
<script src="js/19-toolbar.js"></script>
<script src="js/20-startup.js"></script>
</body>
</html>
