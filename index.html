  url() { return location.origin + '/handy.html#t.' + this.link.chan + '.' + this.link.key; },

  init() {
    try { this.link = JSON.parse(localStorage.getItem(this.LINK_KEY) || 'null'); } catch (e) { this.link = null; }
    // Heute schon benutzt → gleich wieder lauschen, damit das Handy ohne neues Scannen verbunden ist
    if (this.link && this.link.chan && Date.now() - (this.link.used || 0) < 12 * 3600e3) this.connect();
    setInterval(() => this.tick(), 2500);
  },
  connect() {
    if (this.ch) return Promise.resolve(true);
    if (this._connecting) return this._connecting;
    const c = this.client();
    if (!c) return Promise.resolve(false);
    this._connecting = (async () => {
      if (!this.link || !this.link.chan || !this.link.key) { this.link = { chan: KB64.rnd(12), key: KB64.rnd(32), used: 0 }; this.saveLink(); }
      this.key = await crypto.subtle.importKey('raw', KB64.unurl(this.link.key), 'AES-GCM', false, ['encrypt', 'decrypt']);
      const ch = c.channel('kbl-' + this.link.chan, { config: { broadcast: { self: false } } });
      ch.on('broadcast', { event: 'm' }, async ({ payload }) => {
        if (!payload || payload.f !== 'p' || ch !== this.ch) return;
        let m; try { m = await kbUnseal(this.key, payload); } catch (e) { return; }
        try { await this.onMsg(m); } catch (e) { console.warn('[Handy]', e); }
      });
      // Verbindungsdienst nicht erreichbar → im Fenster ehrlich anzeigen statt einen Code, der nicht funktioniert
      ch.subscribe(status => { if (ch !== this.ch) return; this.chState = status; this.paint(); });
      this.ch = ch;
      return true;
    })().catch(() => false);
    this._connecting.then(() => { this._connecting = null; });
    return this._connecting;
  },
  disconnect() {
    this.liveClose(true);
    if (this.ch) { try { this.client().removeChannel(this.ch); } catch (e) {} }
    this.ch = null; this.chState = ''; this.seen = 0; this.wasOnline = false; this.parts = {}; this.lastState = '';
  },
  // Neuer Code: alle bisher gekoppelten Geräte sind damit ausgesperrt
  async reset() {
    this.disconnect();
    this.link = null;
    try { localStorage.removeItem(this.LINK_KEY); } catch (e) {}
    await this.connect();
    this.paint();
  },
  async send(m) {
    if (!this.ch) return;
    try { await this.ch.send({ type: 'broadcast', event: 'm', payload: { f: 'b', ...(await kbSeal(this.key, m)) } }); } catch (e) {}
  },

  tick() {
    const on = this.online();
    const b = document.getElementById('dock-phone');
    if (b) b.classList.toggle('linked', on);
    if (on) this.pushState();
    else if (this.wasOnline) { this.wasOnline = false; this.paint(); }
    // angefangene, nie beendete Übertragungen wegräumen
    Object.keys(this.parts).forEach(id => { if (Date.now() - this.parts[id].at > 60000) delete this.parts[id]; });
  },

  // ── Zustand für die Fernbedienung ──
  controls(w, shell) {
    if (w.type === 'traffic') {
      return [['red', 'Rot'], ['yellow', 'Gelb'], ['green', 'Grün']].map(([k, label]) => ({ k: 's:' + k, label, on: w.config.state === k }));
    }
    // Allgemein: die Knöpfe, die das Element selbst zeigt – die Fernbedienung „tippt" sie an
    const out = [];
    shell.querySelectorAll('.widget-body button').forEach((b, i) => {
      if (out.length >= 10 || b.disabled || !b.offsetParent) return;
      const text = (b.textContent || '').replace(/\s+/g, ' ').trim();
      const label = (text.length >= 2 ? text : (b.getAttribute('aria-label') || b.title || text)).replace(/\s+/g, ' ').trim().slice(0, 26);
      if (!label) return;
      out.push({ k: 'b:' + i, label, on: b.classList.contains('on') || b.classList.contains('active'), go: /^(Start|Weiter|Pause|Nochmal)/.test(label) });
    });
    return out;
  },
  buildState() {
    const board = APP.activeBoard(), widgets = [];
    (board ? board.widgets.slice() : []).sort((a, b) => (a.y - b.y) || (a.x - b.x)).forEach(w => {
      const shell = document.querySelector('[data-wid="' + w.id + '"]');
      if (!shell || widgets.length >= 14) return;
      widgets.push({ id: w.id, label: (REGISTRY[w.type] || {}).label || w.type, full: !!(_wfull && _wfull.id === w.id), controls: this.controls(w, shell) });
    });
    return {
      boards: APP.state.boards.map(b => ({ id: b.id, name: String(b.name || 'Tafel').slice(0, 40) })),
      active: APP.state.activeBoardId, widgets,
      drop: { open: !!this.drop, n: this.drop ? this.drop.items.length : 0 },
    };
  },
  pushState(force) {
    if (!this.ch) return;
    const s = this.buildState(), json = JSON.stringify(s);
    if (!force && json === this.lastState) return;
    this.lastState = json;
    this.send({ t: 'state', s });
  },
  soon() { setTimeout(() => this.pushState(), 250); setTimeout(() => this.pushState(), 1200); },

  async onMsg(m) {
    this.seen = Date.now();
    if (Date.now() - (this.link.used || 0) > 600000) { this.link.used = Date.now(); this.saveLink(); }
    const first = !this.wasOnline;
    this.wasOnline = true;
    if (first) { toast('Handy verbunden'); this.paint(); this.tick(); }
    switch (m.t) {
      case 'hello':
        this.pushState(true);
        if (first) this.dropResend();
        break;
      case 'ph': {
        const n = m.n | 0;
        if (n >= 1 && n <= 80 && typeof m.id === 'string') this.parts[m.id] = { n, got: 0, chunks: [], at: Date.now() };
        break;
      }
      case 'pc': {
        const p = this.parts[m.id];
        if (!p || p.chunks[m.i] != null || typeof m.d !== 'string' || m.d.length > 45000) return;
        p.chunks[m.i] = m.d; p.at = Date.now();
        if (++p.got < p.n) return;
        delete this.parts[m.id];
        try {
          const w = await addPhotoWidget(KB64.dec(p.chunks.join('')), 'Foto vom Handy');
          this.send({ t: w ? 'ph-ok' : 'ph-err', id: m.id });
          if (w) toast('Foto vom Handy ist da');
        } catch (e) { this.send({ t: 'ph-err', id: m.id }); }
        this.soon();
        break;
      }
      case 'text': {
        const v = String(m.v || '').slice(0, 2000).trim();
        if (v && addWidget('text', { text: v }, { w: 460, h: Math.min(420, 150 + Math.ceil(v.length / 34) * 34) })) toast('Text vom Handy ist da');
        this.soon();
        break;
      }
      case 'nav':
        if (m.to === 'next') stepBoard(1);
        else if (m.to === 'prev') stepBoard(-1);
        else if (APP.state.boards.some(b => b.id === m.to)) switchBoard(m.to);
        this.soon();
        break;
      case 'act': this.act(m); this.soon(); break;
      case 'full':
        if (document.querySelector('[data-wid="' + CSS.escape(String(m.wid)) + '"]')) toggleWidgetFull(String(m.wid));
        this.soon();
        break;
      case 'laser': this.laser(m); break;
      case 'live-start': this.liveOpen(); break;
      case 'rtc': await this.liveSignal(m); break;
      case 'lf': this.liveFrame(m.d); break;
      case 'live-stop': this.liveClose(true); break;
      case 'drop-open': await this.dropStart(); break;
      case 'drop-close': this.dropStop(); break;
      case 'drop-approve': await this.dropApprove(String(m.id)); break;
      case 'drop-delete': this.dropDelete(String(m.id)); break;
    }
  },
  act(m) {
    const board = APP.activeBoard(), w = board && board.widgets.find(x => x.id === m.wid), k = String(m.k || '');
    if (!w) return;
    const sel = '[data-wid="' + CSS.escape(w.id) + '"] .widget-body';
    if (k.slice(0, 2) === 's:' && w.type === 'traffic') {
      const st = k.slice(2);
      if (!['red', 'yellow', 'green'].includes(st)) return;
      w.config.state = (w.config.state === st) ? '' : st;
      APP.save();
      const body = document.querySelector(sel);
      if (body) renderWidgetContent(w, body);
    } else if (k.slice(0, 2) === 'b:') {
      const b = document.querySelectorAll(sel + ' button')[parseInt(k.slice(2), 10)];
      if (b && !b.disabled) b.click();
    }
  },
  laser(m) {
    let d = this._laserEl;
    if (!d) { d = this._laserEl = document.createElement('div'); d.id = 'phone-laser'; d.setAttribute('data-kb-keep', ''); document.body.appendChild(d); }
    clearTimeout(this._laserT);
    if (m.off) { d.classList.remove('on'); return; }
    d.style.left = (Math.max(0, Math.min(1, +m.x || 0)) * 100) + 'vw';
    d.style.top = (Math.max(0, Math.min(1, +m.y || 0)) * 100) + 'vh';
    d.classList.add('on');
    this._laserT = setTimeout(() => d.classList.remove('on'), 2500);
  },

  // ── Live-Kamera: Fenster an der Tafel (nicht gespeichert) ──
  liveOpen() {
    if (this.live) { this.liveResetPc(); return; }
    const box = document.createElement('div');
    box.id = 'phone-live';
    box.setAttribute('data-kb-keep', '');
    const head = document.createElement('div'); head.className = 'pl-head';
    const title = document.createElement('b'); title.textContent = 'Handy-Kamera';
    const tag = document.createElement('span'); tag.className = 'pl-tag'; tag.textContent = 'verbinde …';
    const mk = (ic, label, fn) => { const b = document.createElement('button'); b.innerHTML = icon(ic, 20); b.title = label; b.setAttribute('aria-label', label); b.addEventListener('click', fn); return b; };
    head.append(title, tag,
      mk('image', 'Standbild auf die Tafel legen', () => this.liveSnap()),
      mk('maximize', 'Groß / klein', () => box.classList.toggle('big')),
      mk('x', 'Schließen', () => this.liveClose(false)));
    const body = document.createElement('div'); body.className = 'pl-body';
    const video = document.createElement('video'); video.autoplay = true; video.muted = true; video.playsInline = true; video.style.display = 'none';
    const img = document.createElement('img'); img.alt = ''; img.style.display = 'none';
    body.append(video, img);
    box.append(head, body);
    document.body.appendChild(box);
    this.live = { el: box, video, img, tag, pc: null, url: null, rtc: false };
  },
  liveResetPc() {
    const L = this.live; if (!L) return;
    if (L.pc) { try { L.pc.close(); } catch (e) {} L.pc = null; }
    L.rtc = false;
  },
  async liveSignal(m) {
    if (!this.live) this.liveOpen();
    const L = this.live;
    try {
      if (m.k === 'offer') {
        this.liveResetPc();
        const pc = L.pc = new RTCPeerConnection({ iceServers: PHONE_ICE });
        pc.ontrack = e => {
          L.video.srcObject = e.streams[0] || new MediaStream([e.track]);
          L.video.play().catch(() => {});
        };
        pc.onicecandidate = e => { if (e.candidate) this.send({ t: 'rtc', k: 'ice', v: e.candidate.toJSON() }); };
        pc.onconnectionstatechange = () => {
          if (pc !== L.pc) return;
          L.rtc = pc.connectionState === 'connected';
          if (L.rtc) { L.video.style.display = ''; L.img.style.display = 'none'; L.tag.textContent = 'live'; }
        };
        await pc.setRemoteDescription(m.v);
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        this.send({ t: 'rtc', k: 'answer', v: { type: ans.type, sdp: ans.sdp } });
      } else if (m.k === 'ice' && L.pc) {
        await L.pc.addIceCandidate(m.v);
      }
    } catch (e) {}
  },
  liveFrame(d) {
    if (typeof d !== 'string' || d.length > 400000) return;
    if (!this.live) this.liveOpen();
    const L = this.live;
    if (L.rtc) return;
    const url = URL.createObjectURL(new Blob([KB64.dec(d)], { type: 'image/jpeg' })), old = L.url;
    L.url = url;
    L.img.onload = () => { if (old) URL.revokeObjectURL(old); };
    L.img.src = url;
    L.img.style.display = ''; L.video.style.display = 'none';
    L.tag.textContent = 'live · Einzelbilder';
  },
  liveClose(fromPhone) {
    const L = this.live; if (!L) return;
    this.liveResetPc();
    if (L.url) URL.revokeObjectURL(L.url);
    L.el.remove();
    this.live = null;
    if (!fromPhone) this.send({ t: 'live-closed' });
  },
  async liveSnap() {
    const L = this.live; if (!L) return;
    const src = L.rtc ? L.video : L.img, sw = L.rtc ? L.video.videoWidth : L.img.naturalWidth, sh = L.rtc ? L.video.videoHeight : L.img.naturalHeight;
    if (!sw || !sh) return;
    const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    c.getContext('2d').drawImage(src, 0, 0);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.88));
    try { if (await addPhotoWidget(new Uint8Array(await blob.arrayBuffer()), 'Standbild vom Handy')) toast('Standbild liegt auf der Tafel'); } catch (e) {}
  },

  // ── Schüler-Abgabe: eigener Kanal, eigener Schlüssel, nichts erscheint ohne Freigabe ──
  async dropStart() {
    const c = this.client();
    if (this.drop || !c) return;
    const pair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']);
    const pub = KB64.url(await crypto.subtle.exportKey('raw', pair.publicKey));
    const chan = KB64.rnd(10);
    const d = this.drop = { chan, pair, url: location.origin + '/handy.html#s.' + chan + '.' + pub, items: [], peers: {}, ch: null, el: null, showList: false, peek: {} };
    d.ch = c.channel('kbd-' + chan, { config: { broadcast: { self: false } } });
    d.ch.on('broadcast', { event: 'm' }, ({ payload }) => { this.dropMsg(d, payload).catch(() => {}); });
    d.ch.subscribe();
    this.dropPaint();
    this.send({ t: 'drop-reset' });
    this.pushState(true);
    this.paint();
  },
  async dropMsg(d, p) {
    if (d !== this.drop || !p || typeof p.s !== 'string' || p.s.length > 24) return;
    if (p.epk) {
      if (d.peers[p.s] || Object.keys(d.peers).length >= 150) return;
      const pub = await crypto.subtle.importKey('raw', KB64.dec(String(p.epk)), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
      const key = await crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, d.pair.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      d.peers[p.s] = { key, sent: 0, part: null };
      return;
    }
    const peer = d.peers[p.s];
    if (!peer || !p.iv) return;
    const m = await kbUnseal(peer.key, p);
    const reply = async o => { try { await d.ch.send({ type: 'broadcast', event: 'm', payload: { to: p.s, ...(await kbSeal(peer.key, o)) } }); } catch (e) {} };
    if (m.t === 'ph') {
      const n = m.n | 0;
      if (peer.sent >= 5 || d.items.length >= 40 || n < 1 || n > 60) { reply({ t: 'full' }); return; }
      peer.part = { id: m.id, n, got: 0, chunks: [], name: String(m.name || '').replace(/\s+/g, ' ').trim().slice(0, 30) };
    } else if (m.t === 'pc') {
      const part = peer.part;
      if (!part || part.id !== m.id || part.chunks[m.i] != null || typeof m.d !== 'string' || m.d.length > 45000) return;
      part.chunks[m.i] = m.d;
      if (++part.got < part.n) return;
      peer.part = null; peer.sent++;
      const bytes = KB64.dec(part.chunks.join(''));
      const thumb = await this.thumb(bytes);
      if (!thumb) { reply({ t: 'full' }); return; }          // kein Bild
      const item = { id: uid(), name: part.name, bytes, thumb };
      d.items.push(item);
      reply({ t: 'ok' });
      toast('Neue Abgabe' + (item.name ? ' von ' + item.name : ''));
      this.dropPaint();
      this.send({ t: 'drop-item', id: item.id, name: item.name, thumb });
      this.pushState();
    }
  },
  async thumb(bytes) {
    try {
      const bmp = await createImageBitmap(new Blob([bytes], { type: 'image/jpeg' }));
      const k = Math.min(1, 260 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      return c.toDataURL('image/jpeg', 0.6).split(',')[1];
    } catch (e) { return null; }
  },
  dropResend() { if (this.drop) this.drop.items.forEach((it, i) => setTimeout(() => this.send({ t: 'drop-item', id: it.id, name: it.name, thumb: it.thumb }), 200 + i * 120)); },
  async dropApprove(id) {
    const d = this.drop, it = d && d.items.find(x => x.id === id);
    if (!it) return;
    d.items = d.items.filter(x => x.id !== id);
    try { await addPhotoWidget(it.bytes, 'Abgabe' + (it.name ? ' von ' + it.name : '')); } catch (e) {}
    this.send({ t: 'drop-gone', id });
    this.dropPaint(); this.pushState();
  },
  dropDelete(id) {
    const d = this.drop; if (!d) return;
    d.items = d.items.filter(x => x.id !== id);
    this.send({ t: 'drop-gone', id });
    this.dropPaint(); this.pushState();
  },
  dropStop() {
    const d = this.drop; if (!d) return;
    try { this.client().removeChannel(d.ch); } catch (e) {}
    if (d.el) d.el.remove();
    this.drop = null;
    this.send({ t: 'drop-reset' });
    this.pushState(true);
    this.paint();
  },
  dropPaint() {
    const d = this.drop; if (!d) return;
    if (!d.el) {
      const el0 = d.el = document.createElement('div');
      el0.id = 'drop-card';
      el0.setAttribute('data-kb-keep', '');
      const qr = document.createElement('div'); qr.className = 'dc-qr';
      try { new QRCode(qr, { text: d.url, width: 232, height: 232, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
      const t = document.createElement('div'); t.className = 'dc-title'; t.textContent = 'Foto abgeben';
      const s = document.createElement('div'); s.className = 'dc-sub'; s.textContent = 'Code mit der Handy-Kamera scannen';
      const list = document.createElement('div'); list.className = 'dc-list';
      const foot = document.createElement('div'); foot.className = 'dc-foot';
      el0.append(t, s, qr, foot, list);
      document.body.appendChild(el0);
      d.list = list; d.foot = foot; d.qr = qr;
    }
    const mk = (label, cls, fn) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.addEventListener('click', fn); return b; };
    d.foot.replaceChildren(
      mk(d.items.length ? 'Eingang (' + d.items.length + ')' : 'Eingang leer', d.items.length ? 'go' : '', () => { d.showList = !d.showList; this.dropPaint(); }),
      mk(d.qr.style.display === 'none' ? 'Code zeigen' : 'Code ausblenden', '', () => { d.qr.style.display = d.qr.style.display === 'none' ? '' : 'none'; this.dropPaint(); }),
      mk('Beenden', 'danger', () => { if (!d.items.length || confirm('Abgabe beenden? Nicht gezeigte Fotos werden verworfen.')) this.dropStop(); }));
    d.list.replaceChildren();
    if (!d.showList) return;
    // Der Eingang zeigt zuerst nur Namen – die Klasse schaut mit. Ein Foto erscheint erst nach „Ansehen" oder „Zeigen".
    d.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'dc-row';
      const name = document.createElement('b'); name.textContent = it.name || 'Ohne Namen';
      const btns = document.createElement('div');
      btns.append(
        mk(d.peek[it.id] ? 'Verbergen' : 'Ansehen', '', () => { d.peek[it.id] = !d.peek[it.id]; this.dropPaint(); }),
        mk('Zeigen', 'go', () => this.dropApprove(it.id)),
        mk('Löschen', '', () => this.dropDelete(it.id)));
      row.append(name, btns);
      if (d.peek[it.id]) { const im = document.createElement('img'); im.alt = ''; im.src = 'data:image/jpeg;base64,' + it.thumb; row.appendChild(im); }
      d.list.appendChild(row);
    });
  },

  // ── Fenster „Handy verbinden" ──
  toggle() {
    if (this.panel) { this.panel.remove(); this.panel = null; return; }
    const p = this.panel = document.createElement('div');
    p.id = 'phone-panel';
    p.setAttribute('data-kb-keep', '');
    document.body.appendChild(p);
    this.paint();
    if (!this.client()) return;
    this.connect().then(ok => {
      if (ok && this.link) { this.link.used = Date.now(); this.saveLink(); }
      this.paint();
    });
  },
  paint() {
    const p = this.panel; if (!p) return;
    const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const head = mk('div', 'pp-head');
    const close = mk('button', 'pp-x'); close.innerHTML = icon('x', 20); close.setAttribute('aria-label', 'Schließen'); close.addEventListener('click', () => this.toggle());
    head.append(mk('b', '', 'Handy verbinden'), close);
    p.replaceChildren(head);
    if (!this.client()) { p.append(mk('p', 'pp-note', 'Die Handy-Verbindung braucht Internet und einen aktuellen Browser.')); return; }
    if (!this.ch || !this.link || !this.chState) { p.append(mk('p', 'pp-note', 'Verbindung wird vorbereitet …')); return; }
    if (this.chState !== 'SUBSCRIBED') {
      p.append(mk('p', 'pp-note', 'Der Verbindungsdienst ist gerade nicht erreichbar. Prüfe das Internet und versuche es gleich noch einmal.'));
      const again = mk('button', 'pp-btn sec', 'Nochmal versuchen');
      again.addEventListener('click', () => { this.disconnect(); this.chState = ''; this.paint(); this.connect().then(() => this.paint()); });
      p.append(again);
      return;
    }
    const on = this.online();
    if (on) {
      const ok = mk('div', 'pp-ok'); ok.innerHTML = icon('check', 26);
      ok.append(mk('span', '', 'Handy ist verbunden'));
      p.append(ok, mk('p', 'pp-note', 'Am Handy kannst du jetzt Fotos schicken, die Kamera live zeigen und die Tafel fernbedienen.'));
      const b = mk('button', 'pp-btn', this.drop ? 'Schüler-Abgabe beenden' : 'Schüler-Abgabe starten');
      b.addEventListener('click', () => { if (this.drop) this.dropStop(); else this.dropStart(); });
      p.append(b);
    }
    const det = mk('div', 'pp-qr-wrap');
    const qr = mk('div', 'pp-qr');
    try { new QRCode(qr, { text: this.url(), width: 212, height: 212, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
    if (on) {
      const more = mk('button', 'pp-link', 'Weiteres Gerät verbinden');
      qr.style.display = 'none';
      more.addEventListener('click', () => { qr.style.display = qr.style.display === 'none' ? '' : 'none'; });
      det.append(more, qr);
    } else {
      const ol = mk('ol', 'pp-steps');
      ['Kamera-App am iPhone, iPad oder Android-Handy öffnen', 'Auf den Code halten und den Link antippen', 'Fertig – Foto, Live-Kamera und Fernbedienung'].forEach(t => ol.append(mk('li', '', t)));
      det.append(qr, ol);
      if (!this.drop) {
        const b = mk('button', 'pp-btn sec', 'Schüler-Abgabe starten (ohne Handy)');
        b.addEventListener('click', () => this.dropStart());
        det.append(b);
      }
    }
    p.append(det);
    const foot = mk('div', 'pp-foot');
    foot.append(mk('span', '', 'Ende-zu-Ende verschlüsselt. Fotos bleiben auf diesem Gerät.'));
    const reset = mk('button', 'pp-link', 'Neuen Code erzeugen');
    reset.title = 'Alle bisher verbundenen Handys werden getrennt';
    reset.addEventListener('click', () => { if (confirm('Neuen Code erzeugen? Bisher verbundene Handys müssen den neuen Code scannen.')) this.reset(); });
    foot.append(reset);
    p.append(foot);
  },
};

// ══════════════════════════════════════════════════════════════
// AKTUALISIERUNG IM HINTERGRUND
// Der Service Worker (sw.js) startet die Tafel vom Gerät und lädt neue Versionen nebenbei. Hier wird nur
// entschieden, WANN die neue Version eingesetzt wird: in einem Moment, in dem es niemand merkt und nichts verloren geht.
// ══════════════════════════════════════════════════════════════
const KB_VER = document.documentElement.getAttribute('data-kb-ver') || '';   // Kennung dieser Version, setzt der Service Worker
const UPDATE = { ready: false, loadedAt: Date.now(), lastInput: 0, hiddenAt: 0 };

// Neu laden nur, wenn gerade nichts läuft, das dabei abbrechen würde
function canSilentReload() {
  if (APP._resetting || APP._booting) return false;
  if (document.fullscreenElement || document.webkitFullscreenElement) return false;   // Browser-Vollbild ginge verloren
  if (_wfull || DRAW.active) return false;
  if (PHONE.live || PHONE.drop || PHONE.busy()) return false;                          // Live-Kamera, Abgabe oder Foto unterwegs
  if (document.querySelector('.modal-overlay, #widget-menu, #more-menu, #ki-panel.open, #voting-page, .draw-float')) return false;
  if (Object.keys(AUDIO_STREAMS).length || CAM_ON.size) return false;                 // Mikrofon/Kamera an
  if (document.querySelector('#widgets-layer iframe, #widgets-layer video, #widgets-layer audio')) return false;   // evtl. läuft Musik/ein Film
  if (APP.state.boards.some(b => (b.widgets || []).some(w => w._timerRunning || w._swRunning))) return false;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return false;
  return true;
}

function maybeApplyUpdate() {
  if (!UPDATE.ready || !canSilentReload()) return;
  const now = Date.now();
  const fresh = !UPDATE.lastInput && now - UPDATE.loadedAt < 20000;         // gerade gestartet, noch nichts angefasst
  const away = UPDATE.hiddenAt && now - UPDATE.hiddenAt > 60000;            // seit einer Minute nicht sichtbar
  const idle = now - (UPDATE.lastInput || UPDATE.loadedAt) > 20 * 60000;    // 20 Minuten nichts angefasst
  if (!fresh && !away && !idle) return;
  try {
    if (now - (+sessionStorage.getItem('kb_upd_at') || 0) < 120000) return; // nie in eine Neulade-Schleife geraten
    sessionStorage.setItem('kb_upd_at', String(now));
  } catch (e) { return; }
  flushPendingSaves();
  location.reload();
}

function checkForUpdate() {
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (sw && KB_VER) sw.postMessage({ type: 'kb-check' });
}

function initBackgroundUpdate() {
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type !== 'kb-ver' || !KB_VER || !d.ver) return;
    UPDATE.ready = d.ver !== KB_VER;
    maybeApplyUpdate();
  });
  ['pointerdown', 'keydown', 'wheel'].forEach(t =>
    window.addEventListener(t, () => { UPDATE.lastInput = Date.now(); }, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { UPDATE.hiddenAt = Date.now(); return; }
    maybeApplyUpdate();
    UPDATE.hiddenAt = 0;
    checkForUpdate();
  });
  window.addEventListener('online', checkForUpdate);
  setTimeout(checkForUpdate, 3000);
  setInterval(checkForUpdate, 30 * 60000);
  setInterval(maybeApplyUpdate, 60000);
}

// ══════════════════════════════════════════════════════════════
// STARTUP
// ══════════════════════════════════════════════════════════════
const _pollParam = new URLSearchParams(window.location.search).get('poll');
if (_pollParam) {
  showVotingPage(_pollParam);
} else {
  AUTH.init();
  DRAW.init();
  initChromeIcons();
  renderDock();
  applyChromePrefs();
  const fontReadyAtStart = !document.fonts || document.fonts.check('16px "Atkinson Hyperlegible Next"');
  init();
  if (!fontReadyAtStart) {
    // Schriftgrößen wurden noch mit der Ersatzschrift berechnet → nach dem Laden einmal neu messen
    document.fonts.load('400 16px "Atkinson Hyperlegible Next"')
      .then(() => { _measureCache.clear(); renderWidgets(); })
      .catch(() => {});
  }
  if (new URLSearchParams(window.location.search).has('reset')) openResetDialog();
  checkSharedBoard();
  UMZUG.init();
  PHONE.init();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    initBackgroundUpdate();
  }
}
</script>
