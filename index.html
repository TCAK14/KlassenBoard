  _showTextInput(x, y) {
    // Remove any existing text input
    document.getElementById('draw-text-input')?.remove();

    const fs = Math.max(16, this.size * 3);
    const inp = document.createElement('input');
    inp.id = 'draw-text-input';
    inp.type = 'text';
    inp.placeholder = 'Text eingeben…';
    inp.style.cssText = [
      'position:fixed',
      'z-index:9999',
      'background:rgba(0,0,0,0.85)',
      'color:' + this.color,
      'border:2px solid #facc15',
      'border-radius:8px',
      'padding:6px 12px',
      'font-size:' + fs + 'px',
      'outline:none',
      'backdrop-filter:blur(6px)',
      'min-width:120px',
      'max-width:400px',
      'width:auto',
    ].join(';');

    // Position near click, keep inside viewport
    const vpW = window.innerWidth, vpH = window.innerHeight;
    inp.style.left = Math.min(x, vpW - 180) + 'px';
    inp.style.top  = Math.min(y - fs/2, vpH - 60) + 'px';

    document.body.appendChild(inp);
    requestAnimationFrame(() => { inp.focus(); });

    const self = this;
    // Das Entfernen des Feldes löst selbst ein blur aus — ohne diese Sperre wurde der Text
    // doppelt gezeichnet, und ESC hat ihn trotzdem eingefügt.
    let finished = false;
    const commit = () => {
      if (finished) return;
      finished = true;
      const txt = inp.value.trim();
      const off = self._scrollOffset();
      const px = parseInt(inp.style.left) + off.x;
      const py = parseInt(inp.style.top) + fs + off.y;
      inp.remove();
      if (!txt) return;
      if (off.x || off.y) self._resize(window.innerWidth + off.x, window.innerHeight + off.y);
      self._pushHistory();
      self._markInk('ink');
      self.ctx.globalCompositeOperation = 'source-over';
      self.ctx.fillStyle = self.color;
      self.ctx.font = `bold ${fs}px sans-serif`;
      self.ctx.shadowBlur = 0;
      self.ctx.fillText(txt, px, py);
      clearTimeout(self._saveTimer);
      self._scheduleSave(400);
    };

    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Escape') { finished = true; inp.remove(); return; }
      if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    });
    inp.addEventListener('blur', () => setTimeout(commit, 120));
  },

  _initTextTool() { /* text handled in _showTextInput, called from _start */ },

  _resize(needW, needH) {
    if (!this.canvas) return;
    // Canvas wächst nur — beim Verkleinern des Fensters würde die Zeichnung
    // sonst irreversibel abgeschnitten (Orientierungswechsel auf Tablets!).
    // Wird in einem gescrollten Bereich der Tafel gezeichnet, wächst er bei Bedarf dorthin
    // (needW/needH) — aber nie pauschal auf die ganze Tafel und gedeckelt (Speicher!).
    const W = Math.min(5000, Math.max(window.innerWidth,  needW || 0, this.canvas.width));
    const H = Math.min(4000, Math.max(window.innerHeight, needH || 0, this.canvas.height));
    if (this.canvas.width === W && this.canvas.height === H) return; // no change — don't clear
    // Inhalt synchron über eine Kopie retten (vorher: asynchron per Bild — Striche in der Zwischenzeit gingen verloren)
    let copy = null;
    if (this.canvas.width > 0 && this.canvas.height > 0) {
      copy = document.createElement('canvas');
      copy.width = this.canvas.width; copy.height = this.canvas.height;
      copy.getContext('2d').drawImage(this.canvas, 0, 0);
    }
    this.canvas.width  = W;
    this.canvas.height = H;
    if (copy) this.ctx.drawImage(copy, 0, 0);
    this.history = [];   // alte Undo-Schnappschüsse passen nicht mehr zur neuen Größe
    this.redo = [];
  },

  // Verschiebung der Zeichenebene = Scrollposition der Tafel
  _scrollOffset() {
    const b = document.getElementById('board');
    return { x: b ? b.scrollLeft : 0, y: b ? b.scrollTop : 0 };
  },
  _syncScroll() {
    if (!this.canvas) return;
    const o = this._scrollOffset();
    this.canvas.style.transform = (o.x || o.y) ? 'translate(' + (-o.x) + 'px,' + (-o.y) + 'px)' : '';
    if (this._sel) this._placeSel();
  },
  // Bildschirm- → Zeichenebenen-Koordinaten
  _getPos(e) {
    const o = this._scrollOffset();
    return { x: e.clientX + o.x, y: e.clientY + o.y };
  },

  // Undo-Schnappschuss mit Speicher-Deckel: 30 Vollbilder wären bei 1920×1080 rund 250 MB
  redo: [],
  _pushHistory() {
    this.redo = [];   // nach einer neuen Aktion gibt es nichts mehr zu wiederholen
    try {
      this.history.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height));
    } catch(e) { this.history = []; return; }
    const bytes = this.canvas.width * this.canvas.height * 4;
    const max = Math.max(1, Math.min(30, Math.floor(96e6 / Math.max(bytes, 1))));
    while (this.history.length > max) this.history.shift();
  },

  _start(e) {
    if (!this.active) return;
    // Nur der erste Finger zeichnet — zweiter Finger/Handballen erzeugt sonst Querstriche
    if (!e.isPrimary) return;
    if (this.tool === 'text') {
      this._showTextInput(e.clientX, e.clientY);
      return;
    }
    e.preventDefault();
    // Capture pointer so drawing works even outside window
    try { this.canvas.setPointerCapture(e.pointerId); } catch(_) {}

    // Laserpointer: nur eine verblassende Spur, verändert die Zeichnung nicht
    if (this.tool === 'laser') {
      this.drawing = true;
      this._laserStroke = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
      this._laserStrokes.push(this._laserStroke);
      this._laserLoop();
      return;
    }

    // Wird in einem gescrollten Bereich gezeichnet, muss die Zeichenebene bis dorthin reichen
    const off = this._scrollOffset();
    if (off.x || off.y) this._resize(window.innerWidth + off.x, window.innerHeight + off.y);
    this._syncScroll();

    if (this.tool === 'select') { this._selStart(e); return; }

    this._pushHistory();   // Undo snapshot
    this._markInk(this.tool === 'eraser' ? 'unknown' : 'ink');

    let p = this._getPos(e);
    this.drawing = true;
    this._rafPending = false;
    this._stroke = null;
    // Formen: Startpunkt merken; die Vorschau wird über dem Undo-Schnappschuss gezeichnet
    this._shape = DRAW_SHAPES.includes(this.tool)
      ? { x0: p.x, y0: p.y, snap: this.history[this.history.length - 1] || null } : null;
    // Striche und gerade Linien, die an einer Kante von Lineal/Geodreieck beginnen, laufen exakt an der Kante
    const guide = this.tool !== 'eraser' && (!this._shape || this.tool === 'line' || this.tool === 'arrow') ? this._instrSnap(p) : null;
    if (this._shape) {
      this._shape.guide = guide;
      if (guide) { const q = this._projectOn(guide, p); this._shape.x0 = q.x; this._shape.y0 = q.y; }
    }
    this._rulerLine = this._shape ? null : guide;
    if (this._rulerLine) p = this._project(p);
    p.t = e.timeStamp;
    this._pts = [p];
    if (this._shape) return;

    // Strich anlegen: Aussehen festhalten, Anfangspunkt setzen
    const spec = this._strokeSpec();
    const ctx = spec.live ? this._liveBegin(spec) : this.ctx;
    const st = this._stroke = { spec, ctx, w: spec.width * (spec.vary ? 0.55 : 1), begun: false };
    this._applyStyle(ctx, spec);
    ctx.beginPath();
    ctx.arc(p.x, p.y, st.w / 2, 0, Math.PI * 2);
    ctx.fill();
    if (spec.grain) this._grain(ctx, spec, p.x, p.y, p.x, p.y);
  },

  _move(e) {
    if (!this.active || !this.drawing) return;
    if (!e.isPrimary) return;
    e.preventDefault();

    // Collect all coalesced points for stylus/high-freq input
    // (liefert der Browser keine Zwischenpunkte, das Ereignis selbst verwenden — sonst entstünde nur ein Punkt)
    const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    const events = coalesced && coalesced.length ? coalesced : [e];
    const off = this._scrollOffset();
    if (this.tool === 'laser') {
      const now = performance.now();
      if (this._laserStroke) events.forEach(ev => this._laserStroke.push({ x: ev.clientX, y: ev.clientY, t: now }));
      this._laserLoop();
      return;
    }
    if (this.tool === 'select') { this._selMove(e); return; }
    if (this._shape) {
      const ev = events[events.length - 1];
      this._shape.x1 = ev.clientX + off.x; this._shape.y1 = ev.clientY + off.y;
      if (this._shape.guide) {
        const q = this._projectOn(this._shape.guide, { x: this._shape.x1, y: this._shape.y1 });
        this._shape.x1 = q.x; this._shape.y1 = q.y;
      }
      if (!this._rafPending) {
        this._rafPending = true;
        requestAnimationFrame(() => { this._rafPending = false; this._previewShape(); });
      }
      return;
    }
    for (const ev of events) {
      const q = { x: ev.clientX + off.x, y: ev.clientY + off.y };
      const pt = this._rulerLine ? this._project(q) : q;
      pt.t = ev.timeStamp;
      // Echter Stift mit Drucksensor: Druck statt Tempo bestimmt die Breite (0.5 = „kein Sensor")
      if (ev.pointerType === 'pen' && ev.pressure > 0 && ev.pressure !== 0.5) pt.p = ev.pressure;
      this._pts.push(pt);
    }

    if (!this._rafPending) {
      this._rafPending = true;
      requestAnimationFrame(() => {
        this._rafPending = false;
        this._flushPoints();
      });
    }
  },

  _flushPoints(final) {
    const pts = this._pts;
    if (pts.length < 2) return;
    const st = this._stroke || (this._stroke = { spec: this._strokeSpec(), ctx: this.ctx, w: this.size, begun: false });
    const ctx = st.ctx, spec = st.spec;
    this._applyStyle(ctx, spec);
    if (spec.vary) { this._flushVary(st, final); return; }

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    let x0 = pts[0].x, y0 = pts[0].y, x1 = x0, y1 = y0;

    // Quadratic bezier through midpoints — smooth, precise
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i+1].x) / 2;
      const my = (pts[i].y + pts[i+1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    // Last segment to current point
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.stroke();
    if (spec.grain) {
      for (const q of pts) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
      this._grain(ctx, spec, x0, y0, x1, y1);
    }

    // Keep only the last point as the new start
    this._pts = [last];
  },

  // Füller und Pinsel: die Breite folgt dem Tempo (langsam = breit, schnell = dünn) bzw. dem Druck eines Stifts.
  // Gezeichnet wird in kurzen Stücken durch die Mittelpunkte, jedes mit seiner eigenen Breite.
  _flushVary(st, final) {
    const ctx = st.ctx, spec = st.spec, pts = this._pts;
    const piece = (ax, ay, cx, cy, bx, by, w0, w1) => {
      const len = Math.hypot(cx - ax, cy - ay) + Math.hypot(bx - cx, by - cy);
      const n = Math.max(1, Math.ceil(len / 3));
      let px = ax, py = ay;
      for (let k = 1; k <= n; k++) {
        const t = k / n, u = 1 - t;
        const x = u * u * ax + 2 * u * t * cx + t * t * bx, y = u * u * ay + 2 * u * t * cy + t * t * by;
        ctx.lineWidth = w0 + (w1 - w0) * t;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
        px = x; py = y;
      }
    };
    const nextWidth = (a, b) => {
      const d = Math.hypot(b.x - a.x, b.y - a.y), dt = Math.max(1, (b.t || 0) - (a.t || 0));
      let f = b.p ? 0.35 + b.p * 1.2 : 1.45 / (1 + (d / dt) * 1.1);
      f = Math.max(spec.vary[0], Math.min(spec.vary[1], f));
      return st.w + (spec.width * f - st.w) * 0.35;   // weich nachziehen statt springen
    };
    if (!st.begun) {
      st.begun = true;
      const a = pts[0], b = pts[1], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, w1 = nextWidth(a, b);
      piece(a.x, a.y, a.x, a.y, mx, my, st.w, w1);
      st.w = w1;
    }
    while (pts.length >= 3) {
      const p0 = pts[0], p1 = pts[1], p2 = pts[2], w1 = nextWidth(p0, p2);
      piece((p0.x + p1.x) / 2, (p0.y + p1.y) / 2, p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2, st.w, w1);
      st.w = w1;
      pts.shift();
    }
    if (final && pts.length === 2) {
      // Auslauf: der Strich wird zum Ende hin dünner
      const a = pts[0], b = pts[1], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      piece(mx, my, mx, my, b.x, b.y, st.w, st.w * 0.5);
      this._pts = [b];
    }
  },

  _end(e) {
    if (!this.drawing) return;
    this.drawing = false;
    if (this.tool === 'laser') { this._laserStroke = null; try { this.canvas.releasePointerCapture(e.pointerId); } catch(_) {} return; }
    if (this.tool === 'select') { this._selEnd(); try { this.canvas.releasePointerCapture(e.pointerId); } catch(_) {} return; }
    if (this._shape) { this._previewShape(true); this._shape = null; }
    // Flush remaining points
    else if (this._pts && this._pts.length > 1) this._flushPoints(true);
    // Textmarker/Bleistift/Kreide: den fertigen Strich in einem Schritt auf die Zeichnung legen
    if (this._stroke && this._stroke.spec.live) this._liveCommit(this._stroke.spec);
    this._stroke = null;
    this._rulerLine = null;
    try { this.canvas.releasePointerCapture(e.pointerId); } catch(_) {}
    // Debounced save — don't call toDataURL on every stroke end
    clearTimeout(this._saveTimer);
    this._scheduleSave(800);
  },

  // Stil für einen Strich setzen. Ohne Angaben: Zeichenebene und aktuelles Werkzeug (Formen nutzen das so).
  _applyStyle(ctx, spec) {
    ctx = ctx || this.ctx;
    spec = spec || this._strokeSpec();
    ctx.setLineDash([]);
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = spec.width;
    if (this.tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.fillStyle   = 'rgba(0,0,0,1)';
    } else {
      // Immer voll deckend zeichnen – durchscheinende Werkzeuge bekommen ihre Deckkraft über die laufende Ebene
      ctx.strokeStyle = this.color;
      ctx.fillStyle   = this.color;
    }
  },

  _lineWidth() { return this._strokeSpec().width; },

  _undo() {
    if (this._sel) { this._sel.el.remove(); this._sel = null; }
    if (this.history.length === 0) return;
    const snap = this.history.pop();
    try { this.redo.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height)); } catch(e) { this.redo = []; }
    if (this.redo.length > 10) this.redo.shift();
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.ctx.putImageData(snap, 0, 0);
    this._markInk('unknown');
    clearTimeout(this._saveTimer);
    this._scheduleSave(800);
  },
  _redo() {
    if (!this.redo.length) return;
    const snap = this.redo.pop();
    try { this.history.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height)); } catch(e) {}
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.ctx.putImageData(snap, 0, 0);
    this._markInk('unknown');
    clearTimeout(this._saveTimer);
    this._scheduleSave(800);
  },

  // Merkt, ob die Zeichenebene Inhalt hat und ob er seit dem letzten Sichern verändert wurde.
  // Erspart das Durchsuchen/Kodieren der ganzen Fläche bei jedem Tafelwechsel.
  _ink: 'empty',        // 'empty' | 'ink' | 'unknown' (z.B. nach Radieren)
  _inkDirty: false,
  _markInk(state) { this._ink = state; this._inkDirty = true; },
  _hasInk() {
    if (this._ink === 'unknown') this._ink = this._isCanvasEmpty() ? 'empty' : 'ink';
    return this._ink === 'ink';
  },

  // Save drawing of current board before switching
  saveBoard(boardId) {
    if (!this.canvas || !boardId) return;
    // Direkter Aufruf (Tafelwechsel, Zeichnen beenden): schwebende Auswahl erst ablegen
    if (this._sel) this._commitSel(true);
    if (!this._hasInk()) {
      if (this.boardDrawings[boardId]) { delete this.boardDrawings[boardId]; this._persistDrawings(); }
    } else if (this._inkDirty || !this.boardDrawings[boardId]) {
      // Nur neu kodieren, wenn sich wirklich etwas geändert hat. (Sonst würde ein schneller
      // Tafelwechsel vor dem Fertigladen eine leere Fläche über die Zeichnung speichern.)
      this.boardDrawings[boardId] = this.canvas.toDataURL();
      this._persistDrawings();
    }
    this._inkDirty = false;
    this._updateKeepVisible();
  },

  // Load drawing for new board (clear canvas if none)
  loadBoard(boardId) {
    if (!this.canvas || !boardId) return;
    // Race-Schutz: bei schnellem Doppel-Wechsel darf nur der letzte Load zeichnen
    const token = (this._loadToken = (this._loadToken || 0) + 1);
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.history = [];
    const dataURL = this.boardDrawings[boardId];
    this._ink = dataURL ? 'ink' : 'empty';
    this._inkDirty = false;
    if (dataURL) {
      const img = new Image();
      img.onload = () => {
        if (token !== this._loadToken) return;
        // Gespeicherte Zeichnung kann größer sein als die aktuelle Fläche (anderes Gerät/gescrollt)
        this._resize(img.naturalWidth, img.naturalHeight);
        this.ctx.drawImage(img, 0, 0);
      };
      img.src = dataURL;
    }
    this._syncScroll();
    this._updateKeepVisible();
  },

  // Zeichnung außerhalb des Zeichenmodus sichtbar lassen (nicht interaktiv)
  _updateKeepVisible() {
    if (!this.canvas) return;
    const has = !!(APP.state && this.boardDrawings[APP.state.activeBoardId]);
    this.canvas.classList.toggle('keep-visible', !this.active && has);
  },

  _isCanvasEmpty() {
    if (!this.canvas || this.canvas.width === 0) return true;
    const d = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] !== 0) return false;
    return true;
  },

  // Zeichnungen überleben Reload — separater Key, damit Board-Daten bei vollem Speicher Vorrang behalten
  _persistDrawings() {
    if (APP._resetting) return;
    try {
      // Zeichnungen gelöschter Tafeln nicht ewig mitschleppen
      const alive = new Set();
      (APP.state.boards || []).forEach(b => alive.add(b.id));
      Object.values(CLASSES._data()).forEach(cl => ((cl && cl.boards) || []).forEach(b => alive.add(b.id)));
      if (alive.size) Object.keys(this.boardDrawings).forEach(id => { if (!alive.has(id)) delete this.boardDrawings[id]; });
      localStorage.setItem('classpuls_drawings', JSON.stringify(this.boardDrawings));
    } catch(e) {
      try { localStorage.removeItem('classpuls_drawings'); } catch(_) {}
      if (!this._quotaWarned) {
        this._quotaWarned = true;
        toast('ℹ️ Zeichnungen sind zu groß zum dauerhaften Speichern — sie bleiben, bis der Tab geschlossen wird', 6000);
      }
    }
  },

  restoreDrawings() {
    try { this.boardDrawings = JSON.parse(localStorage.getItem('classpuls_drawings') || '{}') || {}; }
    catch(e) { this.boardDrawings = {}; }
    if (APP.state && APP.state.activeBoardId) this.loadBoard(APP.state.activeBoardId);
  }
};



// ══════════════════════════════════════════════════════════════
// KI-ASSISTENT (Gemini über die Netlify-Funktion ai-chat, Bilder über image-search)
// ══════════════════════════════════════════════════════════════
(function() {
  const panel = document.getElementById('ki-panel');
  const historyEl = document.getElementById('ki-history');
  const textarea = document.getElementById('ki-textarea');
  const sendBtn = document.getElementById('ki-send');
  const foot = document.getElementById('ki-foot');
  if (!panel) return;

  const TEXT_AI_KEY = 'kb_text_ai_count';
  const MAX_FREE_TEXT = 50;
  const SUGGESTIONS = [
    '5 Kopfrechen-Aufgaben für Klasse 3',
    'Erkläre Photosynthese für Klasse 5',
    'Zeige einen Vulkan',
    '3 Ideen für eine Bewegungspause',
    'Quizfrage zu Europa mit 4 Antworten',
    'Schreibanlass für Klasse 4',
  ];
  let sending = false;
  let chatHistory = [];

  panel.querySelector('.ki-logo').innerHTML = icon('ai', 22);
  document.getElementById('ki-new').innerHTML = icon('reset', 18);
  document.getElementById('ki-big').innerHTML = icon('maximize', 18);
  document.getElementById('ki-close').innerHTML = icon('x', 20);
  sendBtn.innerHTML = icon('play', 20);

  // ── Öffnen / Schließen ──
  const isOpen = () => panel.classList.contains('open');
  function setOpen(open) {
    panel.classList.toggle('open', open);
    if (!open) return;
    if (!historyEl.childElementCount) renderEmpty();
    updateFoot();
    // auf Touch-Geräten nicht automatisch ins Feld springen (Bildschirmtastatur verdeckt alles)
    if (window.matchMedia && window.matchMedia('(pointer:fine)').matches) textarea.focus();
  }
  window.toggleKiPanel = () => setOpen(!isOpen());
  document.getElementById('ki-close').addEventListener('click', () => setOpen(false));
  // Das Fenster wird auch von außen geschlossen (ESC) — Knopf in der Leiste nachziehen
  new MutationObserver(() => {
    document.getElementById('dock-ki')?.classList.toggle('on', isOpen());
  }).observe(panel, { attributes: true, attributeFilter: ['class'] });

  // Groß anzeigen: Antworten für die ganze Klasse lesbar
  document.getElementById('ki-big').addEventListener('click', () => {
    const big = panel.classList.toggle('big');
    const b = document.getElementById('ki-big');
    b.innerHTML = icon(big ? 'minimize' : 'maximize', 18);
    b.title = big ? 'Wieder klein anzeigen' : 'Groß anzeigen – für die ganze Klasse lesbar';
    historyEl.scrollTop = historyEl.scrollHeight;
  });
  document.getElementById('ki-new').addEventListener('click', () => {
    if (sending) return;
    chatHistory = [];
    renderEmpty();
  });

  // Größe ändern (Griff oben links, das Fenster ist unten rechts verankert)
  const rh = document.getElementById('ki-resize');
  if (rh) {
    let dragging = false, sx, sy, sw, sh;
    rh.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      dragging = true; sx = e.clientX; sy = e.clientY;
      sw = panel.offsetWidth; sh = panel.offsetHeight;
      rh.setPointerCapture(e.pointerId);
    });
    rh.addEventListener('pointermove', e => {
      if (!dragging) return;
      panel.style.width = Math.max(300, Math.min(sw - (e.clientX - sx), window.innerWidth - 24)) + 'px';
      panel.style.height = Math.max(320, Math.min(sh - (e.clientY - sy), window.innerHeight - 120)) + 'px';
    });
    rh.addEventListener('pointerup', () => dragging = false);
    rh.addEventListener('lostpointercapture', () => dragging = false);
  }

  function updateFoot() {
    const hint = 'Bitte keine Namen oder Daten von Kindern eingeben.';
    if (isPro()) { foot.textContent = hint; return; }
    const left = Math.max(0, MAX_FREE_TEXT - (parseInt(localStorage.getItem(TEXT_AI_KEY) || '0', 10) || 0));
    foot.textContent = 'Noch ' + left + ' von ' + MAX_FREE_TEXT + ' kostenlosen Fragen · ' + hint;
  }

  function scrollDown() { historyEl.scrollTop = historyEl.scrollHeight; }

  // ── Leerer Zustand: Beispiele zum Antippen ──
  function renderEmpty() {
    historyEl.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'ki-empty';
    const h = document.createElement('div'); h.className = 'ki-empty-title';
    h.textContent = 'Wobei kann ich helfen?';
    const p = document.createElement('div'); p.className = 'ki-empty-sub';
    p.textContent = 'Aufgaben, Erklärungen, Ideen oder ein Bild – die Antwort kannst du direkt auf die Tafel legen.';
    const chips = document.createElement('div'); chips.className = 'ki-chips';
    SUGGESTIONS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'ki-chip';
      b.textContent = s;
      b.addEventListener('click', () => ask(s));
      chips.appendChild(b);
    });
    box.append(h, p, chips);
    historyEl.appendChild(box);
  }

  // ── Antwort-Text sicher formatieren (Markdown → DOM, ohne innerHTML) ──
  function inlineMd(parent, s) {
    const re = /\*\*([^*\n]+)\*\*|__([^_\n]+)__|\*([^\s*][^*\n]*[^\s*]|[^\s*])\*|`([^`\n]+)`/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
      let node;
      if (m[1] != null || m[2] != null) { node = document.createElement('strong'); node.textContent = m[1] != null ? m[1] : m[2]; }
      else if (m[3] != null) { node = document.createElement('em'); node.textContent = m[3]; }
      else { node = document.createElement('code'); node.textContent = m[4]; }
      parent.appendChild(node);
      last = re.lastIndex;
    }
    if (last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
  }
  function renderMarkdown(text) {
    const root = document.createElement('div');
    root.className = 'ki-md';
    let list = null, listType = null, para = null;
    String(text).replace(/\r/g, '').split('\n').forEach(raw => {
      const line = raw.replace(/\s+$/, '');
      if (!line.trim()) { list = null; listType = null; para = null; return; }
      let m;
      if ((m = line.match(/^\s{0,3}#{1,6}\s+(.*)$/))) {
        const h = document.createElement('h4');
        inlineMd(h, m[1].replace(/\s*#+\s*$/, ''));
        root.appendChild(h);
        list = null; listType = null; para = null;
        return;
      }
      if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
        if (listType !== 'ul') { list = document.createElement('ul'); root.appendChild(list); listType = 'ul'; para = null; }
        const li = document.createElement('li'); inlineMd(li, m[1]); list.appendChild(li);
        return;
      }
      if ((m = line.match(/^\s*(\d{1,3})[.)]\s+(.*)$/))) {
        if (listType !== 'ol') {
          list = document.createElement('ol'); list.start = Number(m[1]);
          root.appendChild(list); listType = 'ol'; para = null;
        }
        const li = document.createElement('li'); inlineMd(li, m[2]); list.appendChild(li);
        return;
      }
      // eingerückte Folgezeile gehört zum Listenpunkt davor
      if (list && list.lastElementChild && /^\s{2,}\S/.test(raw)) {
        list.lastElementChild.appendChild(document.createElement('br'));
        inlineMd(list.lastElementChild, line.trim());
        return;
      }
      if (!para || list) { para = document.createElement('p'); root.appendChild(para); list = null; listType = null; }
      else para.appendChild(document.createElement('br'));
      inlineMd(para, line.trim());
    });
    return root;
  }
  // Für die Tafel: derselbe Text ohne Markdown-Zeichen
  function mdToPlain(text) {
    return String(text).replace(/\r/g, '')
      .replace(/^\s{0,3}#{1,6}\s+/gm, '')
      .replace(/\*\*([^*\n]+)\*\*/g, '$1').replace(/__([^_\n]+)__/g, '$1')
      .replace(/\*([^\s*][^*\n]*[^\s*]|[^\s*])\*/g, '$1').replace(/`([^`\n]+)`/g, '$1')
      .replace(/^(\s*)[-*]\s+/gm, '$1• ')
      .replace(/\n{3,}/g, '\n\n').trim();
  }
  // Aufgaben ohne den Lösungsteil (der Assistent setzt die Lösungen unter eine Zeile „Lösungen:“)
  function withoutSolutions(text) {
    const m = String(text).match(/^[ \t]*(?:#{1,6}[ \t]*)?\**[ \t]*L(?:ö|oe)sung(?:en)?[ \t]*:?[ \t]*\**[ \t]*:?[ \t]*$/im);
    if (!m) return null;
    const head = text.slice(0, m.index).trim();
    return head.length > 20 ? head : null;
  }

  // ── Auf die Tafel legen ──
  function textToBoard(text) {
    const plain = mdToPlain(text);
    if (!plain) return;
    if (!APP.state.editMode) toggleEditMode();
    const len = plain.length;
    const size = len > 520 ? { w: 760, h: 520 } : len > 220 ? { w: 620, h: 420 } : { w: 500, h: 300 };
    if (addWidget('text', { text: plain }, size)) {
      toast('✅ Auf die Tafel gelegt');
      if (window.innerWidth < 900) setOpen(false);
    }
  }
  function imageToBoard(dataUrl, subject, ratio) {
    if (!APP.state.editMode) toggleEditMode();
    const w = 480, h = Math.round(Math.max(200, Math.min(640, w / (ratio || 1.5))));
    if (addWidget('image', { src: dataUrl, alt: subject }, { w, h })) {
      toast('✅ Bild auf die Tafel gelegt');
      if (window.innerWidth < 900) setOpen(false);
    }
  }

  function actBtn(iconName, label, fn, primary) {
    const b = document.createElement('button');
    b.className = 'ki-act' + (primary ? ' primary' : '');
    b.innerHTML = icon(iconName, 16) + '<span>' + safeText(label) + '</span>';
    b.addEventListener('click', fn);
    return b;
  }

  function addBubble(cls, text) {
    const b = document.createElement('div');
    b.className = 'ki-bubble ' + cls;
    if (text != null) b.textContent = text;
    historyEl.appendChild(b);
    scrollDown();
    return b;
  }
  function addThinking(label) {
    const b = addBubble('ai thinking');
    b.innerHTML = '<span>' + safeText(label) + '</span><span class="ki-dots"><i></i><i></i><i></i></span>';
    return b;
  }

  // ── Antwort anzeigen ──
  function addAnswer(data, question) {
    const b = addBubble('ai');
    if (data.viaWeb) {
      const tag = document.createElement('div'); tag.className = 'ki-tag';
      tag.textContent = 'Mit Web-Suche geprüft';
      b.appendChild(tag);
    }
    b.appendChild(renderMarkdown(data.text || ''));
    if (data.truncated) {
      const cut = document.createElement('div'); cut.className = 'ki-note';
      cut.textContent = 'Die Antwort wurde gekürzt. Schreib „weiter“, um den Rest zu bekommen.';
      b.appendChild(cut);
    }
    if (data.blocked || data.empty) return b;

    if (data.grounded) {
      // Antwort aus der Web-Suche: Quellen und Googles Suchvorschläge gehören dazu
      if (Array.isArray(data.sources) && data.sources.length) {
        const src = document.createElement('div'); src.className = 'ki-sources';
        const lbl = document.createElement('span'); lbl.textContent = 'Quellen: ';
        src.appendChild(lbl);
        data.sources.forEach((s, i) => {
          if (!/^https:\/\//.test(String(s.url))) return;
          if (i) src.appendChild(document.createTextNode(' · '));
          const a = document.createElement('a');
          a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = s.title || 'Quelle';
          src.appendChild(a);
        });
        b.appendChild(src);
      }
      if (data.searchHtml) {
        // Fremdes HTML von Google: in einem abgeschotteten Rahmen ohne Skripte anzeigen
        const f = document.createElement('iframe');
        f.className = 'ki-sugg-frame';
        f.title = 'Google-Suchvorschläge';
        f.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox');
        f.setAttribute('referrerpolicy', 'no-referrer');
        f.srcdoc = '<base target="_blank">' + data.searchHtml;
        b.appendChild(f);
      }
    }

    const acts = document.createElement('div'); acts.className = 'ki-actions';
    if (!data.grounded) {
      // (Antworten aus der Web-Suche dürfen laut Google nur zusammen mit den Suchvorschlägen
      //  gezeigt werden — deshalb kein „Auf die Tafel“ für sie.)
      acts.appendChild(actBtn('plus', 'Auf die Tafel', () => textToBoard(data.text), true));
      const tasksOnly = withoutSolutions(data.text);
      if (tasksOnly) acts.appendChild(actBtn('plus', 'Ohne Lösungen', () => textToBoard(tasksOnly)));
    }
    acts.appendChild(actBtn('copy', 'Kopieren', async () => {
      try { await navigator.clipboard.writeText(mdToPlain(data.text)); toast('Kopiert'); }
      catch (e) { toast('Kopieren nicht möglich'); }
    }));
    if (!data.grounded && question) {
      acts.appendChild(actBtn('browser', 'Im Web prüfen', () => ask(question, { web: true, quiet: true })));
    }
    b.appendChild(acts);
    scrollDown();
    return b;
  }

  // ── Bilder ──
  function isImageRequest(q) {
    const t = q.trim().toLowerCase();
    return /^(zeig|zeige|mal|male|zeichne|bild von|bild:|foto von|zeig mir|zeige mir|show|draw)\b/.test(t) ||
           /\b(als bild|als foto|als zeichnung|als illustration)\b/.test(t);
  }
  function isDrawRequest(q) {
    return /^(mal|male|zeichne|draw)\b/i.test(q.trim()) || /\b(als zeichnung|als illustration)\b/i.test(q);
  }
  function extractSubject(q) {
    return q.replace(/^(zeig(e)?(\s+(mir|uns))?|mal(e)?(\s+(mir|uns))?|zeichne(\s+(mir|uns))?|bild von|bild:|foto von|show(\s+me)?|draw)\s*/i, '')
      .replace(/^(bitte\s+)?(ein(e[nmrs]?)?|das|die|den|der|ne|nen)\s+/i, '')
      .replace(/\b(als bild|als foto|als zeichnung|als illustration)\b/i, '')
      .replace(/[.!?]+$/, '').trim() || q;
  }
  async function fetchImage(subject, type, index) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 25000);
    try {
      const res = await fetch('/api/image-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: subject, type, index, inline: true }),
        signal: controller.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || String(res.status));
      return data;
    } finally { clearTimeout(timer); }
  }
  async function showImage(subject, type) {
    sending = true; sendBtn.disabled = true;
    const b = addThinking('Suche ein Bild');
    let index = 0;
    const fill = data => {
      b.className = 'ki-bubble ai';
      b.innerHTML = '';
      if (data.blocked) { b.textContent = 'Dazu zeige ich kein Bild. Versuch es mit einem anderen Begriff.'; return; }
      const src = data.dataUrl || '';
      if (!src) { b.textContent = 'Dazu habe ich kein passendes Bild gefunden. Versuch es mit einem einfacheren Begriff, zum Beispiel „Vulkan“ statt „Vulkanausbruch bei Nacht“.'; return; }
      const img = document.createElement('img');
      img.className = 'ki-img';
      img.alt = subject;
      img.src = src;
      const cap = document.createElement('div'); cap.className = 'ki-note';
      cap.textContent = subject + (data.credit ? ' · Bild: ' + data.credit : '');
      const acts = document.createElement('div'); acts.className = 'ki-actions';
      acts.appendChild(actBtn('plus', 'Auf die Tafel', () => imageToBoard(src, subject, img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1.5), true));
      if (data.more) acts.appendChild(actBtn('reset', 'Anderes Bild', async () => {
        if (sending) return;
        sending = true; sendBtn.disabled = true;
        acts.style.opacity = '0.5';
        try { index++; fill(await fetchImage(subject, type, index)); }
        catch (e) { acts.style.opacity = ''; toast('Kein weiteres Bild gefunden'); }
        finally { sending = false; sendBtn.disabled = false; }
      }));
      img.addEventListener('load', scrollDown);
      b.append(img, cap, acts);
      scrollDown();
    };
    try { fill(await fetchImage(subject, type, index)); }
    catch (e) {
      console.warn('Bildsuche:', e);
      b.className = 'ki-bubble ai';
      b.textContent = !navigator.onLine ? 'Keine Internetverbindung.'
        : (/rate/.test(e.message) ? 'Zu viele Anfragen in kurzer Zeit – bitte einen Moment warten.'
        : 'Die Bildsuche ist gerade nicht erreichbar. Bitte später nochmal versuchen.');
    } finally { sending = false; sendBtn.disabled = false; }
  }

  // ── Frage senden ──
  async function ask(q, opts) {
    opts = opts || {};
    q = String(q || '').trim();
    if (sending || !q) return;
    historyEl.querySelector('.ki-empty')?.remove();
    if (!opts.quiet) addBubble('user', q);

    if (!opts.web && isImageRequest(q)) {
      await showImage(extractSubject(q), isDrawRequest(q) ? 'illustration' : 'photo');
      return;
    }

    const count = parseInt(localStorage.getItem(TEXT_AI_KEY) || '0', 10) || 0;
    if (!isPro() && count >= MAX_FREE_TEXT) {
      const b = addBubble('ai', 'Die ' + MAX_FREE_TEXT + ' kostenlosen Fragen sind aufgebraucht. Mit Scolavis Pro kannst du unbegrenzt weiterfragen.');
      const acts = document.createElement('div'); acts.className = 'ki-actions';
      acts.appendChild(actBtn('ai', 'Pro ansehen', () => openUpgradeModal('ki'), true));
      b.appendChild(acts);
      return;
    }

    sending = true;
    sendBtn.disabled = true;
    const thinking = addThinking(opts.web ? 'Suche im Web' : 'Denke nach');

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);
      let res;
      try {
        res = await fetch('/api/ai-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, history: chatHistory.slice(-6), web: !!opts.web }),
          signal: controller.signal,
        });
      } finally { clearTimeout(timer); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'http-' + res.status);

      if (!isPro()) localStorage.setItem(TEXT_AI_KEY, String(count + 1));
      if (!data.blocked && !data.empty) {
        chatHistory.push({ role: 'user', content: q });
        chatHistory.push({ role: 'assistant', content: data.text });
      }
      thinking.remove();
      if (opts.web) data.viaWeb = true;
      addAnswer(data, q);
      updateFoot();
    } catch (e) {
      thinking.remove();
      // Technische Details nur in die Konsole — der Lehrkraft eine verständliche Meldung zeigen
      console.warn('KI-Assistent:', e);
      let msg;
      if (e.name === 'AbortError' || /timeout/.test(e.message)) msg = 'Das hat zu lange gedauert. Bitte nochmal versuchen oder die Frage kürzer stellen.';
      else if (!navigator.onLine) msg = 'Keine Internetverbindung.';
      else if (/rate/.test(e.message)) msg = 'Zu viele Fragen in kurzer Zeit – bitte einen Moment warten.';
      else if (/busy|429/.test(e.message)) msg = 'Der KI-Dienst ist gerade ausgelastet. Bitte in einer Minute nochmal versuchen.';
      else msg = 'Der KI-Assistent ist gerade nicht erreichbar. Bitte später nochmal versuchen.';
      const b = addBubble('ai error', msg);
      const acts = document.createElement('div'); acts.className = 'ki-actions';
      acts.appendChild(actBtn('reset', 'Nochmal versuchen', () => { b.remove(); ask(q, { web: opts.web, quiet: true }); }));
      b.appendChild(acts);
    } finally {
      sending = false;
      sendBtn.disabled = false;
    }
  }

  function sendFromInput() {
    if (sending) return;
    const q = textarea.value.trim();
    if (!q) return;
    textarea.value = '';
    textarea.style.height = '';
    ask(q);
  }
  sendBtn.addEventListener('click', sendFromInput);
  textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFromInput(); }
    if (e.key !== 'Escape') e.stopPropagation();   // Tafel-Tastenkürzel nicht auslösen
  });
  textarea.addEventListener('input', function() {
    textarea.style.height = '';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
  });
})();

// LEISTEN — obere Navigation, untere Element-Leiste (Dock), Menü „Mehr“
// ══════════════════════════════════════════════════════════════
const DOCK_DEFAULT = ['clock','timer','traffic','dayplan','text','goal','checklist','names','groups','noise'];
// Kurze Beschriftungen für die Leiste
const DOCK_LABEL = {
  goal: 'Ziel', names: 'Namen', poll: 'Umfrage', phases: 'Phasen', status: 'Status',
  randomnum: 'Zufall', ai: 'KI-Text', ask: 'KI-Frage', homework: 'Hausaufg.', timetable: 'Plan',
  worksymbols: 'Symbole', scoreboard: 'Punkte', visualtimer: 'Zeitkreis', dayplan: 'Tagesplan', today: 'Datum', duties: 'Dienste',
};

function getDockItems() {
  try {
    const saved = JSON.parse(localStorage.getItem('kb_dock_items') || 'null');
    if (Array.isArray(saved)) return saved.filter(t => REGISTRY[t]);
  } catch(e) {}
  // Schnell-Knöpfe, die jemand in der früheren Leiste eingeschaltet hatte, übernehmen
  const items = DOCK_DEFAULT.slice();
  try {
    const old = JSON.parse(localStorage.getItem('kb_toolbar_prefs') || 'null') || {};
    Object.keys(old).forEach(k => {
      const t = k.replace('qadd-', '');
      if (k.startsWith('qadd-') && old[k] && REGISTRY[t] && !items.includes(t)) items.push(t);
    });
  } catch(e) {}
  return items;
}

function renderDock() {
  const dock = document.getElementById('dock');
  if (!dock) return;
  dock.innerHTML = '';
  // Die Element-Knöpfe liegen in einem eigenen Scroll-Bereich, damit „KI“ und „Mehr“
  // auch auf schmalen Bildschirmen immer erreichbar bleiben
  const scroll = document.createElement('div');
  scroll.className = 'dock-scroll';
  scroll.addEventListener('wheel', e => {
    if (!e.deltaY || e.deltaX || scroll.scrollWidth <= scroll.clientWidth) return;
    scroll.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
  dock.appendChild(scroll);
  const add = (parent, cls, iconName, label, title, onClick, id) => {
    const b = document.createElement('button');
    b.className = 'dock-btn' + (cls ? ' ' + cls : '');
    if (id) b.id = id;
    b.title = title;
    b.innerHTML = icon(iconName, 24) + '<span>' + safeText(label) + '</span>';
    b.addEventListener('click', onClick);
    parent.appendChild(b);
    return b;
  };
  getDockItems().forEach(type => {
    const reg = REGISTRY[type];
    add(scroll, '', type, DOCK_LABEL[type] || reg.label, reg.label + ' auf die Tafel legen', () => {
      // Wer ein Element hinzufügt, will es auch platzieren können → Bearbeiten einschalten
      if (!APP.state.editMode) toggleEditMode();
      if (addWidget(type)) toast('✅ ' + reg.label + ' hinzugefügt');
    });
  });
  const sep = document.createElement('div');
  sep.className = 'dock-sep';
  dock.appendChild(sep);
  add(dock, 'accent', 'brush', 'Zeichnen', 'Auf der Tafel zeichnen und schreiben', () => DRAW.toggle(), 'dock-draw');
  add(dock, 'accent', 'phone', 'Handy', 'Handy verbinden: Fotos schicken, Kamera live zeigen, Tafel fernbedienen', () => PHONE.toggle(), 'dock-phone');
  add(dock, 'accent', 'ai', 'KI', 'KI-Assistent: Fragen stellen', () => { if (window.toggleKiPanel) window.toggleKiPanel(); }, 'dock-ki');
  add(dock, 'accent', 'grid', 'Mehr', 'Alle Elemente anzeigen (W)', () => openWidgetMenu(), 'btn-add-widget');
}

function updateEditModeBtn() {
  const btn = document.getElementById('edit-mode-btn');
  if (!btn) return;
  const on = APP.state.editMode;
  const opt = (mode, active, iconName, label, title) =>
    '<button class="em-opt' + (active ? ' on' : '') + '" data-mode="' + mode + '" aria-pressed="' + active + '" title="' + title + '">'
    + icon(iconName, 18) + '<span class="lbl">' + label + '</span></button>';
  btn.innerHTML =
    opt('view', !on, 'eye', 'Ansicht', 'Ansicht: Elemente sind fest, beim Antippen verrutscht nichts (E)') +
    opt('edit', on, 'edit', 'Bearbeiten', 'Bearbeiten: Elemente verschieben, Größe ändern, einstellen, löschen (E)');
}

function updateFullscreenBtn() {
  const btn = document.getElementById('btn-fullscreen');
  if (btn) btn.innerHTML = icon(document.body.classList.contains('fullscreen') ? 'minimize' : 'maximize', 20);
}

function initChromeIcons() {
  const set = (id, name, size) => { const e = document.getElementById(id); if (e) e.innerHTML = icon(name, size || 20); };
  set('add-board-btn', 'plus', 20);
  set('btn-more', 'dots', 22);
  set('auth-logout-btn', 'logout', 16);
  updateFullscreenBtn();
  updateEditModeBtn();
}

function openTimetableFromMenu() {
  const board = APP.activeBoard();
  if (!board) return;
  const w = board.widgets.find(x => x.type === 'timetable') || addWidget('timetable');
  if (w) openTimetableSettings(w);
}

function setCardTheme(theme) {
  if (theme === 'dark') { document.body.dataset.cards = 'dark'; localStorage.setItem('kb_cards', 'dark'); }
  else { delete document.body.dataset.cards; localStorage.removeItem('kb_cards'); }
  renderWidgets();
}

function setAutoHide(on) {
  if (on) localStorage.setItem('kb_autohide', '1');
  else { localStorage.removeItem('kb_autohide'); localStorage.removeItem('kb_toolbar_pos'); }
  applyChromePrefs();
  if (on) toast('Leisten ausgeblendet — oben über „Leisten“ wieder einblenden', 4000);
}

// Gespeicherte Darstellungs-Einstellungen anwenden (Karten hell/dunkel, Leisten ausblenden)
function applyChromePrefs() {
  if (localStorage.getItem('kb_cards') === 'dark') document.body.dataset.cards = 'dark';
  const auto = localStorage.getItem('kb_autohide') === '1' || localStorage.getItem('kb_toolbar_pos') === 'autohide';
  document.body.classList.toggle('autohide', auto);
  document.body.classList.remove('chrome-shown');
  let tab = document.getElementById('tb-pull-tab');
  if (!auto) { if (tab) tab.remove(); return; }
  const label = shown => icon(shown ? 'chevronUp' : 'chevronDown', 16) + '<span>Leisten</span>';
  if (!tab) {
    tab = document.createElement('button');
    tab.id = 'tb-pull-tab';
    tab.addEventListener('click', e => {
      e.stopPropagation();
      tab.innerHTML = label(document.body.classList.toggle('chrome-shown'));
    });
    document.body.appendChild(tab);
  }
  tab.innerHTML = label(false);
}
// Scrollt die Tafel, liegen Elemente unter der oberen Leiste → Leiste deckend machen
document.getElementById('board').addEventListener('scroll', e => {
  document.getElementById('toolbar').classList.toggle('solid', e.currentTarget.scrollTop > 4);
}, { passive: true });
// Klick auf die Tafel blendet eingeblendete Leisten wieder aus
document.getElementById('board').addEventListener('click', () => {
  if (!document.body.classList.contains('autohide') || !document.body.classList.contains('chrome-shown')) return;
  document.body.classList.remove('chrome-shown');
  const tab = document.getElementById('tb-pull-tab');
  if (tab) tab.innerHTML = icon('chevronDown', 16) + '<span>Leisten</span>';
});

// Menü „Mehr“: alles, was man selten braucht, raus aus der Leiste
function openMoreMenu() {
  const existing = document.getElementById('more-menu');
  if (existing) { existing.remove(); return; }
  const menu = document.createElement('div');
  menu.id = 'more-menu';
  const item = (iconName, label, fn, opts) => {
    opts = opts || {};
    const b = document.createElement('button');
    b.className = 'mm-item' + (opts.danger ? ' danger' : '');
    b.innerHTML = icon(iconName, 20) + '<span>' + safeText(label) + '</span>'
      + (opts.note ? '<span class="mm-note">' + safeText(opts.note) + '</span>' : '');
    b.addEventListener('click', () => { menu.remove(); fn(); });
    menu.appendChild(b);
  };
  const sep = () => { const s = document.createElement('div'); s.className = 'mm-sep'; menu.appendChild(s); };
  const hidden = id => { const e = document.getElementById(id); return !e || getComputedStyle(e).display === 'none'; };

  // Auf kleinen Bildschirmen wandern diese Knöpfe aus der Leiste hierher
  let moved = false;
  if (hidden('dock-draw')) { item('brush', 'Zeichnen', () => DRAW.toggle()); moved = true; }
  if (hidden('dock-phone')) { item('phone', 'Handy verbinden', () => PHONE.toggle()); moved = true; }
  if (hidden('edit-mode-btn')) {

// ══════════════════════════════════════════════════════════════
// UMZUG — Tafeln von der alten Adresse klassenboard.netlify.app nach scolavis.de mitnehmen.
// Browser speichern pro Adresse getrennt. umzug.html (alte Adresse) packt localStorage classpuls_*/kb_* und die Dateien
// aus IndexedDB in „scolavis-umzug.json"; hier wird sie wieder ausgepackt. Die Android-App (MainActivity) holt die Datei
// selbst ab und reicht sie beim Antippen von „Übernehmen" über die Dateiauswahl durch (accept enthält „json").
// ══════════════════════════════════════════════════════════════
const OLD_HOST = 'klassenboard.netlify.app';
const UMZUG = {
  KEYS: /^(classpuls_|kb_)/,
  init() {
    if (location.hostname === OLD_HOST) { this.banner(); return; }
    if (location.hash === '#umzug') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      setTimeout(() => this.offer(), 600);
    }
  },
  // Alte Adresse: Hinweis-Leiste mit Weg zum Mitnehmen (nicht in der App — die zieht selbst um)
  banner() {
    try { if (sessionStorage.getItem('kb_umzug_banner') === 'x') return; } catch (e) {}
    const bar = el('div', 'umzug-bar');
    bar.setAttribute('data-kb-keep', '');
    bar.setAttribute('role', 'status');
    const txt = el('span');
    txt.textContent = 'Scolavis ist umgezogen: scolavis.de. Nimm deine Tafeln mit – dauert eine Minute.';
    const go = el('a', 'umzug-go', { href: '/umzug.html' });
    go.textContent = 'Tafeln mitnehmen';
    const x = el('button', 'umzug-x', { type: 'button', 'aria-label': 'Hinweis ausblenden' });
    x.textContent = '×';
    x.addEventListener('click', () => { bar.remove(); try { sessionStorage.setItem('kb_umzug_banner', 'x'); } catch (e) {} });
    bar.append(txt, go, x);
    document.body.appendChild(bar);
  },
  offer() {
    const app = typeof IN_ANDROID_APP !== 'undefined' && IN_ANDROID_APP;
    const m = openModal(`<div class="modal" style="max-width:460px">
      <button class="modal-close" data-close>✕</button>
      <h2 style="margin-bottom:8px">Tafeln übernehmen</h2>
      <p style="font-size:14px;line-height:1.6;margin:0 0 12px">${app
        ? 'Deine Tafeln, Klassen, Zeichnungen und Dateien von der alten Adresse sind bereit. Tippe auf „Übernehmen“ – die App reicht sie direkt weiter.'
        : 'Wähle die Datei <b>scolavis-umzug.json</b> (meist im Ordner „Downloads“). Sie kommt von der alten Adresse klassenboard.netlify.app.'}</p>
      <p style="font-size:12.5px;opacity:.7;line-height:1.5;margin:0 0 16px">Was auf diesem Gerät unter scolavis.de schon gespeichert ist, wird dabei ersetzt. Anmelden musst du dich danach neu.</p>
      <input type="file" accept=".json,application/json" hidden>
      <div style="display:flex;gap:10px">
        <button class="btn-secondary" style="flex:1" data-close type="button">Später</button>
        <button class="btn-primary" style="flex:1" data-go type="button">${app ? 'Übernehmen' : 'Datei wählen'}</button>
      </div></div>`);
    const input = m.overlay.querySelector('input[type=file]');
    m.overlay.querySelector('[data-go]').addEventListener('click', () => input.click());
    input.addEventListener('change', async () => {
      const f = input.files && input.files[0];
      if (!f) return;
      const btn = m.overlay.querySelector('[data-go]');
      btn.disabled = true; btn.textContent = 'Übernehme …';
      try {
        const n = await this.apply(await f.text());
        m.close();
        toast('✅ Übernommen: ' + n + ' Tafel(n) – lade neu …', 4000);
        setTimeout(() => location.replace(location.pathname), 900);
      } catch (e) {
        btn.disabled = false; btn.textContent = app ? 'Übernehmen' : 'Datei wählen';
        toast('❌ ' + (e && e.message ? e.message : 'Übernehmen hat nicht geklappt'), 5000);
      }
    });
  },
  // Schreibt den Inhalt der Umzugsdatei in diesen Browser. Gibt die Zahl der Tafeln zurück.
  async apply(json) {
    let data;
    try { data = JSON.parse(json); } catch (e) { throw new Error('Das ist keine Umzugsdatei'); }
    if (!data || data.kind !== 'scolavis-umzug' || !data.ls || typeof data.ls !== 'object') throw new Error('Das ist keine Umzugsdatei');
    let boards = 0;
    try { boards = (JSON.parse(data.ls.classpuls_v2 || '{}').boards || []).length; } catch (e) {}
    // Ab hier nichts mehr aus dem Speicher der laufenden Seite zurückschreiben lassen (Demo-Tafeln usw.)
    APP._resetting = true;
    clearTimeout(APP.saveTimer); APP.saveTimer = null;
    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && this.KEYS.test(k)) localStorage.removeItem(k);
      }
      for (const [k, v] of Object.entries(data.ls)) {
        if (this.KEYS.test(k) && typeof v === 'string') localStorage.setItem(k, v);
      }
      localStorage.setItem('classpuls_moved_from', String(data.from || OLD_HOST).slice(0, 80));
      for (const f of (Array.isArray(data.files) ? data.files : [])) {
        if (!f || typeof f.id !== 'string' || typeof f.d !== 'string') continue;
        const bytes = KB64.dec(f.d);
        await PDFSTORE.put(f.id, f.t === 'blob' ? new Blob([bytes], { type: String(f.mime || '') }) : bytes.buffer);
      }
    } catch (e) {
      APP._resetting = false;
      throw new Error(e && e.name === 'QuotaExceededError' ? 'Zu wenig Speicherplatz im Browser' : 'Übernehmen hat nicht geklappt');
    }
    return boards;
  },
};

let _installEvt = null;
const IN_ANDROID_APP = /ClassPulsApp\//.test(navigator.userAgent || '');   // unsere Android-App (GeckoView)

// TOOLBAR GUARDIAN — auto-removes any element blocking the toolbar

// ══════════════════════════════════════════════════════════════
// HANDY-VERBINDUNG (Gegenstück zu handy.html)
// Ein Handy/Tablet wird per QR-Code gekoppelt und kann dann: Fotos schicken, live die Kamera zeigen,
// die Tafel fernbedienen und Schüler-Abgaben freigeben. Alles läuft Ende-zu-Ende verschlüsselt über einen
// Durchreiche-Kanal (Supabase Realtime Broadcast) – auf Servern wird nichts gespeichert. Fotos liegen danach
// nur in IndexedDB auf diesem Gerät (config.fileId), nicht in localStorage und nicht in der Cloud.
// ══════════════════════════════════════════════════════════════
const KB64 = {
  enc(buf) { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
  dec(str) { const s = atob(str), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; },
  url(buf) { return this.enc(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  unurl(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return this.dec(str); },
  rnd(n) { return this.url(crypto.getRandomValues(new Uint8Array(n))); },
};
async function kbSeal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: KB64.enc(iv), d: KB64.enc(ct) };
}
async function kbUnseal(key, p) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: KB64.dec(p.iv) }, key, KB64.dec(p.d));
  return JSON.parse(new TextDecoder().decode(pt));
}

// Bilder, die nur auf diesem Gerät liegen (IndexedDB) → Adresse zum Anzeigen
const _imgUrls = new Map();
async function localImageUrl(fileId) {
  if (_imgUrls.has(fileId)) return _imgUrls.get(fileId);
  let buf = null;
  try { buf = await PDFSTORE.get(fileId); } catch (e) {}
  if (!buf) return null;
  const url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
  _imgUrls.set(fileId, url);
  return url;
}
// Foto (JPEG-Bytes) als Bild-Element auf die aktuelle Tafel legen
async function addPhotoWidget(bytes, alt) {
  const blob = new Blob([bytes], { type: 'image/jpeg' });
  const bmp = await createImageBitmap(blob);            // wirft, wenn es kein Bild ist
  const iw = bmp.width, ih = bmp.height;
  if (bmp.close) bmp.close();
  const fileId = 'img_' + uid();
  await PDFSTORE.put(fileId, await blob.arrayBuffer());
  _imgUrls.set(fileId, URL.createObjectURL(blob));
  const boardEl = document.getElementById('board');
  const maxW = Math.min(640, Math.max(240, (boardEl.clientWidth || window.innerWidth) * 0.5));
  const maxH = Math.min(520, Math.max(200, (boardEl.clientHeight || window.innerHeight) * 0.62));
  const k = Math.min(maxW / iw, maxH / ih);
  return addWidget('image', { fileId, alt }, { w: Math.max(160, Math.round(iw * k)), h: Math.max(120, Math.round(ih * k)) + (APP.state.editMode ? 34 : 0) });
}

const PHONE = {
